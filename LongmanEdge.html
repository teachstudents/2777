        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal specific scrollbar */
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
    </style>

            "js2-u4": {
                p: "Organize an Adventure Club itinerary and justify your activity choices using connectives of purpose.",

            "js2-u5": {

                            </div>

                            <div class="bg-gray-100 p-6 md:p-8 rounded-xl border border-gray-200 shadow-inner relative text-gray-800 font-sans leading-relaxed text-lg md:text-xl font-medium mb-8">
                                <div class="absolute top-0 right-0 bg-yellow-400 text-yellow-900 text-sm font-bold px-4 py-2 rounded-bl-lg rounded-tr-xl flex items-center gap-1 shadow-sm">
                                    <i class="fas fa-crown"></i> Level 5 Target Achieved
                                </div>
                                <p class="pt-4 whitespace-pre-wrap">${mData.ex}</p>
                                <div class="mt-6 pt-4 border-t border-gray-300 text-right text-sm text-gray-500 font-sans font-bold uppercase tracking-wide">
                                    Word Count: ~${mData.wc} words
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <!-- Commentary Table -->
                                <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                                    <div class="bg-blue-50 px-5 py-4 border-b border-blue-100 font-bold text-blue-800 text-base flex items-center gap-2">
                                        <i class="fas fa-clipboard-list"></i> HKEAA-Style Commentary
                                    </div>
                                    <div class="p-5 space-y-5 text-base md:text-lg flex-1">
                                        <div><span class="font-bold text-gray-800 block mb-1">Content (C):</span> <span class="text-gray-600">${mData.c.c}</span></div>
                                        <div><span class="font-bold text-gray-800 block mb-1">Language (L):</span> <span class="text-gray-600">${mData.c.l}</span></div>
                                        <div><span class="font-bold text-gray-800 block mb-1">Organization (O):</span> <span class="text-gray-600">${mData.c.o}</span></div>
                                    </div>
                                </div>

                                <!-- Making the Leap Checklist -->
                                <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                                    <div class="bg-emerald-50 px-5 py-4 border-b border-emerald-100 font-bold text-emerald-800 text-base flex items-center gap-2">
                                        <i class="fas fa-level-up-alt"></i> "Making the Leap" (L3 vs L5)
                                    </div>
                                    <div class="p-5 space-y-5 flex-1">
                                        ${leapHtml}
                                    </div>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            `;
        }

        function switchTab(levelKey) {
            currentTab = levelKey;
            ['all', 'js1', 'js2', 'js3'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (btn) {
                    if (key === levelKey) {
                        btn.className = "flex items-center gap-2 px-5 py-3 bg-blue-50 text-blue-700 rounded-lg text-base font-medium transition-colors whitespace-nowrap";
                    } else {
                        btn.className = "flex items-center gap-2 px-5 py-3 text-base text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors whitespace-nowrap";
                    }
                }
            });
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            renderContent();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content-area');
            let html = '<div class="fade-in max-w-6xl mx-auto">';
            let levelsToRender = currentTab === 'all' ? [curriculumData.js1, curriculumData.js2, curriculumData.js3] : [curriculumData[currentTab]];
            let hasResults = false;

            levelsToRender.forEach(data => {
                const filteredModules = data.modules.filter(mod => {
                    const searchableText = (mod.title + " " + mod.items.join(" ") + " " + mod.studentExample).toLowerCase();
                    return searchableText.includes(searchQuery);
                });

                if (filteredModules.length > 0) {
                    hasResults = true;
                    html += `
                        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div>
                                <h2 class="text-3xl font-bold text-gray-800 mb-2">${data.level} Syllabus</h2>
                                <div class="flex items-center gap-3 mb-4">
                                    <span class="bg-blue-100 text-blue-800 text-sm font-bold px-4 py-1.5 rounded-full"><i class="fas fa-chart-line mr-1"></i> ${data.cefr}</span>
                                </div>
                                <p class="text-gray-600 leading-relaxed max-w-3xl text-base md:text-lg">${data.focus}</p>
                            </div>
                            <div class="shrink-0 bg-gray-50 p-4 rounded-xl border border-gray-100 text-center w-full md:w-48">
                                <i class="fas fa-bullseye text-4xl text-blue-500 mb-2"></i>
                                <div class="text-base font-semibold text-gray-700">HKDSE Alignment</div>
                                <div class="text-sm text-gray-500 mt-1">Foundational Prep</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                    `;

                    filteredModules.forEach(mod => {
                        html += `
                            <div class="bg-white rounded-2xl p-6 shadow-sm border ${borderMap[mod.color]} hover:shadow-md transition-shadow relative overflow-hidden flex flex-col">
                                <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-${mod.color}-50 to-transparent rounded-bl-3xl opacity-50"></div>
                                <div class="flex items-center gap-4 mb-5">
                                    <div class="w-14 h-14 rounded-xl flex items-center justify-center shrink-0 ${colorMap[mod.color]}">
                                        <i class="fas ${mod.icon} text-2xl"></i>
                                    </div>
                                    <div>
                                        <span class="text-xs font-bold text-gray-400 tracking-wider uppercase">${mod.tag}</span>
                                        <h3 class="text-xl font-bold text-gray-800 leading-tight">${mod.title}</h3>
                                    </div>
                                </div>
                                <ul class="space-y-3 mb-6 flex-1">
                                    ${mod.items.map(item => `
                                        <li class="flex items-start gap-2 text-base text-gray-600">
                                            <i class="fas fa-check-circle text-${mod.color}-400 mt-1 text-sm"></i>
                                            <span>${item}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                                <div class="bg-gray-50 rounded-xl p-5 mt-auto border border-gray-100 flex flex-col justify-between h-full">
                                    <div>
                                        <div class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center gap-2">
                                            <i class="fas fa-user-graduate"></i> Task-Based Project Output
                                        </div>
                                        <p class="text-base text-purple-800 mb-4 font-normal">${mod.studentExample}</p>
                                    </div>
                                    <div class="mt-4 pt-4 border-t border-gray-200 flex flex-col gap-3">
                                        <button onclick="openModal('${mod.id}')" class="w-full bg-${mod.color}-100 text-${mod.color}-800 py-3 rounded-lg text-base font-bold hover:bg-${mod.color}-200 transition-colors flex items-center justify-center gap-2">
                                            <i class="fas fa-expand-arrows-alt"></i> Lesson Plan & Level 5 Model
                                        </button>
                                        <button onclick="openErrorLogModal('${mod.id}')" class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg text-base font-bold hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
                                            <i class="fas fa-clipboard-check"></i> Assessment & Error Log
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`; 
                }
            });

            if (!hasResults) {
                html += `
                    <div class="text-center py-20">
                        <i class="fas fa-search text-5xl text-gray-300 mb-4"></i>
                        <h3 class="text-2xl font-semibold text-gray-600">No results found for "${searchQuery}"</h3>
                        <p class="text-gray-400 mt-2 text-lg">Try adjusting your search terms.</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        window.onload = () => switchTab('js1');
    </script>
</body>
</html>
