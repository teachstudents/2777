                        <!-- Section III -->
                        <section>
                            <h3 class="text-xl font-bold text-gray-800 border-b-2 border-emerald-200 pb-2 mb-4 flex items-center gap-2">
                                <i class="fas fa-sitemap text-emerald-600"></i> III. Target Syntax: The Modal Verbs Grammar Map
                            </h3>
                            <p class="text-sm mb-4 text-gray-600">This unit focuses on establishing clear boundaries between different degrees of necessity, prohibition, and advice using modal auxiliary verbs.</p>
                            
                            <!-- Visual Map -->
                            <div class="flex flex-col md:flex-row items-stretch justify-between bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm mb-6">
                                <div class="flex-1 p-4 border-b md:border-b-0 md:border-r border-gray-200 bg-red-50 text-center relative">
                                    <div class="text-xs font-bold text-red-400 tracking-wider mb-2">PROHIBITION</div>
                                    <div class="text-xl font-bold text-red-700">mustn't</div>
                                    <div class="text-sm text-red-600 mt-1">(Strictly forbidden)</div>
                                    <i class="fas fa-arrow-right absolute -right-3 top-1/2 transform -translate-y-1/2 text-gray-300 hidden md:block z-10 text-xl bg-white rounded-full"></i>
                                </div>
                                <div class="flex-1 p-4 border-b md:border-b-0 md:border-r border-gray-200 bg-amber-50 text-center relative">
                                    <div class="text-xs font-bold text-amber-500 tracking-wider mb-2">ADVICE / RECOMMENDATION</div>
                                    <div class="text-xl font-bold text-amber-700">should / ought to</div>
                                    <div class="text-sm text-amber-600 mt-1">(Best course of action)</div>
                                    <i class="fas fa-arrow-right absolute -right-3 top-1/2 transform -translate-y-1/2 text-gray-300 hidden md:block z-10 text-xl bg-white rounded-full"></i>
                                </div>
                                <div class="flex-1 p-4 bg-emerald-50 text-center">
                                    <div class="text-xs font-bold text-emerald-500 tracking-wider mb-2">OBLIGATION / NECESSITY</div>
                                    <div class="text-xl font-bold text-emerald-700">must / have to</div>
                                    <div class="text-sm text-emerald-600 mt-1">(Mandatory / No choice)</div>
                                </div>
                            </div>

                            <div class="space-y-6">
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                    <h4 class="font-bold text-gray-800 mb-2">1. Talking about Obligation and Necessity</h4>
                                    <ul class="space-y-2 text-sm text-gray-700">
                                        <li><span class="font-semibold text-emerald-600">Must / Have to (Present):</span> Used to express urgent requirements or mandatory rules.<br><span class="italic text-gray-500">Example: "You must report cyberbullying immediately to protect yourself."</span></li>
                                        <li><span class="font-semibold text-emerald-600">Had to (Past):</span> The past form of must and have to.<br><span class="italic text-gray-500">Example: "When his account was hacked, he had to contact a counselor."</span></li>
                                        <li><span class="font-semibold text-emerald-600">Will have to (Future):</span> Expressing future requirements.<br><span class="italic text-gray-500">Example: "If trolls keep attacking you, you will have to block them."</span></li>
                                    </ul>
                                </div>

                                <div class="bg-white p-5 rounded-xl shadow-sm border border-red-200">
                                    <h4 class="font-bold text-gray-800 mb-2">2. The Critical Distinction: Prohibition vs. Lack of Obligation (DSE Target)</h4>
                                    <p class="text-sm text-gray-600 mb-3">Teachers must carefully scaffold the stark difference in meaning between these two negative structures:</p>
                                    <ul class="space-y-4 text-sm text-gray-700">
                                        <li class="bg-red-50 p-3 rounded-lg border border-red-100">
                                            <span class="font-bold text-red-700">Must not (Mustn't) = Prohibition (Strictly Forbidden):</span><br>
                                            <strong>Meaning:</strong> You are not allowed to do this. It is dangerous or against the rules.<br>
                                            <span class="italic text-gray-600">Example: "You mustn't share your private password with anyone online."</span>
                                        </li>
                                        <li class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                            <span class="font-bold text-blue-700">Don't / Doesn't have to = Lack of Obligation (Optional):</span><br>
                                            <strong>Meaning:</strong> There is no rule requiring you to do this. You can choose to do it if you want, but it is not necessary.<br>
                                            <span class="italic text-gray-600">Example: "You don't have to reply to positive comments on your blog, but it is nice to do so."</span>
                                        </li>
                                    </ul>
                                </div>

                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                    <h4 class="font-bold text-gray-800 mb-2">3. Giving Advice and Stating Best Options</h4>
                                    <ul class="space-y-2 text-sm text-gray-700">
                                        <li><span class="font-semibold text-amber-600">Should / Ought to:</span> Used to give recommendations, highlight ideal behavior, or suggest solutions to peer-to-peer digital conflicts.<br><span class="italic text-gray-500">Example: "Victims of cyberbullying ought to seek help rather than feeling miserable."</span></li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <!-- Section IV -->
                        <section>
                            <h3 class="text-xl font-bold text-gray-800 border-b-2 border-emerald-200 pb-2 mb-4 flex items-center gap-2">
                                <i class="fas fa-chalkboard-teacher text-emerald-600"></i> IV. Instructional Steps: The Four-Lesson Progression
                            </h3>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Lesson 1 -->
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                    <div class="flex items-center justify-between mb-3">
                                        <h4 class="font-bold text-emerald-700">Lesson 1: Structural Elicitation & Obligation Contrast</h4>
                                        <span class="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded">40 Mins</span>
                                    </div>
                                    <ul class="text-sm space-y-2 text-gray-600 list-disc list-inside">
                                        <li><strong>Lead-in (3 mins):</strong> Present a short projected dialogue of a student dealing with a compromised online profile to capture interest.</li>
                                        <li><strong>Form & Function Elicitation (10 mins):</strong> Direct students to analyze <em>must, have to, had to,</em> and <em>will have to</em> in a comparative grammar table. Highlight the stark difference between <em>mustn't</em> and <em>don't have to</em>.</li>
                                        <li><strong>Concept Checking (10 mins):</strong> Gap-fill exercise focusing on tenses (choosing between <em>had to</em> for past incidents and <em>will have to</em> for future outcomes).</li>
                                        <li><strong>Consolidation (17 mins):</strong> Students complete a sentence-correction drill on the board to clear up any confusion between <em>mustn't</em> and <em>don't have to</em>.</li>
                                    </ul>
                                </div>

                                <!-- Lesson 2 -->
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-2 h-full bg-blue-400"></div>
                                    <div class="flex items-center justify-between mb-3">
                                        <h4 class="font-bold text-emerald-700">Lesson 2: Vocabulary Acquisition via Semantic Association</h4>
                                        <span class="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded">40 Mins</span>
                                    </div>
                                    <ul class="text-sm space-y-2 text-gray-600 list-disc list-inside mb-4">
                                        <li><strong>Lead-In (5 mins):</strong> Display close-up, abstract images representing online safety issues (such as a lock, block buttons, or a silhouette).</li>
                                        <li><strong>Meaning Deduction & Pronunciation (15 mins):</strong> Display slides dividing words into syllables to practice clear pronunciation. Have students deduce meanings using contextual clues on the slides.</li>
                                        <li><strong>Matching (10 mins):</strong> Pairs match vocabulary terms with definitions.</li>
                                        <li><strong>Practice Task (10 mins):</strong> Short sentence-completion activity.</li>
                                    </ul>
                                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-800 flex items-start gap-2">
                                        <i class="fas fa-headphones-alt mt-0.5"></i>
                                        <p><strong>Teacher Note:</strong> To ensure secondary students successfully acquire complex multisyllabic vocabulary, guarantee that the digital audio playback during pronunciation modeling is set to <strong>85% speed</strong>. This allows sufficient time for phonetic decoding.</p>
                                    </div>
                                </div>

                                <!-- Lesson 3 -->
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                    <div class="flex items-center justify-between mb-3">
                                        <h4 class="font-bold text-emerald-700">Lesson 3: Problem-Solution Text Analysis</h4>
                                        <span class="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded">40 Mins</span>
                                    </div>
                                    <ul class="text-sm space-y-2 text-gray-600 list-disc list-inside">
                                        <li><strong>Lead-in (3 mins):</strong> Project a graphic illustrating an online forum comment section overrun by internet trolls.</li>
                                        <li><strong>Skimming (5 mins):</strong> Pairs skim the text "Don't Feed the Trolls" and match paragraph blocks to structural functions (Intro, Problem, Solution, Conclusion).</li>
                                        <li><strong>Scanning (21 mins):</strong> Students scan to fill in a summary graphic organizer detailing the exact steps recommended to neutralize trolls.</li>
                                        <li><strong>Synthesis Discussion (11 mins):</strong> Students write three advice sentences on post-it notes using <em>should, ought to,</em> or <em>must</em> to share main takeaways.</li>
                                    </ul>
                                </div>

                                <!-- Lesson 4 -->
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                    <div class="flex items-center justify-between mb-3">
                                        <h4 class="font-bold text-emerald-700">Lesson 4: Person-reflective Blog Writing</h4>
                                        <span class="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded">40 Mins</span>
                                    </div>
                                    <ul class="text-sm space-y-2 text-gray-600 list-disc list-inside mb-4">
                                        <li><strong>Genre Analysis (10 mins):</strong> Introduce the G.A.P.S. elements of a blog post (Genre: Reflective blog, Audience: School peers, Purpose: To advise, Style: Inspirational).</li>
                                        <li><strong>Process Brainstorming (15 mins):</strong> Provide a mind map template asking: "How can you make your blog title eye-catching?" and "What two practical tips will you highlight?"</li>
                                        <li><strong>Drafting & Peer Feedback (15 mins):</strong> Students write their introductory paragraph using <em>should</em> and <em>must</em> structures, followed by peer-review using a G.A.P.S. checklist.</li>
                                    </ul>
                                    <div class="p-3 bg-gray-50 rounded border border-gray-200 mt-2">
                                        <p class="text-xs font-bold text-emerald-700 mb-1">Sentence Stems for Students:</p>
                                        <ul class="text-xs text-gray-600 list-disc list-inside">
                                            <li>You must not share your passwords because...</li>
                                            <li>If you are targeted, you ought to...</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Section V -->
                        <section>
                            <h3 class="text-xl font-bold text-gray-800 border-b-2 border-emerald-200 pb-2 mb-4 flex items-center gap-2">
                                <i class="fas fa-file-alt text-emerald-600"></i> V. Student Practice Sheet
                            </h3>
                            
                            <!-- Printable Worksheet Look -->
                            <div class="bg-white p-6 sm:p-10 rounded-lg shadow-inner border border-gray-300 font-serif text-gray-800">
                                <!-- Header -->
                                <div class="flex flex-wrap items-center justify-between gap-4 border-b-2 border-black pb-4 mb-8">
                                    <div class="flex items-center gap-2"><span class="font-bold">Class:</span> <div class="border-b border-black w-24"></div></div>
                                    <div class="flex items-center gap-2"><span class="font-bold">Name:</span> <div class="border-b border-black w-40"></div></div>
                                    <div class="flex items-center gap-2"><span class="font-bold">No:</span> <div class="border-b border-black w-12"></div></div>
                                    <div class="flex items-center gap-2"><span class="font-bold">Date:</span> <div class="border-b border-black w-32"></div></div>
                                </div>
                                
                                <!-- Part A -->
                                <div class="mb-8">
                                    <h4 class="font-bold text-lg mb-2">Part A: Contextual Vocabulary Cloze</h4>
                                    <p class="text-sm italic mb-4">Instructions: Fill in the blanks with the correct words from your target vocabulary list. Change the word form where grammatically necessary.</p>
                                    <ol class="list-decimal list-outside ml-5 space-y-4 text-sm leading-loose">
                                        <li>Many online harassers hide behind <span class="inline-block w-32 border-b border-gray-400"></span> profiles because they do not want anyone to discover their real identities.</li>
                                        <li>If you experience digital harassment, you should immediately inform a school <span class="inline-block w-32 border-b border-gray-400"></span> or a trusted teacher to receive professional guidance.</li>
                                        <li>Receiving mean and hurtful messages can make a student feel incredibly <span class="inline-block w-32 border-b border-gray-400"></span> and anxious.</li>
                                        <li>She felt highly <span class="inline-block w-32 border-b border-gray-400"></span> about posting her artwork online after reading several harsh comments on her channel.</li>
                                        <li>Setting your social media profile to <span class="inline-block w-32 border-b border-gray-400"></span> ensures that only approved friends can view your personal photos and updates.</li>
                                    </ol>
                                </div>

                                <!-- Part B -->
                                <div class="mb-8">
                                    <h4 class="font-bold text-lg mb-2">Part B: Grammatical Choice (Prohibition vs. Absence of Obligation)</h4>
                                    <p class="text-sm italic mb-4">Instructions: Circle the correct modal verb to complete each sentence safely.</p>
                                    <ol class="list-decimal list-outside ml-5 space-y-4 text-sm leading-loose">
                                        <li>To protect your identity, you <strong>(mustn't / don't have to)</strong> share your login password with anyone, even your close friends.</li>
                                        <li>Your school social platform is open to all students; you <strong>(mustn't / don't have to)</strong> pay any fee to register an account.</li>
                                        <li>We <strong>(don't have to / mustn't)</strong> post abusive comments about others, as cyberbullying is a very serious offense.</li>
                                        <li>If your profile settings are set to public, you <strong>(mustn't / don't have to)</strong> enter a security passcode every time someone views your page.</li>
                                        <li>Remember, you <strong>(mustn't / don't have to)</strong> upload photos of other classmates without getting their permission first.</li>
                                    </ol>
                                </div>

                                <!-- Part C -->
                                <div>
                                    <h4 class="font-bold text-lg mb-2">Part C: Reflection Writing (Modals of Advice)</h4>
                                    <p class="text-sm italic mb-4">Instructions: Imagine your classmate is being targeted by internet trolls and feels deeply distressed. Write three complete sentences of advice to help them, using the modal verbs provided below.</p>
                                    <div class="space-y-6 text-sm">
                                        <div>
                                            <div class="flex items-start gap-2">
                                                <span class="font-bold min-w-[80px]">[Ought to]</span>
                                                <div class="flex-1 border-b border-gray-400 pt-5"></div>
                                            </div>
                                            <div class="text-emerald-700 italic text-xs mt-2 ml-[88px] opacity-70">(Suggested Answer: You ought to block those accounts immediately so they cannot send you any more abuse.)</div>
                                        </div>
                                        <div>
                                            <div class="flex items-start gap-2">
                                                <span class="font-bold min-w-[80px]">[Mustn't]</span>
                                                <div class="flex-1 border-b border-gray-400 pt-5"></div>
                                            </div>
                                            <div class="text-emerald-700 italic text-xs mt-2 ml-[88px] opacity-70">(Suggested Answer: You mustn't reply to their comments because trolls want to see you upset.)</div>
                                        </div>
                                        <div>
                                            <div class="flex items-start gap-2">
                                                <span class="font-bold min-w-[80px]">[Should]</span>
                                                <div class="flex-1 border-b border-gray-400 pt-5"></div>
                                            </div>
                                            <div class="text-emerald-700 italic text-xs mt-2 ml-[88px] opacity-70">(Suggested Answer: You should save screenshots of the abusive messages and show them to our counselor.)</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                        
                        <!-- DSE Footer Support Note -->
                        <div class="bg-gray-800 text-gray-200 rounded-xl p-5 text-sm flex items-start gap-4">
                            <i class="fas fa-comment-dots text-2xl text-emerald-400 shrink-0"></i>
                            <div>
                                <p>💬 I can design a comprehensive model candidate response for the JS2 Unit 1 reflective blog writing task, highlighting Level 3 and Level 5 descriptors to help your secondary students master this text type.</p>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        function switchTab(levelKey) {
            currentTab = levelKey;
            
            // Update Navigation UI
            ['all', 'js1', 'js2', 'js3'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (btn) {
                    if (key === levelKey) {
                        btn.className = "flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-700 rounded-lg text-sm font-medium transition-colors whitespace-nowrap";
                    } else {
                        btn.className = "flex items-center gap-2 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors whitespace-nowrap";
                    }
                }
            });

            const mobileSelect = document.getElementById('mobile-nav');
            if (mobileSelect) mobileSelect.value = levelKey;

            document.getElementById('searchInput').value = '';
            searchQuery = '';

            renderContent();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content-area');
            let html = '<div class="fade-in max-w-6xl mx-auto">';
            
            let levelsToRender = [];
            if (currentTab === 'all') {
                levelsToRender = [curriculumData.js1, curriculumData.js2, curriculumData.js3];
            } else {
                levelsToRender = [curriculumData[currentTab]];
            }

            let hasResults = false;

            levelsToRender.forEach(data => {
                const filteredModules = data.modules.filter(mod => {
                    const searchableText = (mod.title + " " + mod.items.join(" ") + " " + mod.studentExample).toLowerCase();
                    return searchableText.includes(searchQuery);
                });

                if (filteredModules.length > 0) {
                    hasResults = true;
                    html += `
                        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div>
                                <h2 class="text-3xl font-bold text-gray-800 mb-2">${data.level} Syllabus</h2>
                                <div class="flex items-center gap-3 mb-4">
                                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full"><i class="fas fa-chart-line mr-1"></i> ${data.cefr}</span>
                                </div>
                                <p class="text-gray-600 leading-relaxed max-w-3xl">${data.focus}</p>
                            </div>
                            <div class="shrink-0 bg-gray-50 p-4 rounded-xl border border-gray-100 text-center w-full md:w-48">
                                <i class="fas fa-bullseye text-3xl text-blue-500 mb-2"></i>
                                <div class="text-sm font-semibold text-gray-700">HKDSE Alignment</div>
                                <div class="text-xs text-gray-500 mt-1">Foundational Prep</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                    `;

                    filteredModules.forEach(mod => {
                        html += `
                            <div class="bg-white rounded-2xl p-6 shadow-sm border ${borderMap[mod.color]} hover:shadow-md transition-shadow relative overflow-hidden flex flex-col">
                                <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-${mod.color}-50 to-transparent rounded-bl-3xl opacity-50"></div>
                                
                                <div class="flex items-center gap-4 mb-4">
                                    <div class="w-12 h-12 rounded-xl flex items-center justify-center ${colorMap[mod.color]}">
                                        <i class="fas ${mod.icon} text-xl"></i>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-bold text-gray-400 tracking-wider uppercase">${mod.tag}</span>
                                        <h3 class="text-lg font-bold text-gray-800 leading-tight">${mod.title}</h3>
                                    </div>
                                </div>
                                
                                <ul class="space-y-2 mb-6 flex-1">
                                    ${mod.items.map(item => `
                                        <li class="flex items-start gap-2 text-sm text-gray-600">
                                            <i class="fas fa-check-circle text-${mod.color}-400 mt-1 text-xs"></i>
                                            <span>${item}</span>
                                        </li>
                                    `).join('')}
                                </ul>

                                <div class="bg-gray-50 rounded-xl p-4 mt-auto border border-gray-100 flex flex-col justify-between h-full">
                                    <div>
                                        <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center gap-1">
                                            <i class="fas fa-user-graduate"></i> Task-Based Project Output
                                        </div>
                                        <p class="text-sm text-gray-700 italic mb-3">"${mod.studentExample}"</p>
                                        
                                        <!-- Output Scaffolding (Vocabulary & Sentence Stems) -->
                                        <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm mt-2">
                                            <div class="text-xs font-bold text-${mod.color}-700 mb-1.5 flex items-center gap-1">
                                                <i class="fas fa-key"></i> Target Vocabulary
                                            </div>
                                            <div class="flex flex-wrap gap-1.5 mb-3">
                                                ${mod.targetVocab.map(v => `<span class="bg-${mod.color}-50 text-${mod.color}-700 text-[10px] font-semibold px-2 py-0.5 rounded border border-${mod.color}-200">${v}</span>`).join('')}
                                            </div>
                                            
                                            <div class="text-xs font-bold text-${mod.color}-700 mb-1.5 flex items-center gap-1">
                                                <i class="fas fa-comment-dots"></i> Sentence Stems
                                            </div>
                                            <ul class="text-[11px] text-gray-600 space-y-1 pl-4 list-disc marker:text-${mod.color}-400">
                                                ${mod.sentenceStems.map(stem => `<li>${stem}</li>`).join('')}
                                            </ul>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-4 pt-4 border-t border-gray-200 flex flex-col gap-2">
                                        <button onclick="openModal('${mod.id}')" class="w-full bg-${mod.color}-100 text-${mod.color}-800 py-2 rounded-lg text-sm font-bold hover:bg-${mod.color}-200 transition-colors flex items-center justify-center gap-2">
                                            <i class="fas fa-expand-arrows-alt"></i> Lesson Plan
                                        </button>
                                        <button onclick="openErrorLogModal('${mod.id}')" class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-bold hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
                                            <i class="fas fa-clipboard-check"></i> Assessment & Error Log
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`; 
                }
            });

            if (!hasResults) {
                html += `
                    <div class="text-center py-20">
                        <i class="fas fa-search text-4xl text-gray-300 mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-600">No results found for "${searchQuery}"</h3>
                        <p class="text-gray-400 mt-2">Try adjusting your search terms or checking another curriculum level.</p>
                    </div>
                `;
            }

            html += `
                    <div class="mt-8 bg-indigo-50 border border-indigo-100 rounded-2xl p-6 flex flex-col md:flex-row items-start gap-4 mb-6">
                        <div class="bg-indigo-600 text-white p-3 rounded-full shrink-0">
                            <i class="fas fa-chalkboard-teacher"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-indigo-900 mb-2">Curriculum Planning Support</h4>
                            <p class="text-sm text-indigo-800 leading-relaxed">
                                📊 I can turn any specific unit from this map into a printable lesson plan, complete with reading comprehension questions, vocabulary lists, and grammar worksheets tailored for your classroom.
                            </p>
                            <p class="text-sm font-semibold text-indigo-900 mt-2">
                                <i class="fas fa-info-circle mr-1"></i> Note: For optimal learning, all associated listening tasks and audio materials are set to 85% playback speed to help secondary students process new pronunciation and complex instructions.
                            </p>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Initialize
        window.onload = () => {
            switchTab('js1');
        };
    </script>
</body>
</html>
