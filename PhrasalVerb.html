<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Phrasal Verb Challenge - Classroom Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: flex;
        }
        
        /* Custom animation for shaking */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.5s; }
        
        /* Animation for bonus points popup */
        @keyframes fade-up-pop {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }
        .bonus-popup {
            position: absolute;
            animation: fade-up-pop 1.5s ease-out forwards;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 50;
        }
        
        /* Animation for the token icon */
        @keyframes pop-icon {
            0% { transform: scale(1); }
            50% { transform: scale(1.5) rotate(-15deg); }
            100% { transform: scale(1); }
        }
        .pop {
            animation: pop-icon 0.3s ease-out;
            display: inline-block;
        }

        /* Visual Effect Base Classes */
        .sparkle, .confetti, .pulse-ring, .heart, .star, .ripple, .firework, .bubble {
            position: absolute; pointer-events: none; z-index: 100;
        }
        .sparkle { background: #fff; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 10px #fff; animation: fade-out 1s forwards; }
        .confetti { width: 8px; height: 16px; animation: fall-spin 2s linear forwards; }
        .pulse-ring { border: 4px solid #4ecdc4; border-radius: 50%; width: 20px; height: 20px; animation: ping 1s forwards; transform: translate(-50%, -50%); }
        .heart { font-size: 24px; animation: float-up 2s forwards; }
        .star { font-size: 24px; animation: spin-fade 1.5s forwards; }
        .ripple { border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; width: 200px; height: 200px; animation: ripple-anim 1s forwards; transform: translate(-50%, -50%); }
        .firework { width: 8px; height: 8px; border-radius: 50%; animation: fade-out 1.2s forwards; }
        .bubble { border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; animation: float-up 2s forwards; }

        /* Modifier Classes applied to Elements */
        .bounce-effect { animation: bounce-custom 0.6s; }
        .glow-effect { box-shadow: 0 0 25px 10px rgba(78, 205, 196, 0.6); transition: box-shadow 0.2s; }
        .shake-effect { animation: shake-intense 0.5s; }
        .flip-effect { animation: flip 0.8s; }
        .zoom-effect { animation: zoom 0.5s; }
        .slide-up-effect { animation: slide-up 0.6s; }
        .rotate-effect { animation: rotate-custom 0.8s; }
        .flash-effect { animation: flash 0.4s; }
        .wobble-effect { animation: wobble 0.8s; }
        .fade-in-effect { animation: fade-in 1s; }
        .slide-in-effect { animation: slide-in 0.6s; }
        .elastic-effect { animation: elastic 1s; }

        @keyframes fade-out { to { opacity: 0; transform: scale(0); } }
        @keyframes fall-spin { to { transform: translateY(200px) rotate(360deg); opacity: 0; } }
        @keyframes float-up { to { transform: translateY(-100px); opacity: 0; } }
        @keyframes spin-fade { to { transform: rotate(360deg) scale(1.5); opacity: 0; } }
        @keyframes ripple-anim { from { transform: translate(-50%, -50%) scale(0.1); opacity: 1; } to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
        @keyframes bounce-custom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px) scale(1.05); } }
        @keyframes shake-intense { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        @keyframes flip { 0% { transform: perspective(400px) rotateY(0); } 100% { transform: perspective(400px) rotateY(360deg); } }
        @keyframes zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); z-index: 10; } }
        @keyframes slide-up { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes rotate-custom { 0% { transform: rotate(0deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes flash { 0%, 100% { filter: brightness(1); background-color: inherit; } 50% { filter: brightness(1.5); background-color: #fff; color: #000; } }
        @keyframes wobble { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(3deg); } 75% { transform: rotate(-3deg); } }
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes slide-in { 0% { transform: translateX(-30px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes elastic { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 75% { transform: scale(0.95); } 100% { transform: scale(1); } }
    </style>
</head>

        function speakText(text, teamId) {
            if (!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            
            let msVoice = voices.find(v => v.name.includes("Microsoft") && v.lang.startsWith("en"));
            if (msVoice) {
                utterance.voice = msVoice;
            } else {
                utterance.lang = 'en-US';
            }
            
            // Adjust pitch to distinguish between players answering consecutively
            utterance.pitch = teamId === 'team1' ? 1.2 : 0.8;
            utterance.rate = 1.1; 
            
            window.speechSynthesis.speak(utterance);
        }

        class Sound {
            constructor() {
                 this.sounds = {
                    levelUp: new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "fatsawtooth" },
                        envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 1 }
                    }).toDestination(),
                    gameOver: new Tone.PolySynth(Tone.Synth, {
                         envelope: { attack: 0.1, decay: 0.5, sustain: 0.2, release: 1.5 }
                    }).toDestination(),
                    click: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).toDestination(),
                    streak: new Tone.PolySynth(Tone.Synth, {
                        volume: -8,
                        oscillator: { type: "pulse", width: 0.2 },
                        envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.4 }
                    }).toDestination(),
                    gameStart: new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'amsine' } }).toDestination()
                };
            }
            async play(soundName) {
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }
                if (this.sounds[soundName]) {
                    const now = Tone.now();
                    switch(soundName) {
                        case 'levelUp': this.sounds.levelUp.triggerAttackRelease(["G4", "C5", "E5", "G5"], "0.6s", now); break;
                        case 'gameOver': this.sounds.gameOver.triggerAttackRelease(["C4", "G3", "C3"], "1.2s", now); break;
                        case 'click': this.sounds.click.triggerAttackRelease("C2", "8n", now); break;
                        case 'streak': this.sounds.streak.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n", now); break;
                        case 'gameStart': this.sounds.gameStart.triggerAttackRelease(["C4", "G4", "C5"], "4n", now); break;
                    }
                }
            }
        }
        
        class FirestoreDB {
            constructor() {
                try {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'phrasal-verb-game';
                    const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                    this.app = initializeApp(firebaseConfig);
                    this.db = getFirestore(this.app);
                    this.auth = getAuth(this.app);
                    this.collectionPath = `/artifacts/${appId}/public/data/leaderboard`;
                } catch (e) {
                    console.error("Firebase initialization failed:", e);
                    this.db = null;
                }
            }

            async ensureAuth() {
                try {
                    if (this.auth.currentUser) return;
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(this.auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(this.auth);
                    }
                } catch (error) {
                    console.error("Authentication failed:", error);
                }
            }

            async saveScore(teamName, score) {
                if (!this.db || !this.auth.currentUser) return;
                try {
                    await addDoc(collection(this.db, this.collectionPath), {
                        name: teamName,
                        score: score,
                        createdAt: new Date()
                    });
                } catch (e) {
                    console.error("Error adding document: ", e);
                }
            }

            async getHighScores(limitCount = 10) {
                if (!this.db || !this.auth.currentUser) return [];
                try {
                    const q = query(collection(this.db, this.collectionPath), limit(limitCount));
                    const querySnapshot = await getDocs(q);
                    const scores = [];
                    querySnapshot.forEach((doc) => {
                        scores.push(doc.data());
                    });
                    return scores.sort((a, b) => b.score - a.score);
                } catch (e) {
                    console.error("Error getting documents: ", e);
                    return [];
                }
            }
        }

        class Team {
            constructor(id, name, domElements) {
                this.id = id;
                this.name = name;
                this.dom = domElements;
                this.reset();
            }

            reset() {
                this.score = 0;
                this.tokens = 0;
                this.streak = 0;
                this.levelIndex = 0;
                
                // Track dynamic progression per level
                this.levelCorrectCount = 0;
                this.levelIncorrectCount = 0;
                
                this.isFinished = false;
                this.questionQueue = [];
                this.currentQuestion = null;
                this.questionStartTime = 0;
                this.awards = new Set();
                this.fastestAnswer = Infinity;
                clearTimeout(this.timer);
                clearInterval(this.timerInterval);
            }

            updateHUD() {
                this.dom.nameDisplay.textContent = this.name;
                this.dom.scoreEl.textContent = `Score: ${this.score}`;
                this.dom.streakEl.innerHTML = `🔥 ${this.streak}`;
                this.dom.tokensEl.innerHTML = `🪙 ${this.tokens}`;
                const levelName = LEVEL_ORDER[this.levelIndex];
                if (levelName) {
                    this.dom.qCountEl.textContent = `${levelName}`;
                }
            }
        }

        class Game {
            constructor() {
                this.sound = new Sound();
                this.firestore = new FirestoreDB();
                this.team1 = new Team('team1', 'Team 1', dom.team1);
                this.team2 = new Team('team2', 'Team 2', dom.team2);
                this.gameTimer = null;
                this.isGameOver = false;
                this.roster = [];
                this.globalQuestionCount = 0;
            }

            async init() {
                dom.buttons.start.addEventListener('click', () => this.startGame());
                dom.buttons.playAgain.addEventListener('click', () => this.resetGame());
                dom.buttons.submitScore.addEventListener('click', () => this.submitScores());
                dom.buttons.home.addEventListener('click', () => this.resetGame());
                
                if (this.firestore.db) {
                    await this.updateLeaderboard();
                } else {
                    dom.leaderboard.innerHTML = '<p class="text-red-500">Leaderboard connection failed.</p>';
                }
            }
            
            async updateLeaderboard() {
                if (!this.firestore.db) return;
                await this.firestore.ensureAuth();
                const scores = await this.firestore.getHighScores();
                dom.leaderboard.innerHTML = '';
                if (scores.length === 0) {
                    dom.leaderboard.innerHTML = '<p class="text-slate-400">No scores yet. Be the first!</p>';
                    return;
                }
                scores.forEach((s, index) => {
                    const entry = document.createElement('div');
                    entry.className = `flex justify-between items-center p-2 rounded-lg ${index === 0 ? 'bg-yellow-500/30' : 'bg-slate-700'}`;
                    entry.innerHTML = `
                        <span class="font-bold text-white">${index + 1}. ${s.name}</span>
                        <span class="font-bold text-cyan-400">${s.score}</span>
                    `;
                    dom.leaderboard.appendChild(entry);
                });
            }

            switchScreen(screenName) {
                this.sound.play('click');
                Object.values(dom.screens).forEach(s => s.classList.remove('active'));
                dom.screens[screenName].classList.add('active');
                
                if (screenName === 'mainMenu') {
                    dom.buttons.home.classList.add('hidden');
                } else {
                    dom.buttons.home.classList.remove('hidden');
                }
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            startGame() {
                this.sound.play('gameStart');
                this.isGameOver = false;
                this.globalQuestionCount = 0;
                
                const listVal = dom.inputs.playerList.value;
                if (listVal.trim()) {
                    this.roster = listVal.split(',').map(n => n.trim()).filter(n => n.length > 0);
                } else {
                    this.roster = [];
                }

                if (this.roster.length >= 2) {
                    this.assignRandomPlayers(true);
                } else {
                    this.team1.name = dom.inputs.team1Name.value || 'Team 1';
                    this.team2.name = dom.inputs.team2Name.value || 'Team 2';
                }
                
                [this.team1, this.team2].forEach(team => {
                    team.reset();
                    this.setupLevelQueue(team);
                    team.updateHUD();
                });

                this.switchScreen('game');
                this.loadNextQuestion(this.team1);
                this.loadNextQuestion(this.team2);
            }

            assignRandomPlayers(isInitial = false) {
                if (this.roster.length >= 2) {
                    let shuffled = this.shuffleArray([...this.roster]);
                    this.team1.name = shuffled[0];
                    this.team2.name = shuffled[1];
                    this.team1.updateHUD();
                    this.team2.updateHUD();
                    
                    if (!isInitial) {
                        this.showCenterMessage(`Player Swap!\n${this.team1.name} vs ${this.team2.name}`);
                    }
                }
            }

            showCenterMessage(msg) {
                dom.centerMessage.innerText = msg;
                dom.centerMessage.classList.remove('hidden');
                dom.centerMessage.classList.add('animate-bounce');
                setTimeout(() => {
                    dom.centerMessage.classList.add('hidden');
                    dom.centerMessage.classList.remove('animate-bounce');
                }, 3000);
            }
            
            resetGame() {
                [this.team1, this.team2].forEach(team => {
                    clearTimeout(team.timer);
                    clearInterval(team.timerInterval);
                });
                this.switchScreen('mainMenu');
                this.updateLeaderboard();
                dom.buttons.submitScore.disabled = false;
                dom.submitMessage.textContent = '';
            }

            setupLevelQueue(team) {
                const level = LEVEL_ORDER[team.levelIndex];
                if (level) {
                    const levelQuestions = [...PHRASAL_VERBS[level]];
                    team.questionQueue = this.shuffleArray(levelQuestions);
                    team.levelCorrectCount = 0;
                    team.levelIncorrectCount = 0;
                }
            }

            loadNextQuestion(team) {
                if (team.isFinished || this.isGameOver) return;

                if (team.questionQueue.length === 0) {
                    // Fallback to push to next level if they clear the board perfectly before hitting 5
                    if (team.levelIndex < LEVEL_ORDER.length - 1) {
                        this.sound.play('levelUp');
                        team.levelIndex++;
                        this.setupLevelQueue(team);
                    } else {
                        team.isFinished = true;
                        team.dom.sentenceEl.textContent = "Finished!";
                        team.dom.optionsEl.innerHTML = "";
                        clearTimeout(team.timer);
                        clearInterval(team.timerInterval);
                        if (this.team1.isFinished && this.team2.isFinished) this.endGame();
                        return;
                    }
                }

                const question = team.questionQueue.shift();
                team.currentQuestion = question;
                team.dom.sentenceEl.textContent = question.sentence;
                team.dom.optionsEl.innerHTML = '';
                const shuffledOptions = this.shuffleArray([...question.options]);

                shuffledOptions.forEach(option => {
                    const button = document.createElement('button');
                    // Font sizes dramatically increased here
                    button.className = 'w-full p-6 bg-slate-800 border-2 border-slate-700 rounded-xl text-3xl md:text-5xl font-bold text-white hover:border-cyan-500 transition disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:border-slate-700 break-words';
                    if (team.id === 'team2') button.classList.add('hover:border-pink-500');
                    button.textContent = option;
                    button.onclick = (e) => this.handleAnswerSelection(team, button, e);
                    team.dom.optionsEl.appendChild(button);
                });

                team.updateHUD();
                this.startQuestionTimer(team);
            }

            startQuestionTimer(team) {
                clearTimeout(team.timer);
                clearInterval(team.timerInterval);
                
                team.questionStartTime = Date.now();
                team.dom.timerBarEl.style.transition = 'none';
                team.dom.timerBarEl.style.width = '100%';
                team.dom.timerTextEl.textContent = TIME_PER_QUESTION.toFixed(1);

                setTimeout(() => {
                    team.dom.timerBarEl.style.transition = `width ${TIME_PER_QUESTION}s linear`;
                    team.dom.timerBarEl.style.width = '0%';
                }, 100);

                team.timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - team.questionStartTime) / 1000;
                    const remaining = Math.max(0, TIME_PER_QUESTION - elapsed);
                    team.dom.timerTextEl.textContent = remaining.toFixed(1);
                }, 100);

                team.timer = setTimeout(() => {
                    clearInterval(team.timerInterval);
                    team.dom.timerTextEl.textContent = "0.0";
                    this.handleAnswerSelection(team, null, null);
                }, TIME_PER_QUESTION * 1000);
            }

            handleAnswerSelection(team, button, event) {
                clearTimeout(team.timer);
                clearInterval(team.timerInterval);
                
                const answerTime = (Date.now() - team.questionStartTime) / 1000;
                const isCorrect = button && button.textContent === team.currentQuestion.answer;

                Array.from(team.dom.optionsEl.children).forEach(btn => {
                    btn.disabled = true;
                    if (btn.textContent === team.currentQuestion.answer) {
                        btn.classList.remove('bg-slate-800', 'border-slate-700');
                        btn.classList.add('bg-green-500', 'border-green-400', 'scale-105', 'z-10', 'relative');
                    }
                });

                if (isCorrect) {
                    VisualAudioFX.playRandomCorrect();
                    VisualAudioFX.triggerRandomEffect(button || team.dom.panel);

                    const timeBonus = Math.max(0, Math.floor((1 - (answerTime / TIME_PER_QUESTION)) * TIME_BONUS_MAX));
                    team.score += BASE_POINTS_CORRECT + timeBonus;
                    team.tokens += 1;
                    team.streak++;
                    
                    if (team.dom.tokensEl) {
                        team.dom.tokensEl.classList.add('pop');
                        setTimeout(() => team.dom.tokensEl.classList.remove('pop'), 300);
                    }

                    if (answerTime < team.fastestAnswer) team.fastestAnswer = answerTime;

                    if (STREAK_MILESTONES[team.streak]) {
                        const streakBonus = STREAK_MILESTONES[team.streak];
                        team.score += streakBonus;
                        team.tokens += Math.floor(streakBonus / 10);
                        this.sound.play('streak');
                        this.showBonusPopup(team, `🔥 +${streakBonus} STREAK!`, event, true);
                        if (team.streak >= 7) team.awards.add("Streak Master");
                    }
                    
                    team.levelCorrectCount++;
                    const praise = PRAISE_PHRASES[Math.floor(Math.random() * PRAISE_PHRASES.length)];
                    speakText(praise, team.id);

                } else {
                    VisualAudioFX.playRandomIncorrect();
                    team.score += POINTS_INCORRECT;
                    team.streak = 0;
                    team.questionQueue.push(team.currentQuestion); // Repeat incorrect only
                    
                    if (button) {
                        button.classList.remove('bg-slate-800', 'border-slate-700');
                        button.classList.add('bg-red-500', 'border-red-400', 'shake');
                    }
                    
                    team.levelIncorrectCount++;
                    const encourage = ENCOURAGE_PHRASES[Math.floor(Math.random() * ENCOURAGE_PHRASES.length)];
                    speakText(encourage, team.id);
                }
                
                team.updateHUD();
                this.globalQuestionCount++;

                if (this.globalQuestionCount > 0 && this.globalQuestionCount % 20 === 0) {
                    this.assignRandomPlayers();
                }

                setTimeout(() => {
                    // Check dynamic difficulty progression
                    if (team.levelCorrectCount >= 5) {
                        if (team.levelIndex < LEVEL_ORDER.length - 1) {
                            team.levelIndex++;
                            this.sound.play('levelUp');
                            this.setupLevelQueue(team);
                        } else {
                            // Finished Max Level!
                            team.isFinished = true;
                            team.dom.sentenceEl.textContent = "Finished!";
                            team.dom.optionsEl.innerHTML = "";
                            if (this.team1.isFinished && this.team2.isFinished) this.endGame();
                            return; 
                        }
                    } else if (team.levelIncorrectCount >= 5) {
                        if (team.levelIndex > 0) {
                            team.levelIndex--;
                            this.setupLevelQueue(team);
                        } else {
                            team.levelIncorrectCount = 0; // Reset to avoid infinite looping if failing at A1
                        }
                    }
                    
                    this.loadNextQuestion(team);
                }, 1500);
            }

            showBonusPopup(team, text, event, isStreak) {
                const popup = document.createElement('div');
                popup.textContent = text;
                popup.className = 'bonus-popup';
                if (isStreak) {
                    popup.className += ' text-amber-400';
                } else {
                    popup.className += ' text-yellow-300';
                }
                if (event) {
                    popup.style.left = `${event.clientX - team.dom.panel.offsetLeft}px`;
                    popup.style.top = `${event.clientY - team.dom.panel.offsetTop}px`;
                } else {
                    popup.style.left = '50%';
                    popup.style.top = '50%';
                }
                team.dom.panel.appendChild(popup);
                setTimeout(() => popup.remove(), 1500);
            }

            endGame() {
                if(this.isGameOver) return;
                this.isGameOver = true;
                
                clearTimeout(this.team1.timer);
                clearInterval(this.team1.timerInterval);
                clearTimeout(this.team2.timer);
                clearInterval(this.team2.timerInterval);
                this.sound.play('gameOver');

                [this.team1, this.team2].forEach(team => {
                    if (team.fastestAnswer < 1.5) team.awards.add("Speed Demon");
                    team.dom.finalScoreEl.textContent = team.score;
                    team.dom.finalTokensEl.textContent = `🪙 ${team.tokens}`;
                    team.dom.finalNameEl.textContent = team.name;
                    team.dom.awardsEl.innerHTML = ''; 
                    if (team.awards.size > 0) {
                        team.awards.forEach(award => {
                            const p = document.createElement('p');
                            p.className = 'text-yellow-400 font-semibold';
                            p.textContent = `- ${award}`;
                            team.dom.awardsEl.appendChild(p);
                        });
                    } else {
                        team.dom.awardsEl.innerHTML = '<p class="text-slate-400">No awards</p>';
                    }
                });

                if (this.team1.score > this.team2.score) {
                    dom.winnerDeclaration.textContent = `${this.team1.name} Wins!`;
                    dom.winnerDeclaration.className = 'text-5xl font-bold mb-10 text-cyan-400';
                } else if (this.team2.score > this.team1.score) {
                    dom.winnerDeclaration.textContent = `${this.team2.name} Wins!`;
                    dom.winnerDeclaration.className = 'text-5xl font-bold mb-10 text-pink-400';
                } else {
                    dom.winnerDeclaration.textContent = "It's a Draw!";
                    dom.winnerDeclaration.className = 'text-5xl font-bold mb-10 text-yellow-400';
                }
                this.switchScreen('winner');
            }
            
            async submitScores() {
                this.sound.play('click');
                dom.buttons.submitScore.disabled = true;
                dom.submitMessage.textContent = 'Submitting...';
                
                await this.firestore.ensureAuth();
                const winningTeam = this.team1.score > this.team2.score ? this.team1 : (this.team2.score > this.team1.score ? this.team2 : null);
                
                if (winningTeam) {
                    await this.firestore.saveScore(winningTeam.name, winningTeam.score);
                } else { 
                    await this.firestore.saveScore(this.team1.name, this.team1.score);
                    await this.firestore.saveScore(this.team2.name, this.team2.score);
                }

                dom.submitMessage.textContent = 'Score submitted!';
                await this.updateLeaderboard();
            }
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            const game = new Game();
            await game.init();
        });
    </script>
</body>
</html>
