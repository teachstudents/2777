                if (headerMatch) {

                        currentUnit.title = title.replace(/\(.*?\)/, '').trim();

                if (currentUnit) {

                    if (line.startsWith('|') && !line.includes('Word (词汇)') && !line.includes('INQUIRY')) {
                        const parts = line.split('|').map(s => s.trim()).filter(s => s.length > 0);

        const Reader = ({ story }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentLineIndex, setCurrentLineIndex] = useState(-1);
            const [currentCharIndex, setCurrentCharIndex] = useState(-1);
            const synthRef = useRef(window.speechSynthesis);

            const getVoiceForSpeaker = (speaker) => {
                const voices = synthRef.current.getVoices();
                let voice = null;
                if (speaker === 'Sophia') voice = voices.find(v => v.name.includes('Emma') && v.name.includes('Online'));
                else if (speaker === 'Mr. Chen') voice = voices.find(v => v.name.includes('Andrew') && v.name.includes('Online'));
                else if (speaker === 'Leo') voice = voices.find(v => v.name.includes('Brian') && v.name.includes('Online'));
                
                if(!voice) voice = voices.find(v => v.lang.startsWith('en') && (speaker==='Sophia' ? v.name.includes('Female') : v.name.includes('Male')));
                if(!voice) voice = voices.find(v => v.lang.startsWith('en'));
                return voice;
            };

            const speakLine = (lineIdx) => {
                if (lineIdx >= story.length) {
                    setIsPlaying(false);
                    setCurrentLineIndex(-1);
                    setCurrentCharIndex(-1);
                    return;
                }

                const line = story[lineIdx];
                setCurrentLineIndex(lineIdx);
                setCurrentCharIndex(0);

                const utterance = new SpeechSynthesisUtterance(line.text);
                const voice = getVoiceForSpeaker(line.speaker);
                if(voice) utterance.voice = voice;
                utterance.rate = 0.85;

                utterance.onboundary = (event) => {
                    if (event.name === 'word') setCurrentCharIndex(event.charIndex);
                };

                utterance.onend = () => speakLine(lineIdx + 1);
                utterance.onerror = () => setIsPlaying(false);

                synthRef.current.speak(utterance);
            };

            const startReading = () => {
                synthRef.current.cancel();
                setIsPlaying(true);
                speakLine(0);
            };

            const stopReading = () => {
                synthRef.current.cancel();
                setIsPlaying(false);
                setCurrentLineIndex(-1);
                setCurrentCharIndex(-1);
            };

            useEffect(() => {
                let isMounted = true;
                const timer = setTimeout(() => {
                    if (isMounted) {
                        if(synthRef.current.getVoices().length > 0) {
                            // Browsers often block autoplay TTS without user interaction.
                            // We will not force it on load to avoid errors, we'll let user click to play
                        } else {
                            synthRef.current.onvoiceschanged = () => { synthRef.current.onvoiceschanged = null; }
                        }
                    }
                }, 500);
                return () => { isMounted = false; clearTimeout(timer); synthRef.current.cancel(); };
            }, [story]);

            const renderLine = (line, idx) => {
                if (currentLineIndex === idx && isPlaying) {
                    const before = line.text.slice(0, currentCharIndex);
                    const wordMatch = line.text.slice(currentCharIndex).match(/^\S+/);
                    const currentWord = wordMatch ? wordMatch[0] : "";
                    const after = line.text.slice(currentCharIndex + (currentWord ? currentWord.length : 0));

                    return (
                        <div key={idx} className="mb-4">
                            <strong className="text-blue-700">{line.speaker}: </strong>
                            <span>{before}</span>
                            <span className="word-highlight text-blue-900 font-bold">{currentWord}</span>
                            <span>{after}</span>
                        </div>
                    );
                }
                
                return (
                    <div key={idx} className="mb-4 transition-all duration-300">
                        <strong className="text-blue-700">{line.speaker}: </strong>
                        <span className="opacity-70">{line.text}</span>
                    </div>
                );
            };

            return (
                <div 
                    className="bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-gray-100 cursor-pointer min-h-[60vh] fade-panel relative"
                    onClick={(e) => { if (!isPlaying) startReading(); }}
                >
                    <button 
                        onClick={(e) => { e.stopPropagation(); isPlaying ? stopReading() : startReading(); }}
                        className={`absolute top-4 right-4 px-4 py-2 rounded-full font-bold text-white shadow-md flex items-center gap-2 transition-all z-10 ${isPlaying ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-500 hover:bg-blue-600'}`}
                    >
                        <i className={`fa-solid ${isPlaying ? 'fa-stop' : 'fa-play'}`}></i>
                        {isPlaying ? "Stop" : "Play"}
                    </button>
                    
                    <div className="text-lg text-gray-700 leading-relaxed font-medium pt-8">
                        {story.map((line, idx) => renderLine(line, idx))}
                    </div>
                    {!isPlaying && currentLineIndex === -1 && (
                        <div className="mt-8 text-center text-gray-400 text-sm animate-pulse">
                            Tap anywhere to play audio (0.85x speed)
                        </div>
                    )}
                </div>
            );
        };

                    </div>
                    <div className="text-center p-4 bg-white rounded-xl shadow-sm">
                        <div className="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Population Density</div>
                        <div className="text-5xl font-black text-emerald-600">{density} <span className="text-xl opacity-70">/km²</span></div>
                    </div>
                </div>
            );
        };

        const MolarMath = ({ math }) => {
            const [atoms, setAtoms] = useState(math.interactive.defaultAtoms || 2);
            const [mass, setMass] = useState(math.interactive.defaultMass || 16);
            const total = (atoms * mass).toFixed(2);
            return (
                <div className="mt-6 bg-cyan-50 p-6 rounded-2xl border-2 border-cyan-200 fade-panel">
                    <div className="mb-4">
                        <label className="block text-sm font-bold text-gray-700 mb-1">Quantity of Atoms: {atoms}</label>
                        <input type="range" min="1" max="10" value={atoms} onChange={e=>setAtoms(e.target.value)} className="w-full" />
                    </div>
                    <div className="mb-6">
                        <label className="block text-sm font-bold text-gray-700 mb-1">Atomic Mass: {mass}</label>
                        <input type="range" min="1" max="100" value={mass} onChange={e=>setMass(e.target.value)} className="w-full" />
                    </div>
                    <div className="text-center p-4 bg-white rounded-xl shadow-sm">
                        <div className="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Total Mass</div>
                        <div className="text-5xl font-black text-cyan-600">{total}</div>
                    </div>
                </div>
            );
        };

        const WaveMath = ({ math }) => {
            const [freq, setFreq] = useState(math.interactive.defaultFreq);
            const [len, setLength] = useState(math.interactive.defaultLength);
            const speed = (freq * len).toFixed(1);
            return (
                <div className="mt-6 bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-200 fade-panel">
                    <div className="mb-4">
                        <label className="block text-sm font-bold text-gray-700 mb-1">Frequency (Hz): {freq}</label>
                        <input type="range" min="10" max="1000" value={freq} onChange={e=>setFreq(e.target.value)} className="w-full" />
                    </div>
                    <div className="mb-6">
                        <label className="block text-sm font-bold text-gray-700 mb-1">Wavelength (m): {len}</label>
                        <input type="range" min="0.1" max="5" step="0.1" value={len} onChange={e=>setLength(e.target.value)} className="w-full" />
                    </div>
                    <div className="text-center p-4 bg-white rounded-xl shadow-sm">
                        <div className="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Wave Speed</div>
                        <div className="text-5xl font-black text-indigo-600">{speed} <span className="text-xl opacity-70">m/s</span></div>
                    </div>
                </div>
            );
        };

        const AverageMath = ({ math }) => {
            const [vals, setVals] = useState(math.interactive.values);
            const avg = (vals.reduce((a,b)=>a+b, 0) / vals.length).toFixed(1);
            return (
                <div className="mt-6 bg-slate-100 p-6 rounded-2xl border-2 border-slate-300 fade-panel">
                     <div className="grid grid-cols-4 gap-2 mb-6">
                        {vals.map((v, i) => (
                            <div key={i}>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Trial {i+1}</label>
                                <input type="number" value={v} onChange={(e) => {
                                    const newVals = [...vals];
                                    newVals[i] = parseFloat(e.target.value) || 0;
                                    setVals(newVals);
                                }} className="w-full p-2 border border-gray-300 rounded text-center font-bold" />
                            </div>
                        ))}
                    </div>
                    <div className="text-center p-4 bg-white rounded-xl shadow-sm">
                        <div className="text-sm text-gray-500 font-bold uppercase tracking-widest mb-1">Calculated Mean</div>
                        <div className="text-5xl font-black text-slate-700">{avg}</div>
                    </div>
                </div>
            );
        };

        const MathInteractive = ({ math }) => {
            if (!math) return <div className="p-8 text-center text-gray-500 fade-panel">No math activity for this unit.</div>;

            const renderInteractive = () => {
                switch(math.interactive?.type) {
                    case 'kinetic': return <KineticMath math={math} />;
                    case 'density': return <DensityMath math={math} />;
                    case 'molar': return <MolarMath math={math} />;
                    case 'wave': return <WaveMath math={math} />;
                    case 'average': return <AverageMath math={math} />;
                    default: return <AverageMath math={math} />;
                }
            };

            return (
                <div className="bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-gray-100 min-h-[60vh] fade-panel">
                    <h2 className="text-2xl font-bold text-gray-800 mb-2"><i className="fa-solid fa-square-root-variable text-red-500 mr-2"></i> {math.title}</h2>
                    <p className="text-gray-600 mb-4">{math.text}</p>
                    <div className="bg-slate-800 text-green-400 font-mono p-4 rounded-xl text-center text-lg shadow-inner">
                        {math.formula}
                    </div>
                    {renderInteractive()}
                </div>
            );
        };

        const ExperimentView = ({ experiment }) => {
            if (!experiment) return <div className="p-8 text-center text-gray-500 fade-panel">No lab activity specified for this unit yet.</div>;
            const containerRef = useRef(null);
            const [completed, setCompleted] = useState(false);

            const handleComplete = (e) => {
                if (completed) return;
                setCompleted(true);
                playRandomCorrectEffect({current: containerRef.current});
            };

            return (
                <div ref={containerRef} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 min-h-[60vh] fade-panel">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-gray-800"><i className="fa-solid fa-flask text-teal-500 mr-2"></i> Lab: {experiment.title}</h2>
                        {completed && <span className="bg-teal-100 text-teal-800 font-bold px-3 py-1 rounded-full text-xs"><i className="fa-solid fa-check mr-1"></i> Logged</span>}
                    </div>

                    <div className="bg-teal-50 p-3 rounded-xl border border-teal-100 mb-4">
                        <h3 className="font-bold text-teal-900 mb-2 uppercase tracking-wider text-xs"><i className="fa-solid fa-box-open mr-2"></i>Materials</h3>
                        <ul className="grid grid-cols-2 gap-1 text-sm">
                            {experiment.materials.map((mat, i) => (
                                <li key={i} className="flex items-center gap-1 text-teal-800 font-medium">
                                    <i className="fa-solid fa-check-circle text-teal-400 text-xs"></i> {mat}
                                </li>
                            ))}
                        </ul>
                    </div>

                    <div className="mb-4">
                        <h3 className="font-bold text-gray-800 mb-2 uppercase tracking-wider text-xs"><i className="fa-solid fa-list-ol mr-2 text-gray-500"></i>Procedure</h3>
                        <div className="space-y-2">
                            {experiment.procedure.map((step, i) => (
                                <div key={i} className="flex gap-3 p-2 bg-slate-50 rounded-xl border border-slate-100 items-start">
                                    <div className="bg-white border border-slate-200 text-slate-500 font-bold rounded-full w-6 h-6 flex items-center justify-center flex-shrink-0 text-xs">
                                        {i + 1}
                                    </div>
                                    <div className="text-gray-700 font-medium text-sm pt-0.5">{step}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-indigo-50 border-l-4 border-indigo-400 p-3 rounded-r-xl mb-4">
                        <h3 className="font-bold text-indigo-900 mb-1 flex items-center gap-2 text-xs"><i className="fa-solid fa-graduation-cap"></i> Secondary Connection</h3>
                        <p className="text-indigo-800 text-xs font-medium leading-relaxed">{experiment.secondaryConnection}</p>
                    </div>

                    <div className="text-center mt-2">
                        <button 
                            onClick={handleComplete}
                            disabled={completed}
                            className={`px-6 py-2 rounded-full font-bold text-white text-sm transition-all shadow-md ${completed ? 'bg-slate-300 cursor-not-allowed' : 'bg-teal-500 hover:bg-teal-600 hover:scale-105 active:scale-95'}`}
                        >
                            {completed ? "Completed" : "Mark Complete"}
                        </button>
                    </div>
                </div>
            );
        };

        const Quiz = ({ questions, unitId, onComplete }) => {
            const [answers, setAnswers] = useState({});
            const containerRef = useRef(null);

            const handleSelect = (qIndex, optIndex, e) => {
                if (answers[qIndex] !== undefined) return; // Prevent changing answer
                
                const isCorrect = optIndex === questions[qIndex].answer;
                const newAnswers = {...answers, [qIndex]: optIndex};
                setAnswers(newAnswers);

                if(isCorrect) {
                    playRandomCorrectEffect({ current: e.target });
                } else {
                    playRandomIncorrectEffect({ current: e.target });
                }

                // Check completion
                if (Object.keys(newAnswers).length === questions.length) {
                    let score = 0;
                    Object.keys(newAnswers).forEach(key => {
                        if (newAnswers[key] === questions[key].answer) score++;
                    });
                    if (score === questions.length) {
                        setTimeout(() => {
                            playCorrectSound16();
                            triggerEffect2(containerRef.current);
                            onComplete(unitId);
                        }, 1000);
                    }
                }
            };

            const resetQuiz = () => { setAnswers({}); };

            let score = 0;
            const isFinished = Object.keys(answers).length === questions.length;
            if (isFinished) {
                questions.forEach((q, i) => { if (answers[i] === q.answer) score++; });
            }

            return (
                <div ref={containerRef} className="bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-gray-100 min-h-[60vh] fade-panel">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800"><i className="fa-solid fa-list-check text-orange-500 mr-2"></i> Assessment</h2>
                        {isFinished && (
                            <span className="bg-orange-100 text-orange-800 font-black px-4 py-2 rounded-full border border-orange-200">
                                Score: {score} / {questions.length}
                            </span>
                        )}
                    </div>
                    
                    <div className="space-y-4"> 
                        {questions.map((q, qIndex) => {
                            const isAnswered = answers[qIndex] !== undefined;
                            
                            return (
                                <div key={qIndex} className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <h3 className="text-md font-bold text-gray-800 mb-3">{qIndex + 1}. {q.q}</h3>
                                    <div className="space-y-2"> 
                                        {q.options.map((opt, optIndex) => {
                                            const isSelected = answers[qIndex] === optIndex;
                                            const isCorrectChoice = optIndex === q.answer;
                                            
                                            let btnClass = "w-full text-left p-3 rounded-lg border-2 transition-all text-sm font-medium text-gray-700 hover:bg-slate-100 ";
                                            
                                            if (isAnswered) {
                                                if (isCorrectChoice) btnClass += "bg-emerald-100 border-emerald-500 text-emerald-900"; 
                                                else if (isSelected) btnClass += "bg-red-100 border-red-500 text-red-900";
                                                else btnClass += "bg-white border-transparent opacity-50 cursor-not-allowed"; 
                                            } else {
                                                btnClass += "bg-white border-transparent";
                                            }

                                            return (
                                                <button 
                                                    key={optIndex} 
                                                    onClick={(e) => handleSelect(qIndex, optIndex, e)} 
                                                    disabled={isAnswered}
                                                    className={btnClass}
                                                >
                                                    {opt}
                                                    {isAnswered && isCorrectChoice && <i className="fa-solid fa-check-circle float-right text-emerald-600 mt-1"></i>}
                                                    {isAnswered && isSelected && !isCorrectChoice && <i className="fa-solid fa-times-circle float-right text-red-600 mt-1"></i>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )
                        })}
                    </div>

                    {isFinished && score !== questions.length && (
                        <div className="mt-6 pt-4 border-t border-slate-200 flex justify-end fade-in-effect">
                            <button onClick={resetQuiz} className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 px-8 rounded-full transition-all">Try Again</button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [selectedUnitId, setSelectedUnitId] = useState("5-1"); 
            const [activeTab, setActiveTab] = useState('read'); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [completedUnits, setCompletedUnits] = useState({});

            // Load progress from local storage
            useEffect(() => {
                const saved = localStorage.getItem('pkxys_science_progress');
                if(saved) setCompletedUnits(JSON.parse(saved));
            }, []);

            const markUnitComplete = (id) => {
                const updated = {...completedUnits, [id]: true};
                setCompletedUnits(updated);
                localStorage.setItem('pkxys_science_progress', JSON.stringify(updated));
            };

            const activeUnit = allUnits.find(u => u.id === selectedUnitId) || allUnits[0];
            const activeIndex = allUnits.findIndex(u => u.id === selectedUnitId);
            
            const grade5Units = allUnits.filter(u => u.grade === 5);
            const grade6Units = allUnits.filter(u => u.grade === 6);

            const handleSelectUnit = (id) => {
                setSelectedUnitId(id);
                setActiveTab('read');
                setIsSidebarOpen(false); 
            };

            const handleNext = () => {
                if (activeIndex < allUnits.length - 1) {
                    handleSelectUnit(allUnits[activeIndex + 1].id);
                }
            };

            const handlePrev = () => {
                if (activeIndex > 0) {
                    handleSelectUnit(allUnits[activeIndex - 1].id);
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    
                    {/* Responsive Sidebar (All 60 Units) */}
                    <div className={`${isSidebarOpen ? 'w-80' : 'w-0'} flex-shrink-0 transition-all duration-300 bg-slate-900 text-white flex flex-col h-full shadow-2xl relative z-40`}>
                        <div className="p-4 bg-slate-800 flex justify-between items-center whitespace-nowrap overflow-hidden">
                            <h1 className="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">PKXYS Platform</h1>
                            <button onClick={() => setIsSidebarOpen(false)} className="text-slate-400 hover:text-white p-2">
                                <i className="fa-solid fa-times text-xl"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto hide-scrollbar p-3 space-y-6">
                            {/* Grade 5 Block */}
                            <div>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 text-center border-b border-slate-700 pb-2">Grade 5 (Units 1-30)</h3>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {grade5Units.map(u => (
                                        <button key={u.id} onClick={() => handleSelectUnit(u.id)} title={u.title}
                                            className={`h-10 rounded text-xs font-bold transition-all relative ${selectedUnitId === u.id ? 'bg-blue-500 text-white shadow-lg scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                                            {u.unitNum}
                                            {completedUnits[u.id] && <i className="fa-solid fa-star text-yellow-400 text-[8px] absolute top-1 right-1 drop-shadow-md"></i>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            {/* Grade 6 Block */}
                            <div>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 text-center border-b border-slate-700 pb-2">Grade 6 (Units 1-30)</h3>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {grade6Units.map(u => (
                                        <button key={u.id} onClick={() => handleSelectUnit(u.id)} title={u.title}
                                            className={`h-10 rounded text-xs font-bold transition-all relative ${selectedUnitId === u.id ? 'bg-emerald-500 text-white shadow-lg scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'}`}>
                                            {u.unitNum}
                                            {completedUnits[u.id] && <i className="fa-solid fa-star text-yellow-400 text-[8px] absolute top-1 right-1 drop-shadow-md"></i>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50 w-full">
                        
                        {/* Header containing Hamburger, Prev/Next Arrows and Title */}
                        <header className="bg-white shadow-sm border-b border-slate-200 px-2 md:px-6 py-2 flex items-center justify-between z-10 w-full">
                            <div className="flex items-center">
                                {!isSidebarOpen && (
                                    <button onClick={() => setIsSidebarOpen(true)} className="text-slate-600 hover:text-blue-600 transition-colors p-2 mr-2">
                                        <i className="fa-solid fa-bars text-xl"></i>
                                    </button>
                                )}
                                <div className="flex items-center gap-2">
                                    <button onClick={handlePrev} disabled={activeIndex === 0} className="p-2 hover:bg-slate-100 rounded-full disabled:opacity-30 transition-colors">
                                        <i className="fa-solid fa-chevron-left text-slate-600"></i>
                                    </button>
                                    <div className="flex flex-col">
                                        <h2 className="text-lg md:text-xl font-extrabold text-slate-800 truncate leading-tight">
                                            {completedUnits[activeUnit.id] && <i className="fa-solid fa-star text-yellow-400 mr-2 drop-shadow-sm"></i>}
                                            {activeUnit.title}
                                        </h2>
                                        <span className="text-slate-500 font-bold uppercase tracking-widest text-[10px]">
                                            Grade {activeUnit.grade} • Unit {activeUnit.unitNum}
                                        </span>
                                    </div>
                                    <button onClick={handleNext} disabled={activeIndex === allUnits.length - 1} className="p-2 hover:bg-slate-100 rounded-full disabled:opacity-30 transition-colors">
                                        <i className="fa-solid fa-chevron-right text-slate-600"></i>
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Navigation Tabs */}
                        <div className="bg-white border-b border-slate-100 px-4 md:px-8 py-2 w-full flex-shrink-0 flex overflow-x-auto hide-scrollbar">
                            <div className="flex gap-4 md:gap-8 flex-1 items-center font-semibold">
                                <button onClick={() => setActiveTab('read')} className={`pb-2 pt-2 whitespace-nowrap transition-colors ${activeTab === 'read' ? 'tab-active' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Listen & Learn
                                </button>
                                <button onClick={() => setActiveTab('vocab')} className={`pb-2 pt-2 whitespace-nowrap transition-colors ${activeTab === 'vocab' ? 'tab-active' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Touch Vocab
                                </button>
                                <button onClick={() => setActiveTab('math')} className={`pb-2 pt-2 whitespace-nowrap transition-colors ${activeTab === 'math' ? 'tab-active' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Science Math
                                </button>
                                <button onClick={() => setActiveTab('experiment')} className={`pb-2 pt-2 whitespace-nowrap transition-colors ${activeTab === 'experiment' ? 'tab-active' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Lab Experiments
                                </button>
                                <button onClick={() => setActiveTab('quiz')} className={`pb-2 pt-2 whitespace-nowrap transition-colors ${activeTab === 'quiz' ? 'tab-active' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Assessment
                                </button>
                            </div>
                        </div>

                        {/* Content Body */}
                        <div className="flex-1 overflow-y-auto p-2 md:p-6 w-full relative">
                            <div className="w-full h-full pb-24">
                                {activeTab === 'read' && <Reader key={`read-${activeUnit.id}`} story={activeUnit.story} title={activeUnit.title} />}
                                {activeTab === 'vocab' && <VocabMatch key={`vocab-${activeUnit.id}`} vocab={activeUnit.vocab} />}
                                {activeTab === 'math' && <MathInteractive key={`math-${activeUnit.id}`} math={activeUnit.math} />}
                                {activeTab === 'experiment' && <ExperimentView key={`exp-${activeUnit.id}`} experiment={activeUnit.experiment} />}
                                {activeTab === 'quiz' && <Quiz key={`quiz-${activeUnit.id}`} unitId={activeUnit.id} questions={activeUnit.quiz} onComplete={markUnitComplete} />}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
