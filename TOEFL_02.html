        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (el.classList.contains('open')) {
                el.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                el.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function startTest(testIndex) {
            currentTest = testDatabase[testIndex];
            currentSectionIndex = 0;
            currentQuestionIndex = 0;
            userAnswers = {};
            
            showModal("Start Simulation", `You are beginning ${currentTest.name}. The timer will start immediately for the Reading section (~30 mins).`, () => {
                headerStatus.classList.remove('hidden');
                testNav.classList.remove('hidden');
                loadSection(currentSectionIndex);
            }, true);
        }

        function loadSection(secIndex) {
            if(secIndex >= currentTest.sections.length) {
                finishTest();
                return;
            }
            
            currentSectionIndex = secIndex;
            currentQuestionIndex = -1; 
            const section = currentTest.sections[secIndex];
            
            sectionTitle.textContent = section.title;
            startTimer(section.timeSeconds);
            
            renderSectionIntro(section);
        }

        function renderSectionIntro(section) {
            btnPrev.classList.add('hidden');
            btnCheck.classList.add('hidden');
            btnNext.innerHTML = '<span>Begin Section</span> <i class="fa-solid fa-play"></i>';
            btnNext.classList.remove('hidden');
            btnNext.onclick = () => loadQuestion(0);
            
            let icon = "fa-book-open";
            if(section.id === 'listening') icon = "fa-headphones";
            if(section.id === 'writing') icon = "fa-pen-nib";
            if(section.id === 'speaking') icon = "fa-microphone";

            mainContent.innerHTML = `
                <div class="max-w-4xl mx-auto mt-8 bg-white p-12 rounded-3xl shadow-lg border border-gray-100 text-center animate-fade-in-up">
                    <div class="inline-flex items-center justify-center w-24 h-24 rounded-2xl bg-blue-50 text-blue-600 mb-8 text-4xl shadow-inner border border-blue-100">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <h2 class="text-4xl font-black text-gray-900 mb-4 tracking-tight">${section.title}</h2>
                    <div class="w-20 h-1.5 bg-blue-600 mx-auto mb-8 rounded-full"></div>
                    <p class="text-xl text-gray-600 leading-relaxed mb-10 max-w-2xl mx-auto">${section.intro}</p>
                    
                    <div class="inline-flex items-center px-8 py-4 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 font-bold text-lg shadow-sm">
                        <i class="fa-regular fa-clock text-blue-600 mr-3 text-2xl"></i> Time allowed: ${Math.floor(section.timeSeconds / 60)} minutes
                    </div>
                </div>
            `;
        }

        function loadQuestion(qIndex) {
            stopAudio(); 
            
            const section = currentTest.sections[currentSectionIndex];
            if (qIndex < 0) {
                renderSectionIntro(section);
                return;
            }
            if (qIndex >= section.questions.length) {
                moveToNextSection();
                return;
            }

            currentQuestionIndex = qIndex;
            const q = section.questions[qIndex];
            
            btnPrev.classList.remove('hidden');
            btnPrev.onclick = () => { saveCurrentAnswer(); loadQuestion(currentQuestionIndex - 1); };
            
            btnCheck.classList.remove('hidden');
            btnCheck.onclick = () => checkCurrentAnswer();
            
            if (qIndex === section.questions.length - 1) {
                btnNext.innerHTML = '<span>Finish Section</span> <i class="fa-solid fa-flag-checkered"></i>';
                btnNext.classList.replace('bg-blue-600', 'bg-green-600');
                btnNext.classList.replace('border-blue-700', 'border-green-700');
                btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                btnNext.onclick = () => { 
                    saveCurrentAnswer();
                    showModal("Finish Section", "Are you sure you want to complete this section? You cannot return to these questions.", () => {
                        btnNext.classList.replace('bg-green-600', 'bg-blue-600');
                        btnNext.classList.replace('border-green-700', 'border-blue-700');
                        btnNext.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
                        moveToNextSection();
                    }, true);
                };
            } else {
                btnNext.innerHTML = '<span>Next</span> <i class="fa-solid fa-arrow-right"></i>';
                btnNext.classList.replace('bg-green-600', 'bg-blue-600');
                btnNext.classList.replace('border-green-700', 'border-blue-700');
                btnNext.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
                btnNext.onclick = () => { saveCurrentAnswer(); loadQuestion(currentQuestionIndex + 1); };
            }

            let html = `
                <div class="max-w-5xl mx-auto animate-fade-in-up" id="question-container">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6" id="question-card">
                        <div class="bg-gray-50 px-8 py-4 border-b border-gray-200 flex justify-between items-center">
                            <span class="font-black text-gray-800 uppercase text-sm tracking-widest flex items-center">
                                <div class="w-3 h-3 rounded-full bg-blue-600 mr-3 shadow-sm"></div>${q.taskType}
                            </span>
                            <span class="text-blue-700 text-sm font-bold bg-blue-50 px-3 py-1 rounded-lg border border-blue-200">
                                Question ${qIndex + 1} of ${section.questions.length}
                            </span>
                        </div>
                        <div class="p-8 md:p-10">
                            <div class="mb-8 pb-5 border-b border-gray-100 flex items-start gap-4">
                                <i class="fa-solid fa-circle-info text-blue-500 text-xl mt-1"></i>
                                <h3 class="text-xl font-semibold text-gray-800 leading-relaxed">${q.instruction}</h3>
                            </div>
            `;

            switch (q.type) {
                case "complete_words": html += renderCompleteWords(q); break;
                case "mcq": html += renderMCQ(q); break;
                case "mcq_audio": html += renderMCQAudio(q); break;
                case "build_sentence": html += renderBuildSentence(q); break;
                case "email": 
                case "essay": html += renderWriting(q); break;
                case "listen_repeat": 
                case "interview": html += renderSpeaking(q); break;
            }

            html += `</div></div></div>`;
            mainContent.innerHTML = html;

            postRenderLogic(q);
        }

        function checkCurrentAnswer() {
            if (currentQuestionIndex < 0) return;
            const section = currentTest.sections[currentSectionIndex];
            const q = section.questions[currentQuestionIndex];
            const answerKey = `${currentTest.id}_${currentSectionIndex}_${currentQuestionIndex}`;
            
            saveCurrentAnswer();
            const uAns = userAnswers[answerKey];

            const existingFeedback = document.getElementById('feedback-container');
            if(existingFeedback) existingFeedback.remove();

            let isCorrect = false;
            let displayUserAns = "No answer provided";
            let statusConfig = { color: "text-red-600", icon: "fa-xmark", title: "Incorrect", border: "border-red-200", bg: "bg-red-50", badgeBg: "bg-red-100", badgeText: "text-red-800" };

            if (q.type === 'complete_words') {
                if (uAns && Array.isArray(uAns)) {
                    let correct = 0;
                    uAns.forEach((l, i) => { if(l === q.answerKeys[i]) correct++; });
                    isCorrect = correct === q.answerKeys.length;
                    displayUserAns = uAns.join(' ').toUpperCase();
                    if(isCorrect) { 
                        statusConfig = { color: "text-green-600", icon: "fa-check-circle", title: "Correct!", border: "border-green-200", bg: "bg-green-50", badgeBg: "bg-green-100", badgeText: "text-green-800" };
                    } else if(correct > 0) { 
                        statusConfig = { color: "text-amber-600", icon: "fa-triangle-exclamation", title: "Partially Correct", border: "border-amber-200", bg: "bg-amber-50", badgeBg: "bg-amber-100", badgeText: "text-amber-800" };
                        displayUserAns += ` <span class="text-sm font-bold ml-2">(${correct}/${q.answerKeys.length})</span>`;
                    }
                }
            } 
            else if (q.type === 'mcq' || q.type === 'mcq_audio') {
                if (uAns !== undefined) {
                    displayUserAns = q.options[uAns];
                    isCorrect = (uAns === q.correctOption);
                    if(isCorrect) { 
                        statusConfig = { color: "text-green-600", icon: "fa-check-circle", title: "Correct!", border: "border-green-200", bg: "bg-green-50", badgeBg: "bg-green-100", badgeText: "text-green-800" };
                    }
                }
            }
            else if (q.type === 'build_sentence') {
                if (uAns && uAns.constructed) {
                    displayUserAns = uAns.constructed.join(' ');
                    isCorrect = uAns.constructed.join(' ') === q.correctOrder.join(' ');
                    if(isCorrect) { 
                        statusConfig = { color: "text-green-600", icon: "fa-check-circle", title: "Correct!", border: "border-green-200", bg: "bg-green-50", badgeBg: "bg-green-100", badgeText: "text-green-800" };
                    }
                }
            }
            else if (q.type === 'email' || q.type === 'essay') {
                statusConfig = { color: "text-blue-600", icon: "fa-pen-to-square", title: "Self-Assessed (Writing)", border: "border-blue-200", bg: "bg-blue-50", badgeBg: "bg-blue-100", badgeText: "text-blue-800" };
                displayUserAns = uAns ? "Response recorded. Compare your approach to the model below." : "No response written.";
            }
            else if (q.type === 'listen_repeat' || q.type === 'interview') {
                statusConfig = { color: "text-purple-600", icon: "fa-microphone", title: "Self-Assessed (Speaking)", border: "border-purple-200", bg: "bg-purple-50", badgeBg: "bg-purple-100", badgeText: "text-purple-800" };
                displayUserAns = uAns === "recorded" ? "Audio simulated. Review the rubric criteria below." : "Not recorded.";
            }

            const feedbackHtml = `
                <div id="feedback-container" class="mt-6 ${statusConfig.bg} border-2 ${statusConfig.border} rounded-2xl p-8 feedback-slide-down shadow-md">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-white border-opacity-60">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full ${statusConfig.badgeBg} ${statusConfig.color} flex items-center justify-center text-2xl shadow-sm">
                                <i class="fa-solid ${statusConfig.icon}"></i>
                            </div>
                            <h4 class="font-black text-2xl text-gray-900">${statusConfig.title}</h4>
                        </div>
                    </div>
                    
                    <div class="mb-6 bg-white bg-opacity-70 p-4 rounded-xl border border-white border-opacity-50">
                        <strong class="text-xs font-black uppercase tracking-widest text-gray-500 block mb-2">Your Answer</strong> 
                        <span class="font-semibold text-gray-800 text-lg">${displayUserAns}</span>
                    </div>
                    
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500"></div>
                        <strong class="text-blue-800 text-sm font-black uppercase tracking-widest flex items-center mb-3">
                            <i class="fa-solid fa-graduation-cap mr-2 text-lg"></i> Official Explanation / Model
                        </strong>
                        <p class="text-gray-700 leading-relaxed text-lg">${q.explanation}</p>
                    </div>
                </div>
            `;
            
            const container = document.getElementById('question-container');
            if(container) {
                 container.insertAdjacentHTML('beforeend', feedbackHtml);
                 setTimeout(() => {
                    document.getElementById('feedback-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                 }, 50);
            }
        }

        function renderCompleteWords(q) {
            return `
                <div class="prose max-w-none text-xl text-gray-800 leading-loose mt-4 p-8 bg-gray-50 rounded-2xl border border-gray-200 shadow-inner font-serif" id="ctw-container">
                    ${q.content}
                </div>
            `;
        }

        function renderMCQ(q) {
            let html = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-10">`;
            
            html += `
                <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm h-[450px] overflow-y-auto">
                    <h4 class="font-black text-2xl text-gray-900 mb-6 pb-4 border-b border-gray-100">${q.passageTitle}</h4>
                    <p class="text-gray-700 leading-relaxed whitespace-pre-wrap text-lg">${q.passage}</p>
                </div>
            `;
            
            html += `<div class="flex flex-col">
                <div class="bg-blue-50 p-6 rounded-xl mb-6 border border-blue-100 shadow-sm">
                    <h4 class="font-bold text-xl text-blue-900 leading-snug">${q.question}</h4>
                </div>
                <div class="space-y-4" id="mcq-options">
            `;
            
            q.options.forEach((opt, idx) => {
                html += `
                    <label class="flex items-start p-5 border-2 border-gray-200 bg-white rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all group shadow-sm">
                        <input type="radio" name="mcq_answer" value="${idx}" class="mt-1 w-6 h-6 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="ml-4 text-gray-700 group-hover:text-blue-900 font-medium text-lg">${opt}</span>
                    </label>
                `;
            });
            
            html += `</div></div></div>`;
            return html;
        }

        function renderMCQAudio(q) {
            let html = `
                <div class="flex flex-col items-center mb-12 bg-gray-50 p-10 rounded-3xl border border-gray-200 shadow-inner relative overflow-hidden">
                    <div class="absolute top-0 w-full h-1 bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-500"></div>
                    <div class="w-full flex justify-between items-center mb-8">
                        <span class="text-sm font-black text-gray-400 uppercase tracking-widest"><i class="fa-solid fa-volume-high mr-2"></i> Audio Prompt</span>
                    </div>
                    <button id="btn-play-audio" class="w-24 h-24 rounded-full bg-blue-600 text-white shadow-xl hover:bg-blue-700 hover:shadow-2xl transform hover:scale-105 transition-all text-3xl focus:outline-none flex items-center justify-center">
                        <i class="fa-solid fa-play ml-2"></i>
                    </button>
                    <p class="mt-6 text-base text-gray-600 font-bold tracking-wide" id="audio-status">Click to play audio</p>
                    
                    <div id="transcript-fallback" class="hidden mt-8 w-full max-w-3xl bg-white p-6 rounded-xl border border-gray-200 text-base text-gray-700 italic border-l-4 border-l-gray-400 shadow-sm whitespace-pre-wrap">
                        <div class="text-xs font-black text-gray-400 uppercase mb-3 not-italic tracking-widest">Transcript (Simulated)</div>
                        "${q.audioText}"
                    </div>
                </div>
                
                <div class="max-w-3xl mx-auto">
                    <div class="bg-blue-50 p-6 rounded-xl mb-6 border border-blue-100 shadow-sm">
                        <h4 class="font-bold text-xl text-blue-900">${q.question}</h4>
                    </div>
                    <div class="space-y-4" id="mcq-options">
            `;
            
            q.options.forEach((opt, idx) => {
                html += `
                    <label class="flex items-start p-5 border-2 border-gray-200 bg-white rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all group shadow-sm">
                        <input type="radio" name="mcq_answer" value="${idx}" class="mt-1 w-6 h-6 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="ml-4 text-gray-700 group-hover:text-blue-900 font-medium text-lg">${opt}</span>
                    </label>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        function renderBuildSentence(q) {
            let words = [...q.words];
            for (let i = words.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [words[i], words[j]] = [words[j], words[i]];
            }
            sentenceBank = words;
            sentenceConstructed = [];

            return `
                <div class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3"><i class="fa-solid fa-hammer mr-2"></i>Construct Your Response</div>
                <div class="bg-blue-50 p-8 rounded-2xl border-2 border-dashed border-blue-300 mb-10 min-h-[140px] flex flex-wrap items-center gap-3 shadow-inner" id="constructed-area">
                    <span class="text-blue-400 font-medium text-lg italic select-none pointer-events-none" id="construct-placeholder">Click words from the bank below to build the sentence...</span>
                </div>
                
                <div class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3"><i class="fa-solid fa-cubes mr-2"></i>Word Bank</div>
                <div class="p-8 border border-gray-200 rounded-2xl flex flex-wrap justify-center gap-4 bg-gray-50 shadow-sm" id="bank-area">
                    <!-- Words injected here -->
                </div>
            `;
        }

        function renderWriting(q) {
            let placeholder = q.type === 'email' ? 'Compose your email here...' : 'Write your academic discussion response here...';
            return `
                <div class="bg-gray-50 p-8 rounded-2xl border border-gray-200 shadow-inner mb-8 whitespace-pre-wrap text-gray-800 leading-relaxed text-lg font-serif">${q.scenario}</div>
                
                <div class="border-2 border-gray-300 rounded-2xl overflow-hidden focus-within:ring-4 focus-within:ring-blue-100 focus-within:border-blue-500 transition-all shadow-sm">
                    <div class="bg-gray-100 px-6 py-4 border-b border-gray-300 flex justify-between items-center">
                        <span class="text-sm font-black text-gray-600 uppercase tracking-widest"><i class="fa-solid fa-pen-nib mr-2"></i>Response Area</span>
                        <div class="text-sm text-gray-600 font-mono bg-white px-4 py-1.5 rounded-lg border border-gray-200 font-bold shadow-sm">
                            Words: <span id="word-count" class="text-blue-600">0</span>
                        </div>
                    </div>
                    <textarea id="writing-area" class="w-full h-80 p-6 outline-none resize-none bg-white text-gray-800 leading-relaxed text-lg" placeholder="${placeholder}"></textarea>
                </div>
            `;
        }

        function renderSpeaking(q) {
            return `
                <div class="flex flex-col items-center py-20 bg-gray-50 rounded-3xl border border-gray-200 shadow-inner">
                    <div class="mb-12 text-center max-w-2xl px-6">
                        <p class="text-3xl text-gray-900 font-medium leading-relaxed font-serif">"${q.instruction}"</p>
                    </div>
                    
                    <button id="btn-play-prompt" class="px-10 py-5 bg-blue-600 text-white rounded-full font-black shadow-xl hover:bg-blue-700 hover:shadow-2xl transform hover:scale-105 transition-all mb-8 text-xl flex items-center">
                        <i class="fa-solid fa-headphones mr-4 text-2xl"></i> Play Prompt & Begin
                    </button>
                    
                    <div id="transcript-fallback" class="hidden mb-10 w-full max-w-xl bg-white p-6 rounded-xl border border-gray-200 text-center italic text-gray-700 text-lg shadow-sm">
                        "${q.audioText}"
                    </div>
                    
                    <div id="recording-ui" class="hidden flex-col items-center w-full max-w-md">
                        <div class="relative flex items-center justify-center w-32 h-32 mb-8">
                            <div class="absolute inset-0 bg-red-100 rounded-full recording-pulse"></div>
                            <div class="relative z-10 w-24 h-24 rounded-full bg-white border-4 border-red-500 flex items-center justify-center text-red-500 text-4xl shadow-lg">
                                <i class="fa-solid fa-microphone"></i>
                            </div>
                        </div>
                        
                        <p class="font-black text-red-600 text-2xl tracking-widest mb-4 uppercase" id="rec-status">Recording...</p>
                        
                        <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
                            <div class="bg-red-500 h-full rounded-full transition-all duration-100 ease-linear" id="rec-progress" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div id="recording-done" class="hidden flex-col items-center mt-6 p-8 bg-green-50 border border-green-200 rounded-2xl w-full max-w-md shadow-sm">
                        <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-4xl mb-4 shadow-sm">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <span class="text-green-800 font-black text-2xl mb-2">Response Recorded</span>
                        <p class="text-green-600 text-center font-medium">In this simulation, your response is self-assessed via the Check Answer button.</p>
                    </div>
                </div>
            `;
        }

        function postRenderLogic(q) {
            const answerKey = `${currentTest.id}_${currentSectionIndex}_${currentQuestionIndex}`;
            const previousAnswer = userAnswers[answerKey];

            if (q.type === 'complete_words') {
                const inputs = document.querySelectorAll('.ctw-input');
                if (previousAnswer && Array.isArray(previousAnswer)) {
                    inputs.forEach((input, i) => input.value = previousAnswer[i] || '');
                }
                inputs.forEach((input, index) => {
                    input.addEventListener('input', function() {
                        if (this.value.length === this.maxLength) {
                            if (index < inputs.length - 1) inputs[index + 1].focus();
                        }
                    });
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                            inputs[index - 1].focus();
                        }
                    });
                });
            } 
            else if (q.type === 'mcq' || q.type === 'mcq_audio') {
                if (previousAnswer !== undefined) {
                    const radios = document.querySelectorAll('input[name="mcq_answer"]');
                    if(radios[previousAnswer]) radios[previousAnswer].checked = true;
                }
                
                if (q.type === 'mcq_audio') {
                    const btnPlay = document.getElementById('btn-play-audio');
                    const status = document.getElementById('audio-status');
                    btnPlay.onclick = () => {
                        btnPlay.disabled = true;
                        btnPlay.classList.replace('bg-blue-600', 'bg-gray-400');
                        btnPlay.classList.replace('hover:bg-blue-700', 'hover:bg-gray-500');
                        btnPlay.classList.remove('transform', 'hover:scale-105', 'shadow-xl');
                        btnPlay.innerHTML = '<i class="fa-solid fa-volume-high text-white"></i>';
                        status.textContent = "Playing Audio...";
                        
                        speakText(q.audioText, () => {
                            status.textContent = "Audio finished. You may answer.";
                            btnPlay.innerHTML = '<i class="fa-solid fa-check text-white"></i>';
                        });
                        
                        setTimeout(() => document.getElementById('transcript-fallback').classList.remove('hidden'), 1500);
                    };
                }
            }
            else if (q.type === 'build_sentence') {
                if (previousAnswer && previousAnswer.bank && previousAnswer.constructed) {
                    sentenceBank = previousAnswer.bank;
                    sentenceConstructed = previousAnswer.constructed;
                }
                renderSentenceUI();
            }
            else if (q.type === 'email' || q.type === 'essay') {
                const textarea = document.getElementById('writing-area');
                const wc = document.getElementById('word-count');
                if (previousAnswer) {
                    textarea.value = previousAnswer;
                    wc.textContent = previousAnswer.trim().split(/\s+/).filter(w => w.length > 0).length;
                }
                textarea.addEventListener('input', () => {
                    const text = textarea.value.trim();
                    wc.textContent = text === '' ? 0 : text.split(/\s+/).length;
                });
            }
            else if (q.type === 'listen_repeat' || q.type === 'interview') {
                const btnPlay = document.getElementById('btn-play-prompt');
                const recUI = document.getElementById('recording-ui');
                const recDone = document.getElementById('recording-done');
                const recProgress = document.getElementById('rec-progress');
                const recStatus = document.getElementById('rec-status');
                
                if(previousAnswer === "recorded") {
                    btnPlay.classList.add('hidden');
                    recDone.classList.remove('hidden');
                    recDone.classList.add('flex');
                } else {
                    btnPlay.onclick = () => {
                        btnPlay.disabled = true;
                        btnPlay.classList.replace('bg-blue-600', 'bg-gray-500');
                        btnPlay.innerHTML = '<i class="fa-solid fa-volume-high mr-3 animate-pulse"></i> Playing...';
                        
                        speakText(q.audioText, () => {
                            btnPlay.classList.add('hidden');
                            document.getElementById('transcript-fallback').classList.remove('hidden');
                            recUI.classList.remove('hidden');
                            recUI.classList.add('flex');
                            
                            let recTime = q.type === 'listen_repeat' ? 8000 : 45000; 
                            const match = q.instruction.match(/\((\d+)s\)/);
                            if(match) recTime = parseInt(match[1]) * 1000;

                            let elapsed = 0;
                            const updateInterval = 50;
                            
                            const recInterval = setInterval(() => {
                                elapsed += updateInterval;
                                const percent = (elapsed / recTime) * 100;
                                recProgress.style.width = `${percent}%`;
                                
                                const secLeft = Math.ceil((recTime - elapsed)/1000);
                                recStatus.textContent = `REC: ${secLeft}s`;

                                if (elapsed >= recTime) {
                                    clearInterval(recInterval);
                                    recUI.classList.add('hidden');
                                    recUI.classList.remove('flex');
                                    recDone.classList.remove('hidden');
                                    recDone.classList.add('flex');
                                    userAnswers[answerKey] = "recorded";
                                }
                            }, updateInterval);
                        });
                    };
                }
            }
        }

        function renderSentenceUI() {
            const bankArea = document.getElementById('bank-area');
            const consArea = document.getElementById('constructed-area');
            const placeholder = document.getElementById('construct-placeholder');
            
            if(!bankArea || !consArea) return;

            Array.from(bankArea.children).forEach(c => c.remove());
            Array.from(consArea.children).forEach(c => { if(c.id !== 'construct-placeholder') c.remove() });

            if (sentenceConstructed.length > 0 && placeholder) {
                placeholder.classList.add('hidden');
            } else if (placeholder) {
                placeholder.classList.remove('hidden');
            }

            sentenceBank.forEach((word, index) => {
                const el = document.createElement('div');
                el.className = 'word-chip shadow-sm';
                el.textContent = word;
                el.onclick = () => {
                    sentenceConstructed.push(word);
                    sentenceBank.splice(index, 1);
                    renderSentenceUI();
                };
                bankArea.appendChild(el);
            });

            sentenceConstructed.forEach((word, index) => {
                const el = document.createElement('div');
                el.className = 'word-chip selected shadow-md';
                el.innerHTML = `${word} <i class="fa-solid fa-xmark ml-3 text-sm opacity-80"></i>`;
                el.onclick = () => {
                    sentenceBank.push(word);
                    sentenceConstructed.splice(index, 1);
                    renderSentenceUI();
                };
                consArea.appendChild(el);
            });
        }

        function saveCurrentAnswer() {
            if (currentQuestionIndex < 0) return;
            const section = currentTest.sections[currentSectionIndex];
            const q = section.questions[currentQuestionIndex];
            const answerKey = `${currentTest.id}_${currentSectionIndex}_${currentQuestionIndex}`;

            if (q.type === 'complete_words') {
                const inputs = document.querySelectorAll('.ctw-input');
                let ans = [];
                inputs.forEach(i => ans.push(i.value.toLowerCase()));
                userAnswers[answerKey] = ans;
            } 
            else if (q.type === 'mcq' || q.type === 'mcq_audio') {
                const selected = document.querySelector('input[name="mcq_answer"]:checked');
                if (selected) userAnswers[answerKey] = parseInt(selected.value);
            }
            else if (q.type === 'build_sentence') {
                userAnswers[answerKey] = { bank: [...sentenceBank], constructed: [...sentenceConstructed] };
            }
            else if (q.type === 'email' || q.type === 'essay') {
                const textarea = document.getElementById('writing-area');
                if(textarea) userAnswers[answerKey] = textarea.value;
            }
        }

        function moveToNextSection() {
            stopAudio();
            currentSectionIndex++;
            loadSection(currentSectionIndex);
        }

        function finishTest() {
            clearInterval(timerInterval);
            headerStatus.classList.add('hidden');
            testNav.classList.add('hidden');
            
            let html = `
                <div class="max-w-5xl mx-auto mt-6 bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden animate-fade-in-up">
                    <div class="bg-gray-900 p-12 text-white text-center relative overflow-hidden">
                        <div class="absolute inset-0 bg-blue-600 opacity-20" style="background-image: radial-gradient(circle at center, #3b82f6 0%, transparent 70%);"></div>
                        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-green-500 text-white mb-6 text-5xl shadow-xl border-4 border-gray-800 relative z-10">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <h2 class="text-5xl font-black mb-4 relative z-10 tracking-tight">Test Completed</h2>
                        <p class="text-gray-300 text-xl relative z-10 font-medium tracking-wide">Review your answers and the official explanations below.</p>
                    </div>
                    <div class="p-8 md:p-12 space-y-12 bg-gray-50">
            `;

            currentTest.sections.forEach((section, sIdx) => {
                html += `
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <h3 class="text-2xl font-black text-gray-900 mb-6 pb-4 border-b-2 border-gray-100 flex items-center">
                            <span class="bg-blue-600 text-white rounded-lg px-4 py-1.5 text-sm mr-4 uppercase tracking-widest font-bold shadow-sm">Section ${sIdx + 1}</span>
                            ${section.title}
                        </h3>
                        <div class="space-y-8">
                `;

                section.questions.forEach((q, qIdx) => {
                    const ansKey = `${currentTest.id}_${sIdx}_${qIdx}`;
                    const uAns = userAnswers[ansKey];
                    
                    let displayUserAns = "No answer provided";
                    let statusColor = "text-red-600";
                    let statusIcon = "fa-xmark";
                    let badge = `<span class="bg-red-100 text-red-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Incorrect</span>`;

                    if (q.type === 'complete_words') {
                        if (uAns && Array.isArray(uAns)) {
                            let correct = 0;
                            uAns.forEach((l, i) => { if(l === q.answerKeys[i]) correct++; });
                            displayUserAns = uAns.join(' ').toUpperCase();
                            if(correct === q.answerKeys.length) { 
                                statusColor = "text-green-600"; statusIcon = "fa-check"; badge = `<span class="bg-green-100 text-green-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Correct</span>`;
                            } else if(correct > 0) { 
                                statusColor = "text-amber-600"; statusIcon = "fa-triangle-exclamation"; badge = `<span class="bg-amber-100 text-amber-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Partial</span>`;
                                displayUserAns += ` (${correct}/${q.answerKeys.length})`;
                            }
                        }
                    } 
                    else if (q.type === 'mcq' || q.type === 'mcq_audio') {
                        if (uAns !== undefined) {
                            displayUserAns = q.options[uAns];
                            if(uAns === q.correctOption) { 
                                statusColor = "text-green-600"; statusIcon = "fa-check"; badge = `<span class="bg-green-100 text-green-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Correct</span>`;
                            }
                        }
                    }
                    else if (q.type === 'build_sentence') {
                        if (uAns && uAns.constructed) {
                            displayUserAns = uAns.constructed.join(' ');
                            if(uAns.constructed.join(' ') === q.correctOrder.join(' ')) { 
                                statusColor = "text-green-600"; statusIcon = "fa-check"; badge = `<span class="bg-green-100 text-green-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Correct</span>`;
                            }
                        }
                    }
                    else if (q.type === 'email' || q.type === 'essay') {
                        statusColor = "text-blue-600"; statusIcon = "fa-pen-to-square";
                        badge = `<span class="bg-blue-100 text-blue-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Self-Assess</span>`;
                        displayUserAns = uAns ? `<div class="mt-3 p-5 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 whitespace-pre-wrap font-serif text-lg leading-relaxed">${uAns}</div>` : "No essay written.";
                    }
                    else if (q.type === 'listen_repeat' || q.type === 'interview') {
                        statusColor = "text-purple-600"; statusIcon = "fa-microphone";
                        badge = `<span class="bg-purple-100 text-purple-800 text-xs font-black px-3 py-1 rounded uppercase tracking-wider">Self-Assess</span>`;
                        displayUserAns = uAns === "recorded" ? "Audio recorded (Simulated)" : "Not recorded.";
                    }

                    html += `
                        <div class="border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
                            <div class="flex justify-between items-center p-5 bg-gray-50 border-b border-gray-200">
                                <div class="flex items-center gap-4">
                                    <span class="w-8 h-8 rounded-full bg-white text-gray-800 flex items-center justify-center font-black text-sm border border-gray-300 shadow-sm">${qIdx + 1}</span>
                                    <span class="font-bold text-gray-800">${q.taskType}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    ${badge}
                                    <span class="${statusColor} text-xl"><i class="fa-solid ${statusIcon}"></i></span>
                                </div>
                            </div>
                            
                            <div class="p-6">
                                <div class="mb-6">
                                    <div class="text-xs text-gray-400 uppercase font-black tracking-widest mb-2">Your Answer</div>
                                    <div class="text-gray-900 font-semibold text-lg">${displayUserAns}</div>
                                </div>
                                
                                <div class="bg-blue-50 border border-blue-100 p-5 rounded-xl">
                                    <div class="text-xs text-blue-800 uppercase font-black tracking-widest mb-2 flex items-center"><i class="fa-solid fa-book-open-reader mr-2"></i>Official Explanation / Model</div>
                                    <p class="text-gray-700 leading-relaxed text-base">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            });

            html += `
                        <div class="text-center pt-6">
                            <button onclick="initApp()" class="px-12 py-4 bg-gray-900 text-white rounded-full font-black hover:bg-black shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all text-xl flex items-center justify-center mx-auto tracking-wide">
                                <i class="fa-solid fa-house mr-3"></i> Return to Dashboard
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            mainContent.innerHTML = html;
        }

        window.onload = initApp;
    </script>
</body>
</html>
