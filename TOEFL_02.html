<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL iBT 2026 Format Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        
        .ctw-input {
            width: 28px; height: 32px; text-align: center; border: 2px solid #cbd5e1; 
            border-radius: 6px; margin: 0 3px; font-weight: 700; text-transform: lowercase;
            outline: none; background: #f8fafc; transition: all 0.2s; color: #1e293b;
        }
        .ctw-input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); transform: scale(1.05); }
        
        .word-chip {
            display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; margin: 6px; 
            background: #fff; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; color: #475569;
            user-select: none;
        }
        .word-chip:hover { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .word-chip.selected { background: #3b82f6; color: white; border-color: #2563eb; }
        
        .recording-pulse {
            animation: pulse 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .feedback-slide-down {
            animation: slideDown 0.3s ease-out forwards;
            transform-origin: top center;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.9); }
            to { opacity: 1; transform: scaleY(1); }
        }

        .practice-accordion-content {
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            max-height: 0;
            overflow: hidden;
        }
        .practice-accordion-content.open {
            max-height: 1000px;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm border-b border-gray-200 flex justify-between items-center px-6 py-4 flex-shrink-0 z-30 relative">
        <div class="flex items-center gap-4 cursor-pointer group" onclick="initApp()">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-md group-hover:bg-blue-700 transition-colors">
                <i class="fa-solid fa-graduation-cap text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">TOEFL iBT <span class="text-blue-600">2026</span></h1>
                <p class="text-xs font-medium text-gray-500 uppercase tracking-widest">Simulator & Practice</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="renderPrepCourse()" class="px-4 py-2 rounded-lg font-bold text-rose-700 bg-rose-50 border border-rose-200 hover:bg-rose-100 transition-colors flex items-center gap-2">
                <i class="fa-solid fa-stopwatch"></i> 3-Hour Prep Course
            </button>
            <button onclick="renderNotebook()" class="px-4 py-2 rounded-lg font-bold text-teal-700 bg-teal-50 border border-teal-200 hover:bg-teal-100 transition-colors flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> Official Notebook
            </button>
            <button onclick="renderPracticeBankIndex()" class="px-4 py-2 rounded-lg font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 transition-colors flex items-center gap-2">
                <i class="fa-solid fa-layer-group"></i> Practice Bank
            </button>
            <div id="header-status" class="flex items-center gap-4 hidden">
                <div class="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-lg border border-gray-200">
                    <i class="fa-solid fa-layer-group text-gray-500"></i>
                    <span class="text-sm font-bold text-gray-700 uppercase tracking-wider" id="section-title">Reading Section</span>
                </div>
                <div class="flex items-center gap-2 bg-blue-50 px-5 py-2 rounded-lg border border-blue-200 shadow-sm relative overflow-hidden">
                    <div class="absolute inset-0 bg-blue-100 opacity-50 w-0 transition-all duration-1000" id="timer-progress"></div>
                    <i class="fa-regular fa-clock text-blue-600 relative z-10 text-lg"></i>
                    <span id="timer-display" class="font-mono text-xl font-black text-blue-900 relative z-10 tracking-widest">30:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Top Action / Navigation Bar for Mock Tests -->
    <div id="test-nav" class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center flex-shrink-0 hidden shadow-sm z-20 sticky top-0">
        <button id="btn-prev" class="px-5 py-2.5 rounded-lg font-semibold text-gray-600 bg-white border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 transition-all shadow-sm hidden flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Previous
        </button>
        <div class="flex-grow flex justify-center px-4">
             <button id="btn-check" class="px-8 py-2.5 rounded-lg font-bold bg-amber-100 text-amber-800 border-2 border-amber-200 hover:bg-amber-200 hover:border-amber-300 transition-all shadow-sm hidden flex items-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-lightbulb text-amber-600"></i> <span>Check Answer & Explanation</span>
            </button>
        </div>
        <button id="btn-next" class="px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white border-2 border-blue-700 hover:bg-blue-700 transition-all shadow-md flex items-center gap-2 transform active:scale-95">
            <span>Next</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <main id="main-content" class="flex-grow overflow-y-auto p-4 sm:p-8 bg-gray-50 relative scroll-smooth">
        <!-- Content injected here -->
    </main>

    <div id="custom-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-all scale-95 opacity-0" id="modal-panel">
            <div class="w-16 h-16 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-3xl mb-6 mx-auto">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="modal-title" class="text-2xl font-black text-gray-900 mb-3 text-center">Notice</h3>
            <p id="modal-message" class="text-gray-600 mb-8 text-center leading-relaxed text-lg"></p>
            <div class="flex justify-center gap-4">
                <button id="modal-btn-cancel" class="px-6 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors hidden w-1/2">Cancel</button>
                <button id="modal-btn-ok" class="px-6 py-3 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-700 shadow-lg hover:shadow-xl transition-all w-1/2">OK</button>
            </div>
        </div>
    </div>

    <script>
        const baseSections = {
            readingTime: 30 * 60, // 30 mins
            listeningTime: 29 * 60, // 29 mins
            writingTime: 23 * 60, // 23 mins
            speakingTime: 8 * 60 // 8 mins
        };

        const fullyGroundedSourceTest = {
            testId: 1,
            name: "Test 1: Official 2026 Blueprint Test",
            description: "A fully source-grounded test containing all task types and audio transcripts matching the exact 2026 specs.",
            sections: [
                {
                    id: "reading", title: "Reading Section", timeSeconds: baseSections.readingTime,
                    intro: "This section contains Complete the Words, Read in Daily Life, and Read an Academic Passage tasks.",
                    questions: [
                        {
                            type: "complete_words", taskType: "Complete the Words",
                            instruction: "Fill in the deleted second half of every second word after the intact first sentence.",
                            content: `We know from drawings that have been preserved in caves for over 10,000 years that early humans performed dances as a group activity. We mi<input class="ctw-input" data-ans="g" maxlength="1"/>h<input class="ctw-input" data-ans="t" maxlength="1"/> think th<input class="ctw-input" data-ans="a" maxlength="1"/>t prehistoric peo<input class="ctw-input" data-ans="p" maxlength="1"/>l<input class="ctw-input" data-ans="e" maxlength="1"/> concentrated on<input class="ctw-input" data-ans="l" maxlength="1"/>y on ba<input class="ctw-input" data-ans="s" maxlength="1"/>i<input class="ctw-input" data-ans="c" maxlength="1"/> survival. How<input class="ctw-input" data-ans="e" maxlength="1"/>v<input class="ctw-input" data-ans="e" maxlength="1"/>r, it i<input class="ctw-input" data-ans="s" maxlength="1"/> clear fr<input class="ctw-input" data-ans="o" maxlength="1"/>m the rec<input class="ctw-input" data-ans="o" maxlength="1"/>r<input class="ctw-input" data-ans="d" maxlength="1"/> that dan<input class="ctw-input" data-ans="c" maxlength="1"/>i<input class="ctw-input" data-ans="n" maxlength="1"/>g was important to them. They recorded more drawings of dances than any other group activity.`,
                            answerKeys: ['g','t','a','p','e','l','y','s','i','c','e','v','e','r','s','o','m','o','r','d','c','i','n','g'],
                            explanation: "The missing letters complete: might, that, people, only, basic, However, is, from, record, dancing."
                        },
                        {
                            type: "mcq", taskType: "Read in Daily Life",
                            instruction: "Read the campus notice below and answer the multiple-choice question.",
                            passageTitle: "Municipal Charter: Paperless Billing",
                            passage: "Sign up for paperless billing statements today.\n\nSafe, convenient, easy. Enroll in paperless billing to receive monthly savings account statements in an electronic PDF document. Access your Municipal Charter account through the mobile app and select account preferences in the upper right-hand corner to enroll.",
                            question: "What type of business issued the notice?",
                            options: ["An Internet provider", "A computer company", "A paper company", "A bank"],
                            correctOption: 3,
                            explanation: "The text mentions receiving 'monthly savings account statements' and accessing an account. Savings accounts are financial products provided by a bank."
                        },
                        {
                            type: "mcq", taskType: "Read an Academic Passage",
                            instruction: "Read the passage and answer the accompanying question.",
                            passageTitle: "The Mirror Test",
                            passage: "Very young children cannot recognize themselves in a mirror; they usually achieve this milestone around 18 months of age. The ability to recognize oneself in the mirror is considered to be a key component of self-awareness and consciousness for humans. But what about animals?\n\nFor many years, scientists have known that members of the great ape family could recognize themselves in mirrors. They measured this by the “mirror test,” which involved putting a colored mark on an ape’s body, and then showing the ape its reflection in a mirror. If the ape tried to remove the mark on its own body, the scientists knew that the ape was recognizing its reflection.\n\nApes are close relatives of humans, but in recent years, scientists have discovered that other animals also pass the “mirror test”. Elephants and dolphins have shown signs of self-recognition. These, like apes, are highly intelligent animals. But in a more recent experiment, a type of fish called the cleaner fish tried to scrape a mark off its body when it saw itself in the mirror. This suggests that even less intelligent animals may possess more self-awareness than previously suspected.",
                            question: "Why did scientists put colored marks on animals’ bodies?",
                            options: [
                                "It made it possible to track the animals’ movements.",
                                "It helped them determine whether the animals recognized themselves.",
                                "It made it easier to tell the animals apart.",
                                "It showed whether some animals can detect color differences."
                            ],
                            correctOption: 1,
                            explanation: "Paragraph 2 states: 'If the ape tried to remove the mark on its own body, the scientists knew that the ape was recognizing its reflection.' Therefore, the mark helped determine self-recognition."
                        }
                    ]
                },
                {
                    id: "listening", title: "Listening Section", timeSeconds: baseSections.listeningTime,
                    intro: "Audio plays ONCE at natural conversational speed. Questions lock upon submission.",
                    questions: [
                        {
                            type: "mcq_audio", taskType: "Listen and Choose a Response",
                            instruction: "Listen to the brief statement and select the most logical response.",
                            audioText: "Didn’t I just see you in the library an hour ago?",
                            question: "What is the best response to the speaker?",
                            options: [
                                "As a matter of fact, I was returning a book.",
                                "Yes, you can find it in the reference section.",
                                "I don’t think I’ll have enough time to do that.",
                                "Actually, I think I can get there a little earlier."
                            ],
                            correctOption: 0,
                            explanation: "The speaker asks a direct question confirming they saw the person in the library. Option A provides a logical confirmation and explanation for why they were there."
                        },
                        {
                            type: "mcq_audio", taskType: "Listen to a Conversation",
                            instruction: "Listen to a short conversation. Then answer the question.",
                            audioText: "Woman: Need anything from the supermarket? \nMan: Huh? Aren’t we getting ready to go see that play in a few minutes?\nWoman: That’s tomorrow.\nMan: Oh. Wow, I’d forget my head if it wasn’t screwed on . . . Guess I don’t need to change my clothes after all.\nWoman: So, you weren’t planning to prepare dinner?\nMan: No, but I can. What do you want?\nWoman: Just something light and healthy. So, can you go shopping instead?\nMan: Yeah, sure. How about salmon and salad? Want anything else?\nWoman: No, that’s good. Thanks!",
                            question: "What does the woman imply that she was about to do?",
                            options: ["See a play", "Change her clothes", "Go shopping", "Eat dinner"],
                            correctOption: 2,
                            explanation: "The woman starts by asking 'Need anything from the supermarket?' and later asks 'can you go shopping instead?' implying she was originally intending to go shopping herself."
                        },
                        {
                            type: "mcq_audio", taskType: "Listen to an Announcement",
                            instruction: "Listen to a campus announcement. Then answer the question.",
                            audioText: "Good afternoon, everyone. I am excited to inform you that Dr. Cynthia Palmer, a renowned expert in environmental science, will be giving a guest lecture next Monday at 2 P.M. in Waldman Auditorium. Dr. Palmer will discuss the latest advancements in sustainable energy solutions and their impact on global climate change. Due to her popularity and the high interest in her work, I highly recommend arriving early to secure a seat.",
                            question: "What is the announcement about?",
                            options: ["A guest lecture", "A different location for a class", "Requirements for a class", "A new university science course"],
                            correctOption: 0,
                            explanation: "The speaker explicitly states that 'Dr. Cynthia Palmer... will be giving a guest lecture next Monday'."
                        },
                        {
                            type: "mcq_audio", taskType: "Listen to an Academic Talk",
                            instruction: "Listen to part of a lecture. Then answer the question.",
                            audioText: "Did you see that new thriller movie that came out last week? I did and loved it. The action, the plot twists . . . I was totally captivated. Time just flew by. Not a single thought occurred to me that was unrelated to the movie. What I experienced is what psychologists call hard fascination. Hard fascination means intense focus and concentration. Whether it’s TV programs, video games . . . hard fascination is all too easy to come by in this modern world.",
                            question: "What is the main topic of the talk?",
                            options: [
                                "Psychological effects of modern action movies",
                                "The concept and characteristics of 'hard fascination'",
                                "Why video games cause mental fatigue",
                                "Differences between theater and cinema audiences"
                            ],
                            correctOption: 1,
                            explanation: "The speaker uses the movie as an example to introduce the psychological concept of 'hard fascination', which is defined as intense focus and concentration."
                        }
                    ]
                },
                {
                    id: "writing", title: "Writing Section", timeSeconds: baseSections.writingTime,
                    intro: "This section contains three tasks: Build a Sentence, Write an Email, and Write for an Academic Discussion.",
                    questions: [
                        {
                            type: "build_sentence", taskType: "Build a Sentence",
                            instruction: "Reorder the scrambled word blocks to construct a grammatically correct sentence replying to the context: 'What was the highlight of your recent city tour?'",
                            words: ["tour guides", "who", "showed us around", "the old city", "were", "fantastic"],
                            correctOrder: ["tour guides", "who", "showed us around", "the old city", "were", "fantastic"],
                            explanation: "The correct syntax creates a relative clause modifying the subject: 'The tour guides who showed us around the old city were fantastic.'"
                        },
                        {
                            type: "email", taskType: "Write an Email",
                            instruction: "Read the scenario and write an appropriate email (Aim for 100-130 words).",
                            scenario: "A new poetry magazine has asked its readers for submissions, and you decided to submit two of your poems. However, you had a problem using the online submission form, and you are not certain that your submissions were received.\n\nTask: Write an email to the editor of the magazine. In your email:\n- Tell the editor what you like about the new magazine.\n- Describe the problem you experienced.\n- Ask about the status of your submissions.",
                            explanation: "Band 6.0 Model: Hi Editor, I hope you are well! I wanted to say that I really love the new Sunshine Poetry Magazine. It's refreshing to see such a diverse range of voices... I had some trouble with the online submission form... Could you please confirm if you received my submissions?"
                        },
                        {
                            type: "essay", taskType: "Write for an Academic Discussion",
                            instruction: "Read the discussion and write a response stating and supporting your opinion (Aim for 100-150 words).",
                            scenario: "Professor Achebe: Welcome to this week's online discussion forum. Today, we are considering a policy shift currently debated by many university administrators: Should higher education institutions replace traditional, high-stakes final examinations with project-based, continuous assessments? Proponents argue that project work fosters real-world collaboration and practical problem-solving skills, whereas traditionalists contend that comprehensive exams are necessary to ensure individual accountability and deep knowledge retention. What is your position on this issue?",
                            explanation: "Band 6.0 Model: While both sides offer compelling arguments, I firmly believe universities should adopt a hybrid model that prioritizes project-based evaluation while maintaining individual defense mechanisms. Continuous projects mirror professional environments..."
                        }
                    ]
                },
                {
                    id: "speaking", title: "Speaking Section", timeSeconds: baseSections.speakingTime,
                    intro: "ZERO preparation time; interface recording begins immediately after audio ends.",
                    questions: [
                        {
                            type: "listen_repeat", taskType: "Listen and Repeat",
                            instruction: "Repeat the sentence verbatim immediately after hearing it. (Response window: 8s)",
                            audioText: "Bears, wolves, and large cats are to the right.",
                            explanation: "This task tests phonological fluency, pronunciation, and working memory. The rubric focuses on intelligibility, stress, and rhythm matching the original speaker."
                        },
                        {
                            type: "interview", taskType: "Take an Interview",
                            instruction: "Answer the interviewer's question spontaneously. (Response window: 45s)",
                            audioText: "Thank you for speaking with me today. Now, I’d like you to think back to the last time you visited a city in your country—a city that you didn’t live in. Why did you travel to that city? What did you like about that city?",
                            explanation: "Band 6.0 Model: The last city I visited was Chicago, which I traveled to last summer for a university research conference. What I enjoyed most was its vibrant public architecture and lakefront cultural parks..."
                        }
                    ]
                }
            ]
        };

        const testDatabase = [fullyGroundedSourceTest];

        // Clone to make 6 tests in total, slightly varying the titles so they look distinct in the dashboard
        const testThemes = [
            "Test 2: Campus Life & Academics", 
            "Test 3: Science & Nature Focus", 
            "Test 4: Arts & Humanities", 
            "Test 5: Global Issues & Economics", 
            "Test 6: Technology & Society"
        ];

        testThemes.forEach((themeName, idx) => {
            let newTest = JSON.parse(JSON.stringify(fullyGroundedSourceTest));
            newTest.testId = idx + 2;
            newTest.name = themeName;
            newTest.description = "A simulated adaptive test containing 4 sections and all 12 updated task types.";
            testDatabase.push(newTest);
        });

        const practiceBank = {
            listening: [
                {
                    id: "L1", title: "Office Hour Conversation",
                    transcript: `<strong>Professor Diaz:</strong> Thanks for stopping by, Kevin. You wanted to talk about the midterm?<br><br>
                    <strong>Kevin:</strong> Yeah, I got the paper back, and I'm a little confused about the grade on the essay part. I thought my argument was solid, but I lost a lot of points on organization.<br><br>
                    <strong>Professor Diaz:</strong> Let me pull it up. Okay — here's the thing. Your thesis was clear, and your evidence was good. The problem is the body paragraphs jumped between points without transitions. A reader can't follow why paragraph three follows paragraph two.<br><br>
                    <strong>Kevin:</strong> Oh, I see. I wrote it the night before, so I just listed examples as they came to me.<br><br>
                    <strong>Professor Diaz:</strong> That's the trap. The ideas were fine; the glue was missing. Two fixes: one, add a sentence at the start of each body paragraph that states its claim; two, use a bridge sentence at the end that links to the next point. Do that and the same content reads as organized.<br><br>
                    <strong>Kevin:</strong> That makes sense. Is there any way to recover some of the points, or is it locked in?<br><br>
                    <strong>Professor Diaz:</strong> The grade itself is final, but — here's an option — if you revise this essay using those two fixes and bring it to me by next Friday, I'll add a small bonus to your participation score. Not the essay grade, but it rewards the improvement.<br><br>
                    <strong>Kevin:</strong> That's fair. I'll do it. Thanks, Professor Diaz.`,
                    questions: [
                        {
                            q: "Q1: Why did Kevin visit the professor?",
                            options: ["A. To argue that his grade was unfair", "B. To ask about points lost on essay organization", "C. To request an extension on the final paper", "D. To discuss his thesis topic"],
                            ans: "B", exp: "Kevin states he is confused about points lost specifically on the organization of his essay. He is not arguing that it is unfair, simply asking for clarification."
                        },
                        {
                            q: "Q2: According to the professor, what was actually wrong with the essay?",
                            options: ["A. The evidence was weak", "B. The thesis was unclear", "C. Paragraphs lacked transitions and claims", "D. It was submitted late"],
                            ans: "C", exp: "The professor explicitly notes that the thesis and evidence were good, but the paragraphs 'jumped between points without transitions'."
                        },
                        {
                            q: "Q3: What advice does the professor give for fixing organization?",
                            options: ["A. Rewrite the whole essay with new evidence", "B. Add a claim sentence and a bridge sentence per paragraph", "C. Submit the essay again as is for regrading", "D. Remove the third paragraph entirely"],
                            ans: "B", exp: "The professor gives 'two fixes': adding a claim sentence at the start of each paragraph and a bridge sentence at the end."
                        },
                        {
                            q: "Q4: What can be inferred about the essay grade itself?",
                            options: ["A. The professor will raise it after revision", "B. It is final, but a bonus is offered for revising", "C. Kevin can retake the midterm to replace it", "D. The participation score will be lowered"],
                            ans: "B", exp: "The professor clearly states 'The grade itself is final', but offers a participation bonus if Kevin revises his work."
                        }
                    ]
                },
                {
                    id: "L2", title: "Biology Lecture (Termites)",
                    transcript: `<strong>Professor:</strong> Okay, let's talk about an animal that engineers have been quietly copying for decades — the termite. Now, when you hear "termite," you probably think of pests eating houses. But here's the puzzle that fascinated architects: a termite mound in Africa can stay within a few degrees of a comfortable temperature all day, even when it's blazing hot outside, and the termites do it without any power source.<br><br>
                    So how? The mound isn't solid. It's basically a network of chimneys and tunnels. Hot air rises through the central chimney and pulls cooler air in from openings near the base. The shape of the tunnels controls the flow, like a lung breathing. Air goes in, gets cleaned of moisture, and circulates. No fan, no fuel — just geometry.<br><br>
                    Now, why should we care? Because humans build skyscrapers that pump enormous energy into heating and cooling. In the 1990s, architects in Zimbabwe designed an office building inspired by this. They used a similar stack-ventilation system instead of full air conditioning for most of the year. The result: the building used about ninety percent less energy for cooling than a normal one its size.<br><br>
                    But — and this is the honest part — copying biology is harder than it looks. That building worked because of Zimbabwe's dry climate. Try the same trick in a humid city and the "lung" just moves muggy air around. So the lesson isn't "copy the termite exactly." It's "steal the principle — use shape to move air — then adapt it to your place." Nature gives the blueprint; we still have to do the engineering.`,
                    questions: [
                        {
                            q: "Q1: What is the main topic of the lecture?",
                            options: ["A. How termites destroy wooden houses", "B. How termite mounds inspire low-energy building design", "C. Why African climates are good for skyscrapers", "D. How to build a chimney without fuel"],
                            ans: "B", exp: "The overarching theme of the lecture is how the natural geometry of termite mounds has inspired architects to design low-energy buildings."
                        },
                        {
                            q: "Q2: According to the professor, how does a termite mound stay cool?",
                            options: ["A. Termites fan air with their wings", "B. A network of chimneys and tunnels moves air by geometry", "C. The mound is made of reflective white clay", "D. Cool groundwater is pumped through it"],
                            ans: "B", exp: "The professor explains that the mound relies on a network of chimneys and tunnels that control airflow using 'just geometry'."

                    passage: `For most of the twentieth century, city planners treated trees as decoration — a pleasant bonus to be added once the roads, pipes, and buildings were done. That view has shifted decisively. Today, urban forests are studied as infrastructure, as essential to a city's functioning as its sewer system. The change came from a pile of research showing that trees do quiet, measurable work that cash and concrete cannot easily replace.<br><br>

                    id: "R2", title: "The Dance Language of Honeybees",
                    passage: `In 1944, the biologist Karl von Frisch made a discovery that still surprises people: honeybees talk to one another. They do not use sounds for this, but a dance. When a forager bee finds a good patch of flowers, she returns to the hive and performs a figure-eight waggle on the vertical comb, and the details of that dance tell the waiting bees exactly where to fly.<br><br>
                    The angle of the dance matters first. The bee aligns the straight part of her waggle run relative to gravity to point in the direction of the food — but relative to the sun, not to the hive. So if the run points straight up, the flowers lie in the direction of the sun; if it tilts thirty degrees to the left, the foraging bees know to fly thirty degrees left of the sun. The bees, it seems, carry a live map of the sky.<br><br>

                                <h3 class="text-xl font-bold text-blue-900 mt-8 mb-4 border-t pt-6">Part 1B: Vocabulary in Context Diagnostic Exam (20 Minutes)</h3>
                                <p class="text-gray-700 mb-4 text-sm"><strong>Instructions:</strong> Answer each of the following 10 questions within 30 seconds without a dictionary. Aim for 9+ out of 10 to track at a 5.0+ score level.</p>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>1. (Contextual Shift Trap):</strong> "As a result, modern farms are able to <u>yield</u> larger quantities of food from the same amount of land than ever before."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) surrender (B) produce (C) slow down (D) abandon<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: B (produce)</span> - In agriculture, farms yield (produce) food.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>2. (Contrast Connector Clue):</strong> "Coastlines are often thought of as <u>fixed</u> boundaries between land and sea, but in reality they are constantly changing."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) damaged (B) natural (C) visible (D) unchanging<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: D (unchanging)</span> - "but in reality" contrasts with "constantly changing".
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>3. (Cognitive Multi-Use Verb Trap):</strong> "She reduces the amount of information students must <u>process</u> all at once."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) organize (B) procedure (C) understand (D) schedule<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: C (understand)</span> - For cognitive information handling, "process" means understand.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>4. (Scope / Managerial Trap):</strong> "Over time, this shift had significant intellectual and <u>administrative</u> consequences: scholars were able to reproduce texts more efficiently and officials could maintain more detailed records."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) governmental (B) official (C) organized (D) managerial<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: D (managerial)</span> - Encompasses organizational records and information management.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>5. (Best Contextual Fit vs. Synonym):</strong> "These roads were not simple dirt paths, but carefully engineered structures designed for <u>durability</u>."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) resistance (B) dependability (C) strength (D) quality<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: C (strength)</span> - Engineered roads built to endure heavy loads require strength.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>6. (Elimination of Simple Literal Meaning):</strong> "Certain markings appear in context that do not clearly relate to storage or trade, raising the possibility that they <u>carried</u> social significance."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) transported (B) conveyed (C) contained (D) required<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: B (conveyed)</span> - Social significance is conveyed (communicated), not physically transported.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>7. (Function Modifiers):</strong> "The instructor used words like but, and, or or to establish logical connections or <u>contrasting</u> details."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) supporting (B) opposing (C) repeating (D) clarifying<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: B (opposing)</span> - Contrast signals opposition.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>8. (Nuance Recognition):</strong> "The consequences of the printing shift allowed scholars to reproduce texts more <u>efficiently</u>."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) productively (B) slowly (C) legally (D) manually<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: A (productively)</span> - Efficient reproduction achieves high output with minimal effort.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>9. (Structural Quality):</strong> "If a structure can <u>endure</u> heavy traffic and long years of exposure, it demonstrates lasting value."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) withstand (B) refuse (C) construct (D) yield<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: A (withstand)</span> - Enduring stress means withstanding forces.
                                    </div>
                                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm">
                                        <strong>10. (Text Inconsistency):</strong> "Measurements must be repeated whenever experimental observations appear <u>inconsistent</u>."<br>
                                        <span class="italic text-gray-500">Closest in meaning to:</span> (A) stable (B) contradictory (C) identical (D) frequent<br>
                                        <span class="text-green-700 font-bold mt-2 inline-block">Key: B (contradictory)</span> - Inconsistent results conflict with expected patterns.
                                    </div>

                                <h3 class="text-xl font-bold text-teal-900 mt-6 mb-4">Part 2A: "Build a Sentence" Speed Drills (20 Minutes)</h3>
                                <p class="text-gray-700 text-sm mb-4"><strong>Rules & Grading:</strong> ETS scores this task with binary grading (1 or 0); there is no partial credit. Any misplaced punctuation or leftover distractor word yields zero points. Answer 20 scrambled questions at 30 seconds each.</p>
                                
                                <div class="bg-teal-50 p-4 rounded-lg border border-teal-200 mb-6 text-sm">
                                    <strong class="text-teal-900">Core Strategies:</strong>
                                    <ol class="list-decimal pl-5 text-teal-800 mt-2 space-y-1">
                                        <li>Find Subject and Verb First (SVO Anchor).</li>
                                        <li>Check for Question Format Inversion (look for do, does, did, Wh- words, modals, or be verbs).</li>
                                        <li>Group Collocations & Word Pairs (e.g., she asked me, outdoor event, my friends).</li>
                                        <li>Beware of Distractor Words added to the scrambled word pool.</li>
                                    </ol>
                                </div>

                                <div class="h-80 overflow-y-auto pr-4 space-y-3 mb-8">
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">1. Stimulus: "Did you see what happened?"</strong> Fragments: [saw / I / it / see]<br><span class="text-teal-700 font-bold block mt-1">Answer: I saw it. (Distractor: see)</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">2. Stimulus: "What do you think of that website?"</strong> Fragments: [trust / not / I / do / it]<br><span class="text-teal-700 font-bold block mt-1">Answer: I do not trust it.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">3. Stimulus: "Where should we look for the document?"</strong> Fragments: [to / need / you / find / it]<br><span class="text-teal-700 font-bold block mt-1">Answer: You need to find it.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">4. Stimulus: "What did she ask about the compass?"</strong> Fragments: [where / she / learned / me / one / asked / to / use / I]<br><span class="text-teal-700 font-bold block mt-1">Answer: She asked me where I learned to use one.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">5. Stimulus: "What is the backup plan for bad weather?"</strong> Fragments: [outdoor / to / if / move / the / rains / auditorium / we'll / event / the / it]<br><span class="text-teal-700 font-bold block mt-1">Answer: We'll move the outdoor event to the auditorium if it rains.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">6. Stimulus: "Who organized the study group?"</strong> Fragments: [friends / attending / my / asked / about / me / meet]<br><span class="text-teal-700 font-bold block mt-1">Answer: My friends asked me about attending. (Distractor: meet)</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">7. Stimulus: "The employer made me an offer."</strong> Fragments: [did / they / what / tell / told / benefits / you / the / include]<br><span class="text-teal-700 font-bold block mt-1">Answer: Did they tell you what the benefits include? (Distractor: told)</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">8. Stimulus: "What will happen if you miss the first class next week?"</strong> Fragments: [mark / will / absent / professor / if / advance / the / email / in / you / don't / her / you]<br><span class="text-teal-700 font-bold block mt-1">Answer: The professor will mark you absent if you don't email her in advance.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">9. Stimulus: "Why is the road closed today?"</strong> Fragments: [due / delayed / passengers / are / maintenance / to / work]<br><span class="text-teal-700 font-bold block mt-1">Answer: Passengers are delayed due to maintenance work.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">10. Stimulus: "Can I check out these books today?"</strong> Fragments: [library / closes / the / noon / strictly / at]<br><span class="text-teal-700 font-bold block mt-1">Answer: The library closes strictly at noon.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">11. Stimulus: "What did the technician say about the laptop?"</strong> Fragments: [repairs / warranty / the / covers / most / covering]<br><span class="text-teal-700 font-bold block mt-1">Answer: The warranty covers most repairs. (Distractor: covering)</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">12. Stimulus: "Are there any seats left for the lecture?"</strong> Fragments: [is / workshop / seating / limited / the / afternoon / for]<br><span class="text-teal-700 font-bold block mt-1">Answer: Seating is limited for the afternoon workshop.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">13. Stimulus: "When will the breakout discussions begin?"</strong> Fragments: [keynote / will / breakout / the / sessions / start / address / after]<br><span class="text-teal-700 font-bold block mt-1">Answer: Breakout sessions will start after the keynote address.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">14. Stimulus: "Can we request our academic transcripts after finishing school?"</strong> Fragments: [online / transcripts / can / graduation / requested / be / after]<br><span class="text-teal-700 font-bold block mt-1">Answer: Transcripts can be requested online after graduation.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">15. Stimulus: "Where can I get directions on campus?"</strong> Fragments: [information / can / any / the / desk / direct / to / office / you]<br><span class="text-teal-700 font-bold block mt-1">Answer: The information desk can direct you to any office.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">16. Stimulus: "What happens if a student returns a book late?"</strong> Fragments: [returned / a / date / books / the / due / after / fee / incur / may]<br><span class="text-teal-700 font-bold block mt-1">Answer: Books returned after the due date may incur a fee.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">17. Stimulus: "What should you do if your lab results look unusual?"</strong> Fragments: [results / should / inconsistent / be / measurements / repeated / appear / if]<br><span class="text-teal-700 font-bold block mt-1">Answer: Measurements should be repeated if results appear inconsistent.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">18. Stimulus: "Why are fitness programs so popular on campus?"</strong> Fragments: [regular / classes / encourage / group / motivation / fitness / and / participation]<br><span class="text-teal-700 font-bold block mt-1">Answer: Group fitness classes encourage motivation and regular participation.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">19. Stimulus: "How do social changes typically happen?"</strong> Fragments: [gradually / changes / occur / political / happen / even / reforms / quickly / when / social]<br><span class="text-teal-700 font-bold block mt-1">Answer: Social changes occur gradually even when political reforms happen quickly.</span></div>
                                    <div class="p-3 bg-gray-50 border border-gray-200 rounded text-sm"><strong class="block text-gray-800">20. Stimulus: "Where are the discounted notebooks located?"</strong> Fragments: [supplies / register / near / are / the / discounted / displayed]<br><span class="text-teal-700 font-bold block mt-1">Answer: Discounted supplies are displayed near the register.</span></div>

                                <h3 class="text-xl font-bold text-teal-900 mb-4 border-t pt-6">Part 2B: Timed Academic Discussion Essay Simulations (40 Minutes)</h3>
                                <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-6">
                                    <h4 class="font-bold text-gray-800 mb-2">Essay Task 1 (10-Minute Timed Session)</h4>
                                    <p class="text-sm text-gray-600 mb-4 italic"><strong>Prompt:</strong> "Today we are discussing the integration of new technologies into commerce. Do you believe that the integration of artificial intelligence and advanced technology will significantly enhance the online shopping experience, or are privacy concerns and limited accessibility more critical barriers? State your position and contribute to the discussion."</p>
                                    
                                    <h5 class="font-bold text-gray-800 text-sm mb-2 mt-4">Student Benchmark Rubric for Self-Evaluation:</h5>
                                    <ul class="space-y-2 text-sm text-gray-700">
                                        <li><strong class="text-red-600">3.0 Check (Failing):</strong> Misspelled prompt words (artificial intelligence, efficiency)? Over 5 spelling mistakes? Just copied students' opinions without own examples?</li>
                                        <li><strong class="text-amber-600">4.0 Check (Average):</strong> Used standard template but included avoidable typos, misplaced commas, or drifted off-topic? Conclusion an exact repetition?</li>
                                        <li><strong class="text-green-600">6.0 Check (Perfect):</strong> 120+ words with a clear stance, concrete personal examples, strict relevance, varied grammar, zero typos?</li>
                                    </ul>
                                </div>

                                <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-6">
                                    <h4 class="font-bold text-gray-800 mb-2">Line-by-Line Revision Workshop</h4>
                                    <p class="text-sm text-gray-700 mb-2"><strong>Unedited 4.0 Draft:</strong> "While I understand Ben's concern about privacy concerns and the impact of the limited access to this technology, I think technology is good. Additionally new technology can provide new techniques to increase the population income reducing the gap between different economic groups."</p>
                                    <div class="mt-4 p-4 bg-white border border-gray-200 rounded-lg">
                                        <strong class="text-teal-800 block mb-2 text-sm">Instructor Revision Goals (to hit 6.0):</strong>
                                        <ol class="list-decimal pl-5 text-sm text-gray-700 space-y-1">
                                            <li>Condense repetitive phrasing ("privacy concerns and access issues").</li>
                                            <li>Eliminate the off-topic drift regarding population income.</li>
                                            <li>Replace with a concrete, shopping-related example (e.g., personalized shoe sizing).</li>
                                        </ol>
                                        <p class="mt-3 text-sm text-green-700 font-medium italic border-l-4 border-green-500 pl-3">"While I understand Ben's concern about privacy and access issues, I find Alice's argument more convincing because AI tools like personalized shoe-sizing drastically reduce return rates and enhance convenience."</p>

                                <h3 class="text-xl font-bold text-purple-900 mt-6 mb-4">Part 3A: "Listen & Repeat" Progressive Training (30 Minutes)</h3>
                                <p class="text-gray-700 text-sm mb-4"><strong>Grading dimensions in priority order:</strong> 1. Repeat Accuracy (most important), 2. Intelligibility / Pronunciation, 3. Fluency (least important—do not worry about imitating the recording's voice music).</p>
