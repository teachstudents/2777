<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2 KEY (KET) Reading Practice - Enhanced Edition</title>
    <style>
        :root {
            --correct-bg: linear-gradient(145deg, #e8f5e8, #c8e6c9);
            --correct-border: #4CAF50;
            --incorrect-bg: linear-gradient(145deg, #ffebee, #ffcdd2);
            --incorrect-border: #f44336;
            --primary: #4ECDC4;
            --primary-dark: #44A08D;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #333;
            font-size: 18px; /* Increased base font size */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 15px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* Start Screen */
        .start-screen {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-top: 5vh;
        }

        .start-screen h1 { font-size: 2.5em; margin-bottom: 20px; color: #44A08D; }
        .start-screen p { font-size: 1.3em; margin-bottom: 20px; }
        
        .input-group {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        input, select {
            padding: 15px 25px;
            font-size: 1.3em;
            border: 3px solid var(--primary);
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.4em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Game Header & Timer */
        .game-header {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3em;
            font-weight: bold;
        }

        .timer-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .timer-bar-container {
            flex-grow: 1;
            height: 25px;
            background: #eee;
            border-radius: 12.5px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 1s linear, background-color 0.3s;
        }
        
        .timer-bar-fill.warning { background: linear-gradient(90deg, #FFC107, #FF9800); }
        .timer-bar-fill.danger { background: linear-gradient(90deg, #F44336, #E91E63); }

        .timer-text { font-size: 1.2em; font-weight: bold; width: 60px; text-align: right; }
        
        .pause-btn {
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .pause-btn:hover { background: #e0e0e0; }

        /* Question Area */
        .question-card {
            background: rgba(255,255,255,0.98);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: stretch;
        }

        @media (max-width: 768px) {
            .question-card {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .context-area {
            background: #f8f9fa;
            border-left: 6px solid var(--primary);
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3em;
            line-height: 1.5;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .stimulus-sign {
            display: inline-block;
            border: 4px solid #333;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 1.2em;
            border-radius: 10px;
            background: #fff;
            margin: 5px 0;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: left;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 12px 20px;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover:not(.disabled) { border-color: var(--primary); background: #f0fbf9; transform: translateX(5px); }
        .option.disabled { cursor: default; }
        
        .option.correct { background: var(--correct-bg); border-color: var(--correct-border); }
        .option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); }

        .option-letter {
            background: var(--bg-gradient);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 1.2em;
        }

        /* Feedback Area */
        .feedback-box {
            margin-top: 15px;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.15em;
            display: none;
            animation: fadeIn 0.5s;
        }
        
        .feedback-box.show { display: block; }
        .feedback-box.success { background: #e8f5e9; border: 2px solid #4CAF50; color: #1e4620; }
        .feedback-box.error { background: #ffebee; border: 2px solid #f44336; color: #b71c1c; }
        .feedback-box.timeout { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }

        .feedback-title { font-weight: bold; font-size: 1.2em; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        .next-controls {
            margin-top: 20px;
            text-align: right;
        }

        /* Results Screen */
        .results-screen {
            background: white;
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-top: 5vh;
        }
        .results-screen h1 { font-size: 3em; margin-bottom: 20px; color: var(--primary-dark); }
        .final-score { font-size: 4em; font-weight: bold; color: #FF6B6B; margin: 20px 0; }

        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Utility to play audio on click */
        .speakable { cursor: pointer; position: relative; }
        .speakable:hover::after {
            content: "🔊 Read Aloud";
            position: absolute;
            bottom: 100%; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 5px 10px;
            border-radius: 5px; font-size: 12px; white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- START SCREEN -->
        <div id="startScreen" class="start-screen">
            <div class="input-group">
                <input type="text" id="studentName" placeholder="Enter your name 👤" autocomplete="off">
                <select id="roundsSelect">
                    <option value="1">1 Round (10 Questions) 🌟</option>
                    <option value="2">2 Rounds (20 Questions) 🚀</option>
                    <option value="3">3 Rounds (30 Questions) 🏆</option>
                    <option value="4">4 Rounds (40 Questions) 🔥</option>
                    <option value="5" selected>5 Rounds (50 Questions) 👑</option>
                </select>
            </div>
            
            <button class="btn" onclick="startGame()">Start Practice 🏁</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" class="hidden">
            
            <div class="game-header">
                <div class="stats-row">
                    <span id="playerDisplay">👤 Name</span>
                    <span id="roundDisplay">Round 1/3 🎯</span>
                    <span id="scoreDisplay">Score: 0 ⭐</span>
                </div>
                
                <div class="timer-row">
                    <button id="pauseBtn" class="pause-btn" onclick="togglePause()" title="Pause/Resume">⏸️</button>
                    <div class="timer-bar-container">
                        <div id="timerFill" class="timer-bar-fill"></div>
                    </div>
                    <div id="timerText" class="timer-text">60s</div>
                </div>
            </div>

            <div class="question-card">
                <div class="left-column" style="display: flex; flex-direction: column; justify-content: center;">
                    <div id="contextArea" class="context-area speakable" onclick="speakCurrentContext()">
                        <!-- Sign, Text, or Passage goes here -->
                    </div>
                </div>
                
                <div class="right-column" style="display: flex; flex-direction: column; justify-content: center;">
                    <div id="questionText" class="question-text speakable" onclick="speakCurrentQuestion()">
                        <!-- Question goes here -->
                    </div>

                    <div id="optionsContainer" class="options-grid">
                        <!-- Options injected via JS -->
                    </div>

                    <div id="feedbackBox" class="feedback-box">
                        <div id="feedbackTitle" class="feedback-title"></div>
                        <div id="feedbackText"></div>
                        <div class="next-controls">
                            <button id="nextBtn" class="btn" onclick="nextQuestion()" style="padding: 10px 20px; font-size: 1.1em;">Next Question ➡️</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- RESULTS SCREEN -->
        <div id="resultsScreen" class="results-screen hidden">
            <h1>🎉 Practice Complete! 🎉</h1>
            <p id="resultsMessage" style="font-size: 1.5em;"></p>
            <div id="finalScore" class="final-score">0 / 0</div>
            
            <div style="display: flex; gap: 20px; justify-content: center; margin-top: 30px;">
                <button class="btn" style="background: #FF6B6B;" onclick="location.reload()">🔄 Play Again</button>
                <button class="btn" onclick="printCertificate()">📜 Print Certificate</button>
            </div>
        </div>

    </div>

// ==========================================
// 2. STATE VARIABLES
// ==========================================
let activeQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let playerName = "";
let selectedRounds = 3;

// Timer State
let timeLeft = 60;
let timerInterval = null;
let isPaused = false;
let questionAnswered = false;

// TTS State
let emmaVoice = null;
let voicesLoaded = false;

// ==========================================
// 3. INITIALIZATION & TTS SETUP
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    initTTS();
});

function initTTS() {
    if ('speechSynthesis' in window) {
        const loadVoices = () => {
            const voices = speechSynthesis.getVoices();
            if (voices.length > 0) {
                voicesLoaded = true;
                // STRCIT REQUIREMENT: "Emma Microsoft multilingual online English"
                // Try to find the exact match first, then fallbacks
                emmaVoice = voices.find(v => 
                    v.name.includes("Emma") && v.name.includes("Multilingual")
                );
                // Fallback to any Emma or British English Female
                if (!emmaVoice) emmaVoice = voices.find(v => v.name.includes("Emma"));
                if (!emmaVoice) emmaVoice = voices.find(v => v.lang === 'en-GB' && v.name.includes("Female"));
                if (!emmaVoice) emmaVoice = voices.find(v => v.lang.startsWith('en')); // Last resort
            }
        };
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
    }
}

function speakText(text) {
    if (!voicesLoaded || !text) return;
    speechSynthesis.cancel(); // Stop current speech
    
    // Clean text (remove emojis and HTML for TTS)
    const cleanText = text.replace(/<[^>]*>?/gm, '') // Remove HTML tags
                          .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, ''); // Remove Emojis

    const utterance = new SpeechSynthesisUtterance(cleanText);
    if (emmaVoice) {
        utterance.voice = emmaVoice;
    }
    utterance.rate = 0.9; // Slightly slower for language learners
    speechSynthesis.speak(utterance);
}

function speakCurrentContext() {
    const q = activeQuestions[currentQuestionIndex];
    speakText(q.context);
}

function speakCurrentQuestion() {
    const q = activeQuestions[currentQuestionIndex];
    speakText(q.question);
}

// ==========================================
// 4. GAME FLOW
// ==========================================
function startGame() {
    const nameInput = document.getElementById('studentName').value.trim();
    if (!nameInput) {
        alert("Please enter your name!");
        return;
    }
    playerName = nameInput;
    selectedRounds = parseInt(document.getElementById('roundsSelect').value);
    
    // Slice questions based on rounds (10 per round)
    const totalQuestions = selectedRounds * 10;
    activeQuestions = ALL_QUESTIONS.slice(0, totalQuestions);
    
    // Reset state
    currentQuestionIndex = 0;
    score = 0;
    
    // UI Update
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('playerDisplay').innerHTML = `👤 ${playerName}`;
    
    loadQuestion();
}

function loadQuestion() {
    if (currentQuestionIndex >= activeQuestions.length) {
        endGame();
        return;
    }

    const q = activeQuestions[currentQuestionIndex];
    questionAnswered = false;
    
    // Update Header Stats
    document.getElementById('roundDisplay').innerHTML = `Round ${q.round} - Q${(currentQuestionIndex % 10) + 1}/10 🎯`;
    document.getElementById('scoreDisplay').innerHTML = `Score: ${score} ⭐`;
    
    // Reset Feedback
    const fb = document.getElementById('feedbackBox');
    fb.classList.remove('show', 'success', 'error', 'timeout');
    
    // Inject Content
    document.getElementById('contextArea').innerHTML = q.context;
    document.getElementById('questionText').innerHTML = q.question;
    
    const optionsHtml = q.options.map((opt, i) => `
        <div class="option" id="opt_${i}" onclick="selectAnswer(${i})">
            <div class="option-letter">${String.fromCharCode(65 + i)}</div>
            <div class="option-text">${opt}</div>
        </div>
    `).join('');
    
    document.getElementById('optionsContainer').innerHTML = optionsHtml;

    // Start Timer
    resetTimer();
    
    // Auto-read question (optional, disabled for now so user chooses to click)
    // speakCurrentQuestion(); 
}

// ==========================================
// 5. TIMER LOGIC
// ==========================================
function resetTimer() {
    clearInterval(timerInterval);
    timeLeft = 60;
    isPaused = false;
    document.getElementById('pauseBtn').innerHTML = "⏸️";
    updateTimerUI();
    timerInterval = setInterval(tickTimer, 1000);
}

function tickTimer() {
    if (isPaused || questionAnswered) return;
    
    timeLeft--;
    updateTimerUI();
    
    if (timeLeft <= 0) {
        handleTimeout();
    }
}

function updateTimerUI() {
    const fill = document.getElementById('timerFill');
    const text = document.getElementById('timerText');
    
    const percentage = (timeLeft / 60) * 100;
    fill.style.width = `${percentage}%`;
    text.innerText = `${timeLeft}s`;
    
    fill.className = 'timer-bar-fill';
    if (timeLeft <= 15) fill.classList.add('danger');
    else if (timeLeft <= 30) fill.classList.add('warning');
}

function togglePause() {
    if (questionAnswered) return;
    isPaused = !isPaused;
    document.getElementById('pauseBtn').innerHTML = isPaused ? "▶️" : "⏸️";
}

function handleTimeout() {
    clearInterval(timerInterval);
    questionAnswered = true;
    
    const q = activeQuestions[currentQuestionIndex];
    lockOptions();
    
    // Show correct answer visually
    document.getElementById(`opt_${q.answer}`).classList.add('correct');
    
    showFeedback('timeout', "⏳ Time's Up!", q.explanation);
    speakText("Time is up. " + q.explanation);
}

// ==========================================
// 6. ANSWER HANDLING & FEEDBACK
// ==========================================
function selectAnswer(selectedIndex) {
    if (questionAnswered || isPaused) return;
    
    clearInterval(timerInterval); // Stop timer
    questionAnswered = true;
    
    const q = activeQuestions[currentQuestionIndex];
    lockOptions();
    
    const selectedEl = document.getElementById(`opt_${selectedIndex}`);
    const correctEl = document.getElementById(`opt_${q.answer}`);
    
    if (selectedIndex === q.answer) {
        // Correct
        score++;
        selectedEl.classList.add('correct');
        showFeedback('success', "✅ Correct!", q.explanation);
        speakText("Correct. " + q.explanation);
    } else {
        // Incorrect
        selectedEl.classList.add('incorrect');
        correctEl.classList.add('correct');
        showFeedback('error', "❌ Incorrect!", q.explanation);
        speakText("Incorrect. " + q.explanation);
    }
    
    document.getElementById('scoreDisplay').innerHTML = `Score: ${score} ⭐`;
}

function lockOptions() {
    const opts = document.querySelectorAll('.option');
    opts.forEach(opt => opt.classList.add('disabled'));
}

function showFeedback(type, title, text) {
    const fb = document.getElementById('feedbackBox');
    const fbTitle = document.getElementById('feedbackTitle');
    const fbText = document.getElementById('feedbackText');
    
    fb.className = `feedback-box show ${type}`;
    fbTitle.innerHTML = title;
    fbText.innerHTML = text;
}

function nextQuestion() {
    speechSynthesis.cancel(); // Stop reading feedback if user clicks next early
    currentQuestionIndex++;
    loadQuestion();
}

// ==========================================
// 7. END GAME & RESULTS
// ==========================================
function endGame() {
    clearInterval(timerInterval);
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('resultsScreen').classList.remove('hidden');
    
    const totalQs = activeQuestions.length;
    const percentage = Math.round((score / totalQs) * 100);
    
    document.getElementById('finalScore').innerText = `${score} / ${totalQs} (${percentage}%)`;
    
    let msg = "";
    if (percentage >= 90) msg = "Absolutely fantastic! You are ready for the test! 🌟🏆";
    else if (percentage >= 70) msg = "Great job! Keep practicing to get even better! 👍✨";
    else msg = "Good effort! Review the error explanations and try again. 📚💪";
    
    document.getElementById('resultsMessage').innerText = msg;
    speakText(`Test complete. Your score is ${score} out of ${totalQs}. ${msg}`);
}

function printCertificate() {
    window.print();
}
