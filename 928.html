<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 6 Dictation Player</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; margin: auto; line-height: 1.6; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 6px; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-radius: 6px; background: #f0f0f0; font-weight: bold; }
        #current-text { margin-top: 10px; font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <h2>Dictation Audio Engine (85% Speed)</h2>
    <button id="playBtn">Start Dictation</button>
    <div id="status">Ready to start.</div>
    <div id="current-text"></div>

    <script>
        const dictationItems = [
            "Number 1, a fire extinguisher.",
            "Number 2, a thermometer.",
            "Number 3, a dehumidifier.",
            "Number 4, a vacuum cleaner.",
            "Number 5, a laboratory.",
            "Number 6, digital.",
            "Number 7, engine.",
            "Number 8, integrated circuits.",
            "Number 9, programmed.",
            "Number 10, transistor.",
            "Dictation 1: Life was different in the past. Homes did not have electricity.",
            "Dictation 2: Today, we can take a shower at any time we are hot. Our ancestors were not so lucky. Only one in ten people had a bathtub in their house in the old days.",
            "Dictation 3: On a hot summer day, people enjoy eating delicious Popsicles. Do you know who invented them?",
            "Dictation 4: Today, there are dozens of flavours, including grape and lemon. Which flavor do you like?"
        ];

        const playBtn = document.getElementById('playBtn');
        const statusDiv = document.getElementById('status');
        const textDiv = document.getElementById('current-text');
        
        // Force voice load
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function playDictation() {
            playBtn.disabled = true;
            
            // Prioritize Microsoft natural voices if available
            const voices = window.speechSynthesis.getVoices();
            let selectedVoice = voices.find(v => v.name.includes('Microsoft Emma Online')) || 
                                voices.find(v => v.name.includes('Microsoft Brian Online')) ||
                                voices.find(v => v.lang.startsWith('en-'));

            for (let i = 0; i < dictationItems.length; i++) {
                textDiv.textContent = dictationItems[i];
                
                for (let rep = 1; rep <= 3; rep++) {
                    statusDiv.textContent = `Playing Item ${i + 1} (Repetition ${rep} of 3)`;
                    await speak(dictationItems[i], selectedVoice);
                    
                    if (rep < 3) {
                        statusDiv.textContent = `Pausing for 5 seconds...`;
                        await sleep(5000);
                    } else {
                        statusDiv.textContent = `Moving to next item...`;
                        await sleep(3000); // Shorter transition between different items
                    }
                }
            }
            statusDiv.textContent = "Dictation complete.";
            textDiv.textContent = "";
            playBtn.disabled = false;
        }

        function speak(text, voice) {
            return new Promise(resolve => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; 
                if (voice) utterance.voice = voice;
                utterance.onend = resolve;
                window.speechSynthesis.speak(utterance);
            });
        }

        playBtn.addEventListener('click', playDictation);
    </script>
</body>
</html>
