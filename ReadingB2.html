    @keyframes flashGreen {
      0% { background-color: #ffffff; border-color: #e2e8f0; }

      100% { background-color: #f0fdf4; border-color: #86efac; }

      40%, 80% { transform: translateX(4px); }
    }

    .animate-correct {
      animation: flashGreen 0.6s ease forwards;
    }
    .animate-incorrect {

    // Audio Context for synthesized sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      if (type === 'correct') {
        // Cheerful high pitched ding
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1); // C6
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'incorrect') {
        // Low buzzing descending tone
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

        passage: `<p>As urban congestion and environmental concerns intensify, many cities are turning to smart mobility solutions to revolutionize public transportation. By integrating real‑time data, IoT sensors, and digital route optimization, municipalities are transforming traditional transit systems into dynamic networks. These smart systems can adjust bus routes on the fly, coordinate traffic signals to prioritize mass transit, and even deploy electric and autonomous vehicles to reduce emissions.</p><p>Investments in smart mobility not only promise reduced travel times and lower environmental impact but also seek to improve overall commuter experiences. However, the rapid integration of technology in urban transport also brings challenges—high initial costs, technical complexities, and issues around data privacy. Despite these hurdles, many city officials remain optimistic that smart mobility will build a more efficient and sustainable urban transportation network.</p><p>Overall, the advent of smart mobility is set to reshape the way cities move, offering a blend of innovation and practicality while confronting significant technical and logistical challenges.</p>`,

        title: "Sustainable Tourism and Its Impact on Local Communities",
        passage: `<p>Tourism has long served as a vital source of revenue for many regions; however, the rapid increase in visitor numbers has raised concerns over environmental degradation and cultural dilution. In response, numerous destinations are embracing sustainable tourism strategies that aim to minimize adverse impacts while maximizing economic and social benefits.</p><p>These initiatives include enforcing visitor limits, promoting eco‑friendly practices among service providers, and investing in infrastructure that safeguards natural resources. By doing so, local governments and communities secure funding necessary to preserve both their environmental assets and cultural heritage.</p><p>Nonetheless, challenges persist. Over‑tourism can strain local resources and erode traditional customs if not properly managed. Experts maintain that the success of sustainable tourism depends on effective planning and active community engagement. When executed well, sustainable tourism strikes a promising balance between fostering economic growth and protecting the natural and cultural assets essential to local quality of life.</p>`,

        title: "The Digital Transformation of Public Libraries",
        passage: `<p>In the era of digital information, public libraries have undergone a significant transformation. Once regarded solely as repositories of physical books, modern libraries now offer a wide array of digital services – including e-books, online databases, interactive multimedia resources, and virtual community programs. This evolution has expanded access to knowledge and made libraries key centers for lifelong learning.</p><p>By integrating advanced technology such as automated systems, digital catalogs, and free internet access, libraries have repositioned themselves as dynamic community hubs. They now bridge the digital divide by providing essential services like digital literacy workshops and remote research tools, making them not only centers of information but also crucial assets for community development.</p><p>Despite these remarkable advances, challenges persist. Limited funding, ongoing staff training needs, and issues surrounding data privacy can hinder the full potential of digital services. Nonetheless, experts remain optimistic that with continuous investment and community support, public libraries will continue to innovate and reinforce their role as vital institutions in the digital age.</p>`,

        title: "The Evolution of Remote Work: Transforming the Modern Workplace",
        passage: `<p>In recent years, remote work has transitioned from a rare perk to a mainstream mode of employment. Powered by technological advances like high-speed internet, communication platforms, and cloud computing, employees are no longer bound to a traditional office. Instead, many companies have adopted flexible work arrangements that allow individuals to collaborate from virtually anywhere.</p><p>This shift has led to notable changes in workplace dynamics. For example, employees report improved work-life balance and a reduction in daily commuting stress. Cost savings on transportation and office maintenance have also positively impacted businesses. However, the move toward remote work introduces challenges such as potential communication gaps, the need for robust digital infrastructure, and difficulties in maintaining team cohesion.</p><p>Experts predict that the future of work will likely evolve into hybrid models that combine remote and in-person work environments. Such models aim to capitalize on the benefits of flexibility while mitigating the challenges associated with entirely remote setups. As organizations continue to adapt, the modern workplace is undergoing a transformative evolution that reflects broader social and technological shifts.</p>`,

        passage: `<p>Faced with increasing concerns over food insecurity and the environmental impact of long food supply chains, many cities are now turning to urban agriculture as a promising solution. Urban agriculture involves cultivating crops and raising livestock within city limits, in places like rooftop gardens, community plots, and vertical farms. Such initiatives not only provide fresh, locally grown produce but also reduce transportation emissions and help reconnect urban dwellers with nature.</p><p>In addition to these tangible benefits, urban agriculture fosters community engagement by creating shared spaces where people can collaborate and learn about sustainable practices. Many local governments are investing in these projects to promote self-sufficiency and encourage environmentally friendly practices. However, challenges remain, including limited space, initial setup costs, and the need for technical expertise to maintain these systems.</p><p>Overall, urban agriculture is emerging as a pioneering model for sustainable city living, balancing economic, social, and environmental objectives in the face of rapid urbanization.</p>`,

        passage: `<p>In recent years, digital platforms have fueled a rapid expansion of the gig economy. This new model of short-term, freelance, or contract work offers workers unprecedented flexibility, allowing them to choose projects and set their own schedules. Many individuals value the autonomy that gig work provides, as it enables them to balance their professional and personal lives more effectively.</p><p>However, the gig economy is not without its challenges. While it opens up new opportunities for entrepreneurship and innovation, many gig workers face income instability and insufficient legal protections. The absence of traditional benefits, such as health insurance and retirement plans, has raised concerns about the long-term security of those relying on gig work. Additionally, critics argue that the erosion of stable, full-time employment may undermine conventional employment standards.</p><p>Despite these challenges, industry advocates believe that the gig economy represents a transformative shift in how people work. As companies and governments explore regulatory frameworks to address worker protections while preserving flexibility, the future of work may well depend on striking a careful balance between innovation and security.</p>`,

        passage: `<p>Nanotechnology has emerged as a groundbreaking field in modern medicine, particularly in the area of drug delivery. By engineering materials at the nanoscale—typically smaller than 100 nanometers—scientists can create nanoparticles designed to carry drugs directly to specific cells. This targeted approach not only increases the effectiveness of the treatment but also minimizes side effects often associated with conventional therapies.</p><p>One key advantage of nanotechnology in drug delivery is its enhancement of a drug’s <em>bioavailability</em>, meaning a higher proportion of the administered dose becomes available for therapeutic action. Moreover, nanoparticles can penetrate biological barriers that would otherwise block the active ingredients from reaching affected areas, thereby promising more precise and efficient treatments.</p><p>Despite these promising attributes, the application of nanotechnology in medicine is not without challenges. Concerns regarding toxicity, long-term stability, and manufacturing costs continue to spur debate among researchers and regulatory bodies. Nonetheless, ongoing advances and controlled clinical trials suggest that nanotechnology could play a pivotal role in the evolution of personalized medicine over the coming decades.</p>`,

        title: "CRISPR Gene Editing: Promising Advances and Ethical Debates",
        passage: `<p>CRISPR, a groundbreaking gene‐editing technology discovered from a natural bacterial defense mechanism, has transformed the landscape of modern biotechnology. By precisely altering DNA sequences, scientists can now target and modify specific genes with remarkable precision—a development that holds the promise of curing genetic disorders, enhancing crop yields, and even combating emerging diseases.</p><p>Beyond its practical applications, CRISPR raises significant ethical questions. The prospect of making permanent changes to an organism’s genetic makeup, particularly in human embryos, has sparked a heated debate among researchers, policymakers, and ethicists. Concerns about unintended consequences, such as off‐target effects and long-term impacts on human evolution, underscore the need for stringent regulatory frameworks.</p><p>Despite these challenges, many experts remain optimistic about CRISPR’s potential. They argue that—with careful oversight and further research—the benefits of CRISPR, such as personalized medicine and improved agricultural practices, can be harnessed while mitigating its risks. As the technology evolves, it is poised to become a pivotal tool in both medicine and environmental science.</p>`,

        passage: `<p>Quantum computing leverages principles of quantum mechanics—such as superposition and entanglement—to process information in ways that classical computers cannot. Unlike traditional bits that exist distinctly as 0 or 1, quantum bits (qubits) can exist in multiple states simultaneously, potentially enabling exponential increases in computing speed for certain tasks. This innovative approach promises to solve complex problems in fields such as cryptography, optimization, and drug discovery.</p><p>However, technical challenges like error correction and decoherence—where quantum information is lost due to interactions with the environment—present significant hurdles. Researchers are investing heavily in developing technologies such as advanced cooling systems and magnetic traps to counteract these issues. While breakthroughs are being achieved gradually, experts caution that practical, widespread application of quantum computers may still be decades away.</p><p>Overall, quantum computing represents a bold step towards revolutionizing computational power, offering transformative potential for solving problems deemed intractable by classical machines, though its development is fraught with significant technical obstacles.</p>`,

        passage: `<p>Over the past few decades, Mars has captivated scientists and space enthusiasts alike. Space agencies from around the world have launched a series of missions to explore the Red Planet, employing advanced rovers and orbiters to collect critical data. Recent missions have provided unprecedented insights into Mars’ geology, revealing evidence of ancient water flows, sedimentary rocks, and mineral deposits that suggest the planet may have once been habitable.</p><p>Modern rovers, equipped with high-resolution cameras and sophisticated sensors, are able to traverse Martian terrain and analyze soil samples in situ. These technological marvels have not only deepened our understanding of Mars’ climatic past but also paved the way for future manned missions. International collaborations and continuous technological innovations further enhance the prospects of unlocking Mars’ many secrets and possibly establishing a future human presence on the planet.</p><p>Despite these impressive strides, challenges remain in ensuring the longevity and efficiency of missions. Harsh environmental conditions, communication delays, and limited budget allocations underscore the difficulties inherent in interplanetary exploration. Nevertheless, the accumulated data is transforming our perception of Mars, fueling optimism that ongoing research will eventually answer some of the fundamental questions about the early solar system.</p>`,

        title: "Ocean Acidification: A Growing Threat to Marine Ecosystems",
        passage: `<p>The rapid increase in atmospheric CO₂ over the past century has not only contributed to global warming but has also led to a phenomenon known as ocean acidification. As more carbon dioxide dissolves into seawater, the pH of the ocean declines, creating a more acidic environment. This shift in ocean chemistry can severely affect marine organisms, particularly those that rely on calcium carbonate to build shells and skeletons—such as corals, mollusks, and some species of plankton.</p><p>Numerous studies have shown that as ocean acidity increases, the ability of these organisms to form and maintain their structures diminishes, which in turn threatens entire ecosystems. Coral reefs, for example, are especially vulnerable; their degradation not only reduces biodiversity but also impacts coastal communities that depend on them for food, tourism, and coastal protection.</p><p>Scientists are actively researching mitigation strategies—from reducing carbon emissions at their source to exploring methods that might enhance the natural buffering capacity of seawater. While significant uncertainties remain about the long-term impacts, there is a growing consensus on the urgent need to address ocean acidification as part of a broader strategy for environmental sustainability.</p>`,

    const testInterface = document.getElementById('test-interface');
    
    // Side by side elements
    const passageTitle = document.getElementById('passage-title');
    const passageContent = document.getElementById('passage-content');
    const questionsContainer = document.getElementById('questions-container');
    const quizForm = document.getElementById('quiz-form');
    
    // Header elements
    const headerTitle = document.getElementById('header-title');
    const hdrScore = document.getElementById('hdr-score');
    const timerDisplay = document.getElementById('timer-display');
    const hdrTests = document.getElementById('hdr-tests');
    const hdrQs = document.getElementById('hdr-qs');
    
    // Sidebar elements
    const toggleMenuBtn = document.getElementById('toggle-menu');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const closeMobileMenuBtn = document.getElementById('close-mobile-menu');

    function init() {
      // Set initial counts
      hdrTests.innerText = testData.length;
      let totalQs = 0;
      testData.forEach(t => totalQs += t.questions.length);
      hdrQs.innerText = totalQs;

      renderMenu();
      setupMenuToggle();
      setupInteractiveGrading();
    }

    function renderMenu() {
      let menuHtml = '';
      testData.forEach((test, index) => {
        const itemHtml = `
          <a href="#" data-testid="${test.id}" class="topic-btn block px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 border-l-4 border-transparent transition-colors truncate" title="${test.title}">
            <span class="font-medium text-slate-500 mr-1">${index + 1}.</span> 
            ${test.title}
          </a>
        `;
        menuHtml += itemHtml;
      });
      testMenu.innerHTML = menuHtml;

      document.querySelectorAll('.topic-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const testId = this.getAttribute('data-testid');
          loadTest(testId);
          
          document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          hideSidebar();
        });
      });
    }

    function setupMenuToggle() {
      toggleMenuBtn.addEventListener('click', () => {
         if (sidebar.classList.contains('-translate-x-full') || sidebar.classList.contains('hidden')) {
             showSidebar();
         } else {
             hideSidebar();
         }
      });
      closeMobileMenuBtn.addEventListener('click', hideSidebar);
      sidebarOverlay.addEventListener('click', hideSidebar);
    }
    
    function showSidebar() {
        sidebar.classList.remove('hidden', '-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
    }
    
    function hideSidebar() {
        sidebar.classList.add('hidden', '-translate-x-full');
        sidebarOverlay.classList.add('hidden');
    }

    function loadTest(testId) {
      currentTest = testData.find(t => t.id === testId);
      if (!currentTest) return;

      welcomeScreen.classList.add('hidden');
      welcomeScreen.classList.remove('flex');
      
      // Ensure test interface is displayed and flexible
      testInterface.classList.remove('hidden');
      testInterface.classList.add('flex');
      
      // Update Header with Title
      headerTitle.textContent = currentTest.title;
      
      // Set Passage Content 
      passageTitle.textContent = currentTest.title;
      passageContent.innerHTML = currentTest.passage;
      
      renderQuestions(currentTest.questions);
      quizForm.reset(); // clear radio buttons visually
      startTimer();
      
      // Reset scroll positions 
      const rightCol = document.querySelector('.lg\\:w-\\[40\\%\\]');
      if (rightCol) rightCol.scrollTop = 0;
      
      const leftCol = document.querySelector('.lg\\:w-\\[60\\%\\]');
      if (leftCol) leftCol.scrollTop = 0;
    }

    function renderQuestions(questions) {
      let html = '';
      questions.forEach((q, index) => {
        // Reduced space-y margins inside question block
        html += `
          <div class="question-block bg-white p-3 md:p-4 rounded-lg border border-slate-200 shadow-sm transition-colors duration-300" data-question-index="${index}">
            <div class="font-semibold text-slate-800 mb-2 text-sm md:text-base leading-tight">
              <span class="text-blue-500 block mb-1 text-[10px] md:text-xs uppercase tracking-wider font-bold">${q.type}</span>
              <span class="text-blue-600 mr-1">Q${index + 1}:</span>
              ${q.text}
            </div>
            <div class="space-y-0.5"> 
        `;
        
        q.options.forEach((opt, optIndex) => {
          // Reduced padding for options
          html += `
              <label class="option-label flex items-start py-1 px-2 rounded-md border border-slate-100 cursor-pointer" data-opt="${optIndex}">
                <div class="flex-shrink-0 mt-0.5">
                  <input type="radio" name="q${index}" value="${optIndex}" class="w-3.5 h-3.5 text-blue-600 bg-slate-100 border-slate-300 focus:ring-blue-500">
                </div>
                <div class="ml-2 text-slate-700 text-xs md:text-sm leading-snug">
                  ${opt}
                </div>
              </label>
          `;
        });
        
        html += `
            </div>
            <div id="feedback-q${index}" class="mt-2 p-2 rounded-md text-xs hidden leading-relaxed"></div>
          </div>
        `;
      });
      
      questionsContainer.innerHTML = html;
    }

    function setupInteractiveGrading() {
       questionsContainer.addEventListener('change', (e) => {
           if(e.target.type === 'radio') {
               const questionIndex = parseInt(e.target.name.replace('q', ''));
               const selectedVal = parseInt(e.target.value);
               handleAnswerSelection(questionIndex, selectedVal, e.target);
           }
       });
    }

    function handleAnswerSelection(qIndex, selectedVal, inputElement) {
        if (!currentTest) return;
        
        const question = currentTest.questions[qIndex];
        const qBlock = document.querySelector(`.question-block[data-question-index="${qIndex}"]`);
        const feedbackEl = document.getElementById(`feedback-q${qIndex}`);
        const allRadios = document.getElementsByName(`q${qIndex}`);
        const isCorrect = (selectedVal === question.correctAnswer);
        
        // Ensure not already answered (prevent multiple grading)
        if(qBlock.hasAttribute('data-answered')) return;
        qBlock.setAttribute('data-answered', 'true');

        // Play Sound and trigger effect
        playSound(isCorrect ? 'correct' : 'incorrect');
        
        if (isCorrect) {
            globalScore++;
            hdrScore.innerText = globalScore;
            
            // Visuals
            qBlock.classList.add('border-green-300', 'bg-green-50', 'animate-correct');
            feedbackEl.classList.add('bg-green-100', 'text-green-800');
            feedbackEl.innerHTML = `<strong>Correct!</strong> <span class="ml-1 text-slate-600">${question.suggestion}</span>`;
            
            // Highlight selected option correctly
            inputElement.closest('label').classList.add('bg-green-100', 'border-green-400');
        } else {
            // Visuals
            qBlock.classList.add('border-red-300', 'bg-red-50', 'animate-incorrect');
            feedbackEl.classList.add('bg-red-100', 'text-red-800');
            feedbackEl.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <em>${question.options[question.correctAnswer]}</em>. <br><span class="mt-1 block text-slate-700">${question.suggestion}</span>`;
            
            // Highlight selected option incorrectly, highlight correct option
            inputElement.closest('label').classList.add('bg-red-100', 'border-red-400');
            
            const correctLabel = document.querySelector(`label[data-opt="${question.correctAnswer}"] input[name="q${qIndex}"]`).closest('label');
            correctLabel.classList.add('bg-green-50', 'border-green-300', 'border-dashed');
        }
        
        feedbackEl.classList.remove('hidden');

        // Lock all options for this question
        allRadios.forEach(opt => {
            opt.disabled = true;
            opt.closest('label').classList.add('locked');
        });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerValue = 10 * 60; // 10 minutes
      updateTimerDisplay();
      
      isTimerRunning = true;
      timerInterval = setInterval(() => {
        timerValue--;
        updateTimerDisplay();
        
        if (timerValue <= 0) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          handleTimeout();
        }
      }, 1000);
    }
    
    function updateTimerDisplay() {
      let minutes = Math.floor(timerValue / 60);
      let seconds = timerValue % 60;
      timerDisplay.innerText = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
      
      if(timerValue <= 60 && isTimerRunning) {
          document.getElementById('global-timer').classList.add('text-red-600', 'bg-red-100', 'border-red-200', 'animate-pulse', 'font-bold');
      } else {
          document.getElementById('global-timer').classList.remove('text-red-600', 'bg-red-100', 'border-red-200', 'animate-pulse', 'font-bold');
      }
    }

    function handleTimeout() {
        // Lock any unanswered questions and show answers
        if(!currentTest) return;
        
        currentTest.questions.forEach((q, i) => {
            const qBlock = document.querySelector(`.question-block[data-question-index="${i}"]`);
            if(!qBlock.hasAttribute('data-answered')) {
                // Manually trigger incorrect state for unanswered
                qBlock.setAttribute('data-answered', 'true');
                const feedbackEl = document.getElementById(`feedback-q${i}`);
                const allRadios = document.getElementsByName(`q${i}`);
                
                qBlock.classList.add('border-amber-300', 'bg-amber-50');
                feedbackEl.classList.add('bg-amber-100', 'text-amber-800');
                feedbackEl.innerHTML = `<strong>Time's up! Unanswered.</strong> The correct answer was: <em>${q.options[q.correctAnswer]}</em>. <br><span class="mt-1 block text-slate-700">${q.suggestion}</span>`;
                feedbackEl.classList.remove('hidden');
                
                const correctLabel = document.querySelector(`label[data-opt="${q.correctAnswer}"] input[name="q${i}"]`).closest('label');
                correctLabel.classList.add('bg-green-50', 'border-green-300');
                
                allRadios.forEach(opt => {
                    opt.disabled = true;
                    opt.closest('label').classList.add('locked');
                });
            }
        });
    }

    // Run init on load
    window.onload = init;

  </script>
</body>
</html>
