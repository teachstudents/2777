<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Mitchell's Vocabulary Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(-45deg, #4ade80, #f472b6, #34d399, #fb7185);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #1f2937;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        .game-container {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        input[type="text"] {
            border: 2px solid #e2e8f0; 
            padding: 15px; 
            border-radius: 12px;
            font-size: 1.2rem;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #10b981; 
            outline: none;
        }

        .choice-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 2.5rem; /* Doubled font size */
            font-weight: 800;
            padding: 15px 10px;
            margin: 0; /* Zero margin as requested */
            line-height: 1.1; 
            border-radius: 12px;
            color: #000000; /* Pure black text */
            background-color: white;
            border: 3px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .choice-button:hover:not(:disabled) { 
            transform: scale(1.02);
            z-index: 10;
        }
        
        .choice-button.correct { 
            background-color: #10b981 !important; 
            color: white !important;
            border-color: #059669 !important;
            transform: scale(1.05); 
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); 
            z-index: 10;
        }
        
        .choice-button.incorrect { 
            background-color: #f43f5e !important; 
            color: white !important;
            border-color: #e11d48 !important;
        }
        
        .choice-button:disabled { cursor: default; }

        .choice-button .pinyin {
            font-size: 1.25rem;
            font-weight: 500;
            color: #000000;
            margin-top: 5px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        @keyframes glitter {
            0% { filter: brightness(1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
            50% { filter: brightness(1.3); box-shadow: 0 0 30px rgba(16, 185, 129, 1); }
            100% { filter: brightness(1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        }
        .glitter { animation: glitter 0.8s infinite; }

        #timer-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #timer-bar {
            height: 100%;
            background-color: #10b981;
            width: 100%;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .header-btn {
            padding: 8px 16px;
            font-weight: 700;
            border-radius: 8px;
            transition: all 0.2s;
        }

        @media (max-width: 640px) {
            .choice-button { font-size: 1.8rem; }
            .choice-button .pinyin { font-size: 1rem; }
            .game-container { margin: 10px; width: auto; padding: 10px; }
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-2 sm:p-5">

            function setNarratorVoice(targetName) {
                if (!voices || voices.length === 0) return;
                const lowerTarget = targetName.toLowerCase();
                currentNarratorVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(lowerTarget)) 
                    || voices.find(v => v.lang.startsWith('en') && (v.name.includes("Google") || v.name.includes("Natural")))
                    || voices.find(v => v.lang.startsWith('en'));
            }

            function initSpeechSynthesis() {
                 if ('speechSynthesis' in window) {
                    const populateVoices = () => {
                        voices = speechSynthesis.getVoices();
                    };
                    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;
                    populateVoices(); setTimeout(populateVoices, 500);
                }
            }
            initSpeechSynthesis(); 

            function speak(text) {
                if (!('speechSynthesis' in window) || !text) return;
                
                if (speakTimeoutId) clearTimeout(speakTimeoutId);
                if (currentUtterance) {
                    currentUtterance.onend = null; currentUtterance.onerror = null; currentUtterance.onstart = null;
                }

                currentUtterance = new SpeechSynthesisUtterance(text);
                if (currentNarratorVoice) currentUtterance.voice = currentNarratorVoice;
                
                const doSpeak = () => speechSynthesis.speak(currentUtterance);
                if (speechSynthesis.speaking || speechSynthesis.pending) {
                    speechSynthesis.cancel(); 
                    speakTimeoutId = setTimeout(doSpeak, 300); 
                } else {
                    speakTimeoutId = setTimeout(doSpeak, 50); 
                }
            }

            function startGame(p1Name, p2Name) {
                gameData = {
                    questionsAnswered: 0,
                    timeLeft: TIME_PER_QUESTION,
                    p1: { name: p1Name, score: 0, locked: false },
                    p2: { name: gameMode === 2 ? p2Name : "", score: 0, locked: false }
                };
                
                shuffledVocabIndices = Array.from(Array(currentVocabList.length).keys());
                shuffleArray(shuffledVocabIndices); 
                currentQuestionIndexInShuffledList = 0; 

                if (gameMode === 1) {
                    p2ScoreContainer.classList.add('hidden');
                    optionsContainer2p.classList.add('hidden');
                    optionsContainer1p.classList.remove('hidden');
                } else {
                    p2ScoreContainer.classList.remove('hidden');
                    optionsContainer2p.classList.remove('hidden');
                    optionsContainer1p.classList.add('hidden');
                    optionsContainer2p.classList.add('flex'); // Ensure flex is applied when unhidden
                }
                
                gameScreen.classList.remove('hidden');
                gameOverScreen.classList.add('hidden');
                document.getElementById('question-area').classList.remove('hidden');
                
                startNewQuestionRound();
            }

            function startNewQuestionRound() {
                if (gameData.questionsAnswered >= TOTAL_QUESTIONS_PER_GAME) { 
                    endGame(); return;
                }
                
                roundActive = true;
                gameData.p1.locked = false;
                gameData.p2.locked = false;
                updateScoreboard();

                const vocabIndex = shuffledVocabIndices[currentQuestionIndexInShuffledList];
                currentQuestionData = { ...currentVocabList[vocabIndex] }; 
                currentQuestionData.type = Math.random() < 0.5 ? 'engToChi' : 'chiToEngSpelling';
                
                questionStimulusDisplay.className = 'w-full text-center py-4 mb-2 bg-white rounded-xl border-2 border-slate-200 transition-all';
                exampleSentenceFeedbackDisplay.classList.add('hidden');

                if (currentQuestionData.type === 'engToChi') {
                    questionStimulusDisplay.innerHTML = `<div class="english-word">${currentQuestionData.eng}</div>`;
                } else {
                    questionStimulusDisplay.innerHTML = `
                        <div class="chinese-definition">${currentQuestionData.chi}</div>
                        <div class="pinyin">${currentQuestionData.pin}</div>`;
                }
                
                speak(`${currentQuestionData.eng}. ${currentQuestionData.sentence}`);
                renderOptions();
            }

            function renderOptions() {
                const { eng, chi, pin, type } = currentQuestionData;
                let options = [];
                let correctVal = type === 'engToChi' ? `${chi} (${pin})` : eng;

                options.push({ text: correctVal, isCorrect: true });
                
                let distractors = [];
                const tempList = currentVocabList.filter(item => item.chi !== chi);
                while (distractors.length < 3 && tempList.length > 0) {
                    const d = tempList.splice(Math.floor(Math.random() * tempList.length), 1)[0];
                    options.push({ text: type === 'engToChi' ? `${d.chi} (${d.pin})` : d.eng, isCorrect: false });
                    distractors.push(d);
                }

                options = shuffleArray(options);
                
                const createBtn = (opt, index, keyHint, player) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-button';
                    const content = opt.text.includes('(') ? 
                        `<div>${opt.text.split('(')[0]}</div><div class="pinyin !text-lg !text-slate-500">(${opt.text.split('(')[1]}</div>` : opt.text;
                    btn.innerHTML = `<span class="absolute top-2 left-2 text-xs opacity-50 bg-slate-100 px-2 rounded">[${keyHint}]</span>${content}`;
                    btn.onclick = () => checkAnswer(player, opt.text, correctVal, btn);
                    return btn;
                };

                if (gameMode === 1) {
                    optionsContainer1p.innerHTML = '';
                    options.forEach((opt, i) => optionsContainer1p.appendChild(createBtn(opt, i, i+1, 'p1')));
                } else {
                    p1OptionsContainer.innerHTML = ''; p2OptionsContainer.innerHTML = '';
                    options.forEach((opt, i) => {
                        p1OptionsContainer.appendChild(createBtn(opt, i, i+1, 'p1'));
                        p2OptionsContainer.appendChild(createBtn(opt, i, [7,8,9,0][i], 'p2'));
                    });
                }
                startTimer();
            }

            function checkAnswer(player, selected, correct, btn) {
                if (!roundActive || gameData[player].locked) return;

                if (selected === correct) {
                    clearInterval(questionTimerInterval);
                    handleWin(player, btn);
                } else {
                    gameData[player].score = Math.max(0, gameData[player].score - 1);
                    btn.classList.add('incorrect', 'shake');
                    btn.disabled = true;
                    setTimeout(() => btn.classList.remove('shake'), 400);
                    document.getElementById('incorrectSound').play().catch(e=>{});
                    updateScoreboard();

                    if (gameMode === 2) {
                        gameData[player].locked = true;
                        Array.from((player === 'p1' ? p1OptionsContainer : p2OptionsContainer).children).forEach(b => b.disabled = true);
                        if (gameData.p1.locked && gameData.p2.locked) {
                            clearInterval(questionTimerInterval);
                            handleTie();
                        }
                    }
                }
            }

            function handleWin(player, btn) {
                roundActive = false;
                gameData[player].score += 10;
                
                document.getElementById('correctSound').play().catch(e=>{});
                btn.classList.add('correct', 'glitter');
                questionStimulusDisplay.classList.add(player === 'p1' ? 'bg-emerald-50' : 'bg-blue-50', 'scale-105');
                
                // Floating point animation
                const pt = document.createElement('div');
                pt.textContent = '+10';
                pt.className = 'fixed font-black text-4xl text-emerald-500 z-[9999] transition-all duration-700 ease-out drop-shadow-md pointer-events-none';
                const rect = btn.getBoundingClientRect();
                const targetRect = document.getElementById(`${player}-score`).getBoundingClientRect();
                
                pt.style.left = `${rect.left + rect.width/2}px`;
                pt.style.top = `${rect.top}px`;
                document.getElementById('points-container').appendChild(pt);
                
                setTimeout(() => {
                    pt.style.left = `${targetRect.left}px`;
                    pt.style.top = `${targetRect.top}px`;
                    pt.style.opacity = '0';
                    pt.style.transform = 'scale(0.5)';
                }, 50);
                setTimeout(() => pt.remove(), 750);

                wrapUpRound();
            }

            function handleTie() {
                roundActive = false;
                questionStimulusDisplay.classList.add('bg-rose-50');
                wrapUpRound();
            }

            function wrapUpRound() {
                if (gameMode === 1) Array.from(optionsContainer1p.children).forEach(b => b.disabled = true);
                else {
                    Array.from(p1OptionsContainer.children).forEach(b => b.disabled = true);
                    Array.from(p2OptionsContainer.children).forEach(b => b.disabled = true);
                }
                
                exampleSentenceFeedbackDisplay.innerHTML = `<span class="font-bold text-slate-800">Sentence:</span> ${currentQuestionData.sentence}`;
                exampleSentenceFeedbackDisplay.classList.remove('hidden');
                
                updateScoreboard();
                gameData.questionsAnswered++;
                currentQuestionIndexInShuffledList++;
                
                autoAdvanceTimeout = setTimeout(startNewQuestionRound, 1800);
            }

            function startTimer() {
                clearInterval(questionTimerInterval);
                gameData.timeLeft = TIME_PER_QUESTION;
                modalTimerDisplay.textContent = gameData.timeLeft;
                timerBar.style.width = '100%';
                timerBar.style.backgroundColor = '#10b981';

                questionTimerInterval = setInterval(() => {
                    gameData.timeLeft--;
                    modalTimerDisplay.textContent = gameData.timeLeft;
                    const pct = (gameData.timeLeft / TIME_PER_QUESTION) * 100;
                    timerBar.style.width = `${pct}%`;
                    if (pct < 30) timerBar.style.backgroundColor = '#f43f5e';
                    else if (pct < 60) timerBar.style.backgroundColor = '#f59e0b';

                    if (gameData.timeLeft <= 0) {
                        clearInterval(questionTimerInterval);
                        handleTie();
                    }
                }, 1000);
            }

            function updateScoreboard() {
                p1NameDisplay.textContent = gameData.p1.name;
                p1ScoreDisplay.textContent = gameData.p1.score;
                if (gameMode === 2) {
                    p2NameDisplay.textContent = gameData.p2.name;
                    p2ScoreDisplay.textContent = gameData.p2.score;
                }
                questionsAnsweredDisplay.textContent = Math.min(gameData.questionsAnswered + 1, TOTAL_QUESTIONS_PER_GAME);
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function endGame() {
                clearInterval(questionTimerInterval);
                clearTimeout(autoAdvanceTimeout);
                document.getElementById('question-area').classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
                
                document.getElementById('final-p1-name').textContent = gameData.p1.name;
                document.getElementById('final-p1-score').textContent = gameData.p1.score;
                
                const p2Card = document.getElementById('final-p2-card');
                const ann = document.getElementById('winner-announcement');
                
                if (gameMode === 2) {
                    p2Card.classList.remove('hidden');
                    document.getElementById('final-p2-name').textContent = gameData.p2.name;
                    document.getElementById('final-p2-score').textContent = gameData.p2.score;
                    if (gameData.p1.score > gameData.p2.score) ann.innerHTML = `<span class="text-emerald-600">${gameData.p1.name} Wins!</span> 🏆`;
                    else if (gameData.p2.score > gameData.p1.score) ann.innerHTML = `<span class="text-blue-600">${gameData.p2.name} Wins!</span> 🏆`;
                    else ann.innerHTML = `<span class="text-amber-500">It's a Tie!</span> 🤝`;
                } else {
                    p2Card.classList.add('hidden');
                    ann.innerHTML = `<span class="text-emerald-600">Great Job!</span> 🎉`;
                }
            }

            navHomeBtn.addEventListener('click', () => quitConfirmPanel.classList.remove('translate-y-full'));
            document.getElementById('quit-no-btn').addEventListener('click', () => quitConfirmPanel.classList.add('translate-y-full'));
            document.getElementById('quit-yes-btn').addEventListener('click', () => {
                quitConfirmPanel.classList.add('translate-y-full');
                clearInterval(questionTimerInterval);
                clearTimeout(autoAdvanceTimeout);
                gameApp.classList.add('hidden');
                mainMenu.classList.remove('hidden');
            });
            
            document.getElementById('play-again-button').addEventListener('click', () => {
                gameOverScreen.classList.add('hidden');
                gameApp.classList.add('hidden');
                mainMenu.classList.remove('hidden');
            });

            repeatButton.addEventListener('click', () => {
                if(currentQuestionData.eng) speak(`${currentQuestionData.eng}. ${currentQuestionData.sentence}`);
            });

            function navManual(dir) {
                if(!roundActive && !autoAdvanceTimeout) return; // Prevent skipping during Game Over
                clearInterval(questionTimerInterval);
                clearTimeout(autoAdvanceTimeout);
                if(speechSynthesis.speaking) speechSynthesis.cancel();
                
                if (dir === 'next' && currentQuestionIndexInShuffledList < TOTAL_QUESTIONS_PER_GAME - 1) {
                    if (roundActive) gameData.questionsAnswered++; // Count current as skipped
                    else currentQuestionIndexInShuffledList--; // Adjust because wrapUpRound already incremented it
                    currentQuestionIndexInShuffledList++;
                    startNewQuestionRound();
                } else if (dir === 'back' && currentQuestionIndexInShuffledList > 0) {
                    if (roundActive) {
                        currentQuestionIndexInShuffledList--;
                        gameData.questionsAnswered--;
                    } else {
                        currentQuestionIndexInShuffledList -= 2; // Go back 2 because it already advanced
                        gameData.questionsAnswered--;
                    }
                    startNewQuestionRound();
                }
            }
            document.getElementById('nav-back-btn').addEventListener('click', () => navManual('back'));
            document.getElementById('nav-next-btn').addEventListener('click', () => navManual('next'));

            document.addEventListener('keydown', (e) => {
                if (!roundActive) return;
                const k = e.key;
                if (['1','2','3','4'].includes(k)) {
                    const btn = (gameMode === 1 ? optionsContainer1p : p1OptionsContainer).children[k-1];
                    if (btn && !btn.disabled) btn.click();
                }
                if (gameMode === 2 && ['7','8','9','0'].includes(k)) {
                    const idx = {'7':0, '8':1, '9':2, '0':3}[k];
                    const btn = p2OptionsContainer.children[idx];
                    if (btn && !btn.disabled) btn.click();
                }
            });
        });
    </script>
</body>
</html>
