<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vocabulary Practice Ultimate - 800 Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0fdf4; /* Light green tint */
      overflow: hidden; /* Prevent scrolling entirely */
      touch-action: manipulation;
    }
    
    .timer-bar-container {
      width: 100%;
      height: 8px;
      background-color: #e5e7eb;
    }
    .timer-bar {
      height: 100%;
      background-color: #10b981; /* Emerald 500 */
      width: 100%;
      transition: width 1s linear, background-color 0.5s ease;
    }
    .timer-bar.warning { background-color: #f59e0b; }
    .timer-bar.danger { background-color: #ef4444; }

    .dynamic-question {
      font-size: clamp(2rem, 4.8vh, 4.4rem); /* Reduced 20% */
      line-height: 1.1;
    }
    .option-btn {
      transition: all 0.15s ease-in-out;
      font-size: clamp(1.6rem, 4vh, 3.6rem); /* Reduced 20% */
      line-height: 1.1;
    }
    .dynamic-feedback-title {
      font-size: clamp(2rem, 4.4vh, 3.6rem); /* Reduced 20% */
    }
    .dynamic-feedback-text {
      font-size: clamp(1.44rem, 3.2vh, 2.8rem); /* Reduced 20% */
    }

    .option-btn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15);
    }
    .option-correct {
      background-color: #d1fae5 !important;
      border-color: #10b981 !important;
      color: #065f46 !important;
    }
    .option-incorrect {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }
    
    .split-divider {
      width: 6px;
      background: linear-gradient(to bottom, transparent, #94a3b8, transparent);
      margin: 0 8px;
      border-radius: 4px;
    }
    
    /* Scrollbars for Home/Result menus only */
    .custom-scroll::-webkit-scrollbar { width: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .mode-btn.active {
      background-color: #10b981;
      color: white;
      border-color: #10b981;
    }
  </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

  <header id="game-header" class="hidden bg-white shadow-md z-10 flex flex-col shrink-0">
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-2 flex justify-between items-center">
      <button onclick="goHome()" class="flex items-center text-slate-600 hover:text-emerald-600 font-semibold transition-colors text-xs sm:text-sm">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span class="hidden sm:inline">Back</span>
      </button>
      
      <div class="text-center">
        <h1 class="text-base sm:text-lg font-black text-slate-800">Vocabulary Mastery</h1>
        <p id="question-counter" class="text-xs sm:text-sm font-bold text-emerald-600"></p>
      </div>

      <button id="next-btn" onclick="nextQuestion()" class="hidden flex items-center bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-md font-bold transition-colors shadow-sm text-xs sm:text-sm">
        Next
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
      <div id="next-placeholder" class="w-[60px] sm:w-[80px]"></div>
    </div>
    <div class="timer-bar-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center relative overflow-hidden">
    
    <!-- Home Screen -->
    <div id="home-screen" class="max-w-5xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 text-center m-4 overflow-y-auto custom-scroll max-h-full">
      <div class="mb-4">
        <svg class="w-16 h-16 text-emerald-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      </div>
      <h1 class="text-4xl md:text-5xl font-black text-slate-800 mb-2">The 800 Question Challenge</h1>
      <p class="text-slate-500 mb-6 text-lg font-medium">Select your mode and the block of questions you want to play!</p>
      
      <div class="flex flex-col sm:flex-row justify-center gap-4 mb-8">
        <button id="btn-mode-1" onclick="setMode(1)" class="mode-btn active px-8 py-4 rounded-xl font-black text-xl border-4 border-emerald-500 text-emerald-600 transition-colors shadow-sm">
          1 Player Mode
        </button>
        <button id="btn-mode-2" onclick="setMode(2)" class="mode-btn px-8 py-4 rounded-xl font-black text-xl border-4 border-emerald-500 text-emerald-600 transition-colors shadow-sm hover:bg-emerald-50">
          2 Player (Split Screen)
        </button>
      </div>

      <h3 class="text-2xl font-black text-slate-700 mb-4 text-center border-b-4 border-slate-100 pb-2">Select Question Range</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <button onclick="startRange(1, 100)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">1 - 100</button>
        <button onclick="startRange(101, 200)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">101 - 200</button>
        <button onclick="startRange(201, 300)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">201 - 300</button>
        <button onclick="startRange(301, 400)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">301 - 400</button>
        <button onclick="startRange(401, 500)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">401 - 500</button>
        <button onclick="startRange(501, 600)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">501 - 600</button>
        <button onclick="startRange(601, 700)" class="py-4 rounded-xl font-black text-xl text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border-2 border-slate-200 transition-colors shadow-sm">601 - 700</button>
        <button onclick="startRange(701, 800)" class="py-4 rounded-xl font-black text-xl text-white bg-emerald-500 hover:bg-emerald-600 border-2 border-emerald-600 transition-colors shadow-md">701 - 800</button>
      </div>
    </div>

    <!-- Game Screen - flex to top to push gaps up and prevent scrolling -->
    <div id="game-screen" class="hidden w-full h-full p-2 flex max-w-[2500px] mx-auto overflow-hidden">
      
      <!-- Player 1 Panel (Scores reduced by 50%) -->
      <div id="p1-panel" class="flex-1 min-w-0 flex flex-col bg-white rounded-2xl shadow-xl p-2 md:p-4 overflow-hidden h-full relative border-4 border-emerald-100">
        <div class="flex justify-between items-center mb-1 shrink-0">
          <h2 id="p1-name" class="text-xl md:text-2xl font-black text-emerald-600">Player 1</h2>
          <span id="p1-score" class="text-sm md:text-lg font-black text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">Score: 0</span>
        </div>
        
        <div class="flex flex-col justify-start flex-1 min-h-0 pt-1">
          <div class="w-full flex justify-center mb-2 shrink-0 max-h-[25vh]">
            <h3 id="p1-question" class="dynamic-question font-black text-slate-800 text-center"></h3>
          </div>
          
          <!-- Strict 2x2 grid, gap reduced to 3 -->
          <div id="p1-options" class="grid grid-cols-2 gap-3 shrink-0 mb-2 w-full max-w-6xl mx-auto h-[45vh] min-h-[150px]">
            <!-- Options injected here -->
          </div>
          
          <div id="p1-feedback" class="hidden shrink-0 bg-slate-50 p-3 rounded-xl border-4 border-slate-200 w-full max-w-6xl mx-auto max-h-[20vh] overflow-hidden">
            <p id="p1-feedback-title" class="dynamic-feedback-title font-black mb-1"></p>
            <p id="p1-feedback-exp" class="dynamic-feedback-text text-slate-800 font-bold leading-snug"></p>
          </div>
        </div>
      </div>

      <div id="split-divider" class="hidden split-divider shrink-0"></div>

      <!-- Player 2 Panel (Scores reduced by 50%) -->
      <div id="p2-panel" class="hidden flex-1 min-w-0 flex flex-col bg-white rounded-2xl shadow-xl p-2 md:p-4 overflow-hidden h-full relative border-4 border-blue-100">
        <div class="flex justify-between items-center mb-1 shrink-0">
          <h2 id="p2-name" class="text-xl md:text-2xl font-black text-blue-600">Player 2</h2>
          <span id="p2-score" class="text-sm md:text-lg font-black text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">Score: 0</span>
        </div>
        
        <div class="flex flex-col justify-start flex-1 min-h-0 pt-1">
          <div class="w-full flex justify-center mb-2 shrink-0 max-h-[25vh]">
            <h3 id="p2-question" class="dynamic-question font-black text-slate-800 text-center"></h3>
          </div>
          
          <div id="p2-options" class="grid grid-cols-2 gap-3 shrink-0 mb-2 w-full max-w-6xl mx-auto h-[45vh] min-h-[150px]">
            <!-- Options injected here -->
          </div>
          
          <div id="p2-feedback" class="hidden shrink-0 bg-slate-50 p-3 rounded-xl border-4 border-slate-200 w-full max-w-6xl mx-auto max-h-[20vh] overflow-hidden">
            <p id="p2-feedback-title" class="dynamic-feedback-title font-black mb-1"></p>
            <p id="p2-feedback-exp" class="dynamic-feedback-text text-slate-800 font-bold leading-snug"></p>
          </div>
        </div>
      </div>

    </div>

    <div id="result-screen" class="hidden max-w-4xl w-full bg-white rounded-3xl shadow-2xl p-10 text-center m-4 overflow-y-auto custom-scroll max-h-full">
      <h2 class="text-5xl md:text-7xl font-black text-slate-800 mb-8 tracking-tight">Set Complete!</h2>
      <div id="final-scores" class="flex flex-col sm:flex-row justify-center items-center gap-8 mb-10">
      </div>
      <p id="winner-text" class="text-4xl md:text-5xl font-black mb-10 tracking-wide"></p>
      
      <button onclick="goHome()" class="px-10 py-5 rounded-2xl font-black text-2xl text-white bg-slate-800 hover:bg-slate-900 shadow-xl transition-transform hover:scale-105">
        Back to Main Menu
      </button>
    </div>
  </main>

    const coreData = [];
    packedData.forEach(str => {
      const parts = str.split('|');
      if (parts.length === 6) {
        coreData.push({
          question: parts[0],
          options: [
            { text: parts[1], isCorrect: true },
            { text: parts[2], isCorrect: false },
            { text: parts[3], isCorrect: false },
            { text: parts[4], isCorrect: false }
          ],
          explanation: parts[5]
        });
      }
    });

    // Expand to exactly 800 questions
    const finalLibrary = [];
    while (finalLibrary.length < 800) {
      const shuffledCore = [...coreData].sort(() => Math.random() - 0.5);
      for (let i = 0; i < shuffledCore.length; i++) {
        if (finalLibrary.length < 800) {
          const q = shuffledCore[i];
          finalLibrary.push({
            question: q.question,
            options: [...q.options],
            explanation: q.explanation
          });
        } else {
          break;
        }
      }
    }

    let audioCtx = null;
    let synth = window.speechSynthesis;
    let voices = [];
    
    const loadVoices = () => { voices = synth.getVoices(); };
    loadVoices();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadVoices;
    }

    const praises = ["Excellent!", "Great job!", "Well done!", "Spot on!", "Fantastic!", "Perfect!", "Brilliant!"];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSoundEffect(isCorrect) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function speakPraise() {
      const text = praises[Math.floor(Math.random() * praises.length)];
      const utter = new SpeechSynthesisUtterance(text);
      
      let voice = voices.find(v => v.name.includes('Emma') || v.name.includes('Andrew'));
      if (!voice) {
        voice = voices.find(v => v.name.includes('Microsoft') && v.lang.startsWith('en')) || 
                voices.find(v => v.lang.startsWith('en'));
      }
      if (voice) utter.voice = voice;
      
      utter.rate = 1.1;
      synth.speak(utter);
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

      const total = activeQuestions.length;
      document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of ${total} (${total - currentIndex - 1} Left)`;

      playersMode = mode;
      document.getElementById('btn-mode-1').classList.remove('active', 'bg-emerald-500', 'text-white');
      document.getElementById('btn-mode-1').classList.add('text-emerald-600');
      document.getElementById('btn-mode-2').classList.remove('active', 'bg-emerald-500', 'text-white');
      document.getElementById('btn-mode-2').classList.add('text-emerald-600');
      
      const activeBtn = document.getElementById(`btn-mode-${mode}`);
      activeBtn.classList.add('active', 'bg-emerald-500', 'text-white');
      activeBtn.classList.remove('text-emerald-600');
    }

    function startRange(start, end) {
      const startIdx = start - 1;
      const endIdx = end;
      
      activeQuestions = finalLibrary.slice(startIdx, endIdx);
      startGame();
    }

    function startGame() {
      initAudio();
      currentIndex = 0;
      p1Score = 0;
      p2Score = 0;
      
      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-header').classList.remove('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      
      if (playersMode === 2) {
        document.getElementById('p2-panel').classList.remove('hidden');
        document.getElementById('split-divider').classList.remove('hidden');
      } else {
        document.getElementById('p2-panel').classList.add('hidden');
        document.getElementById('split-divider').classList.add('hidden');
      }
      
      renderQuestion();
    }

    function goHome() {
      stopTimer();
      clearTimeout(autoAdvanceTimeout);
      synth.cancel();
      document.getElementById('game-header').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('home-screen').classList.remove('hidden');
    }

    function renderQuestion() {
      clearTimeout(autoAdvanceTimeout);
      const q = activeQuestions[currentIndex];
      formatQuestionHeader();
      
      p1Answered = false;
      p2Answered = false;
      document.getElementById('next-btn').classList.add('hidden');
      document.getElementById('next-placeholder').classList.remove('hidden');
      
      const p1Opts = shuffleArray(q.options);
      renderPlayerPanel(1, q.question, p1Opts);
      
      if (playersMode === 2) {
        const p2Opts = shuffleArray(q.options);
        renderPlayerPanel(2, q.question, p2Opts);
      } else {
        p2Answered = true; // Auto-pass for player 2
      }
      
      startTimer();
    }

    function renderPlayerPanel(playerNum, text, optionsArr) {
      document.getElementById(`p${playerNum}-score`).innerText = `Score: ${eval('p'+playerNum+'Score')}`;
      document.getElementById(`p${playerNum}-question`).innerText = text;
      
      const optionsContainer = document.getElementById(`p${playerNum}-options`);
      optionsContainer.innerHTML = '';
      
      optionsArr.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn flex items-center justify-center w-full h-full text-center p-3 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 font-black text-slate-700 focus:outline-none';
        btn.innerText = opt.text;
        btn.onclick = () => handleAnswer(playerNum, opt.isCorrect, btn);
        optionsContainer.appendChild(btn);
      });
      
      document.getElementById(`p${playerNum}-feedback`).classList.add('hidden');
    }

    function handleAnswer(playerNum, isCorrect, btnElement) {
      if (playerNum === 1 && p1Answered) return;
      if (playerNum === 2 && p2Answered) return;
      
      if (playerNum === 1) p1Answered = true;
      if (playerNum === 2) p2Answered = true;
      
      const q = activeQuestions[currentIndex];
      const container = document.getElementById(`p${playerNum}-options`);
      const buttons = container.querySelectorAll('button');
      
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        const isThisBtnCorrect = q.options.find(o => o.text === btn.innerText).isCorrect;
        if (isThisBtnCorrect) {
          btn.classList.add('option-correct');
          btn.classList.remove('opacity-50');
        }
      });
      
      if (!isCorrect) {
        btnElement.classList.add('option-incorrect');
        btnElement.classList.remove('opacity-50');
      }

      playSoundEffect(isCorrect);
      if (isCorrect) {
        if (playerNum === 1) p1Score += 10;
        if (playerNum === 2) p2Score += 10;
        document.getElementById(`p${playerNum}-score`).innerText = `Score: ${eval('p'+playerNum+'Score')}`;
        speakPraise();
      }
      
      showFeedback(playerNum, isCorrect, q.explanation);
      checkTurnComplete(false);
    }

    function showFeedback(playerNum, isCorrect, expl, isTimeout = false) {
      const feedbackDiv = document.getElementById(`p${playerNum}-feedback`);
      feedbackDiv.classList.remove('hidden');
      
      let titleText = isCorrect ? "✅ Correct!" : "❌ Incorrect";
      if (isTimeout) titleText = "⏰ Time's Up!";
      
      let titleClass = isCorrect ? 'text-emerald-600' : 'text-red-600';
      if (isTimeout) titleClass = 'text-amber-600';
      
      document.getElementById(`p${playerNum}-feedback-title`).innerText = titleText;
      document.getElementById(`p${playerNum}-feedback-title`).className = `dynamic-feedback-title font-black mb-1 ${titleClass}`;
      document.getElementById(`p${playerNum}-feedback-exp`).innerText = expl;
    }

    function checkTurnComplete(fromTimeout) {
      if (p1Answered && p2Answered) {
        stopTimer();
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('next-placeholder').classList.add('hidden');
        
        // Competitive Auto-advance logic 
        if (playersMode === 2 && fromTimeout) {
          autoAdvanceTimeout = setTimeout(() => {
            if (!document.getElementById('next-btn').classList.contains('hidden')) {
              nextQuestion();
            }
          }, 2500); 
        }
      }
    }

    function startTimer() {
      timerActive = true;
      timerStartTime = performance.now();
      const bar = document.getElementById('timer-bar');
      bar.style.width = '100%';
      bar.className = 'timer-bar'; 
      
      function updateBar(currentTime) {
        if (!timerActive) return;
        const elapsed = (currentTime - timerStartTime) / 1000;
        const remaining = Math.max(0, timerDuration - elapsed);
        const percent = (remaining / timerDuration) * 100;
        
        bar.style.width = `${percent}%`;
        
        if (percent < 25) bar.className = 'timer-bar danger';
        else if (percent < 50) bar.className = 'timer-bar warning';
        
        if (remaining > 0) {
          timerRAF = requestAnimationFrame(updateBar);
        } else {
          timeOut();
        }
      }
      timerRAF = requestAnimationFrame(updateBar);
    }

    function stopTimer() {
      timerActive = false;
      if (timerRAF) cancelAnimationFrame(timerRAF);
    }

    function timeOut() {
      if (!p1Answered) simulateTimeOutAnswer(1);
      if (playersMode === 2 && !p2Answered) simulateTimeOutAnswer(2);
      checkTurnComplete(true);
    }
    
    function simulateTimeOutAnswer(playerNum) {
      if (playerNum === 1) p1Answered = true;
      if (playerNum === 2) p2Answered = true;
      
      const q = activeQuestions[currentIndex];
      const container = document.getElementById(`p${playerNum}-options`);
      const buttons = container.querySelectorAll('button');
      
      playSoundEffect(false); 

      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        const isThisBtnCorrect = q.options.find(o => o.text === btn.innerText).isCorrect;
        if (isThisBtnCorrect) {
          btn.classList.add('option-correct');
          btn.classList.remove('opacity-50');
        }
      });
      
      showFeedback(playerNum, false, q.explanation, true);
    }

    function nextQuestion() {
      clearTimeout(autoAdvanceTimeout);
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        renderQuestion();
      } else {
        endGame();
      }

      const totalPossible = activeQuestions.length * 10;
      
      let html = `
        <div class="bg-emerald-50 p-6 md:p-8 rounded-3xl border-4 border-emerald-200 w-full max-w-md mx-auto mb-6">
          <h3 class="text-3xl md:text-4xl font-black text-emerald-600 mb-2">Player 1</h3>
          <p class="text-6xl md:text-8xl font-black text-slate-800">${p1Score} <span class="text-3xl md:text-4xl text-slate-500 font-bold">/ ${totalPossible}</span></p>
        </div>
      `;
      
      if (playersMode === 2) {
        html += `
          <div class="bg-blue-50 p-6 md:p-8 rounded-3xl border-4 border-blue-200 w-full max-w-md mx-auto">
            <h3 class="text-3xl md:text-4xl font-black text-blue-600 mb-2">Player 2</h3>
            <p class="text-6xl md:text-8xl font-black text-slate-800">${p2Score} <span class="text-3xl md:text-4xl text-slate-500 font-bold">/ ${totalPossible}</span></p>
          </div>
        `;
        
        const winnerText = document.getElementById('winner-text');
        if (p1Score > p2Score) {
          winnerText.innerText = "🏆 Player 1 Takes The Crown!";
          winnerText.className = "text-4xl md:text-6xl font-black text-emerald-500 mb-10";
        } else if (p2Score > p1Score) {
          winnerText.innerText = "🏆 Player 2 Takes The Crown!";
          winnerText.className = "text-4xl md:text-6xl font-black text-blue-500 mb-10";
        } else {
          winnerText.innerText = "🤝 It's a Legendary Tie!";
          winnerText.className = "text-4xl md:text-6xl font-black text-slate-600 mb-10";
        }
      } else {
        document.getElementById('winner-text').innerText = "Exceptional Effort!";
        document.getElementById('winner-text').className = "text-5xl md:text-6xl font-black text-emerald-500 mb-10";
      }
      
      document.getElementById('final-scores').innerHTML = html;
    }
    
    // Initialize default mode visually
    setMode(1);
  </script>
</body>
</html>
