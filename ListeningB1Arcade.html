<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Mitchell's B1 Listening Test Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            background-color: #f3f4f6;
        }
        .card {
            background-color: white;
            border-radius: 1rem;
            padding: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 0.5rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary {
            background-color: #4f46e5;
            color: white;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
        }
        .btn-primary:hover {
            background-color: #4338ca;
        }
        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
            border-color: #d1d5db;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #d1d5db;
        }
        .btn-test {
            background-color: #ffffff;
            color: #4f46e5;
            border: 2px solid #e0e7ff;
            padding: 1rem;
            font-size: 1rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .btn-test:hover {
            background-color: #e0e7ff;
            border-color: #c7d2fe;
            transform: translateY(-2px);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none !important;
        }
        .option-btn {
            flex: 1;
            background-color: white;
            color: #374151;
            border: 1px solid #d1d5db;
            min-height: 2.5rem;
            padding: 0.25rem;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        .option-btn.selected {
            background-color: #6366f1;
            color: white;
            border-color: #4f46e5;
        }
        .option-btn.correct {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #059669 !important;
            animation: pop 0.3s ease;
        }
        .option-btn.incorrect {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #speaker-icon path {
            transition: fill 0.3s ease;
        }
        .speaking #speaker-icon {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-1 sm:p-2 bg-[#f3f4f6]">

    <div id="app-container" class="w-full max-w-[98%] sm:max-w-[95%] xl:max-w-7xl mx-auto">
        <!-- Start Screen -->
        <div id="start-screen" class="card text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Joel Mitchell's B1 Listening</h1>
            <p id="total-tests-display" class="text-gray-500 mb-6 text-sm md:text-base">Select a test module below to begin. Each test has 50 questions.</p>
            
            <div class="mb-6 w-full max-w-md mx-auto">
                <label for="player-name-input" class="block text-gray-700 text-lg mb-2 font-medium">Enter your name:</label>
                <input type="text" id="player-name-input" class="w-full p-3 border border-gray-300 rounded-lg text-center text-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-inner" placeholder="Your Name">
                <p id="name-error" class="text-red-500 text-sm mt-2 h-4"></p>
            </div>

            <div class="mt-8 border-t border-gray-100 pt-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Choose a Test</h2>
                <div id="test-selection-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4">
                    <!-- Test buttons generated dynamically via JS -->
                </div>
            </div>
        </div>

        <div id="game-screen" class="card hidden">
            <!-- Consolidated Header -->
            <div class="flex flex-row justify-between items-center bg-gray-50 p-2 rounded-xl mb-2 gap-2 border border-gray-100 shadow-sm sticky top-0 z-10">
                <button id="back-to-menu-btn" class="btn btn-secondary text-sm px-2 py-2 sm:px-3 whitespace-nowrap">
                    &larr; Menu
                </button>
                <div class="font-bold text-gray-800 text-base sm:text-lg truncate flex-1 text-center" id="current-test-title">Test Name</div>
                <div class="flex flex-row items-center gap-2 sm:gap-3">
                    <div id="score" class="text-base sm:text-lg font-bold text-indigo-600 whitespace-nowrap">Score: 0</div>
                    <div class="text-sm text-gray-500 font-medium hidden md:block whitespace-nowrap">Player: <span id="player-display" class="text-gray-700"></span></div>
                    <button id="play-audio-btn" class="btn btn-secondary text-sm px-2 py-2 sm:px-3 flex items-center bg-white shadow-sm border-gray-200 whitespace-nowrap">
                        <svg id="speaker-icon" class="w-5 h-5 sm:mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
                        </svg>
                        <span id="play-audio-text" class="hidden sm:inline">Audio</span>
                    </button>
                    <button id="next-group-btn" class="btn btn-primary text-sm px-3 py-2 sm:px-4 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap" disabled>
                        Next &rarr;
                    </button>
                </div>
            </div>

            <div class="mb-1">
                <div id="questions-container" class="space-y-1">
                    <!-- Questions for the group dynamically inserted here -->
                </div>
            </div>
        </div>

        <div id="end-screen" class="card text-center hidden">
            <div class="py-8">
                <svg class="w-20 h-20 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <h1 class="text-4xl font-bold text-gray-800 mb-4">Test Complete!</h1>
                <p id="final-score" class="text-gray-600 mb-8 text-2xl font-medium"></p>
                <button id="restart-btn" class="btn btn-primary text-xl px-12 py-4 shadow-lg">Return to Menu</button>
            </div>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const testGrid = document.getElementById('test-selection-grid');
        const playerNameInput = document.getElementById('player-name-input');
        const nameErrorEl = document.getElementById('name-error');
        const playerDisplayEl = document.getElementById('player-display');
        const currentTestTitleEl = document.getElementById('current-test-title');
        const playAudioBtn = document.getElementById('play-audio-btn');
        const playAudioText = document.getElementById('play-audio-text');
        const scoreEl = document.getElementById('score');
        const questionsContainer = document.getElementById('questions-container');
        const nextGroupBtn = document.getElementById('next-group-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const totalTestsDisplayEl = document.getElementById('total-tests-display');

        let correctSynth, incorrectSynth;
        let availableVoices = [];
        let isAudioReady = false;

        let score = 0;
        let currentGroupIndex = 0;
        let activeTestGroups = [];
        let playerName = '';
        let speechKeepAliveInterval;
        let globalQuestionCounter = 1;
        let questionsAnsweredInGroup = 0;
        let isMainUtteranceSpeaking = false;

        const allTestsData = {
            "Test 1": [
                { audioscript: "I'm going to mend and paint the cupboard in the bedroom today. I need to ask my daughter to go to the shop and get me a new hammer; this one’s broken. But first, I need to ask my husband what he’s done with the paintbrush. I’ve looked everywhere for it. I checked the garage, but all I could find was this knife which I lost months ago!", questions: [{ question: "What is the speaker's main project for the day?", options: ["Mending a knife", "Painting the garage", "Fixing a cupboard"], answer: "Fixing a cupboard" },{ question: "What is wrong with the hammer?", options: ["It is lost", "It is broken", "It is in the garage"], answer: "It is broken" },{ question: "Who will be asked to go to the shop?", options: ["Her husband", "Her daughter", "No one"], answer: "Her daughter" },{ question: "What is the main item the speaker needs to find?", options: ["A knife", "A hammer", "A paintbrush"], answer: "A paintbrush" },{ question: "What did the speaker find in the garage?", options: ["The paintbrush", "The hammer", "A lost knife"], answer: "A lost knife" }]},
                { audioscript: "And now for those of you planning to go to the rock festival tomorrow, you’ll want to know what the weather’s going to be like. As we go through today, the heavy rain will gradually disappear by the end of the afternoon. Tomorrow we can expect some sunshine with just a few light showers, and then some very hot and dry weather is likely by the weekend.", questions: [{ question: "This weather forecast is for people planning to do what?", options: ["Go to the beach", "Go to a festival", "Stay indoors"], answer: "Go to a festival" },{ question: "What will happen to the heavy rain today?", options: ["It will get heavier", "It will continue all day", "It will disappear by the afternoon"], answer: "It will disappear by the afternoon" },{ question: "What is the weather forecast for tomorrow?", options: ["Heavy rain", "Hot and dry", "Sunshine with light showers"], answer: "Sunshine with light showers" },{ question: "What kind of weather is likely by the weekend?", options: ["Cold and wet", "Hot and dry", "Cloudy and windy"], answer: "Hot and dry" },{ question: "What event is happening tomorrow?", options: ["A food festival", "A rock festival", "A country fair"], answer: "A rock festival" }]},
                { audioscript: "I got most of the shopping that was asked for. I bought the last of the bread and some orange juice, but unfortunately, there weren’t any newspapers left. I'll have to remember to go in the morning for that. Oh, I also forgot the tomatoes for the salad. I'll have to go back for them later, or maybe someone else can pick them up.", questions: [{ question: "What items did the speaker successfully buy?", options: ["Bread and orange juice", "Newspaper and tomatoes", "Bread and tomatoes"], answer: "Bread and orange juice" },{ question: "What was unavailable at the shop?", options: ["Bread", "Orange juice", "Newspapers"], answer: "Newspapers" },{ question: "Why does the speaker need to remember to go shopping in the morning?", options: ["To buy tomatoes", "To get a newspaper", "To get bread"], answer: "To get a newspaper" },{ question: "What did the speaker forget to buy?", options: ["Bread", "Newspaper", "Tomatoes"], answer: "Tomatoes" },{ question: "For what meal were the tomatoes needed?", options: ["A sandwich", "A soup", "A salad"], answer: "A salad" }]},
                { audioscript: "I've finally got Mum’s birthday present. I think she’ll like it. It's the gold-coloured one. She’s always writing letters, so she’ll find it very useful. I had thought about a CD, but I’m never really sure what music she likes. Besides, Dad has already bought her a new pair of earrings for her birthday. I'm sure she’ll like what I got her.", questions: [{ question: "What present did the speaker buy for her mother?", options: ["A CD", "A pair of earrings", "A gold-coloured pen"], answer: "A gold-coloured pen" },{ question: "What color is the present the speaker bought?", options: ["Silver", "Gold", "Black"], answer: "Gold" },{ question: "Why will the mother find the present useful?", options: ["She likes gold things", "She is always writing letters", "She likes music"], answer: "She is always writing letters" },{ question: "Why did the speaker not buy a CD for her mother?", options: ["They were sold out", "She doesn't know her mother's music taste", "Her mother doesn't like music"], answer: "She doesn't know her mother's music taste" },{ question: "Who bought the mother earrings?", options: ["The speaker", "Her Dad", "Her sister"], answer: "Her Dad" }]},
                { audioscript: "My mum decided to take me to an indoor climbing centre. She got the idea after she went with a friend and loved it. I had missed the school trip there last year because I was sick. At first, I was really looking forward to it because I like climbing, but then I was a bit disappointed when I heard the wall was inside, as I prefer being outdoors. When we got there, it was quiet, but it got busy later with people of all ages, which was cool. The wall itself didn't seem too high, and it had helpful foot holes - green for easy, red for difficult. My first climb was tough; I was the last to the top, which was annoying. But I learned to think more carefully before I move, and it showed me I'm fitter than my friends who are always on their computers.", questions: [{ question: "Why did the speaker's mum suggest going to the climbing centre?", options: ["The school recommended it", "She had been and loved it", "The speaker asked to go"], answer: "She had been and loved it" },{ question: "Why did the speaker miss the school trip?", options: ["He was on holiday", "He was sick", "He was not interested"], answer: "He was sick" },{ question: "How did the speaker feel about the climbing wall being indoors?", options: ["Excited", "Nervous", "Disappointed"], answer: "Disappointed" },{ question: "What color were the foot holes for a more difficult climb?", options: ["Green", "Red", "Blue"], answer: "Red" },{ question: "What did the speaker learn from the experience?", options: ["That he is not very fit", "To think carefully before acting", "That indoor climbing is boring"], answer: "To think carefully before acting" }]},
                { audioscript: "My name’s Hannah. I come from a family that trains horses, and we have a champion horse called Griffon. He is black with an incredibly shiny coat. He was born two years ago, in December, and we’re taking him to compete in his first international show in March next year, just after my fifteenth birthday. The whole family is going. We live in Poland and we’re going to drive to the show in England. The person riding the horse has to be over 18, so my father will do it. He’s won dozens of cups, but at an event a couple of weeks ago, he got some money as a prize. My dream is to be a trainer too. When Griffon wins, we give him apples as a treat.", questions: [{ question: "What is the name of the champion horse?", options: ["Shadow", "Griffon", "Black Beauty"], answer: "Griffon" },{ question: "When is the international horse show?", options: ["December", "March", "Next week"], answer: "March" },{ question: "Where does Hannah's family live?", options: ["England", "Germany", "Poland"], answer: "Poland" },{ question: "Who will ride the horse in the show?", options: ["Hannah", "Her sister", "Her father"], answer: "Her father" },{ question: "What treat is the horse given when he wins?", options: ["Sweets", "Carrots", "Apples"], answer: "Apples" }]},
                { audioscript: "I wonder if that basketball match has finished yet. I really want to watch the wildlife programme at nine o’clock. Oh, wait, it seems the wildlife show is cancelled. Everything’s running late because a rock concert finished later than expected. The concert was supposed to end at 8, but it went on for an extra hour. I guess I'll just sit down and watch this basketball match. It looks really exciting, probably more interesting than looking at animals anyway. The final score is really close.", questions: [{ question: "What program was originally planned?", options: ["A movie", "A wildlife programme", "A news report"], answer: "A wildlife programme" },{ question: "Why is the TV schedule delayed?", options: ["A rock concert ran late", "The basketball match started early", "There was a technical problem"], answer: "A rock concert ran late" },{ question: "How long was the rock concert delayed?", options: ["30 minutes", "One hour", "Two hours"], answer: "One hour" },{ question: "What program will the speaker watch now?", options: ["The wildlife programme", "The basketball match", "The rock concert"], answer: "The basketball match" },{ question: "How does the speaker describe the basketball match?", options: ["Boring and long", "Exciting and close", "Loud and chaotic"], answer: "Exciting and close" }]},
                { audioscript: "I just got a call from my friend Judy asking to play tennis after school around 4:30. That would have been fun, but I have a swimming lesson. It’s usually at a quarter past five, but it’s half an hour earlier this evening, so it's at a quarter to five. It takes me ages to cycle to the swimming pool, so I really don’t think I’ll have time today. I need to leave right now to make it. I'll have to suggest we try tomorrow instead. Maybe we can play on the weekend.", questions: [{ question: "What activity did the speaker's friend suggest?", options: ["Swimming", "Cycling", "Tennis"], answer: "Tennis" },{ question: "What is the new time for the swimming lesson?", options: ["4:30", "4:45", "5:15"], answer: "4:45" },{ question: "By how much was the swimming lesson moved?", options: ["15 minutes", "30 minutes", "1 hour"], answer: "30 minutes" },{ question: "Why can't the speaker play tennis today?", options: ["She has to cycle a long way to her lesson", "She doesn't want to play with Judy", "She forgot her tennis racket"], answer: "She has to cycle a long way to her lesson" },{ question: "When does the speaker suggest they could play tennis?", options: ["Later this evening", "Never", "Tomorrow or the weekend"], answer: "Tomorrow or the weekend" }]},
                { audioscript: "I share a room with my older brother, Max. It's pretty good because he lets me use his stuff, like his laptop and music player, even though my parents think I'm too young. He's going to university soon, and the room will feel really empty. On the bright side, I'll finally be able to do my homework in peace. It's hard to concentrate at the moment because he's often in the room, listening to music or talking to friends. Still, it's great having him to talk to about my problems. I don't think we'd be as close if we didn't share a room.", questions: [{ question: "What items does the speaker borrow from his brother?", options: ["Clothes and shoes", "Books and games", "Laptop and music player"], answer: "Laptop and music player" },{ question: "What is happening to the speaker's brother soon?", options: ["He is getting a job", "He is moving out", "He is going to university"], answer: "He is going to university" },{ question: "What is a positive aspect of his brother going to university?", options: ["He will get the whole room", "He can do his homework in peace", "He can use his brother's things more"], answer: "He can do his homework in peace" },{ question: "What is a negative aspect of sharing a room for the speaker?", options: ["His brother is messy", "It's hard to concentrate on homework", "They argue a lot"], answer: "It's hard to concentrate on homework" },{ question: "What does the speaker believe is the reason for his close relationship with his brother?", options: ["They have similar hobbies", "Their parents make them spend time together", "They share a room"], answer: "They share a room" }]},
                { audioscript: "I really like the new IT teacher – our project for this term is to design a new website. I’ve always wanted to know how to do that. The sports teacher is much more serious, but that’s still my favourite subject, especially when we play football. Last year I used to really like geography, but the teacher we have now gives us so much homework, it's hard to keep up. I think I'm falling behind in that class.", questions: [{ question: "What is the speaker's opinion of the new IT teacher?", options: ["He is too serious", "He gives too much homework", "The speaker likes him"], answer: "The speaker likes him" },{ question: "What is the speaker's favorite subject?", options: ["IT", "Sport", "Geography"], answer: "Sport" },{ question: "What does the speaker particularly enjoy about their favorite subject?", options: ["Running", "Playing football", "The teacher's attitude"], answer: "Playing football" },{ question: "Why is the speaker struggling with geography?", options: ["The teacher is boring", "The subject is difficult", "There is too much homework"], answer: "There is too much homework" },{ question: "What is the speaker's concern about their geography class?", options: ["Failing the exam", "Falling behind", "Getting a bad grade on the project"], answer: "Falling behind" }]}
            ],
            "Test 2": [
                { audioscript: "Last summer, I decided to take up a new hobby: photography. I bought a second-hand camera from a local shop because new ones were too expensive. My first few pictures were terrible, mostly blurry photos of my cat. I almost gave up, but then I watched some online tutorials. I learned about light and composition. Now, my favorite thing to photograph is nature, especially sunsets. I hope to sell some of my prints at a local art fair next month.", questions: [{ question: "Why did the speaker buy a second-hand camera?", options: ["It was better", "It was a gift", "It was cheaper"], answer: "It was cheaper" },{ question: "What were the speaker's first photos of?", options: ["Sunsets", "His cat", "Flowers"], answer: "His cat" },{ question: "How did the speaker improve their photography skills?", options: ["Took a class", "Read a book", "Watched tutorials"], answer: "Watched tutorials" },{ question: "What is the speaker's favorite subject to photograph now?", options: ["People", "Buildings", "Nature"], answer: "Nature" },{ question: "What does the speaker hope to do next month?", options: ["Buy a new camera", "Sell prints", "Travel"], answer: "Sell prints" }]},
                { audioscript: "I work as a tour guide in a big city, which is a really interesting job. I start my day at 9 AM at the main city square. The morning tour is usually the busiest, with up to thirty people. We visit historical buildings and museums. The most common question I get is about the best place to eat lunch. I always recommend a small Italian restaurant near the river. The job can be tiring because I walk about 15 kilometers every day, but meeting people from all over the world makes it worth it.", questions: [{ question: "What time does the speaker's workday begin?", options: ["8 AM", "9 AM", "10 AM"], answer: "9 AM" },{ question: "Which tour is typically the busiest?", options: ["Morning", "Afternoon", "Evening"], answer: "Morning" },{ question: "What is the most common question the speaker is asked?", options: ["Where the toilets are", "Where to eat lunch", "How old the city is"], answer: "Where to eat lunch" },{ question: "What is a challenging part of the job?", options: ["Answering questions", "Walking a lot", "Dealing with tourists"], answer: "Walking a lot" },{ question: "What makes the job worthwhile for the speaker?", options: ["The good pay", "The free lunches", "Meeting new people"], answer: "Meeting new people" }]},
                { audioscript: "I've been trying to learn Spanish for about a year now. I use a language app on my phone for about 20 minutes every day, usually during my commute to work. My biggest challenge is the grammar; it's very different from English. Speaking is also difficult, I get nervous. To practice, I joined a language exchange group that meets every Thursday at a local library. I talk with native speakers, which helps a lot. Next year, I'm planning a trip to Spain to really test my skills.", questions: [{ question: "How long has the speaker been learning Spanish?", options: ["Six months", "One year", "Two years"], answer: "One year" },{ question: "When does the speaker usually practice with the app?", options: ["In the morning", "During his commute", "Before bed"], answer: "During his commute" },{ question: "What does the speaker find most difficult?", options: ["Vocabulary", "Pronunciation", "Grammar"], answer: "Grammar" },{ question: "Where does the language exchange group meet?", options: ["A cafe", "A park", "A library"], answer: "A library" },{ question: "What is the speaker's goal for next year?", options: ["To visit Spain", "To become fluent", "To teach Spanish"], answer: "To visit Spain" }]},
                { audioscript: "I'm training for my first marathon. The race is in three months, so I have a strict training schedule. I run four times a week. On Tuesdays and Thursdays, I do short, fast runs. On Saturdays, I do a very long run, which gets longer each week. My longest run so far has been 20 kilometers. My diet has also changed. I've had to give up fast food, which is hard, but I'm eating more fruit and vegetables. My main goal isn't to win, but just to finish the race.", questions: [{ question: "When is the marathon?", options: ["Next month", "In three months", "In six months"], answer: "In three months" },{ question: "How many times a week does the speaker run?", options: ["Three times", "Four times", "Five times"], answer: "Four times" },{ question: "What kind of run does the speaker do on Saturdays?", options: ["A short run", "A fast run", "A long run"], answer: "A long run" },{ question: "What has the speaker stopped eating?", options: ["Fruit", "Vegetables", "Fast food"], answer: "Fast food" },{ question: "What is the speaker's main goal for the marathon?", options: ["To win", "To set a record", "To finish"], answer: "To finish" }]},
                { audioscript: "I recently moved into a new apartment. It's on the fourth floor, and unfortunately, there's no elevator, which makes moving furniture very difficult. The best feature is the large balcony, which gets a lot of sun in the afternoon. I've put some plants and a small table out there. The kitchen is quite small, so I had to buy a smaller fridge. My neighbours seem friendly; the person next door brought me a cake to welcome me. I'm still unpacking boxes, but it already feels like home.", questions: [{ question: "What is a major difficulty with the new apartment?", options: ["It is too small", "It has no elevator", "It is very noisy"], answer: "It has no elevator" },{ question: "What is the best feature of the apartment?", options: ["The kitchen", "The balcony", "The bedroom"], answer: "The balcony" },{ question: "When does the balcony get a lot of sun?", options: ["In the morning", "At midday", "In the afternoon"], answer: "In the afternoon" },{ question: "Why did the speaker have to buy a smaller fridge?", options: ["The old one broke", "The kitchen is small", "He wanted a new one"], answer: "The kitchen is small" },{ question: "How did the neighbour welcome the speaker?", options: ["Said hello", "Gave him a plant", "Brought him a cake"], answer: "Brought him a cake" }]},
                { audioscript: "This weekend, I'm going camping with some friends by a lake about two hours' drive from the city. We need to leave early on Saturday to avoid the traffic. I'm in charge of bringing the tent, which I borrowed from my brother. My friend Sarah is bringing all the food, and David is responsible for the cooking equipment. The weather forecast said it might rain on Sunday afternoon, so I've packed my waterproof jacket. The main thing I'm looking forward to is swimming in the lake.", questions: [{ question: "Where is the speaker going camping?", options: ["In the mountains", "By a lake", "In a forest"], answer: "By a lake" },{ question: "Who is bringing the tent?", options: ["Sarah", "David", "The speaker"], answer: "The speaker" },{ question: "Who is responsible for the food?", options: ["Sarah", "David", "The speaker"], answer: "Sarah" },{ question: "What does the weather forecast predict for Sunday?", options: ["Sunshine", "Strong winds", "Possible rain"], answer: "Possible rain" },{ question: "What is the speaker most excited about?", options: ["Hiking", "Cooking", "Swimming"], answer: "Swimming" }]},
                { audioscript: "I work at a local radio station as a sound engineer. It's a night job, so my shift starts at 10 PM and finishes at 6 AM. The hardest part was getting used to sleeping during the day. I'm responsible for making sure all the music and advertisements sound clear. Sometimes, we have live interviews with musicians, which is exciting but can be stressful if there are technical problems. Last week, the main computer crashed just before a big interview, but I managed to fix it with only seconds to spare. I enjoy the job because I love music.", questions: [{ question: "What is the speaker's job?", options: ["Radio presenter", "Musician", "Sound engineer"], answer: "Sound engineer" },{ question: "When does the speaker's shift end?", options: ["10 PM", "12 AM", "6 AM"], answer: "6 AM" },{ question: "What was the most difficult part of the job to get used to?", options: ["The long hours", "Sleeping during the day", "The technical work"], answer: "Sleeping during the day" },{ question: "What happened before a big interview last week?", options: ["The musician was late", "The computer crashed", "The microphone broke"], answer: "The computer crashed" },{ question: "Why does the speaker enjoy the job?", options: ["It pays well", "It is easy", "He loves music"], answer: "He loves music" }]},
                { audioscript: "I've decided to volunteer at an animal shelter on weekends. I started last month. My main duty is to walk the dogs in the morning. There are about twenty dogs, so it takes a few hours. In the afternoon, I help clean the cat enclosures. It's not a fun job, but it's important. The best part is seeing an animal get adopted and go to a new home. Last Saturday, a family adopted a small dog that had been at the shelter for almost a year. It was a very happy moment.", questions: [{ question: "When does the speaker volunteer?", options: ["On weekdays", "On weekends", "Every day"], answer: "On weekends" },{ question: "What is the speaker's main duty in the morning?", options: ["Feeding the cats", "Walking the dogs", "Cleaning cages"], answer: "Walking the dogs" },{ question: "What does the speaker do in the afternoon?", options: ["Play with puppies", "Clean cat enclosures", "Answer phone calls"], answer: "Clean cat enclosures" },{ question: "What does the speaker describe as the best part of volunteering?", options: ["Walking the dogs", "Seeing an animal get adopted", "Playing with the cats"], answer: "Seeing an animal get adopted" },{ question: "How long had the adopted dog been at the shelter?", options: ["A few weeks", "Six months", "Almost a year"], answer: "Almost a year" }]},
                { audioscript: "My family is planning a big holiday for next year. We've decided to visit Japan. My sister is most excited about seeing the temples in Kyoto. I want to visit the technology district in Tokyo. My parents are interested in trying all the different kinds of food. We have to save a lot of money because it's an expensive trip. I've taken on an extra shift at my part-time job to help pay for my flight ticket. We are all learning a few basic phrases in Japanese so we can be polite.", questions: [{ question: "Where is the family planning to go for their holiday?", options: ["China", "Japan", "South Korea"], answer: "Japan" },{ question: "What is the speaker's sister most excited to see?", options: ["The food", "The technology", "The temples"], answer: "The temples" },{ question: "What is the speaker personally most interested in?", options: ["The food", "The technology", "The temples"], answer: "The technology" },{ question: "How is the speaker helping to pay for the trip?", options: ["By selling things", "By working extra hours", "By asking for money"], answer: "By working extra hours" },{ question: "What is the family doing to prepare for the trip?", options: ["Packing their bags", "Learning Japanese phrases", "Booking hotels"], answer: "Learning Japanese phrases" }]},
                { audioscript: "I'm redecorating my living room. The first thing I did was paint the walls a light grey colour, which made the room feel much bigger. This weekend, I'm going to assemble a new bookshelf I bought online. It came in a flat box with hundreds of pieces, so I think it will be a challenge. After that, I need to buy a new rug. I'm looking for something with a geometric pattern. The final touch will be to hang some pictures on the wall. I'm hoping to have it all finished by the end of the month.", questions: [{ question: "What was the first thing the speaker did to redecorate?", options: ["Bought a rug", "Assembled a bookshelf", "Painted the walls"], answer: "Painted the walls" },{ question: "How did the new paint colour change the room?", options: ["Made it feel smaller", "Made it feel bigger", "Made it feel darker"], answer: "Made it feel bigger" },{ question: "What is the speaker's task for this weekend?", options: ["Buy a rug", "Assemble a bookshelf", "Hang pictures"], answer: "Assemble a bookshelf" },{ question: "What kind of pattern is the speaker looking for in a rug?", options: ["Floral", "Striped", "Geometric"], answer: "Geometric" },{ question: "When does the speaker hope to finish the project?", options: ["Next week", "By the end of the month", "Next year"], answer: "By the end of the month" }]}

                { audioscript: "I've started a small vegetable garden in my backyard this year. It's my first time, so I'm learning a lot. I planted tomatoes, cucumbers, and lettuce. The most difficult part has been dealing with pests, especially the rabbits that eat my lettuce. I built a small fence around the garden, which seems to have helped. The best part is harvesting fresh vegetables for my salads. Next year, I plan to add some herbs like basil and mint.", questions: [{ question: "What is the speaker's new project?", options: ["Building a fence", "Starting a garden", "Making salads"], answer: "Starting a garden" },{ question: "What has been the most difficult part of this project?", options: ["Watering plants", "Dealing with pests", "Planting seeds"], answer: "Dealing with pests" },{ question: "How did the speaker solve the problem with rabbits?", options: ["Used a spray", "Built a fence", "Got a dog"], answer: "Built a fence" },{ question: "What does the speaker enjoy most about the garden?", options: ["The fresh vegetables", "The hard work", "The quiet time"], answer: "The fresh vegetables" },{ question: "What does the speaker plan to add next year?", options: ["More tomatoes", "Flowers", "Herbs"], answer: "Herbs" }]},
                { audioscript: "I'm a librarian at the city's public library. My main responsibility is helping people find the books theyre looking for. I also run the weekly story time for children on Wednesday mornings. That's my favorite part of the job. The library is currently preparing for its annual book sale, which will happen in two weeks. We have thousands of used books to organize. All the money from the sale will be used to buy new computers for the public to use. It's a lot of work, but for a good cause.", questions: [{ question: "What is the speaker's main role at the library?", options: ["Organizing sales", "Cleaning", "Helping people find books"], answer: "Helping people find books" },{ question: "What is the speaker's favorite part of the job?", options: ["The book sale", "Story time", "Organizing books"], answer: "Story time" },{ question: "When is the annual book sale?", options: ["Next week", "In two weeks", "Next month"], answer: "In two weeks" },{ question: "What will the money from the sale be used for?", options: ["New books", "New computers", "Staff salaries"], answer: "New computers" },{ question: "What event happens on Wednesday mornings?", options: ["A book club", "A computer class", "Children's story time"], answer: "Children's story time" }]},
                { audioscript: "I've recently taken up cycling as a way to get more exercise. I bought my bike from a friend who was moving away. I try to cycle to work three days a week, which is a 10-kilometer trip each way. The biggest challenge is the big hill just before I get to my office. On weekends, I prefer cycling on the path along the river, which is flat and has beautiful scenery. I'm thinking of joining a cycling club to meet other people who enjoy it and maybe do some longer rides.", questions: [{ question: "How did the speaker get their bike?", options: ["Bought it new", "From a friend", "Rented it"], answer: "From a friend" },{ question: "How often does the speaker cycle to work?", options: ["Every day", "Three days a week", "On weekends"], answer: "Three days a week" },{ question: "What is the most difficult part of the commute?", options: ["The distance", "The traffic", "A big hill"], answer: "A big hill" },{ question: "Where does the speaker prefer to cycle on weekends?", options: ["In the city", "In the mountains", "Along the river"], answer: "Along the river" },{ question: "Why is the speaker considering joining a club?", options: ["To get a new bike", "To race", "To meet other cyclists"], answer: "To meet other cyclists" }]},
                { audioscript: "I'm taking a pottery class at the local community center. The class is every Tuesday evening for two hours. We are learning how to use the potter's wheel to make bowls and mugs. It's much harder than it looks; my first few attempts were complete failures. The instructor is very patient and helpful. Last week, I finally made a small bowl that I was happy with. The next step is to glaze it, which means adding color. I've chosen a dark blue glaze. I find the class very relaxing after a long day at work.", questions: [{ question: "Where is the speaker taking the class?", options: ["At a university", "Online", "At a community center"], answer: "At a community center" },{ question: "What are the students learning to make?", options: ["Plates and cups", "Bowls and mugs", "Vases and pots"], answer: "Bowls and mugs" },{ question: "How does the speaker describe their first attempts?", options: ["Very successful", "Easy", "Complete failures"], answer: "Complete failures" },{ question: "What is the next step after making a bowl?", options: ["Selling it", "Glazing it", "Breaking it"], answer: "Glazing it" },{ question: "How does the speaker feel about the class?", options: ["It is stressful", "It is boring", "It is relaxing"], answer: "It is relaxing" }]},
                { audioscript: "I'm planning a surprise birthday party for my best friend, Mark. His birthday is on the 20th of this month, but the party will be on the Saturday after, which is the 22nd. I've invited about 25 people. I'm going to decorate my apartment with balloons and banners. I've asked our friend Chloe to bake the cake because she's an amazing baker. My only worry is keeping it a secret from Mark. He's very clever, so I have to be careful what I say around him.", questions: [{ question: "Who is the party for?", options: ["The speaker", "Chloe", "Mark"], answer: "Mark" },{ question: "When is the party?", options: ["On the 20th", "On a Saturday", "On a Friday"], answer: "On a Saturday" },{ question: "How many people have been invited?", options: ["About 20", "About 25", "About 30"], answer: "About 25" },{ question: "Who is in charge of the cake?", options: ["The speaker", "A bakery", "Chloe"], answer: "Chloe" },{ question: "What is the speaker's main concern?", options: ["The decorations", "The food", "Keeping it a secret"], answer: "Keeping it a secret" }]},
                { audioscript: "I've started a blog about classic films. I try to post a new review every Friday. I watch the film on a Monday, take notes, and then spend a couple of evenings writing the review. My most popular post so far was a review of a black-and-white film from the 1940s. I was surprised so many people were interested. I get a lot of comments from readers, which I really enjoy. Some of them suggest films for me to review next. It's a great way to connect with other film lovers.", questions: [{ question: "What is the speaker's blog about?", options: ["New movies", "Classic films", "TV shows"], answer: "Classic films" },{ question: "When does the speaker post new reviews?", options: ["Every Monday", "Every Friday", "Every day"], answer: "Every Friday" },{ question: "Which post has been the most popular?", options: ["A modern film", "A silent film", "A black-and-white film"], answer: "A black-and-white film" },{ question: "What does the speaker enjoy about blogging?", options: ["Making money", "Getting free films", "Reader comments"], answer: "Reader comments" },{ question: "How does the speaker get ideas for new reviews?", options: ["From a list", "From reader suggestions", "From magazines"], answer: "From reader suggestions" }]},
                { audioscript: "I'm trying to reduce the amount of plastic I use. My first step was to buy a reusable water bottle and a coffee cup. It was an easy change to make. The next, more difficult step, was at the supermarket. I now buy loose fruit and vegetables instead of the ones in plastic packaging. I also take my own cloth bags. It takes a bit more planning before I go shopping. My goal for next month is to try making my own cleaning products to avoid buying more plastic bottles.", questions: [{ question: "What is the speaker trying to do?", options: ["Save money", "Eat healthier", "Use less plastic"], answer: "Use less plastic" },{ question: "What was the first step the speaker took?", options: ["Buying loose fruit", "Using cloth bags", "Buying reusable cups"], answer: "Buying reusable cups" },{ question: "What change did the speaker make at the supermarket?", options: ["Buying organic food", "Buying loose vegetables", "Shopping less often"], answer: "Buying loose vegetables" },{ question: "What does this new approach to shopping require?", options: ["More money", "More time", "More planning"], answer: "More planning" },{ question: "What is the speaker's goal for next month?", options: ["To make cleaning products", "To avoid supermarkets", "To grow their own food"], answer: "To make cleaning products" }]},
                { audioscript: "I collect old postcards. I have over 500 now. I started when I found a box of my grandfather's old postcards in the attic. My oldest postcard is from 1905. It shows the main street of my town, but it looks very different. I find them at antique shops and online auctions. My favorite postcards are the ones with handwritten messages on the back. It's like reading a small piece of history. I keep them all in special albums to protect them.", questions: [{ question: "What does the speaker collect?", options: ["Stamps", "Coins", "Old postcards"], answer: "Old postcards" },{ question: "How did the collection start?", options: ["He bought one", "He found a box", "It was a gift"], answer: "He found a box" },{ question: "What does the oldest postcard show?", options: ["A person", "A ship", "The main street"], answer: "The main street" },{ question: "What is the speaker's favorite thing about the postcards?", options: ["The pictures", "The stamps", "The messages"], answer: "The messages" },{ question: "How does the speaker store the collection?", options: ["In a box", "In albums", "In frames"], answer: "In albums" }]},
                { audioscript: "I'm learning to play the guitar. I have a lesson every week with a teacher named Sarah. She's very talented. The hardest part for me is changing between the chords quickly enough. My fingers just don't seem to move that fast. I practice for half an hour every day after I finish my homework. I've learned to play a few simple songs. My goal is to be able to play and sing my favorite song at the family barbecue this summer. I think they will be very surprised.", questions: [{ question: "What instrument is the speaker learning?", options: ["Piano", "Violin", "Guitar"], answer: "Guitar" },{ question: "What does the speaker find most difficult?", options: ["Reading music", "Changing chords", "Strumming"], answer: "Changing chords" },{ question: "How often does the speaker practice?", options: ["Once a week", "For an hour a day", "For half an hour a day"], answer: "For half an hour a day" },{ question: "What is the speaker's main goal?", options: ["To join a band", "To write a song", "To play at a barbecue"], answer: "To play at a barbecue" },{ question: "Who is the speaker's teacher?", options: ["Mark", "Sarah", "David"], answer: "Sarah" }]},
                { audioscript: "I've just finished a course in web design. It was a six-month online course. The final project was to build a complete website for a fictional business. I created a site for a local bakery. The most challenging part was writing the code to make it work on mobile phones, which is called responsive design. I'm really proud of the final result. Now, I'm building a portfolio of my work, and I've already applied for a junior web designer job at a small technology company downtown.", questions: [{ question: "What kind of course did the speaker finish?", options: ["Graphic design", "Web design", "Marketing"], answer: "Web design" },{ question: "What was the final project?", options: ["Design a logo", "Build a website", "Create an app"], answer: "Build a website" },{ question: "What was the most challenging part of the project?", options: ["Choosing colors", "Writing text", "Making it work on phones"], answer: "Making it work on phones" },{ question: "What is the speaker doing now?", options: ["Taking a holiday", "Building a portfolio", "Starting another course"], answer: "Building a portfolio" },{ question: "What kind of job has the speaker applied for?", options: ["Senior designer", "Junior designer", "Manager"], answer: "Junior designer" }]}

            { audioscript: "I've started commuting to work by train instead of driving. The main reason was to save money on petrol and parking, which were costing me a fortune. The train station is a 15-minute walk from my house. The journey itself takes about 40 minutes. I use the time to read or listen to podcasts, which is much more relaxing than sitting in traffic. The only downside is that the last train home is at 10 PM, so I can't stay out late in the city after work.", questions: [{ question: "Why did the speaker switch to commuting by train?", options: ["It's faster", "To save money", "It's more comfortable"], answer: "To save money" },{ question: "How long is the train journey?", options: ["15 minutes", "40 minutes", "1 hour"], answer: "40 minutes" },{ question: "How does the speaker use their time on the train?", options: ["Working", "Sleeping", "Reading"], answer: "Reading" },{ question: "What is the main disadvantage of taking the train?", options: ["It's crowded", "It's often late", "The last train is early"], answer: "The last train is early" },{ question: "How far is the train station from the speaker's house?", options: ["5 minutes", "15 minutes", "30 minutes"], answer: "15 minutes" }]},
            { audioscript: "I've been taking a cookery course that focuses on Southeast Asian food. We meet every Thursday evening. So far, we've learned to make Thai green curry and Vietnamese noodle soup. This week, we're making a spicy Malaysian dish. The most challenging part is finding all the specific ingredients; some of them are only available at specialty Asian markets. My favorite part is, of course, tasting everything at the end of the class. I've started cooking these dishes for my family, and they are very impressed.", questions: [{ question: "What type of food is the course focused on?", options: ["Italian", "French", "Southeast Asian"], answer: "Southeast Asian" },{ question: "What is the most challenging aspect of the course for the speaker?", options: ["The cooking techniques", "Finding ingredients", "The spicy food"], answer: "Finding ingredients" },{ question: "What dish are they making this week?", options: ["Thai curry", "Vietnamese soup", "Malaysian dish"], answer: "Malaysian dish" },{ question: "What is the speaker's favorite part of the class?", options: ["Learning new skills", "Meeting people", "Tasting the food"], answer: "Tasting the food" },{ question: "Who has the speaker been cooking for at home?", options: ["Friends", "Nobody", "Family"], answer: "Family" }]},
            { audioscript: "I work as a freelance graphic designer from home. This gives me a lot of flexibility with my hours, which is great. However, it can be quite lonely sometimes. My main project right now is designing a logo for a new coffee shop. They want a modern and simple design. The most difficult part of my job is managing my time and avoiding distractions, like doing housework. I make a to-do list every morning to stay focused. I usually finish work around 6 PM.", questions: [{ question: "What is the main advantage of the speaker's job?", options: ["High salary", "Flexible hours", "Lots of holidays"], answer: "Flexible hours" },{ question: "What is a disadvantage of working from home for the speaker?", options: ["It's lonely", "It's noisy", "It's expensive"], answer: "It's lonely" },{ question: "What is the speaker's current main project?", options: ["A website", "A logo", "A brochure"], answer: "A logo" },{ question: "What does the speaker find most difficult about their job?", options: ["Finding clients", "Using the software", "Managing time"], answer: "Managing time" },{ question: "How does the speaker stay focused?", options: ["Drinks coffee", "Listens to music", "Makes a to-do list"], answer: "Makes a to-do list" }]},
            { audioscript: "I'm trying to read more books this year. My goal is to read two books every month. I've joined the local book club to help me stay motivated. We meet on the last Wednesday of the month to discuss the book. This month's book is a historical novel set in ancient Rome. I usually prefer modern thrillers, so this is a bit different for me. I find it's best to read for about an hour before I go to sleep, as it helps me to relax. It's a much better habit than scrolling on my phone.", questions: [{ question: "What is the speaker's reading goal?", options: ["One book a week", "Two books a month", "One book a month"], answer: "Two books a month" },{ question: "Why did the speaker joined the book club?", options: ["To get free books", "To make friends", "To stay motivated"], answer: "To stay motivated" },{ question: "What genre of book is the club reading this month?", options: ["Science fiction", "Modern thriller", "Historical novel"], answer: "Historical novel" },{ question: "What genre does the speaker usually prefer?", options: ["Historical novels", "Thrillers", "Romance"], answer: "Thrillers" },{ question: "When does the speaker find it best to read?", options: ["In the morning", "On the bus", "Before sleep"], answer: "Before sleep" }]},
            { audioscript: "I'm organizing a community cleanup event at the local park. It's scheduled for next Saturday morning. I've put up posters around the neighborhood to find volunteers. So far, about 15 people have signed up. The city council is providing us with gloves and rubbish bags. The biggest challenge will be cleaning up the area near the river, as a lot of trash collects there. After the cleanup, we're having a free barbecue for all the volunteers as a thank you. I hope it encourages more people to help keep our park clean in the future.", questions: [{ question: "What kind of event is the speaker organizing?", options: ["A picnic", "A sports day", "A cleanup"], answer: "A cleanup" },{ question: "How has the speaker tried to find volunteers?", options: ["By email", "With posters", "On social media"], answer: "With posters" },{ question: "Who is providing the equipment?", options: ["The speaker", "The volunteers", "The city council"], answer: "The city council" },{ question: "Which area of the park will be the most difficult to clean?", options: ["The playground", "Near the river", "The car park"], answer: "Near the river" },{ question: "What is happening after the cleanup?", options: ["A meeting", "A barbecue", "A tree planting"], answer: "A barbecue" }]},
            { audioscript: "I've taken up painting with watercolors. I find it very calming. I bought a small set of paints and some special paper from an art supply store. My favorite thing to paint is landscapes, especially mountains and forests. I'm not very good at painting people. I often go hiking on weekends to find beautiful scenes to paint. Last weekend I found a beautiful waterfall. I took a photo so I could paint it at home. I've given a few of my paintings to friends as gifts.", questions: [{ question: "What type of paint is the speaker using?", options: ["Oil paints", "Acrylics", "Watercolors"], answer: "Watercolors" },{ question: "What does the speaker like to paint most?", options: ["People", "Buildings", "Landscapes"], answer: "Landscapes" },{ question: "What subject is the speaker not good at painting?", options: ["Animals", "People", "Flowers"], answer: "People" },{ question: "How does the speaker find scenes to paint?", options: ["From books", "By going hiking", "On the internet"], answer: "By going hiking" },{ question: "What has the speaker done with some of their paintings?", options: ["Sold them", "Thrown them away", "Given them as gifts"], answer: "Given them as gifts" }]},
            { audioscript: "I manage a small, independent cinema. We only have two screens, so we have to choose our films carefully. We try to show a mix of new Hollywood movies and independent or foreign films. This week, we are showing a French comedy. The most difficult part of my job is the financial side - making sure we sell enough tickets to pay the bills. Our busiest times are Friday and Saturday evenings. We have a special offer on Mondays where tickets are half-price, which is very popular with students.", questions: [{ question: "What is the speaker's job?", options: ["Film director", "Actor", "Cinema manager"], answer: "Cinema manager" },{ question: "What kind of film is showing this week?", options: ["A Hollywood movie", "A French comedy", "A documentary"], answer: "A French comedy" },{ question: "What is the most difficult part of the job?", options: ["Choosing films", "Managing staff", "The financial side"], answer: "The financial side" },{ question: "When are the busiest times at the cinema?", options: ["Weekday afternoons", "Weekend evenings", "Monday mornings"], answer: "Weekend evenings" },{ question: "What is the special offer on Mondays?", options: ["Free popcorn", "Two-for-one tickets", "Half-price tickets"], answer: "Half-price tickets" }]},

            { audioscript: "My family and I visited the city's planetarium last weekend. The main show was a journey through our solar system, projected onto a huge dome ceiling. It was a spectacular visual experience. The narrator's voice was very clear and explained everything well. After the show, we explored the exhibits. My younger brother was fascinated by the large telescope on display. The only slight issue was the price of the tickets; they were quite steep. But overall, it was a very educational and enjoyable afternoon.", questions: [{ question: "What was the main show about?", options: ["Distant galaxies", "The life of stars", "Our solar system"], answer: "Our solar system" },{ question: "How does the speaker describe the visual experience?", options: ["Boring", "Confusing", "Spectacular"], answer: "Spectacular" },{ question: "What was the speaker's brother most interested in?", options: ["The gift shop", "The large telescope", "The space suits"], answer: "The large telescope" },{ question: "What was a slight issue with the visit?", options: ["It was too crowded", "The show was too short", "The ticket price"], answer: "The ticket price" },{ question: "What does 'steep' mean when talking about prices?", options: ["Reasonable", "Cheap", "Expensive"], answer: "Expensive" }]},
            { audioscript: "I decided to build my own bookshelves last month instead of buying them. I followed a plan I found online. The first step was buying the wood and cutting it to the correct sizes, which was precision work. The most tedious part was sanding all the pieces of wood to make them smooth. Assembling it was like putting together a giant puzzle. Now that it's finished and filled with my books, I feel a great sense of accomplishment. It's much more sturdy than the cheap ones from the store.", questions: [{ question: "What was the first step of the project?", options: ["Painting the wood", "Buying and cutting wood", "Assembling the parts"], answer: "Buying and cutting wood" },{ question: "What did the speaker describe as the most tedious part?", options: ["Finding a plan", "Sanding the wood", "Buying the wood"], answer: "Sanding the wood" },{ question: "How did the speaker describe the assembly process?", options: ["Very easy", "Like a giant puzzle", "Very frustrating"], answer: "Like a giant puzzle" },{ question: "How does the speaker feel about the finished project?", options: ["Disappointed", "A sense of accomplishment", "Tired"], answer: "A sense of accomplishment" },{ question: "What does 'sturdy' mean in this context?", options: ["Attractive", "Weak and fragile", "Strong and well-built"], answer: "Strong and well-built" }]},

            { audioscript: "I bought a concert ticket from a resale website for £60. The concert was last Friday, the 20th of May. The original face value of the ticket was only £30. When I arrived at the venue at 7 PM, the security staff scanned my ticket and told me it was a fake. It was a counterfeit. I was denied entry. It was a mortifying experience, especially as I could hear the band starting to play. I tried to contact the website I bought it from, but their phone number was disconnected. I lost my money and missed the show.", questions: [{ question: "How much did the speaker pay for the ticket?", options: ["£30", "£60", "£70"], answer: "£60" },{ question: "What was the problem with the ticket?", options: ["It was for the wrong day", "It was a fake", "It was for a different seat"], answer: "It was a fake" },{ question: "What happened when the speaker tried to enter the venue?", options: ["He got in easily", "He was denied entry", "He had to pay again"], answer: "He was denied entry" },{ question: "On what date was the concert?", options: ["May 13th", "May 20th", "May 30th"], answer: "May 20th" },{ question: "In the text, what does 'counterfeit' mean?", options: ["Authentic and genuine", "Made in exact imitation of something valuable with the intention to deceive", "A type of ticket"], answer: "Made in exact imitation of something valuable with the intention to deceive" }]},
            { audioscript: "I had a dental appointment for a filling on Tuesday at 2 PM. The dentist quoted me a price of £70 for the work. During the procedure, the dentist found that the decay was more extensive than he initially thought. He said I would need a crown instead of a filling, which was a much more complex procedure. The new cost would be £180. I was not prepared for this. I had to schedule a new appointment for the following Monday to have the work done, as it required more time.", questions: [{ question: "What was the original price quoted for the work?", options: ["£70", "£80", "£180"], answer: "£70" },{ question: "Why did the treatment plan change?", options: ["The dentist made a mistake", "The decay was more extensive than thought", "The speaker changed his mind"], answer: "The decay was more extensive than thought" },{ question: "What is the new cost for the treatment?", options: ["£70", "£170", "£180"], answer: "£180" },{ question: "When is the new appointment scheduled for?", options: ["The next day", "The following Monday", "In two weeks"], answer: "The following Monday" },{ question: "What does 'extensive' mean here?", options: ["Covering or affecting a large area", "Small and contained", "Easy to fix"], answer: "Covering or affecting a large area" }]}
        ];

        function initTestGrid() {
            const testNames = Object.keys(allTestsData);
            
            // Update the display text to show the total number of tests
            totalTestsDisplayEl.textContent = `Select a test module below to begin. There are ${testNames.length} tests available. Each test has 50 questions.`;

            testGrid.innerHTML = '';
            
            testNames.forEach(testName => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-test font-bold transition-all';
                btn.textContent = testName;
                btn.onclick = () => selectTest(testName);
                testGrid.appendChild(btn);
            });
        }

        function initAudio() {
            if (typeof Tone === 'undefined') {
                console.warn("Tone.js not loaded. Sound effects disabled.");
                return;
            }
            correctSynth = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 } }).toDestination();
            incorrectSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 0.5 } }).toDestination();
            isAudioReady = true;
        }

        function initSpeechSynthesis() {
            if (!('speechSynthesis' in window)) {
                console.warn("Speech Synthesis not supported");
                return;
            }
            const setVoices = () => {
                const allVoices = speechSynthesis.getVoices();
                if (allVoices.length > 0) {
                    const desiredNames = ['brian', 'emma', 'andrew'];
                    availableVoices = allVoices.filter(v => 
                        v.lang.startsWith('en') && 
                        desiredNames.some(name => v.name.toLowerCase().includes(name)) &&
                        (v.name.toLowerCase().includes('online') || v.name.toLowerCase().includes('multilingual'))
                    );
                    
                    if (availableVoices.length === 0) {
                        availableVoices = allVoices.filter(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('neural') || v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('natural')));
                    }
                    if (availableVoices.length === 0) { 
                        availableVoices = allVoices.filter(v => v.lang.startsWith('en'));
                    }
                }
            };
            setVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = setVoices;
            }
        }

        function startSpeechKeepAlive() {
            if (window.speechSynthesis) {
                stopSpeechKeepAlive();
                speechKeepAliveInterval = setInterval(() => {
                    // Fix for the Chrome 15-second speech synthesis cutoff bug
                    if (speechSynthesis.speaking) {
                        speechSynthesis.pause();
                        speechSynthesis.resume();
                    } else {
                        const keepAliveUtterance = new SpeechSynthesisUtterance('');
                        keepAliveUtterance.volume = 0;
                        speechSynthesis.speak(keepAliveUtterance);
                    }
                }, 10000);
            }
        }

        function stopSpeechKeepAlive() {
            if (speechKeepAliveInterval) {
                clearInterval(speechKeepAliveInterval);
                speechKeepAliveInterval = null;
            }
        }

        function speak(text, callback) {
            if (!('speechSynthesis' in window) || availableVoices.length === 0) {
                console.warn("Speech synthesis not ready or no voices available.");
                if (callback) setTimeout(callback, 50);
                return;
            }
            
            speechSynthesis.cancel();
            
            playAudioBtn.classList.add('speaking');
            playAudioText.textContent = "Playing Audio...";
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = availableVoices[currentGroupIndex % availableVoices.length];
            utterance.rate = 0.95; // Slightly slower for listening test
            
            utterance.onend = () => {
                playAudioBtn.classList.remove('speaking');
                playAudioText.textContent = "Replay Audio";
                if(callback) callback();
            };
            
            utterance.onerror = (e) => {
                // Ignore intentional cancellations and the 15-second interruption bug
                if (e.error !== 'interrupted' && e.error !== 'canceled') {
                    console.error("SpeechSynthesisUtterance.onerror:", e.error);
                }
                playAudioBtn.classList.remove('speaking');
                playAudioText.textContent = "Replay Audio";
                if (callback) callback();
            };

            speechSynthesis.speak(utterance);
        }

        function selectTest(testName) {
            playerName = playerNameInput.value.trim();
            if (playerName === '') {
                nameErrorEl.textContent = 'Please enter your name first!';
                playerNameInput.classList.add('border-red-500', 'bg-red-50');
                playerNameInput.focus();
                return; 
            }
            nameErrorEl.textContent = '';
            playerNameInput.classList.remove('border-red-500', 'bg-red-50');

            if (Tone.context.state !== 'running') {
                Tone.start().catch(e => console.error("Could not start Tone.js", e));
            }
            
            startSpeechKeepAlive();

            activeTestGroups = [...allTestsData[testName]];
            score = 0;
            currentGroupIndex = 0;
            globalQuestionCounter = 1;
            
            scoreEl.textContent = `Score: ${score}`;
            playerDisplayEl.textContent = playerName;
            currentTestTitleEl.textContent = testName;
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            displayGroup();
        }

        function displayGroup() {
            nextGroupBtn.disabled = true;
            questionsAnsweredInGroup = 0;
            
            const group = activeTestGroups[currentGroupIndex];
            questionsContainer.innerHTML = '';
            
            playAudioBtn.disabled = true;
            playAudioBtn.onclick = () => {
                 playAudioBtn.disabled = true;
                 speak(group.audioscript, () => { playAudioBtn.disabled = false; });
            };

            group.questions.forEach((q, qIndex) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'p-2 border border-gray-200 rounded-lg bg-gray-50';
                questionDiv.dataset.questionIndex = globalQuestionCounter;

                const questionTitle = document.createElement('h3');
                questionTitle.className = 'text-lg sm:text-xl font-bold text-gray-900 mb-1 leading-tight';
                questionTitle.textContent = `${globalQuestionCounter}. ${q.question}`;
                questionDiv.appendChild(questionTitle);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'flex flex-row items-stretch gap-1 sm:gap-2'; 
                
                q.options.forEach(optionText => {
                    const optionButton = document.createElement('button');
                    optionButton.textContent = optionText;
                    optionButton.className = 'btn option-btn text-base sm:text-lg py-1 px-1 sm:px-2 leading-tight flex-1';
                    optionButton.dataset.option = optionText;
                    optionButton.onclick = () => evaluateAnswer(optionButton, optionText, q.answer, optionsDiv);
                    optionsDiv.appendChild(optionButton);
                });

                questionDiv.appendChild(optionsDiv);
                questionsContainer.appendChild(questionDiv);
                globalQuestionCounter++;
            });
            
            speak(group.audioscript, () => {
                playAudioBtn.disabled = false;
            });
        }

        function evaluateAnswer(selectedButton, selectedAnswer, correctAnswer, optionsDiv) {
            if (selectedButton.disabled) return; 

            const allButtons = optionsDiv.querySelectorAll('.option-btn');
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
                score += 2;
                selectedButton.classList.add('correct');
                if(isAudioReady) correctSynth.triggerAttackRelease("C5", "8n");
            } else {
                selectedButton.classList.add('incorrect');
                if(isAudioReady) incorrectSynth.triggerAttackRelease("C3", "4n");
                
                allButtons.forEach(btn => {
                    if (btn.dataset.option.toLowerCase() === correctAnswer.toLowerCase()) {
                        btn.classList.add('correct');
                    }
                });
            }
            
            scoreEl.textContent = `Score: ${score}`;
            questionsAnsweredInGroup++;

            if (questionsAnsweredInGroup === activeTestGroups[currentGroupIndex].questions.length) {
                nextGroupBtn.disabled = false;
            }
        }
        
        function nextGroup() {
            currentGroupIndex++;
            if (currentGroupIndex < activeTestGroups.length) {
                displayGroup();
            } else {
                endGame();
            }
        }

        function endGame() {
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            const totalQuestions = activeTestGroups.reduce((acc, group) => acc + group.questions.length, 0);
            finalScoreEl.innerHTML = `Well done, <span class="text-indigo-600 font-bold">${playerName}</span>!<br>Your final score is <span class="text-indigo-600 font-bold">${score}</span> out of ${totalQuestions * 2}.`;
            
            stopSpeechKeepAlive();
            if (window.speechSynthesis) {
                speechSynthesis.cancel();
            }
        }

        function returnToMenu() {
            stopSpeechKeepAlive();
            if (window.speechSynthesis) speechSynthesis.cancel();
            
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            
            playerNameInput.value = playerName; // preserve name
        }

        nextGroupBtn.addEventListener('click', nextGroup);
        restartBtn.addEventListener('click', returnToMenu);
        backToMenuBtn.addEventListener('click', returnToMenu);

        window.onload = () => {
            initAudio();
            initSpeechSynthesis();
            initTestGrid();
        };
    </script>
</body>
</html>
