<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Mitchell's Verb Practice Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fredoka+One&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #4c1d95);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Fredoka One', cursive;
        }

        /* Shake animation for incorrect answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Pop animation for correct answers */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .pop {
            animation: pop 0.3s ease-out;
        }

        /* Timer bar transition */
        .timer-bar {
            transition: width 1s linear, background-color 0.3s;
        }

        /* Split screen styling */
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .player-zone {
            flex: 1;
            padding: 15px; /* Reduced padding */
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin: 0 10px;
            transition: all 0.3s;
        }
        .player-zone.active {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            border: 2px solid white;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }

        /* Input styling */
        input[type="text"] {
            color: #333;
            font-weight: bold;
            font-size: 1.25rem;
        }

        /* Confetti canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>

                        <input type="radio" name="mode" value="single" class="w-5 h-5" checked>

                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="mode" value="multi" class="w-5 h-5">
                        <span class="text-lg">Two Player</span>
                    </label>
                </div>
            </div>

            <!-- Category Selection -->
            <div class="bg-white/10 p-4 rounded-xl">
                <h2 class="text-2xl font-bold mb-4 text-white">Topic</h2>
                <select id="categorySelect" class="w-full p-3 rounded text-gray-800 font-semibold text-lg">
                    <option value="past">Past Tenses</option>
                    <option value="present_perfect">Present Perfect</option>
                    <option value="future">Future Tenses</option>
                    <option value="irregular">Irregular Verbs</option>
                    <option value="mixed">Mixed Random</option>
                </select>
            </div>
            
            <!-- Settings -->
            <div class="bg-white/10 p-4 rounded-xl md:col-span-2">
                <h2 class="text-2xl font-bold mb-4 text-white">Settings</h2>
                <label class="flex items-center justify-center space-x-3 cursor-pointer">

                    <span class="text-lg">Enable Adaptive Difficulty</span>
                </label>
                <div class="mt-4 flex justify-center items-center gap-4">

                         <option value="1">Level 1 (A1)</option>
                         <option value="2">Level 2 (A2)</option>
                         <option value="3">Level 3 (B1)</option>
                         <option value="4">Level 4 (B2)</option>

    <!-- Game Container (Hidden initially) -->

            <h2 id="questionDisplay" class="text-4xl md:text-5xl font-bold leading-tight drop-shadow-md">Loading question...</h2>

            <div id="reviewOverlay" class="absolute inset-0 bg-blue-900/95 flex flex-col justify-center items-center hidden z-20">

                <p class="text-base text-gray-300">Next in <span id="reviewCountdown">5</span>s...</p>
            </div>
        </div>

        <!-- Players Area (Scores removed from here, just inputs and feedback) -->
        <div id="playersArea" class="flex flex-col md:flex-row gap-4 w-full flex-grow">

            <div id="p1Zone" class="player-zone">

            drawPiles: {},
            
            p1: { name: 'Player 1', score: 0, streak: 0, badges: [] },
            p2: { name: 'Player 2', score: 0, streak: 0, badges: [] }
        };

        const timeLimits = { 1: 20, 2: 30, 3: 40, 4: 50 };
        const praisePhrases = ["Great job!", "Excellent!", "You got it!", "Fantastic!", "Brilliant!", "Spot on!"];
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCorrectSound() {
            playTone(600, 'sine', 0.1);
            setTimeout(() => playTone(800, 'sine', 0.2), 100);
        }

        function playIncorrectSound() {
            playTone(300, 'sawtooth', 0.3, 0.2);
            setTimeout(() => playTone(250, 'sawtooth', 0.4, 0.2), 150);
        }

        // --- STREAMING_CHUNK: TTS Setup with Microsoft Emma Priority ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancel ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                
                // Prioritize Microsoft Emma Online Multilingual
                let selectedVoice = voices.find(v => 
                    v.name.toLowerCase().includes('emma') && 
                    v.name.toLowerCase().includes('online')
                );
                
                // Fallback to local Emma or other good English voices
                if (!selectedVoice) selectedVoice = voices.find(v => v.name.toLowerCase().includes('emma'));
                if (!selectedVoice) selectedVoice = voices.find(v => v.lang.includes('en-') && (v.name.includes('Microsoft') || v.name.includes('Google')));

                if(selectedVoice) utterance.voice = selectedVoice;
                utterance.rate = 1.05; // Natural pacing
                window.speechSynthesis.speak(utterance);
            }
        }
        window.speechSynthesis.onvoiceschanged = () => {};

        const UI = {
            mainMenu: document.getElementById('mainMenu'),
            gameContainer: document.getElementById('gameContainer'),
            summaryScreen: document.getElementById('summaryScreen'),
            
            overallTimer: document.getElementById('overallTimerDisplay'),
            levelBadge: document.getElementById('levelBadge'),
            timerBar: document.getElementById('timerBar'),
            questionDisplay: document.getElementById('questionDisplay'),
            
            reviewOverlay: document.getElementById('reviewOverlay'),
            reviewTitle: document.getElementById('reviewTitle'),
            reviewSentence: document.getElementById('reviewSentence'),
            reviewCountdown: document.getElementById('reviewCountdown'),
            
            roundDisplay: document.getElementById('roundDisplay'),
            questionCountDisplay: document.getElementById('questionCountDisplay'),
            p1ScoreHead: document.getElementById('p1ScoreHead'),
            p2ScoreHead: document.getElementById('p2ScoreHead'),
            p2ScoreContainer: document.getElementById('p2ScoreContainer'),

            p1Zone: document.getElementById('p1Zone'),
            p2Zone: document.getElementById('p2Zone'),
            p1Input: document.getElementById('p1Input'),
            p2Input: document.getElementById('p2Input'),
            p1Feedback: document.getElementById('p1Feedback'),
            p2Feedback: document.getElementById('p2Feedback'),
            p1Badges: document.getElementById('p1Badges'),
            p2Badges: document.getElementById('p2Badges'),
        };

        // --- STREAMING_CHUNK: Start Game & Logic ---
        document.getElementById('startBtn').addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();

            gameState.mode = document.querySelector('input[name="mode"]:checked').value;
            gameState.category = document.getElementById('categorySelect').value;
            gameState.isAdaptive = document.getElementById('adaptiveToggle').checked;
            gameState.currentLevel = parseInt(document.getElementById('startLevelSelect').value);
            
            gameState.overallTime = 600;
            gameState.currentRound = 1;
            gameState.currentQInRound = 0;
            gameState.p1 = { name: 'Player 1', score: 0, streak: 0, badges: [] };
            gameState.p2 = { name: 'Player 2', score: 0, streak: 0, badges: [] };
            
            // Setup Draw Piles
            gameState.drawPiles = {};
            let totalQsForSelected = 0;

            for (const cat in questionBank) {
                gameState.drawPiles[cat] = {};
                for (const lvl in questionBank[cat]) {
                    gameState.drawPiles[cat][lvl] = [...questionBank[cat][lvl]].sort(() => Math.random() - 0.5);
                    
                    if (gameState.category === cat || gameState.category === 'mixed') {
                        totalQsForSelected += gameState.drawPiles[cat][lvl].length;
                    }
                }
            }
            
            // Calculate how many questions per round based on available questions
            // Assuming 3 rounds, let's distribute evenly, or cap at 10 per round.
            // If total questions are less than 30, we reduce maxQsPerRound
            gameState.totalQuestionsAvailableForCategory = totalQsForSelected;
            gameState.maxQsPerRound = Math.min(10, Math.ceil(totalQsForSelected / gameState.maxRounds));
            
            // Fallback if somehow there are very few questions
            if (gameState.maxQsPerRound === 0) gameState.maxQsPerRound = 5;

            UI.mainMenu.classList.add('hidden');
            UI.gameContainer.classList.remove('hidden');
            UI.summaryScreen.classList.add('hidden');
            
            if (gameState.mode === 'multi') {
                UI.p2Zone.classList.remove('hidden');
                UI.p2ScoreContainer.classList.remove('hidden');
            } else {
                UI.p2Zone.classList.add('hidden');
                UI.p2ScoreContainer.classList.add('hidden');
            }
            
            document.getElementById('adaptiveStatus').innerText = gameState.isAdaptive ? "Adapt: ON" : "Adapt: OFF";
            
            updateScores();
            startOverallTimer();
            loadNextQuestion();
        });

        document.getElementById('quitBtn').addEventListener('click', endGame);
        document.getElementById('menuBtn').addEventListener('click', () => {
            UI.summaryScreen.classList.add('hidden');
            UI.mainMenu.classList.remove('hidden');
        });

        function getQuestion() {
            let cat = gameState.category;
            if (cat === 'mixed') {
                const cats = ['past', 'present_perfect', 'future', 'irregular'];
                cat = cats[Math.floor(Math.random() * cats.length)];
            }
            
            let pile = gameState.drawPiles[cat][gameState.currentLevel];
            
            // If pile is empty, find another level or reshuffle
            if (!pile || pile.length === 0) {
                pile = [...questionBank[cat][gameState.currentLevel]].sort(() => Math.random() - 0.5);
                gameState.drawPiles[cat][gameState.currentLevel] = pile;
            }
            
            return pile.pop();
        }

        function loadNextQuestion() {
            gameState.isReviewing = false;
            UI.reviewOverlay.classList.add('hidden');
            
            gameState.currentQInRound++;
            
            // Check for end of round
            if (gameState.currentQInRound > gameState.maxQsPerRound) {
                gameState.currentQInRound = 1;
                gameState.currentRound++;
                if (gameState.currentRound > gameState.maxRounds) {
                    endGame(); 
                    return;
                }
            }
            
            UI.roundDisplay.innerText = `Round ${gameState.currentRound}/${gameState.maxRounds}`;
            UI.questionCountDisplay.innerText = `Q: ${gameState.currentQInRound}/${gameState.maxQsPerRound}`;

            gameState.currentQ = getQuestion();
            UI.questionDisplay.innerHTML = gameState.currentQ.template.replace('___', '<span class="inline-block w-24 border-b-4 border-dashed border-gray-400 mx-2"></span>');
            
            UI.levelBadge.innerText = `Lvl ${gameState.currentLevel}`;
            
            UI.p1Input.value = '';
            UI.p2Input.value = '';
            UI.p1Input.disabled = false;
            UI.p2Input.disabled = false;
            UI.p1Feedback.innerText = '';
            UI.p2Feedback.innerText = '';
            
            UI.p1Input.focus();

            gameState.questionTime = timeLimits[gameState.currentLevel];
            startQuestionTimer();
        }

        // --- STREAMING_CHUNK: Timers ---
        function startOverallTimer() {
            clearInterval(gameState.overallInterval);
            gameState.overallInterval = setInterval(() => {
                gameState.overallTime--;
                const m = Math.floor(gameState.overallTime / 60);
                const s = gameState.overallTime % 60;
                UI.overallTimer.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (gameState.overallTime <= 0) endGame();
            }, 1000);
        }

        function startQuestionTimer() {
            clearInterval(gameState.timerInterval);
            
            UI.timerBar.style.transition = 'none';
            UI.timerBar.style.width = '100%';
            UI.timerBar.style.backgroundColor = '#4ade80';
            
            void UI.timerBar.offsetWidth; 
            
            UI.timerBar.style.transition = `width ${gameState.questionTime}s linear, background-color 0.3s`;
            UI.timerBar.style.width = '0%';

            let timeLeft = gameState.questionTime;
            gameState.timerInterval = setInterval(() => {
                timeLeft--;
                
                if (timeLeft === Math.floor(gameState.questionTime / 2)) {
                    UI.timerBar.style.backgroundColor = '#facc15';
                } else if (timeLeft === Math.floor(gameState.questionTime / 4)) {
                    UI.timerBar.style.backgroundColor = '#ef4444';
                }

                if (timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        // --- STREAMING_CHUNK: Interactions & Review ---
        function attachInputListeners(inputEl, playerKey) {
            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !gameState.isReviewing) {
                    evaluateAnswer(playerKey, inputEl.value.trim());
                }
            });
        }
        attachInputListeners(UI.p1Input, 'p1');
        attachInputListeners(UI.p2Input, 'p2');

        function evaluateAnswer(player, answer) {
            if (gameState.isReviewing) return;

            const isCorrect = answer.toLowerCase() === gameState.currentQ.answer.toLowerCase();
            const inputEl = player === 'p1' ? UI.p1Input : UI.p2Input;
            const feedbackEl = player === 'p1' ? UI.p1Feedback : UI.p2Feedback;
            
            if (isCorrect) {
                playCorrectSound();
                inputEl.classList.add('pop');
                setTimeout(() => inputEl.classList.remove('pop'), 300);
                
                gameState[player].score++;
                gameState[player].streak++;
                
                const otherPlayer = player === 'p1' ? 'p2' : 'p1';
                gameState[otherPlayer].streak = 0;

                const phrase = praisePhrases[Math.floor(Math.random() * praisePhrases.length)];
                speakText(`${phrase} ${gameState[player].name}`);
                
                checkBadges(player);
                triggerReviewPhase(player);

            } else {
                playIncorrectSound();
                inputEl.classList.add('shake');
                setTimeout(() => inputEl.classList.remove('shake'), 400);
                inputEl.value = ''; 
                
                gameState.p1.streak = 0; 
                if(gameState.mode === 'multi') gameState.p2.streak = 0;
                
                feedbackEl.innerText = "Incorrect!";
                feedbackEl.classList.add('text-red-400');
                
                gameState.wrongStreak = (gameState.wrongStreak || 0) + 1;
                handleAdaptiveDifficulty();
            }
        }

        function handleTimeout() {
            if (gameState.isReviewing) return;
            playIncorrectSound();
            gameState.p1.streak = 0;
            gameState.p2.streak = 0;
            gameState.wrongStreak = (gameState.wrongStreak || 0) + 1;
            speakText("Time's up! Let's review.");
            triggerReviewPhase(null);
        }

        function triggerReviewPhase(winnerId) {
            gameState.isReviewing = true;
            clearInterval(gameState.timerInterval);
            
            UI.p1Input.disabled = true;
            UI.p2Input.disabled = true;

            handleAdaptiveDifficulty();
            updateScores();

            UI.reviewOverlay.classList.remove('hidden');
            
            if (winnerId) {
                const winnerName = gameState[winnerId].name;
                UI.reviewTitle.innerHTML = `<span class="text-green-400">${winnerName} got it!</span>`;
            } else {
                UI.reviewTitle.innerHTML = `<span class="text-red-400">Time's Up!</span>`;
            }

            const fullSentence = gameState.currentQ.template.replace('___', `<span class="text-yellow-400 underline">${gameState.currentQ.answer}</span>`);
            UI.reviewSentence.innerHTML = fullSentence;

            const cleanSentence = gameState.currentQ.template.replace('___', gameState.currentQ.answer).replace(/\(.*?\)/g, '');
            
            // Read answer using Emma immediately after praise finishes (approx 1s delay)
            setTimeout(() => {
                if(winnerId) speakText(cleanSentence);
            }, 1000); 

            let countdown = 5;
            UI.reviewCountdown.innerText = countdown;
            const reviewInterval = setInterval(() => {
                countdown--;
                UI.reviewCountdown.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(reviewInterval);
                    loadNextQuestion();
                }
            }, 1000);
        }

        function handleAdaptiveDifficulty() {
            if (!gameState.isAdaptive) return;
            
            if (gameState.p1.streak >= 3 || gameState.p2.streak >= 3) {
                if (gameState.currentLevel < 4) {
                    gameState.currentLevel++;
                    speakText(`Level Up! Level ${gameState.currentLevel}`);
                    fireConfetti(100);
                }
                gameState.p1.streak = 0;
                gameState.p2.streak = 0;
                gameState.wrongStreak = 0;
            }
            
            if (gameState.wrongStreak >= 3) {
                if (gameState.currentLevel > 1) {
                    gameState.currentLevel--;
                    speakText(`Difficulty decreased to Level ${gameState.currentLevel}`);
                }
                gameState.wrongStreak = 0;
            }
        }

        function checkBadges(player) {
            const score = gameState[player].score;
            let earned = false;
            
            if (score === 5 && !gameState[player].badges.includes('⭐')) { gameState[player].badges.push('⭐'); earned = true; }
            if (score === 10 && !gameState[player].badges.includes('🔥')) { gameState[player].badges.push('🔥'); earned = true; }
            if (score === 20 && !gameState[player].badges.includes('🏆')) { gameState[player].badges.push('🏆'); earned = true; }
            
            if (gameState[player].streak === 3 && !gameState[player].badges.includes('⚡')) { gameState[player].badges.push('⚡'); earned = true; }

            if (earned) {
                fireConfetti(50);
                const badgeEl = player === 'p1' ? UI.p1Badges : UI.p2Badges;
                badgeEl.innerHTML = gameState[player].badges.join(' ');
                badgeEl.classList.add('pop');
                setTimeout(() => badgeEl.classList.remove('pop'), 300);
            }
        }

        function updateScores() {
            if(UI.p1ScoreHead) UI.p1ScoreHead.innerText = gameState.p1.score;
            if(UI.p2ScoreHead) UI.p2ScoreHead.innerText = gameState.p2.score;
        }

        // --- STREAMING_CHUNK: Final Screens & Confetti ---
        function endGame() {
            clearInterval(gameState.overallInterval);
            clearInterval(gameState.timerInterval);
            
            UI.gameContainer.classList.add('hidden');
            UI.summaryScreen.classList.remove('hidden');
            
            let html = '';
            if (gameState.mode === 'single') {
                html = `<p>Final Score: <span class="font-bold text-green-400">${gameState.p1.score}</span></p>
                        <p>Badges Earned: ${gameState.p1.badges.join(' ') || 'None yet!'}</p>`;
                if (gameState.p1.score > 0) speakText(`Great practice! You scored ${gameState.p1.score} points.`);
            } else {
                let winnerText = '';
                if (gameState.p1.score > gameState.p2.score) winnerText = "Player 1 Wins!";
                else if (gameState.p2.score > gameState.p1.score) winnerText = "Player 2 Wins!";
                else winnerText = "It's a Tie!";
                
                html = `<h2 class="text-3xl font-bold text-green-400 mb-4">${winnerText}</h2>
                        <div class="flex justify-around">
                            <div><p>Player 1</p><p class="text-2xl font-bold">${gameState.p1.score}</p></div>
                            <div><p>Player 2</p><p class="text-2xl font-bold">${gameState.p2.score}</p></div>
                        </div>`;
                speakText(winnerText);
            }
            
            document.getElementById('summaryContent').innerHTML = html;
            fireConfetti(200);
        }

        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        
        function fireConfetti(amount = 100) {
            const colors = ['#facc15', '#4ade80', '#3b82f6', '#ec4899', '#a855f7'];
            for(let i=0; i<amount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * -10 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngle: 0,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05
                });
            }
        }

        function animateConfetti() {
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.1;
                p.x += p.dx;
                p.y += p.dy;
                
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();
                
                if (p.y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }
        animateConfetti();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
