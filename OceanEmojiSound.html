<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Ocean Emoji Championship</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", 'Arial', sans-serif;
            background: #000;
            color: #00d4ff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Ocean Background */
        .ocean-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
            background: linear-gradient(135deg, #023e8a, #0077b6, #00b4d8);
        }

        .ocean-bubble {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: oceanFloat linear infinite;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes oceanFloat {
            0% { transform: translateY(50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Game Container */
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            position: relative;
            z-index: 10;
        }

        /* Game Progress */
        .game-progress {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 2px solid #00d4ff;
            text-align: center;
        }

        .progress-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .progress-item {
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 10px #00d4ff;
        }

        .phase-indicator {
            font-size: 1.3rem;
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
        }

        /* Game Modes */
        .game-modes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin: 5rem 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 1.2rem 2.5rem;
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #48cae4);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .mode-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.8);
        }
        
        /* Learning Mode */
        .learning-mode {
            display: none;
            text-align: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid #00d4ff;
        }

        .learning-card {
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 2rem;
            margin: 1rem auto;
            max-width: 450px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .learning-emoji {
            font-size: 6rem;
            margin-bottom: 1rem;
            animation: emojiPulse 2s ease-in-out infinite;
        }

        @keyframes emojiPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .learning-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #00d4ff;
        }

        .learning-progress {
            width: 100%;
            height: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .learning-progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #00d4ff, #48cae4);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        /* Team Setup */
        .team-setup {
            display: none;
            text-align: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid #00d4ff;
        }

        .teams-display {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            margin-top: 1rem;
        }

        .team {
            flex: 1;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 1.5rem;
            border: 2px solid #00d4ff;
        }

        .team h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #00d4ff;
        }

        .team-member {
            padding: 0.5rem;
            margin: 0.5rem 0;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            font-size: 1rem;
        }

        /* Player Selection */
        .player-selection {
            display: none;
            text-align: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid #00d4ff;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem auto;
        }

        .slot-reel {
            width: 250px;
            height: 250px;
            border: 5px solid #00d4ff;
            border-radius: 15px;
            background: rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
        }

        .slot-window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 100px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            z-index: 10;
            padding: 10px;
            word-wrap: break-word;
        }

        .slot-strip {
            position: absolute;
            width: 100%;
            transition: transform 3s ease-out;
        }

        .slot-item {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #00d4ff;
            text-align: center;
            padding: 0 10px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        /* Game Play */
        .game-play { display: none; }

        .game-status {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 2px solid #00d4ff;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .round-info { font-size: 1.3rem; font-weight: bold; text-shadow: 0 0 10px #00d4ff; }
        .card-counter { font-size: 1.2rem; color: #ffd700; text-shadow: 0 0 10px #ffd700; }

        .game-area { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

        .versus-indicator {
            font-size: 3rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 15px #ff8c00;
            animation: versusPulse 1.5s ease-in-out infinite;
        }
        @keyframes versusPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .team-game-area { flex: 1; display: flex; flex-direction: column; gap: 1rem; position: relative; transition: transform 0.1s; }
        
        .team-score-display {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 0.5rem;
            border: 2px solid #00d4ff;
            text-align: center;
        }

        .team-score-display .team-name { font-size: 1.1rem; font-weight: bold; }
        .team-score-display .score-number { font-size: 2rem; color: #ffd700; text-shadow: 0 0 15px #ffd700; }

        .player-area {
            flex: 1;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 1.5rem;
            border: 2px solid #00d4ff;
            text-align: center;
        }

        .player-name { 
            font-size: 1.4rem; 
            font-weight: bold; 
            margin-bottom: 1rem; 
            text-shadow: 0 0 10px #00d4ff;
            min-height: 40px; 
        }
        .emoji-display { font-size: 5rem; margin: 1rem 0; animation: emojiFloat 3s ease-in-out infinite; }
        @keyframes emojiFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        .answer-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
        .answer-btn {
            padding: 0.8rem; font-size: 1rem; font-weight: bold;
            background: linear-gradient(45deg, rgba(0, 212, 255, 0.3), rgba(72, 202, 228, 0.3));
            color: #00d4ff; border: 2px solid #00d4ff; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .answer-btn:hover { background: linear-gradient(45deg, rgba(0, 212, 255, 0.6), rgba(72, 202, 228, 0.6)); transform: scale(1.05); }
        .answer-btn.correct { background: linear-gradient(45deg, #00d4ff, #48cae4); color: #000; animation: correctPulse 0.5s ease; }
        .answer-btn.incorrect { background: linear-gradient(45deg, #ff0040, #ff4060); color: #fff; animation: incorrectShake 0.5s ease; }
        @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        @keyframes incorrectShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        .praise-word, .point-badge {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 2.5rem; font-weight: bold;
            z-index: 100; pointer-events: none; animation: praise-animation 1.5s ease-out forwards;
        }
        .point-badge { font-size: 2rem; color: #ffd700; text-shadow: 0 0 10px #ff8c00; top: 15%; }
        @keyframes praise-animation { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1.2); opacity: 0; } }

        .encouragement-phrase {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 1.5rem; font-weight: bold;
            z-index: 100; pointer-events: none; animation: encouragement-animation 2s ease-out forwards;
            color: #ffd700; text-shadow: 0 0 10px #ff8c00; text-align: center; width: 80%;
        }
        @keyframes encouragement-animation {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            80% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -120%) scale(1); opacity: 0; }
        }

        /* Timer */
        .timer-container { margin: 1rem 0; text-align: center; }
        .timer-display { font-size: 2.5rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px #ffd700; margin-bottom: 0.5rem; }
        .timer-bar { width: 100%; height: 15px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; border: 2px solid #00d4ff; }
        .timer-progress { height: 100%; background: linear-gradient(45deg, #ffd700, #ff8c00); transition: width 0.1s linear; border-radius: 10px; }

        /* Fireworks */
        .fireworks-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .firework { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: fireworkExplode 2s ease-out forwards; }
        @keyframes fireworkExplode { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        /* Certificate */
        .certificate {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: linear-gradient(135deg, #ffd700, #ffb347);
            color: #000; padding: 3rem; border-radius: 20px; text-align: center;
            border: 5px solid #ff8c00; box-shadow: 0 0 50px rgba(255,215,0,0.8);
            z-index: 2000; max-width: 600px;
        }
        .certificate h2 { font-size: 2.5rem; margin-bottom: 1rem; }
        .certificate-content { font-size: 1.3rem; line-height: 1.6; margin: 2rem 0; }
        .winning-team { font-size: 2rem; font-weight: bold; color: #ff0040; margin: 1rem 0; }
        .final-score { font-size: 1.8rem; font-weight: bold; color: #0066cc; margin: 1rem 0; }
        .certificate-date { font-size: 1.1rem; margin-top: 2rem; font-style: italic; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .game-area, .teams-display, .progress-info, .game-status, .game-modes { flex-direction: column; }
            .mode-btn { padding: 1rem 2rem; font-size: 1.2rem; }
        }

        /* Bonus Round Styles */
        .bonus-indicator { font-size: 1.8rem; font-weight: bold; color: #ff0040; text-shadow: 0 0 20px #ff0040; animation: bonusPulse 1s ease-in-out infinite; }
        @keyframes bonusPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* Phase Transition */
        .phase-transition {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.9);
            color: #00d4ff; padding: 3rem; border-radius: 20px; text-align: center;
            border: 3px solid #00d4ff; box-shadow: 0 0 50px rgba(0, 212, 255, 0.8);
            z-index: 1500; font-size: 2rem; font-weight: bold; text-shadow: 0 0 20px #00d4ff;
        }
        
        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
            opacity: 0;
            animation: sparkle-animation 1s ease-out forwards;
        }
        @keyframes sparkle-animation {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
        }

        /* NEW: Bonus Shake Effect for Misses */
        @keyframes intenseShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .bonus-shake {
            animation: intenseShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ff0040 !important;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.8) !important;
        }
    </style>
</head>
<body>
    <!-- Backgrounds and Effects -->
    <div class="ocean-bg" id="oceanBg"></div>
    <div class="fireworks-container" id="fireworksContainer"></div>
    <div class="phase-transition" id="phaseTransition"><div id="transitionText"></div></div>

    <div class="game-container">
        <!-- Grade Selection (Start Screen) -->
        <div class="game-modes" id="gameModes">
            <button class="mode-btn" onclick="selectGradeAndStart(10)">Grade 10</button>
            <button class="mode-btn" onclick="selectGradeAndStart(11)">Grade 11</button>
            <button class="mode-btn" onclick="selectGradeAndStart(12)">Grade 12</button>
        </div>

        <!-- All other game sections are hidden by default -->
        <div id="game-content" style="display: none;">
            <!-- Team Setup -->
            <div class="team-setup" id="teamSetup">
                <h2 style="font-size: 2rem; margin-bottom: 1rem; text-shadow: 0 0 15px #00d4ff;">👥 Team Formation</h2>
                <div class="teams-display">
                    <div class="team"><h3 id="team1Name"></h3><div id="team1Members"></div></div>
                    <div class="team"><h3 id="team2Name"></h3><div id="team2Members"></div></div>
                </div>
            </div>

            <!-- Learning Mode -->
            <div class="learning-mode" id="learningMode">
                <h2 style="font-size: 2rem; margin-bottom: 1rem; text-shadow: 0 0 15px #00d4ff;">📖 Learning: <span id="learningSetName">Set 1</span></h2>
                <div class="learning-card">
                    <div class="learning-emoji" id="learningEmoji"></div>
                    <div class="learning-text" id="learningText"></div>
                </div>
                <div class="learning-progress"><div class="learning-progress-bar" id="learningProgressBar" style="width: 0%"></div></div>
                <p style="margin-top: 1rem; font-size: 1rem;">Progress: <span id="learningCounter">0</span> / <span id="totalLearningItems">0</span></p>
            </div>

            <!-- Player Selection -->
            <div class="player-selection" id="playerSelection">
                <h2 style="font-size: 2rem; margin-bottom: 1rem; text-shadow: 0 0 15px #00d4ff;">🎰 Player Selection</h2>
                <div class="slot-machine">
                    <div class="slot-reel">
                        <div class="team-name" id="slot1TeamName" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: bold;"></div>
                        <div class="slot-window" id="slot1Window">---</div>
                        <div class="slot-strip" id="slot1Strip"></div>
                    </div>
                    <div class="slot-reel">
                        <div class="team-name" id="slot2TeamName" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: bold;"></div>
                        <div class="slot-window" id="slot2Window">---</div>
                        <div class="slot-strip" id="slot2Strip"></div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 1rem; font-size: 1.2rem; color: #ffd700;">
                    <div id="selectionCountdown">Game starts in <span id="countdownTimer">10</span>s...</div>
                </div>
            </div>

            <!-- Game Play -->
            <div class="game-play" id="gamePlay">
                <div class="game-area">
                    <div class="team-game-area" id="team1GameArea">
                        <div class="team-score-display"><div class="team-name" id="gameTeam1Name"></div><div class="score-number" id="team1Score">0</div></div>
                        <div class="player-area"><div class="player-name" id="player1Name"></div><div class="emoji-display" id="player1Emoji"></div><div class="answer-buttons" id="player1Buttons"></div></div>
                    </div>
                    <div class="versus-indicator">VS</div>
                    <div class="team-game-area" id="team2GameArea">
                        <div class="team-score-display"><div class="team-name" id="gameTeam2Name"></div><div class="score-number" id="team2Score">0</div></div>
                        <div class="player-area"><div class="player-name" id="player2Name"></div><div class="emoji-display" id="player2Emoji"></div><div class="answer-buttons" id="player2Buttons"></div></div>
                    </div>
                </div>
                <div class="timer-container"><div class="timer-display" id="timerDisplay">10</div><div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div></div>
                <div class="game-status"><div class="round-info" id="roundInfo"></div><div class="card-counter">Card: <span id="currentCard">1</span>/10</div></div>
            </div>
        </div>

        <!-- Game Progress (moved to bottom) -->
        <div class="game-progress" id="gameProgress" style="display: none;">
            <div class="progress-info">
                <div class="progress-item"><span class="phase-indicator" id="currentPhase">Phase 1</span></div>
                <div class="progress-item">Round: <span id="currentRound">1</span></div>
                <div class="progress-item">Player Pair: <span id="currentPair">1</span></div>
                <div class="progress-item">Total Played: <span id="totalRounds">0</span></div>
            </div>
        </div>
    </div>

    <!-- Certificate -->
    <div class="certificate" id="certificate">
        <h2>🏆 CHAMPIONSHIP CERTIFICATE 🏆</h2>
        <div class="certificate-content">
            <p>This certifies that</p>
            <div class="winning-team" id="certificateTeam"></div>
            <p>has won the <strong>OCEAN EMOJI CHAMPIONSHIP</strong></p>
            <div class="final-score" id="certificateScore"></div>
            <div id="certificateMembers" style="margin: 1rem 0; font-weight: bold;"></div>
        </div>
        <div class="certificate-date" id="certificateDate"></div>
        <button class="mode-btn" onclick="resetGame()" style="margin-top: 2rem;">🔄 Play Again</button>
    </div>

    <script>
        // Player Data
        const grade10Players = ["冯奕尘 / Feng, Yichen", "黄若涵 / Huang, Ruohan", "李丰屹 / Li, Fengyi", "李鹏潞 / Li, Penglu", "梁锦天 / Ling, Jintian", "刘景扬 / Liu, Jingyang", "龙俊志 / Long, Junzhi", "马赫 / Ma, He", "聂溪康 / Nie, Xikang", "庞云蔚 / Pang, Yunwei", "曲家瑞 / Qu, Jiarui", "孙诗童 / Sun, Shitong", "王子言 / Zhang, Chenkai", "徐浚洹 / Xu, Junhuan", "赵浩文 / Zhao, Haowen"];
        const grade11Players = ["陈峻弘 / Chen, Junhong", "韩睿雄 / Han, Ruixiong", "何怡敏 / He, Yimin", "康艺芸 / Kang, Yiyun", "李雨霏 / Li, Yufei", "李沾衣 / Li, Zhanyi", "刘圃言 / Liu, Puyan", "庞泽霖 / Pang, Zelin", "王梓晗 / Wang, Zihan", "尹九思 / Yin, Jiusi", "游项雯 / You, Xiangwen", "臧姝婷 / Zang, Shuting", "张澜馨 / Zhang, Lanxin"];
        const grade12Players = ["安政聿 / An, Zhengyu", "蔡子墨 / Cai, Zimo", "刘镇榕 / Liu, Zhenrong", "马知行 / Ma, Zhixing", "邱天 / Qiu, Tian", "盛思语 / Sheng, Siyu", "唐可盈 / Tang, Keying", "田子凡 / Tian, Zifan", "谢斯飞 / Xie, Sifei", "杨加麒 / Yang, Jiaqi", "张程皓 / Zhang, Chenghao", "赵晨达鑫 / Zhao, Chendaxin", "周逸凡 / Zhou, Yifan"];
        let playerNames = [];

        // Game Data
        const emojiSets = [

        // --- Sound Engine ---
        let preferredVoices = [];
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            if (voices.length === 0) return; 

            const naturalVoices = voices.filter(v => v.name.includes('Natural') && v.lang.startsWith('en-'));
            const requestedVoiceNames = ['Ava', 'Emma', 'Brian'];
            const specificVoices = requestedVoiceNames.map(name => voices.find(v => v.name.includes(name) && v.lang.startsWith('en-'))).filter(Boolean);
            const combined = [...naturalVoices, ...specificVoices];
            preferredVoices = [...new Map(combined.map(item => [item['name'], item])).values()];

            if (preferredVoices.length === 0) {
                preferredVoices.push(
                    voices.find(v => v.lang.startsWith('en-US') && v.name.includes('Google')) || 
                    voices.find(v => v.lang.startsWith('en-US')) ||
                    voices.find(v => v.lang.startsWith('en-'))
                );
            }
        }
        
        speechSynthesis.onvoiceschanged = loadVoices;

        function playAudio(text, voiceIndex) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                if (preferredVoices.length > 0 && preferredVoices[0]) {
                    utterance.voice = preferredVoices[voiceIndex % preferredVoices.length];
                }
                utterance.rate = 0.85; 
                speechSynthesis.speak(utterance);
            }
        }
        
        // Base Sound Libraries
        const correctSounds=[{seq:[{freq:880,dur:.3}]},{seq:[{freq:660,dur:.2},{freq:880,dur:.2}]},{seq:[{freq:500,dur:.3},{freq:1500,dur:.1}]},{seq:[{freq:784,dur:.4}]},{seq:[{freq:880,type:"square",dur:.15},{freq:1320,type:"square",dur:.15}]},{seq:[{freq:1200,type:"sawtooth",dur:.15},{freq:1800,type:"sawtooth",dur:.15}]},{seq:[{freq:660,dur:.15},{freq:880,dur:.15},{freq:990,dur:.15}]},{seq:[{freq:1e3,type:"square",dur:.05}]},{seq:[{freq:1200,dur:.1},{freq:2e3,dur:.1}]},{seq:[{freq:660,dur:.15},{freq:880,dur:.15},{freq:1320,dur:.15}]},{seq:[{freq:523,dur:.1},{freq:659,dur:.1},{freq:784,dur:.1},{freq:1046,dur:.1}]},{seq:[{freq:988,dur:.05,gap:.05},{freq:1046,dur:.05,gap:.05},{freq:988,dur:.05,gap:.05},{freq:1046,dur:.05}]},{seq:[{freq:784,dur:.15},{freq:1046,dur:.25}]},{seq:[{freq:600,type:"triangle",dur:.1},{freq:1200,type:"triangle",dur:.1,gap:.1}]},{seq:[{freq:900,type:"sawtooth",vol:.3,dur:.2}]},{seq:[{freq:2e3,dur:.05},{freq:2500,dur:.05,gap:.1},{freq:3e3,dur:.05}]},{seq:[{freq:440,dur:.1},{freq:550,dur:.1},{freq:660,dur:.1}]},{seq:[{freq:1500,dur:.4,vol:.4},{freq:1510,dur:.4,vol:.4,gap:-.4}]},{seq:[{freq:330,type:"square",dur:.1},{freq:440,type:"square",dur:.1},{freq:660,type:"square",dur:.2}]},{seq:[{freq:1046,dur:.5}]}];
        const incorrectSounds=[{seq:[{freq:200,type:"square",dur:.5}]},{seq:[{freq:200,type:"square",dur:.2},{freq:200,type:"square",dur:.2}]},{seq:[{freq:600,dur:.2},{freq:200,dur:.3}]},{seq:[{freq:150,dur:.4}]},{seq:[{freq:400,type:"sawtooth",dur:.3}]},{seq:[{freq:1e3,type:"square",dur:.05},{freq:300,type:"square",dur:.05}]},{seq:[{freq:400,dur:.2},{freq:300,dur:.2},{freq:200,dur:.3}]},{seq:[{freq:100,type:"square",dur:.05}]},{seq:[{freq:500,dur:.2},{freq:500,dur:.2}]},{seq:[{freq:800,dur:.2},{freq:100,dur:.3}]},{seq:[{freq:300,dur:.4},{freq:290,dur:.4,gap:-.4}]},{seq:[{freq:500,type:"sawtooth",dur:.05},{freq:400,type:"sawtooth",dur:.05},{freq:300,type:"sawtooth",dur:.05},{freq:200,type:"sawtooth",dur:.2}]},{seq:[{freq:220,dur:.5},{freq:225,dur:.5,gap:-.5}]},{seq:[{freq:100,type:"triangle",dur:.2,vol:.8}]},{seq:[{freq:1800,type:"sawtooth",dur:.05},{freq:1900,type:"sawtooth",dur:.05,gap:-.05},{freq:1700,type:"sawtooth",dur:.05,gap:-.05}]},{seq:[{freq:330,dur:.2},{freq:220,dur:.2},{freq:110,dur:.3}]},{seq:[{freq:800,type:"square",dur:.1},{freq:810,type:"square",dur:.1,gap:-.1}]},{seq:[{freq:155,type:"sawtooth",dur:.4}]},{seq:[{freq:523,dur:.1},{freq:392,dur:.1},{freq:261,dur:.2}]},{seq:[{freq:900,type:"square",dur:.02,gap:.02},{freq:900,type:"square",dur:.02,gap:.02},{freq:900,type:"square",dur:.02}]}];
        const natureSounds = [{seq:[{freq:1046,dur:.1},{freq:1396,dur:.2, vol: 0.4}, {freq:1568, dur: .3, vol: 0.3}]}];
        
        // NEW: Phase Transition Special Sounds
        const levelUpSound = [{seq:[{freq:261.63,dur:0.1},{freq:329.63,dur:0.1},{freq:392.00,dur:0.1},{freq:523.25,dur:0.3,type:'square'}]}];
        const bonusSound = [{seq:[{freq:440,dur:0.1,type:'sawtooth'},{freq:880,dur:0.2,type:'sawtooth'},{freq:1760,dur:0.5,type:'square'}]}];

        // UPDATED: Dynamically change frequency based on player and level multiplier
        function playSound(type, playerNum = null, levelMultiplier = 1) {
            let e;
            if("correct"===type) e = correctSounds;
            else if("incorrect"===type) e = incorrectSounds;
            else if("nature"===type) e = natureSounds;
            else if("levelup"===type) e = levelUpSound;
            else if("bonus"===type) e = bonusSound;
            else return;

            let t=e[Math.floor(Math.random()*e.length)], o=audioContext.currentTime;
            t.seq.forEach(e=>{
                if(e.gap&&e.gap>0) o+=e.gap;
                let tNode=audioContext.createOscillator(), nNode=audioContext.createGain();
                tNode.connect(nNode);
                nNode.connect(audioContext.destination);
                
                // Scale Frequency
                let baseFreq = e.freq * levelMultiplier;
                // Unique pitches for players
                if (playerNum === 1) baseFreq *= 1.05; // Slightly higher
                if (playerNum === 2) baseFreq *= 0.95; // Slightly lower

                tNode.frequency.setValueAtTime(baseFreq, o);
                tNode.type=e.type||"sine";
                nNode.gain.setValueAtTime(e.vol||.5, o);
                nNode.gain.exponentialRampToValueAtTime(.001, o+e.dur);
                tNode.start(o);
                tNode.stop(o+e.dur);
                if(!(e.gap&&e.gap>=0)) o+=e.dur;
            });
        }

        function switchScreen(activeScreen) {
            ['teamSetup', 'learningMode', 'playerSelection', 'gamePlay'].forEach(screenId => {
                document.getElementById(screenId).style.display = (screenId === activeScreen) ? 'block' : 'none';
            });
        }
        
        function selectGradeAndStart(grade) {
            // Resume Audio Context on user interaction (fixes autoplay policies)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (grade === 10) playerNames = [...grade10Players];
            if (grade === 11) playerNames = [...grade11Players];
            if (grade === 12) playerNames = [...grade12Players];
            if (playerNames.length === 0) return;
            gameState.totalRoundsNeeded = Math.ceil(playerNames.length / 2);
            startAutoChampionship();
        }

        function startAutoChampionship() {
            gameState.isAutoMode = true;
            gameState.phase = 'team-setup';
            document.getElementById('gameModes').style.display = 'none';
            document.getElementById('game-content').style.display = 'block';
            document.getElementById('gameProgress').style.display = 'block';
            
            shuffleTeams(); 
            switchScreen('teamSetup');
            
            setTimeout(() => {
                showPhaseTransition('🎮 Starting Championship!', 2000);
                setTimeout(() => startLearningPhase(), 2000);
            }, TEAM_REVEAL_TIME); 
        }

        function shuffleTeams() {
            const oceanTeams = ["Sharks 🦈", "Dolphins 🐬", "Octopuses 🐙", "Whales 🐋", "Crabs 🦀", "Turtles 🐢"];
            const shuffledTeams = oceanTeams.sort(() => .5 - Math.random());
            gameState.team1.name = shuffledTeams[0];
            gameState.team2.name = shuffledTeams[1];
            
            const shuffledPlayers = [...playerNames].sort(() => .5 - Math.random());
            const mid = Math.ceil(shuffledPlayers.length / 2);
            gameState.team1.players = shuffledPlayers.slice(0, mid);
            gameState.team2.players = shuffledPlayers.slice(mid);
            
            displayTeams();
        }
        
        function displayTeams() {
            document.getElementById('team1Name').innerHTML = gameState.team1.name;
            document.getElementById('team2Name').innerHTML = gameState.team2.name;
            const t1Members = document.getElementById('team1Members');
            const t2Members = document.getElementById('team2Members');
            t1Members.innerHTML = gameState.team1.players.map(p => `<div class="team-member">${p}</div>`).join('');
            t2Members.innerHTML = gameState.team2.players.map(p => `<div class="team-member">${p}</div>`).join('');
        }

        function startLearningPhase() {
            gameState.phase = 'learning';
            gameState.learningIndex = 0;
            updateGameProgress();
            switchScreen('learningMode');
            const set = emojiSets[gameState.currentSet];
            document.getElementById('learningSetName').textContent = set.name;
            document.getElementById('totalLearningItems').textContent = set.items.length;
            showLearningCard();
        }

        function showLearningCard() {
            const set = emojiSets[gameState.currentSet];
            const item = set.items[gameState.learningIndex];
            document.getElementById('learningEmoji').textContent = item.emoji;
            document.getElementById('learningText').textContent = item.name;
            document.getElementById('learningCounter').textContent = gameState.learningIndex + 1;
            document.getElementById('learningProgressBar').style.width = `${((gameState.learningIndex + 1) / set.items.length) * 100}%`;
            
            setTimeout(() => playAudio(item.name, gameState.currentSet), 500);
            
            setTimeout(() => {
                gameState.learningIndex++;
                if (gameState.learningIndex < set.items.length) {
                    showLearningCard();
                } else {
                    setTimeout(startPlayingPhase, 1000);
                }
            }, 5000);
        }

        function startPlayingPhase() {
            gameState.phase = 'player-selection';
            gameState.currentCard = 1;
            showPhaseTransition(`⚔️ Competition Round ${gameState.currentRound}`, 2000);
            setTimeout(selectPlayersForRound, 2000);
        }
        
        function selectPlayersForRound() {
            if (gameState.team1Queue.length === 0) {
                gameState.team1Queue = [...gameState.team1.players].sort(() => 0.5 - Math.random());
            }
            if (gameState.team2Queue.length === 0) {
                gameState.team2Queue = [...gameState.team2.players].sort(() => 0.5 - Math.random());
            }

            const p1 = gameState.team1Queue.pop();
            const p2 = gameState.team2Queue.pop();

            gameState.currentPlayer1 = p1;
            gameState.currentPlayer2 = p2;
            
            updateGameProgress();
            switchScreen('playerSelection');
            createSlotMachine();
        }

        function createSlotMachine() {
            document.getElementById('slot1TeamName').innerHTML = gameState.team1.name;
            document.getElementById('slot2TeamName').innerHTML = gameState.team2.name;

            const s1 = document.getElementById('slot1Strip');
            const s2 = document.getElementById('slot2Strip');
            s1.innerHTML = ''; s2.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                s1.innerHTML += `<div class="slot-item">${gameState.team1.players[i % gameState.team1.players.length]}</div>`;
                s2.innerHTML += `<div class="slot-item">${gameState.team2.players[i % gameState.team2.players.length]}</div>`;
            }
            const i1 = gameState.team1.players.indexOf(gameState.currentPlayer1);
            const i2 = gameState.team2.players.indexOf(gameState.currentPlayer2);
            [s1, s2].forEach(s => { s.style.transition = 'none'; s.style.transform = 'translateY(0)'; s.offsetHeight; s.style.transition = 'transform 3s ease-out'; });
            s1.style.transform = `translateY(-${(40 - (gameState.team1.players.length - i1)) * 60}px)`;
            s2.style.transform = `translateY(-${(40 - (gameState.team2.players.length - i2)) * 60}px)`;
            setTimeout(() => {
                document.getElementById('slot1Window').textContent = gameState.currentPlayer1;
                document.getElementById('slot2Window').textContent = gameState.currentPlayer2;
                startGameCountdown();
            }, 3000);
        }

        function startGameCountdown() {
            let count = 10;
            const timerEl = document.getElementById('countdownTimer');
            timerEl.textContent = count;
            const interval = setInterval(() => {
                count--;
                timerEl.textContent = count;
                if (count <= 0) { clearInterval(interval); start10CardRound(); }
            }, 1000);
        }
        
        function start10CardRound() {
            gameState.phase = 'playing';
            gameState.currentCard = 1;
            switchScreen('gamePlay');
            updateGameProgress();
            playNextCard();
        }

        function playNextCard() {
            if (gameState.currentCard > 10) {
                gameState.totalRoundsPlayed++;
                // Slight pitch shift up for completing a round successfully
                playSound('correct', null, 1.2);
                showPhaseTransition(`🎉 Round Complete!`, 3000);

                setTimeout(() => {
                    if (gameState.totalRoundsPlayed >= gameState.totalRoundsNeeded) {
                        endGame();
                        return;
                    }

                    gameState.currentRound++;

                    if (gameState.totalRoundsPlayed < emojiSets.length) {
                        gameState.currentSet = gameState.totalRoundsPlayed;
                        startLearningPhase();
                    } else {
                        startBonusRound();
                    }
                }, 3000);
                return;
            }

            updateGameStatus();
            setupQuestions();
            startRoundTimer();
        }

        function updateGameProgress() {
            let phaseText = `Phase ${gameState.currentSet + 1}`;
            if (gameState.currentRound > emojiSets.length) {
                phaseText = "Bonus Phase";

            document.getElementById('currentPhase').textContent = phaseText;
            document.getElementById('currentRound').textContent = `${gameState.currentRound}/${gameState.totalRoundsNeeded}`;

        function setupQuestions() {
            let items = (gameState.currentRound > emojiSets.length) 
                ? emojiSets.flatMap(s => s.items) 
                : emojiSets[gameState.currentSet].items;
            const shuffled = [...items].sort(() => .5 - Math.random());
            gameState.currentQuestions.player1 = shuffled[0];
            gameState.currentQuestions.player2 = shuffled[1] || shuffled[0];
            document.getElementById('player1Emoji').textContent = gameState.currentQuestions.player1.emoji;
            document.getElementById('player2Emoji').textContent = gameState.currentQuestions.player2.emoji;
            setupAnswerButtons(1, gameState.currentQuestions.player1, items);
            setupAnswerButtons(2, gameState.currentQuestions.player2, items);
            gameState.currentAnswers = { player1: null, player2: null };
        }
        
        function setupAnswerButtons(playerNum, correctAns, allItems) {
            const container = document.getElementById(`player${playerNum}Buttons`);
            container.innerHTML = '';
            let answers = [correctAns.name];
            const incorrect = allItems.map(i => i.name).filter(n => n !== correctAns.name);
            while (answers.length < 4 && incorrect.length > 0) answers.push(incorrect.splice(Math.floor(Math.random() * incorrect.length), 1)[0]);
            answers.sort(() => .5 - Math.random()).forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans;
                btn.onclick = () => selectAnswer(playerNum, i, ans);
                container.appendChild(btn);
            });
        }

        function showPraise(playerNum) {
            const text = correctPhrases[Math.floor(Math.random() * correctPhrases.length)];
            const el = document.createElement('div');
            el.className = 'praise-word'; el.textContent = text;
            // distinct color based on player
            el.style.color = playerNum === 1 ? '#00d4ff' : '#ff4060';
            const badge = document.createElement('div');
            badge.className = 'point-badge'; badge.textContent = "+1";
            const container = document.getElementById(`team${playerNum}GameArea`);
            container.appendChild(el); container.appendChild(badge);
            
            createSparkleTrail(container, playerNum); 
            
            setTimeout(() => { el.remove(); badge.remove(); }, 1500);
        }
        
        function createSparkleTrail(container, playerNum) {
            const scoreArea = container.querySelector('.team-score-display');
            if (!scoreArea) return;

            const rect = scoreArea.getBoundingClientRect();
            const containerRect = document.querySelector('.game-container').getBoundingClientRect();

            // Setup colors based on player / bonus status
            const colorsP1 = ['#00d4ff', '#48cae4', '#90e0ef']; 
            const colorsP2 = ['#ff0040', '#ff4060', '#ff8fa3'];
            const colorsBonus = ['#ffd700', '#ffb347', '#ffffff'];
            let colorSet = (gameState.currentRound > emojiSets.length) ? colorsBonus : (playerNum === 1 ? colorsP1 : colorsP2);

            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                const startX = rect.left - containerRect.left + rect.width / 2;
                const startY = rect.top - containerRect.top + rect.height / 2;

                sparkle.style.left = `${startX}px`;
                sparkle.style.top = `${startY}px`;

                // Assign random color from respective palette
                const col = colorSet[Math.floor(Math.random() * colorSet.length)];
                sparkle.style.background = col;
                sparkle.style.boxShadow = `0 0 10px ${col}, 0 0 20px ${col}`;

                sparkle.style.setProperty('--x', `${(Math.random() - 0.5) * 300}px`);
                sparkle.style.setProperty('--y', `${(Math.random() - 0.5) * 300}px`);
                sparkle.style.animationDelay = `${Math.random() * 0.3}s`;

                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        function showEncouragement(playerNum) {
            const phrase = incorrectPhrases[Math.floor(Math.random() * incorrectPhrases.length)];
            const el = document.createElement('div');
            el.className = 'encouragement-phrase'; el.textContent = phrase;
            document.getElementById(`team${playerNum}GameArea`).appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function selectAnswer(playerNum, btnIndex, selectedAns) {
            if (gameState.currentAnswers['player' + playerNum]) return;
            const correctAns = gameState.currentQuestions['player' + playerNum].name;
            const isCorrect = selectedAns === correctAns;
            gameState.currentAnswers['player' + playerNum] = { correct: isCorrect, btnIndex };
            
            const btns = document.getElementById(`player${playerNum}Buttons`).children;
            btns[btnIndex].classList.add(isCorrect ? 'correct' : 'incorrect');
            
            // Apply Phase Pitch Multiplier
            let isBonus = gameState.currentRound > emojiSets.length;
            let pitchMult = 1 + (gameState.currentSet * 0.1); 
            if (isBonus) pitchMult = 1.3;

            playSound(isCorrect ? 'correct' : 'incorrect', playerNum, pitchMult);
            
            if (isCorrect) {
                if (playerNum === 1) gameState.team1Score++; else gameState.team2Score++;
                showPraise(playerNum); 
                // Determine firework palette
                let fwMode = isBonus ? 'bonus' : `player${playerNum}`;
                createFireworks(fwMode);
            } else {
                if (playerNum === 1) gameState.team2Score++; else gameState.team1Score++;
                showEncouragement(playerNum);

                // Add Intense visual penalty during bonus round misses
                if (isBonus) {
                    const gameArea = document.getElementById(`team${playerNum}GameArea`);
                    gameArea.classList.add('bonus-shake');
                    setTimeout(() => gameArea.classList.remove('bonus-shake'), 500);
                }
            }
            
            document.getElementById('team1Score').textContent = gameState.team1Score;
            document.getElementById('team2Score').textContent = gameState.team2Score;
            Array.from(btns).forEach(btn => btn.onclick = null);
        }

        function revealCorrectAnswers() {
            for (let i = 1; i <= 2; i++) {
                if (!gameState.currentAnswers['player' + i]) {
                    const buttons = document.getElementById(`player${i}Buttons`).children;
                    const correctAnswer = gameState.currentQuestions['player' + i].name;
                    for (let btn of buttons) {
                        if (btn.textContent === correctAnswer) {
                            btn.classList.add('correct');
                        }
                        btn.onclick = null;
                    }
                }
            }
        }

        function nextCard() {
            gameState.currentCard++;
            playNextCard();
        }

        function startRoundTimer() {
            clearTimeout(gameState.roundTimer);
            let timeLeft = 10;
            const timerDisp = document.getElementById('timerDisplay');
            const timerProg = document.getElementById('timerProgress');
            timerDisp.textContent = timeLeft;
            timerProg.style.width = '100%';
            gameState.roundTimer = setInterval(() => {
                timeLeft--;
                timerDisp.textContent = timeLeft;
                timerProg.style.width = `${(timeLeft / 10) * 100}%`;
                if (timeLeft <= 0) {
                    clearInterval(gameState.roundTimer);
                    revealCorrectAnswers();
                    
                    let pitchMult = 1 + (gameState.currentSet * 0.1);
                    if (!gameState.currentAnswers.player1) { gameState.team2Score++; playSound('incorrect', 1, pitchMult); }
                    if (!gameState.currentAnswers.player2) { gameState.team1Score++; playSound('incorrect', 2, pitchMult); }
                    
                    document.getElementById('team1Score').textContent = gameState.team1Score;
                    document.getElementById('team2Score').textContent = gameState.team2Score;
                    
                    setTimeout(nextCard, 2000); 
                }
            }, 1000);
        }
        
        function showPhaseTransition(text, duration = 3000) {
            // Trigger customized dynamic sounds based on phase content
            if (text.includes('BONUS')) playSound('bonus');
            else if (text.includes('Round') || text.includes('Starting')) playSound('levelup');
            
            const transition = document.getElementById('phaseTransition');
            document.getElementById('transitionText').textContent = text;
            transition.style.display = 'block';
            
            setTimeout(() => {
                transition.style.display = 'none';
            }, duration);
        }

        function startBonusRound() {
            gameState.phase = 'player-selection';
            gameState.currentCard = 1;
            showPhaseTransition(`🎉 BONUS ROUND ${gameState.currentRound}! 🎉`, 3000);
            setTimeout(selectPlayersForRound, 3000);
        }

        function endGame() {
            clearInterval(gameState.roundTimer);
            playSound('levelup');
            const winner = gameState.team1Score > gameState.team2Score ? gameState.team1.name : (gameState.team2Score > gameState.team1Score ? gameState.team2.name : 'Tie Game');
            const members = gameState.team1Score > gameState.team2Score ? gameState.team1.players : (gameState.team2Score > gameState.team1Score ? gameState.team2.players : [...gameState.team1.players, ...gameState.team2.players]);
            document.getElementById('game-content').style.display = 'none';
            document.getElementById('gameProgress').style.display = 'none';
            showCertificate(winner, members);
            for (let i = 0; i < 100; i++) setTimeout(() => createFireworks('default'), i * 50);
        }

        function showCertificate(winner, members) {
            const cert = document.getElementById('certificate');
            document.getElementById('certificateTeam').textContent = winner;
            document.getElementById('certificateScore').textContent = `Final Score: ${gameState.team1Score} - ${gameState.team2Score}`;
            document.getElementById('certificateDate').textContent = `Date: ${new Date().toLocaleDateString()}`;
            document.getElementById('certificateMembers').textContent = members.join(', ');
            cert.style.display = 'block';
        }

        // Updated to accept modes to differentiate events visually
        function createFireworks(mode = 'default') {
            const container = document.getElementById('fireworksContainer');
            
            let colors = ['#ff006e', '#8338ec', '#06ffa5', '#ffd700', '#ff8c00', '#00d4ff'];
            // Player-specific and level-specific colors
            if (mode === 'player1') colors = ['#00d4ff', '#0077b6', '#48cae4', '#90e0ef'];
            if (mode === 'player2') colors = ['#ff0040', '#ff4060', '#c9184a', '#ff8fa3'];
            if (mode === 'bonus') colors = ['#ffd700', '#ffb347', '#ff8c00', '#ffffff'];

            for (let i = 0; i < 15; i++) {
                const fw = document.createElement('div');
                fw.className = 'firework';
                fw.style.left = `${Math.random() * 100}%`;
                fw.style.top = `${Math.random() * 100}%`;
                const color = colors[Math.floor(Math.random() * colors.length)];
                fw.style.background = color;
                fw.style.boxShadow = `0 0 20px ${color}`;
                container.appendChild(fw);
                setTimeout(() => fw.remove(), 2000);
            }
        }

        function resetGame() {
            clearInterval(gameState.roundTimer);
            resetGameState();
            document.getElementById('game-content').style.display = 'none';
            document.getElementById('gameProgress').style.display = 'none';
            document.getElementById('certificate').style.display = 'none';
            document.getElementById('phaseTransition').style.display = 'none';
            document.getElementById('gameModes').style.display = 'flex';
            speechSynthesis.cancel();
        }

        window.addEventListener('load', () => {
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
            loadVoices();

            const oceanBg = document.getElementById('oceanBg');
            const emojis = ['🐟','🐠','🐡','🦈','🐬','🐋','🐳','🐙','🦑','🦀','🦐','💧','🫧'];
            for(let i=0;i<30;i++){let e=document.createElement("div");e.className="ocean-bubble",e.style.left=100*Math.random()+"%",e.style.animationDuration=6+8*Math.random()+"s",e.style.animationDelay=5*Math.random()+"s",e.textContent=emojis[Math.floor(Math.random()*emojis.length)],oceanBg.appendChild(e)}
        });
    </script>
</body>
</html>
