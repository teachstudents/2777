<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Spelling Race</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
            overflow-x: hidden;
        }

        .timer-bar-container {
            width: 100%;
            height: 12px;
            background-color: #334155;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        .timer-bar {
            height: 100%;
            background-color: #10b981;
            width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }

        .timer-warning { background-color: #f59e0b; }
        .timer-critical { background-color: #ef4444; }

        .keyboard-key {
            background-color: #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .keyboard-key:active {
            background-color: #475569;
            transform: translateY(2px);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .player-zone {
            transition: all 0.3s ease;
            border: 4px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .player-zone.winner {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
            animation: pulse-green 1s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .players-1 { grid-template-columns: 1fr; }
        .players-2 { grid-template-columns: repeat(2, 1fr); }
        .players-3 { grid-template-columns: repeat(3, 1fr); }

        @media (max-width: 768px) {
            .players-2, .players-3 {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
        }

        /* 1-Player Huge Keyboard Overrides */
        .players-1 .keyboard-key {
            font-size: 2.5rem; /* Huge text */
            border-radius: 12px;
            margin: 2px;
        }
        .players-1 .kb-row {
            flex: 1; 
        }
        .players-1 .player-zone {
            padding: 1rem;
        }
        .players-1 #input-display-0 {
            height: 5rem;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 2-Player Big Keyboard Overrides */
        .players-2 .keyboard-key {
            font-size: 1.5rem; /* Big text */
            border-radius: 8px;
            margin: 2px;
        }
        .players-2 .kb-row {
            flex: 1; 
        }
        .players-2 .player-zone {
            padding: 0.75rem;
        }
    </style>
</head>

        let preferredVoice = null;
        let voicesLoaded = false;
        let allVoices = [];

        function loadVoices() {
            allVoices = window.speechSynthesis.getVoices();
            if (allVoices.length > 0) {
                const targetNames = ['microsoft brian', 'microsoft emma', 'microsoft andrew'];
                preferredVoice = allVoices.find(v => targetNames.some(name => v.name.toLowerCase().includes(name)));
                
                if (!preferredVoice) {
                    preferredVoice = allVoices.find(v => v.lang.startsWith('en-GB') || v.lang.startsWith('en-US'));
                }
                voicesLoaded = true;
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
            // Polling fallback for Chrome/Safari sometimes missing the event
            setTimeout(loadVoices, 500);
            setTimeout(loadVoices, 1000);
        }

        function speak(text, rate = 0.9) {
            if (!('speechSynthesis' in window)) return;
            
            // Resume suspended context and clear any stuck queues
            window.speechSynthesis.resume();
            window.speechSynthesis.cancel(); 
            
            // Final fallback check if voices delayed
            if (!voicesLoaded || allVoices.length === 0) loadVoices();

            // Slight timeout fixes Safari queueing bugs
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                if (preferredVoice) utterance.voice = preferredVoice;
                utterance.lang = 'en-US';
                utterance.rate = rate;
                
                // Chrome long-utterance bug keep-alive
                utterance.onstart = () => { window.speechSynthesis.resume(); };

                window.speechSynthesis.speak(utterance);
            }, 50);
        }

            // Read definition FIRST, then say word
            const text = `${currentWordObj.clue}. The word is, ${currentWordObj.word}.`;
            speak(text);
        }

        function speakWordOnly() {
            if (!currentWordObj) return;
            speak(currentWordObj.word, 0.8);
        }

        function populateGameSelect() {
            gameSelect.innerHTML = '';
            for (let i = 0; i < totalGames; i++) {
                const startIdx = i * WORDS_PER_GAME;
                const endIdx = Math.min(startIdx + WORDS_PER_GAME, currentDictionary.length);
                const option = document.createElement('option');
                option.value = i;
                // Show a preview of the span to help user see what's in the set
                const firstWord = currentDictionary[startIdx].word;
                const lastWord = currentDictionary[endIdx - 1].word;
                option.textContent = `Game ${i + 1} of ${totalGames} (${firstWord} - ${lastWord})`;
                gameSelect.appendChild(option);
            }
        }

        function updateDictionaryMode() {
            currentDictionary = [...allUniqueWords];
            if (gameMode === 'shuffle') {
                // Fisher-Yates shuffle
                for (let i = currentDictionary.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentDictionary[i], currentDictionary[j]] = [currentDictionary[j], currentDictionary[i]];
                }
            } else {
                currentDictionary.sort((a, b) => a.word.localeCompare(b.word));
            }
            populateGameSelect();
        }

        // Init setup menu
        updateDictionaryMode();

        document.querySelectorAll('.player-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.player-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'border-blue-400');
                    b.classList.add('bg-slate-700', 'text-slate-300', 'border-transparent');
                });
                const target = e.target;
                target.classList.remove('bg-slate-700', 'text-slate-300', 'border-transparent');
                target.classList.add('bg-blue-600', 'text-white', 'border-blue-400');
                numPlayers = parseInt(target.dataset.players);
            });
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('bg-purple-600', 'text-white', 'border-purple-400');
                    b.classList.add('bg-slate-700', 'text-slate-300', 'border-transparent');
                });
                const target = e.target;
                target.classList.remove('bg-slate-700', 'text-slate-300', 'border-transparent');
                target.classList.add('bg-purple-600', 'text-white', 'border-purple-400');
                gameMode = target.dataset.mode;
                updateDictionaryMode();
            });
        });

        document.getElementById('start-game-btn').addEventListener('click', () => {
            // WARM-UP HACK: Unlock iOS/Safari audio context on user interaction
            if ('speechSynthesis' in window) {
                const warmup = new SpeechSynthesisUtterance('');
                warmup.volume = 0;
                window.speechSynthesis.speak(warmup);
            }

            const selectedSetIndex = parseInt(gameSelect.value);
            const startIdx = selectedSetIndex * WORDS_PER_GAME;
            const endIdx = startIdx + WORDS_PER_GAME;
            
            // Extract the 25 words for this specific game
            gameWords = currentDictionary.slice(startIdx, endIdx);

            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            initGameUI();
            currentWordIndex = 0;
            scores = [0, 0, 0];
            
            setTimeout(startRound, 1000);
        });

        document.getElementById('quit-btn').addEventListener('click', () => {
            window.speechSynthesis.cancel();
            clearInterval(roundTimer);
            clearInterval(speechRepeatInterval);
            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('flex');
            setupScreen.classList.remove('hidden');
        });

        function initGameUI() {
            playersContainer.className = `flex-1 grid gap-4 p-4 overflow-hidden no-select players-${numPlayers}`;
            playersContainer.innerHTML = '';
            
            const colors = [
                { border: 'border-blue-500', bg: 'bg-blue-900/30', text: 'text-blue-300' },
                { border: 'border-rose-500', bg: 'bg-rose-900/30', text: 'text-rose-300' },
                { border: 'border-amber-500', bg: 'bg-amber-900/30', text: 'text-amber-300' }
            ];

            for (let i = 0; i < numPlayers; i++) {
                const pDiv = document.createElement('div');
                pDiv.id = `player-zone-${i}`;
                pDiv.className = `player-zone flex flex-col bg-slate-800 rounded-xl p-3 ${colors[i].border} border-2 shadow-lg h-full max-h-full`;
                
                // Player Header
                const header = document.createElement('div');
                header.className = `flex justify-between items-center mb-2 font-bold ${colors[i].text}`;
                header.innerHTML = `<span>Player ${i+1}</span><span id="score-${i}" class="bg-slate-700 px-3 py-1 rounded-full text-white">Score: 0</span>`;
                pDiv.appendChild(header);

                // Input Display
                const inputDisplay = document.createElement('div');
                inputDisplay.id = `input-display-${i}`;
                inputDisplay.className = 'bg-slate-900 rounded-lg h-14 flex items-center justify-center text-2xl font-mono text-white tracking-widest border border-slate-700 mb-3 overflow-hidden px-2 shrink-0';
                pDiv.appendChild(inputDisplay);

                // Keyboard
                const kbContainer = document.createElement('div');
                kbContainer.className = 'kb-container flex-1 flex flex-col gap-1 justify-end';
                
                qwertyLayout.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'kb-row flex justify-center gap-1 w-full h-12';
                    row.forEach(key => {
                        const keyBtn = document.createElement('button');
                        keyBtn.className = 'keyboard-key flex-1 text-sm sm:text-lg max-w-[2.5rem] sm:max-w-[3rem] text-slate-200';
                        if (numPlayers <= 2) keyBtn.classList.remove('max-w-[2.5rem]', 'sm:max-w-[3rem]'); // Let them grow big in 1P/2P mode

                        if (key === 'BACK') {
                            keyBtn.innerHTML = '&#9003;';
                            keyBtn.classList.add('bg-slate-700', 'flex-[1.5]', 'max-w-[4rem]');
                            if (numPlayers <= 2) keyBtn.classList.remove('max-w-[4rem]');
                            keyBtn.onpointerdown = (e) => { e.preventDefault(); handleInput(i, 'BACK'); };
                        } else {
                            keyBtn.textContent = key.toUpperCase();
                            keyBtn.onpointerdown = (e) => { e.preventDefault(); handleInput(i, key); };
                        }
                        
                        rowDiv.appendChild(keyBtn);
                    });
                    kbContainer.appendChild(rowDiv);
                });
                
                pDiv.appendChild(kbContainer);
                playersContainer.appendChild(pDiv);
            }
        }

        function handleInput(playerIndex, key) {
            if (!roundActive) return;

            let currentInput = inputs[playerIndex];
            
            if (key === 'BACK') {
                currentInput = currentInput.slice(0, -1);
            } else {
                if (currentInput.length < 20) { 
                    currentInput += key.toLowerCase();
                }
            }
            
            inputs[playerIndex] = currentInput;
            updateInputDisplay(playerIndex);
            
            // Check win
            if (currentInput === currentWordObj.word.toLowerCase()) {
                handleWin(playerIndex);
            }
        }

        function updateInputDisplay(playerIndex) {
            const display = document.getElementById(`input-display-${playerIndex}`);
            if (display) {
                display.textContent = inputs[playerIndex].toUpperCase();
            }
        }

        function startRound() {
            if (currentWordIndex >= gameWords.length) {
                endGame();
                return;
            }

            // Reset state
            inputs = ["", "", ""];
            for (let i = 0; i < numPlayers; i++) {
                updateInputDisplay(i);
                const zone = document.getElementById(`player-zone-${i}`);
                if (zone) zone.classList.remove('winner');
            }

            currentWordObj = gameWords[currentWordIndex];
            wordCounter.textContent = `Word ${currentWordIndex + 1} / ${gameWords.length}`;
            statusText.textContent = "Listen and Spell!";
            statusText.classList.remove('text-emerald-400', 'text-rose-400', 'text-amber-400');
            statusText.classList.add('text-blue-400');
            
            timeLeft = TOTAL_TIME;
            updateTimerVisuals();
            
            roundActive = true;
            
            // Speak Sequence
            speakCurrentWordSequence();

            // Set up repeat interval (repeat word every 10 seconds if no answer)
            clearInterval(speechRepeatInterval);
            speechRepeatInterval = setInterval(() => {
                if (roundActive && window.speechSynthesis.speaking === false) {
                    speakWordOnly();
                }
            }, 10000);

            // Timer countdown
            clearInterval(roundTimer);
            roundTimer = setInterval(() => {
                timeLeft--;
                updateTimerVisuals();
                
                if (timeLeft <= 0) {
                    handleTimeUp();
                }
            }, 1000);
        }

        function updateTimerVisuals() {
            countdownText.textContent = timeLeft;
            const percent = (timeLeft / TOTAL_TIME) * 100;
            timerBar.style.width = `${percent}%`;
            
            timerBar.classList.remove('timer-warning', 'timer-critical');
            if (percent < 25) {
                timerBar.classList.add('timer-critical');
            } else if (percent < 50) {
                timerBar.classList.add('timer-warning');
            }
        }

        function handleWin(winnerIndex) {
            roundActive = false;
            clearInterval(roundTimer);
            clearInterval(speechRepeatInterval);
            window.speechSynthesis.cancel();
            
            // Update Score
            scores[winnerIndex]++;
            document.getElementById(`score-${winnerIndex}`).textContent = `Score: ${scores[winnerIndex]}`;
            
            // Visuals
            const zone = document.getElementById(`player-zone-${winnerIndex}`);
            zone.classList.add('winner');
            
            const displayWord = currentWordObj.word;
            statusText.innerHTML = `Player ${winnerIndex + 1} got it! Answer: <span class="text-white">${displayWord.toUpperCase()}</span>`;
            statusText.classList.remove('text-blue-400');
            statusText.classList.add('text-emerald-400');
            
            speak(`Player ${winnerIndex + 1} wins. The word was ${displayWord}`);

            // Next round after 3 seconds break
            setTimeout(() => {
                currentWordIndex++;
                startRound();
            }, 3000);
        }

        function handleTimeUp() {
            roundActive = false;
            clearInterval(roundTimer);
            clearInterval(speechRepeatInterval);
            window.speechSynthesis.cancel();
            
            statusText.innerHTML = `Time's up! Answer: <span class="text-white">${currentWordObj.word.toUpperCase()}</span>`;
            statusText.classList.remove('text-blue-400');
            statusText.classList.add('text-rose-400');
            
            speak(`Time is up. The word was ${currentWordObj.word}.`);

            // Next round after 3 seconds
            setTimeout(() => {
                currentWordIndex++;
                startRound();
            }, 3000);
        }

        function endGame() {
            statusText.textContent = "Game Over!";
            statusText.classList.remove('text-blue-400', 'text-emerald-400', 'text-rose-400');
            statusText.classList.add('text-amber-400');
            wordCounter.textContent = "Complete!";
            
            let maxScore = Math.max(...scores.slice(0, numPlayers));
            let winners = [];
            for (let i = 0; i < numPlayers; i++) {
                if (scores[i] === maxScore) winners.push(`Player ${i + 1}`);
            }
            
            let resultText = winners.length > 1 ? `It's a tie! (${maxScore} points)` : `${winners[0]} Wins with ${maxScore} points!`;
            speak(`Game over. ${resultText}`);
            
            setTimeout(() => {
                alert(`Final Results:\n${resultText}`);
                document.getElementById('quit-btn').click();
            }, 1000);
        }

        // Global Physical Keyboard Support for 1 Player
        document.addEventListener('keydown', (e) => {
            if (!roundActive) return;
            if (numPlayers === 1) {
                const key = e.key.toLowerCase();
                if (/^[a-z]$/.test(key) || key === '-' || key === ' ') {
                    handleInput(0, key);
                } else if (key === 'backspace') {
                    handleInput(0, 'BACK');
                }
            }
        });

    </script>
</body>
</html>
