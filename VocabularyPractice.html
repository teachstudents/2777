<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vocabulary Practice Ultimate (800 Questions)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0fdf4; /* Light green tint background */
      overflow: hidden; /* Prevent scrolling on body */
    }
    
    /* Timer Bar Animation */
    .timer-bar-container {
      width: 100%;
      height: 8px;
      background-color: #e5e7eb;
    }
    .timer-bar {
      height: 100%;
      background-color: #10b981; /* Emerald 500 */
      width: 100%;
      transition: width 1s linear, background-color 0.5s ease;
    }
    .timer-bar.warning {
      background-color: #f59e0b; /* Amber 500 */
    }
    .timer-bar.danger {
      background-color: #ef4444; /* Red 500 */
    }

    /* Option Hover & Selection States */
    .option-btn {
      transition: all 0.2s ease-in-out;
    }
    .option-btn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .option-correct {
      background-color: #d1fae5 !important;
      border-color: #10b981 !important;
      color: #065f46 !important;
    }
    .option-incorrect {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }
    
    /* Split Screen Divider */
    .split-divider {
      width: 4px;
      background: linear-gradient(to bottom, transparent, #cbd5e1, transparent);
      margin: 0 10px;
    }
    
    /* Custom Scrollbar (Used only on Home/Result screens if needed) */
    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f1f1; 
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    
    /* Mode Toggle Active State */
    .mode-btn.active {
      background-color: #10b981;
      color: white;
      border-color: #10b981;
    }
  </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

  <header id="game-header" class="hidden bg-white shadow-md z-10 flex flex-col shrink-0">
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-2 flex justify-between items-center">
      <button onclick="goHome()" class="flex items-center text-slate-600 hover:text-emerald-600 font-semibold transition-colors text-sm sm:text-base">
        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span class="hidden sm:inline">Back Home</span>
      </button>
      
      <div class="text-center">
        <h1 class="text-lg sm:text-xl font-bold text-slate-800">Vocabulary Mastery</h1>
        <p id="question-counter" class="text-xs sm:text-sm font-semibold text-emerald-600"></p>
      </div>

      <button id="next-btn" onclick="nextQuestion()" class="hidden flex items-center bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold transition-colors shadow-sm text-sm sm:text-base">
        Next
        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
      <div id="next-placeholder" class="w-[70px] sm:w-[90px]"></div>
    </div>
    <!-- Timer Progress Bar -->
    <div class="timer-bar-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center relative overflow-hidden">
    
    <!-- Home Screen -->
    <div id="home-screen" class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 text-center m-4 overflow-y-auto custom-scroll max-h-full">
      <div class="mb-4">
        <svg class="w-16 h-16 text-emerald-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-2">The 800 Question Challenge</h1>
      <p class="text-slate-500 mb-6 text-base md:text-lg">Select your mode and the block of questions you want to play!</p>
      
      <div class="flex justify-center gap-4 mb-8">
        <button id="btn-mode-1" onclick="setMode(1)" class="mode-btn active px-6 py-2 md:px-8 md:py-3 rounded-xl font-bold text-base md:text-lg border-2 border-emerald-500 text-emerald-600 transition-colors shadow-sm">
          1 Player
        </button>
        <button id="btn-mode-2" onclick="setMode(2)" class="mode-btn px-6 py-2 md:px-8 md:py-3 rounded-xl font-bold text-base md:text-lg border-2 border-emerald-500 text-emerald-600 transition-colors shadow-sm hover:bg-emerald-50">
          2 Player (Split Screen)
        </button>
      </div>

      <h3 class="text-xl font-bold text-slate-700 mb-4 text-left border-b pb-2">Select Question Range</h3>
      <!-- 4 Columns for 8 buttons layout -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <button onclick="startRange(1, 100)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">1 - 100</button>
        <button onclick="startRange(101, 200)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">101 - 200</button>
        <button onclick="startRange(201, 300)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">201 - 300</button>
        <button onclick="startRange(301, 400)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">301 - 400</button>
        <button onclick="startRange(401, 500)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">401 - 500</button>
        <button onclick="startRange(501, 600)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">501 - 600</button>
        <button onclick="startRange(601, 700)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">601 - 700</button>
        <button onclick="startRange(701, 800)" class="py-3 md:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 border border-slate-200 transition-colors">701 - 800</button>
      </div>
      <p id="range-warning" class="text-red-500 font-bold mt-4 hidden">Not enough questions available in this range yet! Adding more soon.</p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full h-full p-2 md:p-4 flex gap-2 md:gap-4 max-w-[1800px] mx-auto overflow-hidden">
      
      <!-- Player 1 Panel -->
      <div id="p1-panel" class="flex-1 flex flex-col bg-white rounded-2xl shadow-lg p-4 md:p-6 overflow-hidden h-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2 shrink-0">
          <h2 id="p1-name" class="text-lg md:text-2xl font-bold text-emerald-600">Player 1</h2>
          <span id="p1-score" class="text-sm md:text-xl font-bold text-slate-500 bg-slate-100 px-3 py-1 md:px-4 md:py-2 rounded-full">Score: 0</span>
        </div>
        
        <!-- Question Area (Flex-1 allows it to expand/shrink based on remaining space) -->
        <div class="flex-1 min-h-0 flex items-center justify-center p-2 mb-2">
          <!-- Responsive Text Sizing tailored to prevent scrolling -->
          <h3 id="p1-question" class="text-2xl sm:text-3xl lg:text-4xl xl:text-5xl font-extrabold text-slate-800 text-center leading-tight"></h3>
        </div>
        
        <!-- Options Grid: Fixed 2x2 with 25% gap reduction (gap-3 instead of gap-4) -->
        <div id="p1-options" class="grid grid-cols-2 gap-2 sm:gap-3 shrink-0 mb-2">
          <!-- Options injected via JS -->
        </div>
        
        <!-- Feedback Block (Shrink-0 ensures it stays intact when shown) -->
        <div id="p1-feedback" class="hidden bg-slate-50 p-3 md:p-4 rounded-xl border-2 border-slate-200 shrink-0 mt-2">
          <p id="p1-feedback-title" class="font-bold text-xl md:text-3xl mb-1"></p>
          <p id="p1-feedback-exp" class="text-slate-800 text-base md:text-xl font-semibold leading-snug mb-1"></p>
          <p id="p1-feedback-det" class="text-slate-600 text-sm md:text-base italic leading-tight"></p>
        </div>
      </div>

      <!-- Split Divider (Visible only in 2P mode) -->
      <div id="split-divider" class="hidden split-divider shrink-0"></div>

      <!-- Player 2 Panel -->
      <div id="p2-panel" class="hidden flex-1 flex flex-col bg-white rounded-2xl shadow-lg p-4 md:p-6 overflow-hidden h-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2 shrink-0">
          <h2 id="p2-name" class="text-lg md:text-2xl font-bold text-blue-600">Player 2</h2>
          <span id="p2-score" class="text-sm md:text-xl font-bold text-slate-500 bg-slate-100 px-3 py-1 md:px-4 md:py-2 rounded-full">Score: 0</span>
        </div>
        
        <!-- Question Area -->
        <div class="flex-1 min-h-0 flex items-center justify-center p-2 mb-2">
          <h3 id="p2-question" class="text-2xl sm:text-3xl lg:text-4xl xl:text-5xl font-extrabold text-slate-800 text-center leading-tight"></h3>
        </div>
        
        <!-- Options Grid -->
        <div id="p2-options" class="grid grid-cols-2 gap-2 sm:gap-3 shrink-0 mb-2">
          <!-- Options injected via JS -->
        </div>
        
        <!-- Feedback Block -->
        <div id="p2-feedback" class="hidden bg-slate-50 p-3 md:p-4 rounded-xl border-2 border-slate-200 shrink-0 mt-2">
          <p id="p2-feedback-title" class="font-bold text-xl md:text-3xl mb-1"></p>
          <p id="p2-feedback-exp" class="text-slate-800 text-base md:text-xl font-semibold leading-snug mb-1"></p>
          <p id="p2-feedback-det" class="text-slate-600 text-sm md:text-base italic leading-tight"></p>
        </div>
      </div>

    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8 text-center overflow-y-auto custom-scroll max-h-full">
      <h2 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6">Set Complete!</h2>
      <div id="final-scores" class="flex flex-col sm:flex-row justify-center items-center gap-8 mb-8">
        <!-- Scores injected via JS -->
      </div>
      <p id="winner-text" class="text-2xl md:text-3xl font-bold text-emerald-500 mb-8"></p>
      
      <button onclick="goHome()" class="px-8 py-3 md:px-10 md:py-4 rounded-xl font-bold text-xl md:text-2xl text-white bg-slate-800 hover:bg-slate-900 shadow-md transition-all">
        Back to Menu
      </button>
    </div>
  </main>

    // Global Game State
    let allQuestions = [...rawData];
    let activeQuestions = [];
    let playersMode = 1;
    let currentIndex = 0;
    let p1Score = 0;
    let p2Score = 0;
    let p1Answered = false;
    let p2Answered = false;
    
    // Timer State
    let timerDuration = 20; // Seconds per question
    let timerStartTime = null;
    let timerRAF = null;
    let timerActive = false;
    let autoAdvanceTimeout = null;

    // Audio & Speech Context
    let audioCtx = null;
    let synth = window.speechSynthesis;
    let voices = [];
    
    // Attempt to load voices (specifically looking for Microsoft Emma/Andrew or fallbacks)
    const loadVoices = () => { voices = synth.getVoices(); };
    loadVoices();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadVoices;
    }

    const praises = ["Excellent!", "Great job!", "Well done!", "Spot on!", "Fantastic!", "You got it!", "Perfect!", "Brilliant!"];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSoundEffect(isCorrect) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function speakPraise() {
      const text = praises[Math.floor(Math.random() * praises.length)];
      const utter = new SpeechSynthesisUtterance(text);
      
      // Look for Emma or Andrew specifically, fallback to any English voice
      let voice = voices.find(v => v.name.includes('Emma') || v.name.includes('Andrew'));
      if (!voice) {
        voice = voices.find(v => v.name.includes('Microsoft') && v.lang.startsWith('en')) || 
                voices.find(v => v.lang.startsWith('en'));
      }
      if (voice) utter.voice = voice;
      
      utter.rate = 1.1;
      synth.speak(utter);
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatQuestionHeader() {
      const total = activeQuestions.length;
      document.getElementById('question-counter').innerText = `Question ${currentIndex + 1} of ${total} (${total - currentIndex - 1} Left)`;
    }

    function setMode(mode) {
      playersMode = mode;
      document.getElementById('btn-mode-1').classList.remove('active', 'bg-emerald-500', 'text-white');
      document.getElementById('btn-mode-1').classList.add('text-emerald-600');
      document.getElementById('btn-mode-2').classList.remove('active', 'bg-emerald-500', 'text-white');
      document.getElementById('btn-mode-2').classList.add('text-emerald-600');
      
      const activeBtn = document.getElementById(`btn-mode-${mode}`);
      activeBtn.classList.add('active', 'bg-emerald-500', 'text-white');
      activeBtn.classList.remove('text-emerald-600');
    }

    function startRange(start, end) {
      const startIdx = start - 1;
      const endIdx = end;
      
      if (startIdx >= allQuestions.length) {
        document.getElementById('range-warning').classList.remove('hidden');
        setTimeout(() => {
          document.getElementById('range-warning').classList.add('hidden');
        }, 3000);
        return;
      }
      
      document.getElementById('range-warning').classList.add('hidden');
      
      // Slice and map to our expected object format
      const slice = allQuestions.slice(startIdx, endIdx);
      activeQuestions = slice.map(q => {
        const correctText = q[1][q[2]];
        return {
          text: q[0],
          options: q[1].map(optText => ({ text: optText, isCorrect: optText === correctText })),
          explanation: q[3],
          detailed: q[4] || ""
        };
      });

      startGame();
    }

    function startGame() {
      initAudio();
      currentIndex = 0;
      p1Score = 0;
      p2Score = 0;
      
      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-header').classList.remove('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      
      if (playersMode === 2) {
        document.getElementById('p2-panel').classList.remove('hidden');
        document.getElementById('split-divider').classList.remove('hidden');
      } else {
        document.getElementById('p2-panel').classList.add('hidden');
        document.getElementById('split-divider').classList.add('hidden');
      }
      
      renderQuestion();
    }

    function goHome() {
      stopTimer();
      clearTimeout(autoAdvanceTimeout);
      synth.cancel();
      document.getElementById('game-header').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('home-screen').classList.remove('hidden');
    }

    function renderQuestion() {
      clearTimeout(autoAdvanceTimeout); // Clear any pending auto-advance
      const q = activeQuestions[currentIndex];
      formatQuestionHeader();
      
      p1Answered = false;
      p2Answered = false;
      document.getElementById('next-btn').classList.add('hidden');
      document.getElementById('next-placeholder').classList.remove('hidden');
      
      const p1Opts = shuffleArray(q.options);
      renderPlayerPanel(1, q.text, p1Opts);
      
      if (playersMode === 2) {
        const p2Opts = shuffleArray(q.options);
        renderPlayerPanel(2, q.text, p2Opts);
      } else {
        p2Answered = true; // Auto-pass for player 2 in 1P mode
      }
      
      startTimer();
    }

    function renderPlayerPanel(playerNum, text, optionsArr) {
      document.getElementById(`p${playerNum}-score`).innerText = `Score: ${eval('p'+playerNum+'Score')}`;
      document.getElementById(`p${playerNum}-question`).innerText = text;
      
      const optionsContainer = document.getElementById(`p${playerNum}-options`);
      optionsContainer.innerHTML = '';
      
      optionsArr.forEach((opt) => {
        const btn = document.createElement('button');
        // Scaled back font sizes, keeping them large but flexible to fit on screen
        btn.className = 'option-btn w-full text-left p-3 md:p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-slate-50 font-bold text-lg sm:text-xl lg:text-2xl text-slate-700 transition-colors focus:outline-none';
        btn.innerText = opt.text;
        btn.onclick = () => handleAnswer(playerNum, opt.isCorrect, btn);
        optionsContainer.appendChild(btn);
      });
      
      document.getElementById(`p${playerNum}-feedback`).classList.add('hidden');
    }

    function handleAnswer(playerNum, isCorrect, btnElement) {
      if (playerNum === 1 && p1Answered) return;
      if (playerNum === 2 && p2Answered) return;
      
      if (playerNum === 1) p1Answered = true;
      if (playerNum === 2) p2Answered = true;
      
      const q = activeQuestions[currentIndex];
      const container = document.getElementById(`p${playerNum}-options`);
      const buttons = container.querySelectorAll('button');
      
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        const isThisBtnCorrect = q.options.find(o => o.text === btn.innerText).isCorrect;
        if (isThisBtnCorrect) {
          btn.classList.add('option-correct');
          btn.classList.remove('opacity-70');
        }
      });
      
      if (!isCorrect) {
        btnElement.classList.add('option-incorrect');
        btnElement.classList.remove('opacity-70');
      }

      playSoundEffect(isCorrect);
      if (isCorrect) {
        if (playerNum === 1) p1Score += 10;
        if (playerNum === 2) p2Score += 10;
        document.getElementById(`p${playerNum}-score`).innerText = `Score: ${eval('p'+playerNum+'Score')}`;
        speakPraise();
      }
      
      showFeedback(playerNum, isCorrect, q.explanation, q.detailed);
      checkTurnComplete();
    }

    function showFeedback(playerNum, isCorrect, expl, det, isTimeout = false) {
      const feedbackDiv = document.getElementById(`p${playerNum}-feedback`);
      feedbackDiv.classList.remove('hidden');
      
      let titleText = isCorrect ? "✅ Correct!" : "❌ Incorrect";
      if (isTimeout) titleText = "⏰ Time's Up!";
      
      let titleClass = isCorrect ? 'text-emerald-600' : 'text-red-600';
      if (isTimeout) titleClass = 'text-amber-600';
      
      document.getElementById(`p${playerNum}-feedback-title`).innerText = titleText;
      document.getElementById(`p${playerNum}-feedback-title`).className = `font-bold text-xl md:text-3xl mb-1 ${titleClass}`;
      document.getElementById(`p${playerNum}-feedback-exp`).innerText = expl;
      
      const detElem = document.getElementById(`p${playerNum}-feedback-det`);
      if (det && det.length > 0) {
        detElem.innerText = det;
        detElem.classList.remove('hidden');
      } else {
        detElem.classList.add('hidden');
      }
    }

    function checkTurnComplete() {
      if (p1Answered && p2Answered) {
        stopTimer();
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('next-placeholder').classList.add('hidden');
      }
    }

    function startTimer() {
      timerActive = true;
      timerStartTime = performance.now();
      const bar = document.getElementById('timer-bar');
      bar.style.width = '100%';
      bar.className = 'timer-bar'; 
      
      function updateBar(currentTime) {
        if (!timerActive) return;
        const elapsed = (currentTime - timerStartTime) / 1000;
        const remaining = Math.max(0, timerDuration - elapsed);
        const percent = (remaining / timerDuration) * 100;
        
        bar.style.width = `${percent}%`;
        
        if (percent < 25) {
          bar.className = 'timer-bar danger';
        } else if (percent < 50) {
          bar.className = 'timer-bar warning';
        }
        
        if (remaining > 0) {
          timerRAF = requestAnimationFrame(updateBar);
        } else {
          timeOut();
        }
      }
      timerRAF = requestAnimationFrame(updateBar);
    }

    function stopTimer() {
      timerActive = false;
      if (timerRAF) cancelAnimationFrame(timerRAF);
    }

    function timeOut() {
      if (!p1Answered) simulateTimeOutAnswer(1);
      if (playersMode === 2 && !p2Answered) simulateTimeOutAnswer(2);
      checkTurnComplete();
      
      // Auto-advance in 2-player mode to keep it extremely competitive
      if (playersMode === 2) {
        autoAdvanceTimeout = setTimeout(() => {
          if (!document.getElementById('next-btn').classList.contains('hidden')) {
            nextQuestion();
          }
        }, 800); // 800ms delay to briefly see the correct answer before jumping
      }
    }
    
    function simulateTimeOutAnswer(playerNum) {
      if (playerNum === 1) p1Answered = true;
      if (playerNum === 2) p2Answered = true;
      
      const q = activeQuestions[currentIndex];
      const container = document.getElementById(`p${playerNum}-options`);
      const buttons = container.querySelectorAll('button');
      
      playSoundEffect(false); // Buzz

      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        const isThisBtnCorrect = q.options.find(o => o.text === btn.innerText).isCorrect;
        if (isThisBtnCorrect) {
          btn.classList.add('option-correct');
          btn.classList.remove('opacity-70');
        }
      });
      
      showFeedback(playerNum, false, q.explanation, q.detailed, true);
    }

    function nextQuestion() {
      clearTimeout(autoAdvanceTimeout);
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        renderQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('game-header').classList.add('hidden');
      const resultScreen = document.getElementById('result-screen');
      resultScreen.classList.remove('hidden');
      
      const totalPossible = activeQuestions.length * 10;
      
      let html = `
        <div class="bg-emerald-50 p-6 rounded-2xl border-2 border-emerald-200 w-full max-w-sm">
          <h3 class="text-2xl font-bold text-emerald-600 mb-2">Player 1</h3>
          <p class="text-6xl font-extrabold text-slate-800">${p1Score} <span class="text-2xl text-slate-500 font-medium">/ ${totalPossible}</span></p>
        </div>
      `;
      
      if (playersMode === 2) {
        html += `
          <div class="bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 w-full max-w-sm">
            <h3 class="text-2xl font-bold text-blue-600 mb-2">Player 2</h3>
            <p class="text-6xl font-extrabold text-slate-800">${p2Score} <span class="text-2xl text-slate-500 font-medium">/ ${totalPossible}</span></p>
          </div>
        `;
        
        const winnerText = document.getElementById('winner-text');
        if (p1Score > p2Score) {
          winnerText.innerText = "🏆 Player 1 Wins!";
          winnerText.className = "text-3xl md:text-4xl font-bold text-emerald-500 mb-8";
        } else if (p2Score > p1Score) {
          winnerText.innerText = "🏆 Player 2 Wins!";
          winnerText.className = "text-3xl md:text-4xl font-bold text-blue-500 mb-8";
        } else {
          winnerText.innerText = "🤝 It's a Tie!";
          winnerText.className = "text-3xl md:text-4xl font-bold text-slate-600 mb-8";
        }
      } else {
        document.getElementById('winner-text').innerText = "Excellent effort!";
      }
      
      document.getElementById('final-scores').innerHTML = html;
    }
    
    // Set default mode on load
    setMode(1);

  </script>
</body>
</html>
