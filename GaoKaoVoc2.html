<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Mitchell's Vocabulary Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #d1fae5, #fbcfe8, #d1fae5); /* Green to Pink animated */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #1f2937;
            padding: 20px;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        /* Game Container Styles */
        .game-container {
            background-color: white;
            padding: 25px 30px; 
            border-radius: 16px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 750px; 
            margin-top: 20px;
        }
        #start-screen input[type="text"] {
            border: 2px solid #e2e8f0; 
            padding: 12px 15px; 
            border-radius: 8px;
            margin-right: 10px;
            width: calc(100% - 140px); 
            max-width: 320px;
            transition: border-color 0.3s ease;
        }
        #start-screen input[type="text"]:focus {
            border-color: #059669; /* Tailwind emerald-600 */
            outline: none;
        }
        .game-button, .choice-button, .action-button { 
            padding: 12px 24px; 
            font-size: 1.05rem; 
            font-weight: 600; 
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .game-button { background-color: #059669; }
        .game-button:hover:not(:disabled) { background-color: #047857; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .game-button:disabled { background-color: #9ca3af; cursor: not-allowed; opacity: 0.7; }
        
        .choice-button {
            background-color: #f59e0b; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1.6rem; /* Large font, but optimized to fit */
            font-weight: 600;
            padding: 10px 12px; /* Tighter padding to prevent scrolling */
            line-height: 1.1; 
            border-radius: 12px;
            color: #000000 !important; 
            min-height: 70px;
        }
        .choice-button:hover:not(:disabled) { background-color: #d97706; transform: scale(1.02); }
        .choice-button.correct { background-color: #10b981; transform: scale(1.02); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); z-index: 10;}
        .choice-button.incorrect { background-color: #f43f5e; opacity: 0.6; }
        .choice-button:disabled { opacity: 0.8; cursor: default; }

        .action-button { background-color: #0ea5e9; font-size: 0.9rem; padding: 8px 16px; }
        .action-button:hover { background-color: #0284c7; }
        
        #game-stats div { margin: 6px 0; font-size: 1rem; color: #334155; }
        #game-stats span.font-bold { color: #064e3b; }

        /* Timer Bar Styles */
        #timer-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 8px;
            height: 10px; /* Slimmer timer bar */
            margin-bottom: 10px;
            overflow: hidden;
        }
        #timer-bar {
            height: 100%;
            background-color: #10b981;
            width: 100%;
            transition: width 1s linear, background-color 0.3s ease;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes glitter {
            0% { filter: brightness(1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
            50% { filter: brightness(1.3); box-shadow: 0 0 25px rgba(16, 185, 129, 1); }
            100% { filter: brightness(1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        }
        .glitter {
            animation: glitter 0.8s infinite;
        }

        /* Elevate header above modal for the Next button */
        .game-header-top {
            position: relative;
            z-index: 1005;
        }
        
        #feedback { font-weight: 600; margin-top: 10px; min-height: 28px; font-size: 1.1rem; }
        #example-sentence-feedback {
            margin-top: 8px; font-style: italic; color: #475569; font-size: 0.95rem;
            border-top: 1px dashed #e2e8f0; padding-top: 8px;
        }
        #badges-display span {
            background-color: #fde047; color: #713f12; padding: 4px 10px; 
            border-radius: 12px; font-size: 0.85rem; font-weight: 500; margin: 0 4px;
            display: inline-block; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .chinese-definition { font-size: 1.2rem; margin-bottom: 2px; color: #000000; }
        .pinyin { font-size: 0.95rem; color: #000000; margin-bottom: 2px; }
        #question-stimulus-display .english-word { font-size: 2rem; font-weight: 700; color: #065f46; margin-bottom: 2px; }

        @media (max-width: 480px) { 
            #start-screen input[type="text"] { width: 100%; max-width: none; margin-bottom:10px; margin-right:0; }
            .game-button, .choice-button, .action-button { padding: 10px 18px; font-size: 0.95rem;}
            .game-container { padding: 15px; }
            .choice-button { font-size: 1.1rem; min-height: 55px; }
            .chinese-definition { font-size: 1.1rem; }
            .pinyin { font-size: 0.85rem; }
            #question-stimulus-display .english-word { font-size: 1.5rem; }
        }
        
        /* Toast notification */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1f2937; color: white; padding: 12px 24px; border-radius: 8px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    <audio id="correctSoundEffect" src="https://actions.google.com/sounds/v1/ui/ding.ogg" preload="auto"></audio> 
    <audio id="incorrectSoundEffect" src="https://actions.google.com/sounds/v1/cartoon/cartoon_cowbell_mark.ogg" preload="auto"></audio> 
    
    <!-- MAIN MENU (gklist) -->
    <main id="main-menu" class="w-full max-w-5xl flex flex-col items-center relative z-10">
        <h1 class="text-4xl md:text-5xl font-extrabold mt-10 mb-4 text-emerald-800 drop-shadow-md text-center px-4">Joel Mitchell's Vocabulary Hub</h1>
        
        <div class="bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-2xl shadow-xl border border-white w-full max-w-lg my-4 flex flex-col items-center">
            
            <!-- Game Mode Toggle -->
            <div class="flex w-full bg-slate-200 rounded-xl p-1 mb-5">
                <button id="mode-1p-btn" class="w-1/2 py-2 text-sm sm:text-base font-bold rounded-lg bg-white text-emerald-700 shadow-sm transition-all">1 Player</button>
                <button id="mode-2p-btn" class="w-1/2 py-2 text-sm sm:text-base font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">2 Player VS</button>
            </div>

            <div class="w-full flex flex-col sm:flex-row gap-4 mb-4">
                <div class="w-full">
                    <label id="p1-label" class="block text-emerald-700 font-bold mb-1 text-sm text-center sm:text-left">Player Name</label>
                    <input type="text" id="p1-username" placeholder="Player 1 Name" class="border-2 border-emerald-200 p-3 rounded-xl w-full text-center text-lg focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all shadow-sm">
                </div>
                <div class="w-full hidden" id="p2-input-container">
                    <label class="block text-blue-700 font-bold mb-1 text-sm text-center sm:text-left">Player 2 (Right)</label>
                    <input type="text" id="p2-username" placeholder="Player 2 Name" class="border-2 border-blue-200 p-3 rounded-xl w-full text-center text-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-sm">
                </div>
            </div>
        </div>

        <div class="relative w-full max-w-4xl my-4">
            <div id="buttonContainer" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-3 sm:gap-4 p-4 sm:p-5 bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-white/50">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </main>

    <!-- GAME APP CONTAINER (Hidden initially) -->
    <div id="game-app" class="w-full max-w-6xl flex-col items-center hidden relative z-10">
        
        <!-- GAME SCREEN -->
        <div id="game-screen" class="game-container relative !p-3 sm:!p-5 !max-w-none w-full xl:w-[1000px]">
            
            <!-- Compact Header -->
            <div class="game-header-top relative overflow-hidden flex w-full flex-col justify-center mb-3 bg-slate-50 rounded-xl shadow-inner border border-slate-200 min-h-[65px]">
                
                <!-- Home Button -->
                <button id="nav-home-btn" class="absolute top-2 right-3 text-slate-500 hover:text-rose-500 transition-colors z-10 p-1 flex items-center gap-1 text-xs font-bold bg-white/80 rounded shadow-sm border border-slate-200" title="Return to Home">
                    🏠 Home
                </button>

                <div id="normal-header-content" class="flex w-full justify-between items-center p-2 sm:p-3 transition-opacity duration-300">
                    <!-- Player 1 Scoreboard -->
                    <div class="flex flex-col items-start w-1/3 bg-emerald-100/50 px-3 py-1.5 rounded-lg border border-emerald-200 transition-transform duration-200">
                        <span class="text-base sm:text-xl font-black text-emerald-700 truncate w-full" id="p1-name-display">P1</span>
                        <span class="text-xs sm:text-sm font-bold text-slate-600">Score: <span id="p1-score" class="text-emerald-800 text-sm sm:text-lg">0</span></span>
                    </div>
                    
                    <!-- Center Game Info & Navigation -->
                    <div class="flex flex-col items-center justify-center w-1/3 px-1 mt-2 sm:mt-0 relative z-10">
                        <div class="flex items-center gap-2 mb-1">
                            <button id="nav-back-btn" class="p-1 bg-slate-200 hover:bg-slate-300 rounded text-slate-600 transition-colors shadow-sm" title="Previous Question">
                                <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <div class="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-wider leading-none">
                                Q: <span id="questions-answered" class="text-slate-800">0</span>/<span id="total-questions" class="text-slate-800">0</span>
                            </div>
                            <button id="nav-next-btn" class="p-1 bg-slate-200 hover:bg-slate-300 rounded text-slate-600 transition-colors shadow-sm" title="Next Question">
                                <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                        <div id="header-timer-container" class="text-slate-800 font-black bg-white border-2 border-slate-300 px-3 py-0.5 rounded-full text-base sm:text-xl flex items-center shadow-sm min-w-[60px] justify-center transition-colors">
                            ⏳ <span id="modal-timer" class="ml-1">15</span>
                        </div>
                    </div>

                    <!-- Player 2 Scoreboard (Hidden in 1P Mode) -->
                    <div id="p2-score-container" class="hidden flex-col items-end w-1/3 bg-blue-100/50 px-3 py-1.5 rounded-lg border border-blue-200 text-right transition-transform duration-200">
                        <span class="text-base sm:text-xl font-black text-blue-700 truncate w-full" id="p2-name-display">P2</span>
                        <span class="text-xs sm:text-sm font-bold text-slate-600">Score: <span id="p2-score" class="text-blue-800 text-sm sm:text-lg">0</span></span>
                    </div>
                    
                    <!-- 1P Repeat Audio Button (Shows in 1P mode on the right) -->
                    <div id="p1-repeat-container" class="w-1/3 flex justify-end pr-6 sm:pr-8">
                        <button id="repeat-button" class="text-xs sm:text-sm text-indigo-600 hover:text-indigo-800 font-bold transition-colors bg-indigo-50 px-3 py-2 rounded-lg border border-indigo-100 hover:bg-indigo-100 shadow-sm active:scale-95">Repeat Audio</button>
                    </div>
                </div>

                <!-- Quit Confirmation Overlay -->
                <div id="quit-confirm-header" class="absolute inset-0 bg-slate-800 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 text-white z-20 translate-y-full transition-transform duration-300 px-2 text-center">
                    <span class="text-xs sm:text-sm font-bold leading-tight max-w-[50%] sm:max-w-none">Quit Match? Are you sure you want to quit? The current scores will be lost.</span>
                    <div class="flex gap-2">
                        <button id="quit-yes-btn" class="bg-rose-500 hover:bg-rose-600 px-3 py-1.5 rounded font-bold text-xs sm:text-sm whitespace-nowrap shadow-sm">Yes, Quit</button>
                        <button id="quit-no-btn" class="bg-slate-500 hover:bg-slate-600 px-3 py-1.5 rounded font-bold text-xs sm:text-sm whitespace-nowrap shadow-sm">Cancel</button>
                    </div>
                </div>
            </div>
            
            <!-- Timer Bar -->
            <div id="timer-bar-container" class="mb-2">
                <div id="timer-bar"></div>
            </div>

            <!-- Inline Question Area -->
            <div id="question-area" class="border-t-2 border-slate-100 pt-3 flex flex-col items-center">
                
                <div id="question-stimulus-display" class="mb-4 mt-1 p-3 sm:p-5 w-full max-w-2xl bg-white shadow-sm border border-slate-200 rounded-2xl min-h-[70px] sm:min-h-[90px] flex flex-col justify-center items-center text-center transform transition-all">
                    <!-- Content injected dynamically -->
                </div>
                
                <!-- 1 PLAYER CHOICES -->
                <div id="options-container-1p" class="w-full max-w-3xl grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-4 mt-1">
                     <!-- Answers injected dynamically -->
                </div>

                <!-- 2 PLAYER SPLIT SCREEN CHOICES -->
                <div id="options-container-2p" class="hidden flex w-full flex-col sm:flex-row gap-3 sm:gap-6 mt-1">
                    <!-- Player 1 Column -->
                    <div class="w-full sm:w-1/2 flex flex-col gap-2 p-2 sm:p-3 bg-emerald-50/50 rounded-xl border border-emerald-100 relative">
                        <div id="p1-options" class="flex flex-col gap-2 w-full mt-1">
                            <!-- Answers injected dynamically -->
                        </div>
                    </div>

                    <!-- Player 2 Column -->
                    <div class="w-full sm:w-1/2 flex flex-col gap-2 p-2 sm:p-3 bg-blue-50/50 rounded-xl border border-blue-100 relative">
                        <div id="p2-options" class="flex flex-col gap-2 w-full mt-1">
                            <!-- Answers injected dynamically -->
                        </div>
                    </div>
                </div>

                <div id="feedback" class="mt-4 text-2xl sm:text-3xl font-black transition-all duration-300 text-center min-h-[36px]"></div>
                <div id="example-sentence-feedback" class="hidden text-lg sm:text-xl text-center bg-slate-100 p-3 rounded-xl mt-2 w-full max-w-3xl border border-slate-200"></div>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="game-over-screen" class="game-container hidden text-center relative p-8">
            <button id="back-to-menu-end" class="absolute top-4 left-4 text-slate-400 hover:text-emerald-600 font-bold text-sm flex items-center transition-colors">
                &larr; Main Menu
            </button>
            <h2 class="text-4xl sm:text-5xl font-black text-slate-800 mb-6 mt-4">Match Over!</h2>
            
            <div id="winner-announcement" class="text-3xl sm:text-4xl font-bold mb-8 animate-bounce"></div>

            <!-- Score displays (adapts based on mode) -->
            <div id="final-scores-container" class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-8 mb-8">
                <!-- P1 Final -->
                <div class="bg-emerald-50 border-2 border-emerald-200 p-4 sm:p-6 rounded-2xl w-full sm:w-48 shadow-md">
                    <div id="final-p1-name" class="text-xl sm:text-2xl font-bold text-emerald-700 truncate mb-2">P1</div>
                    <div class="text-xs sm:text-sm text-slate-500 uppercase font-bold tracking-wider">Score</div>
                    <div id="final-p1-score" class="text-3xl sm:text-4xl font-black text-emerald-600">0</div>
                </div>
                <!-- P2 Final (Hidden in 1P) -->
                <div id="final-p2-card" class="hidden bg-blue-50 border-2 border-blue-200 p-4 sm:p-6 rounded-2xl w-full sm:w-48 shadow-md">
                    <div id="final-p2-name" class="text-xl sm:text-2xl font-bold text-blue-700 truncate mb-2">P2</div>
                    <div class="text-xs sm:text-sm text-slate-500 uppercase font-bold tracking-wider">Score</div>
                    <div id="final-p2-score" class="text-3xl sm:text-4xl font-black text-blue-600">0</div>
                </div>
            </div>

            <p class="text-lg sm:text-xl text-slate-500 mb-8 font-medium">Total Questions: <span id="final-total-questions" class="font-bold text-slate-700">0</span></p>
            <button id="play-again-button" class="game-button text-xl px-8 py-4 shadow-xl">Play Rematch!</button>
        </div>
    </div>

    <div id="toast">Message here</div>

            const numberOfButtons = 40;
            const buttonColors = [
                'bg-red-500 hover:bg-red-600', 'bg-blue-500 hover:bg-blue-600',
                'bg-green-500 hover:bg-green-600', 'bg-yellow-400 hover:bg-yellow-500 text-black',
                'bg-purple-500 hover:bg-purple-600', 'bg-pink-500 hover:bg-pink-600',
                'bg-indigo-500 hover:bg-indigo-600', 'bg-teal-500 hover:bg-teal-600',
                'bg-orange-500 hover:bg-orange-600', 'bg-lime-400 hover:bg-lime-500 text-black',
                'bg-cyan-500 hover:bg-cyan-600', 'bg-emerald-500 hover:bg-emerald-600'
            ];

            for (let i = 1; i <= numberOfButtons; i++) {
                const button = document.createElement('button');
                const colorClassSet = buttonColors[(i - 1) % buttonColors.length];
                const textColorClass = colorClassSet.includes('text-black') ? 'text-black' : 'text-white';
                
                button.className = `
                    p-3 sm:p-4 aspect-square flex items-center justify-center text-lg sm:text-xl md:text-2xl font-bold

                `;

            buttonContainer.addEventListener('click', function(event) {
                const targetButton = event.target.closest('button');
                if (targetButton && targetButton.dataset.setId) {
                    const p1Name = p1UsernameInput.value.trim();
                    const p2Name = p2UsernameInput.value.trim();
                    
                    if (!p1Name || (gameMode === 2 && !p2Name)) {
                        if (!p1Name) {
                            p1UsernameInput.classList.add('border-rose-500', 'bg-rose-50');
                            setTimeout(() => p1UsernameInput.classList.remove('border-rose-500', 'bg-rose-50'), 1500);
                        }

                            p2UsernameInput.classList.add('border-rose-500', 'bg-rose-50');
                            setTimeout(() => p2UsernameInput.classList.remove('border-rose-500', 'bg-rose-50'), 1500);
                        }

                    if (allVocabData[setId]) {
                        currentSetId = setId;
                        currentVocabList = allVocabData[setId];
                        TOTAL_QUESTIONS_PER_GAME = currentVocabList.length;
                        
                        // Select voice based on level modulo logic (Emma, Andrew, Brian)
                        activeTargetVoiceIndex = (setId - 1) % targetVoiceNames.length;
                        setNarratorVoice(targetVoiceNames[activeTargetVoiceIndex]);
                        
                        mainMenu.classList.add('hidden');
                        gameApp.classList.remove('hidden');

                startGame(gameData.p1.name, gameData.p2.name);
            });

            // QUIT HEADER HANDLERS
            navHomeBtn.addEventListener('click', () => {
                normalHeaderContent.classList.add('opacity-0', 'pointer-events-none');
                quitConfirmHeader.classList.remove('translate-y-full');
            });
            document.getElementById('quit-no-btn').addEventListener('click', () => {
                normalHeaderContent.classList.remove('opacity-0', 'pointer-events-none');
                quitConfirmHeader.classList.add('translate-y-full');
            });
            document.getElementById('quit-yes-btn').addEventListener('click', () => {
                normalHeaderContent.classList.remove('opacity-0', 'pointer-events-none');
                quitConfirmHeader.classList.add('translate-y-full');
                goBackToMenu();
            });

            // NAVIGATION HANDLERS (Back / Next)
            function navigateQuestion(direction) {
                clearTimeout(autoAdvanceTimeout);
                clearInterval(questionTimerInterval);

                if (direction === 'next') {
                    if (roundActive) {
                        currentQuestionIndexInShuffledList++;
                        gameData.questionsAnswered++;
                    }
                } else if (direction === 'back') {
                    if (roundActive) {
                        currentQuestionIndexInShuffledList = Math.max(0, currentQuestionIndexInShuffledList - 1);
                    } else {
                        // If round is not active, handleRoundEnd already incremented the index by 1. 
                        // To go to the PREVIOUS question, we need to go back 2 steps.
                        currentQuestionIndexInShuffledList = Math.max(0, currentQuestionIndexInShuffledList - 2);
                    }
                    gameData.questionsAnswered = currentQuestionIndexInShuffledList;
                }

                if (currentQuestionIndexInShuffledList >= TOTAL_QUESTIONS_PER_GAME) {
                    endGame();
                } else {
                    startNewQuestionRound();
                }
            }

            navBackBtn.addEventListener('click', () => navigateQuestion('back'));
            navNextBtn.addEventListener('click', () => navigateQuestion('next'));

            // --- POINT ANIMATION SYSTEM ---
            function animatePoints(button, player) {
                const pt = document.createElement('div');
                pt.textContent = '+10';
                pt.className = 'fixed font-black text-3xl text-emerald-500 z-[9999] pointer-events-none drop-shadow-lg';
                
                const startRect = button.getBoundingClientRect();
                const targetId = player === 'p1' ? 'p1-score' : 'p2-score';
                const targetEl = document.getElementById(targetId);
                const targetRect = targetEl.getBoundingClientRect();

                pt.style.left = `${startRect.left + startRect.width / 2}px`;
                pt.style.top = `${startRect.top + startRect.height / 2}px`;
                pt.style.transform = 'translate(-50%, -50%)';
                pt.style.transition = 'all 0.6s cubic-bezier(0.25, 1, 0.5, 1)';

                document.body.appendChild(pt);

                // Force reflow
                pt.offsetHeight;

                pt.style.left = `${targetRect.left + targetRect.width / 2}px`;
                pt.style.top = `${targetRect.top + targetRect.height / 2}px`;
                pt.style.opacity = '0';
                pt.style.transform = 'translate(-50%, -50%) scale(0.5)';

                setTimeout(() => {
                    pt.remove();
                    const scoreboard = targetEl.parentElement.parentElement;
                    scoreboard.classList.add('scale-105', 'shadow-md');
                    setTimeout(() => scoreboard.classList.remove('scale-105', 'shadow-md'), 200);
                }, 600);
            }

            // --- TTS Functions ---
            function setNarratorVoice(targetName) {
                if (!voices || voices.length === 0) return;
                
                const lowerTarget = targetName.toLowerCase();
                let foundVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(lowerTarget));
                
                if (!foundVoice) {
                    foundVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes("Google") || v.name.includes("Natural")));
                }
                if (!foundVoice) {
                    foundVoice = voices.find(v => v.lang.startsWith('en'));
                }
                
                currentNarratorVoice = foundVoice;
            }

            function initSpeechSynthesis() {
                 if ('speechSynthesis' in window) {
                    const populateVoices = () => {
                        voices = speechSynthesis.getVoices();
                        if (voices.length > 0 && currentSetId) {
                            setNarratorVoice(targetVoiceNames[activeTargetVoiceIndex]);
                        }
                    };
                    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;
                    populateVoices(); setTimeout(populateVoices, 300); setTimeout(populateVoices, 1200); 
                }
            }
            initSpeechSynthesis(); 

            function speak(text) {
                if (!('speechSynthesis' in window) || !text) return;
                
                if (speakTimeoutId) clearTimeout(speakTimeoutId);
                if (currentUtterance) {
                    currentUtterance.onend = null; currentUtterance.onerror = null; currentUtterance.onstart = null;
                }

                currentUtterance = new SpeechSynthesisUtterance(text);
                
                if (currentNarratorVoice) {
                    currentUtterance.voice = currentNarratorVoice;
                }
                
                const doSpeak = () => speechSynthesis.speak(currentUtterance);
                if (speechSynthesis.speaking || speechSynthesis.pending) {
                    speechSynthesis.cancel(); 
                    speakTimeoutId = setTimeout(doSpeak, 300); 
                } else {
                    speakTimeoutId = setTimeout(doSpeak, 50); 
                }
            }

            // --- KEYBOARD LISTENER ---
            document.addEventListener('keydown', (e) => {
                if (!roundActive) return; // Ignore if round is over or loading
                
                const key = e.key.toLowerCase();
                
                // Player 1 Keys: 1, 2, 3, 4 (Works in both 1P and 2P modes)
                if (['1', '2', '3', '4'].includes(key) && !gameData.p1.locked) {
                    const index = parseInt(key) - 1;
                    const container = gameMode === 1 ? optionsContainer1p : p1OptionsContainer;
                    const btn = container.children[index];
                    if (btn && !btn.disabled) btn.click();
                }
                
                // Player 2 Keys: 7, 8, 9, 0 (Only works in 2P mode)
                if (gameMode === 2 && ['7', '8', '9', '0'].includes(key) && !gameData.p2.locked) {
                    const map = {'7': 0, '8': 1, '9': 2, '0': 3};
                    const index = map[key];
                    const btn = p2OptionsContainer.children[index];
                    if (btn && !btn.disabled) btn.click();
                }
            });

            // --- GAME LOGIC ---
            function resetGameData(p1Name, p2Name) {
                gameData = {
                    totalQuestions: TOTAL_QUESTIONS_PER_GAME, 
                    questionsAnswered: 0,
                    timeLeft: TIME_PER_QUESTION,
                    p1: { name: p1Name, score: 0, locked: false },
                    p2: { name: gameMode === 2 ? p2Name : "", score: 0, locked: false }
                };
                shuffledVocabIndices = Array.from(Array(currentVocabList.length).keys());
                shuffleArray(shuffledVocabIndices); 
                currentQuestionIndexInShuffledList = 0; 

                // Setup layout based on mode
                if (gameMode === 1) {
                    p2ScoreContainer.classList.add('hidden');
                    p1RepeatContainer.classList.remove('hidden');
                    optionsContainer2p.classList.add('hidden');
                    optionsContainer1p.classList.remove('hidden');
                } else {
                    p2ScoreContainer.classList.remove('hidden');
                    p1RepeatContainer.classList.add('hidden');
                    optionsContainer2p.classList.remove('hidden');
                    optionsContainer1p.classList.add('hidden');
                }

                updateGameStatsDisplay(); 
            }

            function updateGameStatsDisplay() {
                p1NameDisplay.textContent = gameData.p1.name;
                p1ScoreDisplay.textContent = gameData.p1.score;
                
                if (gameMode === 2) {
                    p2NameDisplay.textContent = gameData.p2.name;
                    p2ScoreDisplay.textContent = gameData.p2.score;
                }
                
                questionsAnsweredDisplay.textContent = Math.min(gameData.questionsAnswered + 1, gameData.totalQuestions);
                totalQuestionsDisplay.textContent = gameData.totalQuestions; 
            }
            
            function startGame(p1Name, p2Name) {
                resetGameData(p1Name, p2Name); 
                gameScreen.classList.remove('hidden');
                questionArea.classList.remove('hidden');
                startNewQuestionRound();
            }
            
            function startNewQuestionRound() {
                if (gameData.questionsAnswered >= TOTAL_QUESTIONS_PER_GAME) { 
                    endGame(); return;
                }
                
                roundActive = true;
                gameData.p1.locked = false;
                gameData.p2.locked = false;
                updateGameStatsDisplay();

                if (currentQuestionIndexInShuffledList >= shuffledVocabIndices.length) {
                    shuffledVocabIndices = Array.from(Array(currentVocabList.length).keys());
                    shuffleArray(shuffledVocabIndices);
                    currentQuestionIndexInShuffledList = 0;
                }

                const vocabIndex = shuffledVocabIndices[currentQuestionIndexInShuffledList];
                currentQuestionData = { ...currentVocabList[vocabIndex] }; 
                currentQuestionData.type = Math.random() < 0.5 ? 'engToChi' : 'chiToEngSpelling';
                
                // Reset styling
                questionStimulusDisplay.classList.remove('scale-105', 'bg-emerald-50', 'border-emerald-300', 'bg-blue-50', 'border-blue-300');
                questionStimulusDisplay.classList.add('bg-white');

                if (currentQuestionData.type === 'engToChi') {
                    questionStimulusDisplay.innerHTML = `<div class="english-word">${currentQuestionData.eng}</div>`;
                } else {
                    questionStimulusDisplay.innerHTML = `
                        <div class="chinese-definition">${currentQuestionData.chi}</div>
                        <div class="pinyin">${currentQuestionData.pin}</div>`;
                }
                
                speak(`${currentQuestionData.eng}. ${currentQuestionData.sentence}`);
                displayQuestionOptions();
            }
            
            function displayQuestionOptions() {
                const { eng, chi, pin, type } = currentQuestionData;
                let options = [];
                let correctAnswerValue;

                if (type === 'engToChi') {
                    correctAnswerValue = `${chi} (${pin})`;
                    options.push({ text: correctAnswerValue, isCorrect: true });
                    let defDistractors = [];
                    const tempList = currentVocabList.filter(item => item.chi !== chi);
                    while (defDistractors.length < 3 && tempList.length > 0) { // Get 3 distractors
                        const randIdx = Math.floor(Math.random() * tempList.length);
                        const distractor = tempList.splice(randIdx, 1)[0];
                        options.push({ text: `${distractor.chi} (${distractor.pin})`, isCorrect: false });
                        defDistractors.push(distractor);
                    }
                } else { 
                    correctAnswerValue = eng;
                    options.push({ text: eng, isCorrect: true });
                    generateSpellingDistractors(eng).forEach(d => options.push({ text: d, isCorrect: false }));
                }

                options = shuffleArray(options);
                
                if (gameMode === 1) {
                    // Render 1P Options (2x2 Grid or single column on mobile)
                    optionsContainer1p.innerHTML = '';
                    options.forEach((opt, index) => {
                        const choiceBtn = document.createElement('button');
                        choiceBtn.classList.add('choice-button', 'bg-white', 'text-slate-800', 'border-2', 'border-slate-200', 'hover:bg-emerald-50', 'hover:border-emerald-400', 'relative', 'shadow-sm', 'transition-all');
                        const innerHTML = opt.text.includes('(') ? 
                            `<div>${opt.text.substring(0, opt.text.indexOf('(')).trim()}</div><div class="pinyin !text-sm sm:!text-base">${opt.text.substring(opt.text.indexOf('(')).trim()}</div>`
                            : opt.text;
                        
                        choiceBtn.innerHTML = `<span class="absolute top-1.5 left-2 text-[10px] sm:text-xs opacity-40 bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono">[${index + 1}]</span>` + innerHTML;
                        
                        choiceBtn.addEventListener('click', () => checkAnswer('p1', opt.text, correctAnswerValue, choiceBtn));
                        optionsContainer1p.appendChild(choiceBtn);
                    });
                } else {
                    // Render 2P Split Screen Options
                    p1OptionsContainer.innerHTML = '';
                    options.forEach((opt, index) => {
                        const choiceBtn = document.createElement('button');
                        choiceBtn.classList.add('choice-button', 'bg-white', 'text-slate-800', 'border-2', 'border-slate-200', 'hover:bg-emerald-50', 'hover:border-emerald-400', 'relative', 'shadow-sm', 'transition-all');
                        const innerHTML = opt.text.includes('(') ? 
                            `<div>${opt.text.substring(0, opt.text.indexOf('(')).trim()}</div><div class="pinyin !text-sm sm:!text-base">${opt.text.substring(opt.text.indexOf('(')).trim()}</div>`
                            : opt.text;
                        
                        choiceBtn.innerHTML = `<span class="absolute top-1.5 left-2 text-[10px] sm:text-xs opacity-40 bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono">[${index + 1}]</span>` + innerHTML;
                        
                        choiceBtn.addEventListener('click', () => checkAnswer('p1', opt.text, correctAnswerValue, choiceBtn));
                        p1OptionsContainer.appendChild(choiceBtn);
                    });

                    p2OptionsContainer.innerHTML = '';
                    const p2KeyMap = ['7', '8', '9', '0'];
                    options.forEach((opt, index) => {
                        const choiceBtn = document.createElement('button');
                        choiceBtn.classList.add('choice-button', 'bg-white', 'text-slate-800', 'border-2', 'border-slate-200', 'hover:bg-blue-50', 'hover:border-blue-400', 'relative', 'shadow-sm', 'transition-all');
                        const innerHTML = opt.text.includes('(') ? 
                            `<div>${opt.text.substring(0, opt.text.indexOf('(')).trim()}</div><div class="pinyin !text-sm sm:!text-base">${opt.text.substring(opt.text.indexOf('(')).trim()}</div>`
                            : opt.text;
                        
                        choiceBtn.innerHTML = `<span class="absolute top-1.5 right-2 text-[10px] sm:text-xs opacity-40 bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono">[${p2KeyMap[index]}]</span>` + innerHTML;
                        
                        choiceBtn.addEventListener('click', () => checkAnswer('p2', opt.text, correctAnswerValue, choiceBtn));
                        p2OptionsContainer.appendChild(choiceBtn);
                    });
                }
                
                feedbackDisplay.textContent = gameMode === 1 ? 'Select the correct answer!' : 'Race to answer!';
                feedbackDisplay.className = "mt-4 text-xl sm:text-2xl font-bold text-slate-400 text-center min-h-[36px]";
                exampleSentenceFeedbackDisplay.classList.add('hidden');
                exampleSentenceFeedbackDisplay.textContent = '';
                
                startQuestionTimer();
            }
            
            function generateSpellingDistractors(correctWord) {
                const distractors = new Set();
                const len = correctWord.length;
                if (len <= 2) return [correctWord + "s", correctWord + "x", correctWord + "y"]; 

                // Generate 3 unique distractors
                while(distractors.size < 3) {
                    let strategy = Math.random();
                    let changed = correctWord;
                    if (strategy < 0.33 && len > 1) { // Swap
                        const i = Math.floor(Math.random() * (len - 1));
                        changed = correctWord.substring(0, i) + correctWord[i+1] + correctWord[i] + correctWord.substring(i+2);
                    } else if (strategy < 0.66 && len > 0) { // Mutate
                        const j = Math.floor(Math.random() * len);
                        const charCode = correctWord.charCodeAt(j);
                        const changedChar = (charCode === 97) ? String.fromCharCode(charCode + 1) : String.fromCharCode(charCode + (Math.random() < 0.5 ? 1 : -1)); 
                        changed = correctWord.substring(0, j) + changedChar + correctWord.substring(j+1);
                    } else { // Delete or Insert
                         if (len > 3 && Math.random() > 0.5) {
                             const k = Math.floor(Math.random() * len);
                             changed = correctWord.substring(0, k) + correctWord.substring(k+1); 
                         } else {
                             changed = correctWord + String.fromCharCode(97 + Math.floor(Math.random() * 26));
                         }
                    }
                    if (changed !== correctWord) distractors.add(changed);
                }
                return Array.from(distractors).slice(0, 3); 
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            function startQuestionTimer() {
                clearInterval(questionTimerInterval);
                gameData.timeLeft = TIME_PER_QUESTION;
                modalTimerDisplay.textContent = gameData.timeLeft;
                document.getElementById('header-timer-container').classList.remove('bg-rose-100', 'text-rose-700', 'border-rose-400');
                document.getElementById('header-timer-container').classList.add('bg-white', 'text-slate-800', 'border-slate-300');
                
                timerBar.style.width = '100%';
                timerBar.style.backgroundColor = '#10b981'; 

                questionTimerInterval = setInterval(() => {
                    gameData.timeLeft--;
                    modalTimerDisplay.textContent = gameData.timeLeft;
                    
                    const percentage = (gameData.timeLeft / TIME_PER_QUESTION) * 100;
                    timerBar.style.width = `${percentage}%`;

                    if (percentage < 30) {
                        timerBar.style.backgroundColor = '#f43f5e'; 
                        document.getElementById('header-timer-container').classList.add('bg-rose-100', 'text-rose-700', 'border-rose-400');
                        document.getElementById('header-timer-container').classList.remove('bg-white', 'text-slate-800', 'border-slate-300');
                    } else if (percentage < 60) {
                        timerBar.style.backgroundColor = '#f59e0b'; 
                    }

                    if (gameData.timeLeft <= 0) {
                        clearInterval(questionTimerInterval);
                        handleRoundEnd(null, null); // Time's up, nobody wins
                    }
                }, 1000);
            }

            function lockPlayerOptions(player) {
                gameData[player].locked = true;
                
                let containersToLock = [];
                if (gameMode === 1) {
                    containersToLock.push(optionsContainer1p);
                } else {
                    containersToLock.push(player === 'p1' ? p1OptionsContainer : p2OptionsContainer);
                }

                containersToLock.forEach(container => {
                    Array.from(container.children).forEach(btn => {
                        btn.disabled = true;
                        btn.classList.add('opacity-50', 'cursor-not-allowed');
                    });
                });
            }
            
            function lockAllOptions() {
                if (gameMode === 1) {
                    lockPlayerOptions('p1');
                } else {
                    lockPlayerOptions('p1');
                    lockPlayerOptions('p2');
                }
                roundActive = false;
            }

            function highlightCorrectAnswer(correctAnswerText) {
                const normalizedCorrect = correctAnswerText.replace(/\s+/g, '');
                
                const processButtons = (container, winColor, borderClass) => {
                    Array.from(container.children).forEach(btn => {
                        const btnText = btn.textContent.replace(/\[.\]/g, '').replace(/\s+/g, ''); // Remove key hints and spaces
                        if (btnText === normalizedCorrect) {
                            btn.classList.remove('bg-white', 'border-slate-200');
                            btn.classList.add(winColor, 'text-white', borderClass, 'shadow-lg', 'scale-[1.02]');
                        }
                    });
                };

                if (gameMode === 1) {
                    processButtons(optionsContainer1p, 'bg-emerald-500', 'border-emerald-600');
                } else {
                    processButtons(p1OptionsContainer, 'bg-emerald-500', 'border-emerald-600');
                    processButtons(p2OptionsContainer, 'bg-blue-500', 'border-blue-600');
                }
            }

            function checkAnswer(player, selectedAnswerText, correctAnswerText, buttonElement) {
                if (!roundActive || gameData[player].locked) return;
                
                const isCorrect = selectedAnswerText === correctAnswerText;

                if (isCorrect) {
                    clearInterval(questionTimerInterval);
                    handleRoundEnd(player, buttonElement);
                } else {
                    // INCORRECT LOGIC
                    gameData[player].score = Math.max(0, gameData[player].score - 1); 
                    
                    // Visual feedback for wrong button
                    buttonElement.classList.remove('bg-white', 'border-slate-200', 'hover:bg-emerald-50', 'hover:bg-blue-50');
                    buttonElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600', 'opacity-80', 'cursor-not-allowed', 'shake');
                    buttonElement.disabled = true;
                    
                    // Remove shake after animation completes
                    setTimeout(() => buttonElement.classList.remove('shake'), 400);

                    // Thud sound
                    const incorrectAudio = document.getElementById('incorrectSoundEffect');
                    if (incorrectAudio) {
                        incorrectAudio.currentTime = 0;
                        incorrectAudio.play().catch(e => console.warn(e));
                    }
                    
                    updateGameStatsDisplay();

                    if (gameMode === 1) {
                        // In 1P mode, don't lock all options, just let them try again.
                        // If they get it wrong, we just keep going until timer runs out or they find the right one.
                    } else {
                        // In 2P mode, lock that player's column
                        lockPlayerOptions(player);
                        // If both players are now locked out, end the round
                        if (gameData.p1.locked && gameData.p2.locked) {
                            clearInterval(questionTimerInterval);
                            handleRoundEnd(null, null);
                        }
                    }
                }
            }
            
            function handleRoundEnd(winningPlayer, winningButton) {
                roundActive = false;
                lockAllOptions();
                
                const correctAnswerText = currentQuestionData.type === 'engToChi' ? `${currentQuestionData.chi} (${currentQuestionData.pin})` : currentQuestionData.eng;
                
                if (winningPlayer) {
                    gameData[winningPlayer].score += 10;
                    const playerName = gameData[winningPlayer].name;
                    
                    let colorClass, bgClass1, bgClass2, winBtnColor, winBtnBorder;
                    if (gameMode === 1 || winningPlayer === 'p1') {
                        colorClass = 'text-emerald-600';
                        bgClass1 = 'bg-emerald-50';
                        bgClass2 = 'border-emerald-300';
                        winBtnColor = 'bg-emerald-500';
                        winBtnBorder = 'border-emerald-600';
                    } else {
                        colorClass = 'text-blue-600';
                        bgClass1 = 'bg-blue-50';
                        bgClass2 = 'border-blue-300';
                        winBtnColor = 'bg-blue-500';
                        winBtnBorder = 'border-blue-600';
                    }
                    
                    // Trigger the floating points animation
                    animatePoints(winningButton, winningPlayer);

                    feedbackDisplay.innerHTML = `<span class="${colorClass}">${gameMode === 1 ? 'Correct!' : playerName + ' got it!'} +10 Points</span>`;
                    
                    // Highlight the specific winning button and the main stimulus card
                    winningButton.classList.remove('bg-white', 'border-slate-200', 'hover:bg-emerald-50', 'hover:bg-blue-50');
                    winningButton.classList.add(winBtnColor, 'text-white', winBtnBorder, 'shadow-xl', 'scale-[1.05]', 'z-10', 'glitter');
                    
                    questionStimulusDisplay.classList.remove('bg-white');
                    questionStimulusDisplay.classList.add(bgClass1, bgClass2, 'scale-[1.02]');

                    const correctAudio = document.getElementById('correctSoundEffect');
                    if (correctAudio) {
                        correctAudio.currentTime = 0;
                        correctAudio.play().catch(e => console.warn(e));
                    }
                    
                    highlightCorrectAnswer(correctAnswerText); // Highlights the other side in 2P mode
                } else {
                    // Nobody won (time up or both wrong)
                    feedbackDisplay.innerHTML = `<span class="text-rose-500">Round Over! Nobody got it.</span>`;
                    highlightCorrectAnswer(correctAnswerText);
                }

                updateGameStatsDisplay();
                gameData.questionsAnswered++;
                currentQuestionIndexInShuffledList++; 

                exampleSentenceFeedbackDisplay.innerHTML = `<span class="font-bold">Sentence:</span> ${currentQuestionData.sentence}`;
                exampleSentenceFeedbackDisplay.classList.remove('hidden');

                // Auto advance after short delay
                autoAdvanceTimeout = setTimeout(() => {
                    startNewQuestionRound();
                }, 1800);
            }

            function endGame() {
                clearInterval(questionTimerInterval);
                clearTimeout(autoAdvanceTimeout);
                
                questionArea.classList.add('hidden'); 
                gameOverScreen.classList.remove('hidden');
                
                document.getElementById('final-p1-name').textContent = gameData.p1.name;
                document.getElementById('final-p1-score').textContent = gameData.p1.score;
                
                const finalP2Card = document.getElementById('final-p2-card');
                const announcement = document.getElementById('winner-announcement');

                if (gameMode === 2) {
                    finalP2Card.classList.remove('hidden');
                    document.getElementById('final-p2-name').textContent = gameData.p2.name;
                    document.getElementById('final-p2-score').textContent = gameData.p2.score;
                    
                    if (gameData.p1.score > gameData.p2.score) {
                        announcement.innerHTML = `<span class="text-emerald-600">${gameData.p1.name} Wins!</span> 🏆`;
                    } else if (gameData.p2.score > gameData.p1.score) {
                        announcement.innerHTML = `<span class="text-blue-600">${gameData.p2.name} Wins!</span> 🏆`;
                    } else {
                        announcement.innerHTML = `<span class="text-amber-500">It's a Tie!</span> 🤝`;
                    }
                } else {
                    finalP2Card.classList.add('hidden');
                    announcement.innerHTML = `<span class="text-emerald-600">Great Job!</span> 🎉`;
                }
                
                document.getElementById('final-total-questions').textContent = gameData.totalQuestions;
            }

            // Bind repeat audio to the 1P header button as well
            const repeatButton1p = document.getElementById('repeat-button-1p');
            if(repeatButton1p) {
                repeatButton1p.addEventListener('click', () => { 
                    if (currentQuestionData && currentQuestionData.sentence && currentQuestionData.eng) {
                        speak(`${currentQuestionData.eng}. ${currentQuestionData.sentence}`); 
                    }
                });
            }

        });
    </script>
</body>
</html>
