<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Collocation Challenge - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-text: #ffffff;
            --highlight: #e94560;
            --team1-color: #3a7bd5;
            --team2-color: #e94560;
            --correct: #28a745;
            --incorrect: #dc3545;
            --timer-bar-color: #4dffaf;
        }

        @keyframes backgroundShift {
            0% { background-color: #000000; }
            33% { background-color: #001f3f; } /* Dark Blue */
            66% { background-color: #3f0000; } /* Dark Red */
            100% { background-color: #000000; }
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: var(--primary-text);
            /* Slow background color shift */
            animation: backgroundShift 25s infinite alternate ease-in-out;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            /* Raised layout to decrease empty margin space */
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding: 2vh 10px 10px 10px;
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        .container {
            width: 95%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 3.2rem; margin-bottom: 5px; color: var(--highlight); }
        h2 { font-size: 2.2rem; color: var(--timer-bar-color); margin-top: 5px; margin-bottom: 5px; }
        p { font-size: 1.2rem; margin-bottom: 10px; }
        
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 10px;
            border: 2px solid var(--team1-color);
            background-color: rgba(22, 33, 62, 0.7);
            color: var(--primary-text);
            font-size: 1.2rem;
            box-sizing: border-box;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            background-color: var(--team1-color);
            color: var(--primary-text);
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover { transform: scale(1.03); }
        .btn.btn-t2 { background-color: var(--team2-color); }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .timer-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .timer-text {
            font-size: 2.2rem;
            font-weight: bold;
            min-width: 50px;
            color: var(--timer-bar-color);
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .timer {
            flex-grow: 1;
            height: 18px;
            background-color: rgba(22, 33, 62, 0.8);
            border-radius: 9px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: var(--timer-bar-color);
            border-radius: 9px;
            box-shadow: 0 0 10px var(--timer-bar-color);
        }

        .question-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 150px; /* Increased min-height to ensure space for translation */
        }

        /* Increased font sizes by 30% */
        .sentence-container {
            font-size: 2.6rem; 
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        
        .translation-container {
            font-size: 1.8rem;
            color: #4dffaf;
            font-weight: bold;
            display: none;
            margin-top: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            min-height: 35px; /* Pre-allocate space to prevent jumping */
        }

        .options-container { width: 100%; display: grid; gap: 10px; grid-template-columns: 1fr; }

        .option-btn {
            width: 100%;
            min-height: 70px;
            padding: 15px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background-color: rgba(22, 33, 62, 0.9);
            color: var(--primary-text);
            font-size: 2.3rem; /* Increased 30% */
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        @keyframes popCorrect {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--correct); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px var(--correct); }
            100% { transform: scale(1.02); box-shadow: 0 0 20px var(--correct); }
        }

        @keyframes shakeIncorrect {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .option-btn.correct { 
            background-color: var(--correct); 
            border-color: #fff; 
            transform: scale(1.02); 
            animation: popCorrect 0.5s ease-out forwards;
        }
        
        .option-btn.incorrect { 
            background-color: var(--incorrect); 
            border-color: #fff; 
            opacity: 0.8;
            animation: shakeIncorrect 0.4s ease-in-out;
        }
        
        .option-btn:disabled { cursor: not-allowed; }

        #game-container-2p {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        .player-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            background-color: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }

        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }

        @media (max-width: 768px) {
            #game-container-2p { flex-direction: column; overflow-y: auto;}
            .player-panel { min-height: 500px; }
            h1 { font-size: 2.2rem; }
            .sentence-container { font-size: 1.8rem; }
            .option-btn { font-size: 1.6rem; }
            .translation-container { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div id="main-menu" class="screen active">
        <div class="container">
            <h1>Collocations</h1>
            <p>Master English Vocabulary!</p>
            
            <div class="input-group">
                <input type="text" id="p1-name" placeholder="Player 1">
                <input type="text" id="p2-name" placeholder="Player 2">
            </div>

            <div class="toggle-container">
                <input type="checkbox" id="tts-toggle" checked>
                <label for="tts-toggle">Read Sentences Aloud</label>
            </div>

            <button id="start-1p-btn" class="btn">Play Solo Mode</button>
            <button id="start-2p-btn" class="btn btn-t2">Play Versus Mode</button>
        </div>
    </div>

    <div id="game-screen-1p" class="screen">
        <div class="container">
            <div class="hud">
                <div>Score: <span id="score-1p" style="color:var(--timer-bar-color)">0</span></div>
                <div>Level: <span id="current-level-1p">A1</span> (<span id="q-progress-1p">0</span>/10)</div>
            </div>
            
            <div class="timer-container">
                <div id="timer-text-1p" class="timer-text">10</div>
                <div class="timer">
                    <div id="timer-bar-1p" class="timer-bar"></div>
                </div>
            </div>

            <div class="question-container">
                <div id="sentence-1p" class="sentence-container"></div>
                <div id="translation-1p" class="translation-container"></div>
            </div>

            <div id="options-1p" class="options-container"></div>
        </div>
    </div>

    <div id="game-screen-2p" class="screen">
        <div id="game-container-2p">
            <!-- Player 1 Panel -->
            <div class="player-panel" style="border-color: var(--team1-color);">
                <div class="hud">
                    <div id="team1-name-hud" style="color: var(--team1-color);">Player 1</div>
                    <div id="team1-level-hud">Lvl A1 (0/10)</div>
                    <div id="team1-score">Score: 0</div>
                </div>
                <div class="timer-container">
                    <div id="timer-text-t1" class="timer-text">10</div>
                    <div class="timer">
                        <div id="timer-bar-t1" class="timer-bar" style="background-color: var(--team1-color); box-shadow: 0 0 10px var(--team1-color);"></div>
                    </div>
                </div>
                <div class="question-container">
                    <div id="sentence-t1" class="sentence-container"></div>
                    <div id="translation-t1" class="translation-container"></div>
                </div>
                <div id="options-t1" class="options-container"></div>
            </div>

            <!-- Player 2 Panel -->
            <div class="player-panel" style="border-color: var(--team2-color);">
                <div class="hud">
                    <div id="team2-name-hud" style="color: var(--team2-color);">Player 2</div>
                    <div id="team2-level-hud">Lvl A1 (0/10)</div>
                    <div id="team2-score">Score: 0</div>
                </div>
                <div class="timer-container">
                    <div id="timer-text-t2" class="timer-text">10</div>
                    <div class="timer">
                        <div id="timer-bar-t2" class="timer-bar" style="background-color: var(--team2-color); box-shadow: 0 0 10px var(--team2-color);"></div>
                    </div>
                </div>
                <div class="question-container">
                    <div id="sentence-t2" class="sentence-container"></div>
                    <div id="translation-t2" class="translation-container"></div>
                </div>
                <div id="options-t2" class="options-container"></div>
            </div>
        </div>
    </div>

    <div id="winner-screen" class="screen">
        <div class="container">
            <h1 id="winner-declaration">Game Over</h1>
            <h2 id="score-summary" style="margin-bottom: 30px;"></h2>
            <button id="play-again-btn" class="btn">Return to Menu</button>
        </div>
    </div>

                    { sentence: "He was asked to ___ a presentation to the board.", options: ["give", "make", "do", "tell"], answer: "give", cn: "他被要求向董事会做报告。" },
                    { sentence: "We need to ___ the issue immediately.", options: ["address", "solve", "do", "make"], answer: "address", cn: "我们需要立即解决这个问题。" },
                    { sentence: "She's trying to ___ fit by going to the gym.", options: ["keep", "stay", "be", "get"], answer: "keep", cn: "她试图通过去健身房来保持健康。" },
                    { sentence: "We need to ___ a solution to this problem.", options: ["find", "get", "do", "make"], answer: "find", cn: "我们需要找到解决这个问题的方法。" },
                    { sentence: "He's trying to ___ his fear of flying.", options: ["overcome", "beat", "win", "get"], answer: "overcome", cn: "他正试图克服对飞行的恐惧。" },
                    { sentence: "Let's ___ an end to this argument.", options: ["put", "make", "do", "have"], answer: "put", cn: "让我们结束这场争论吧。" },
                    { sentence: "He decided to ___ a career in medicine.", options: ["pursue", "follow", "chase", "take"], answer: "pursue", cn: "他决定从事医学事业。" }
                ],
                "B2": [
                    { sentence: "The athlete is trying to ___ a new world record.", options: ["break", "smash", "beat", "hit"], answer: "break", cn: "这位运动员正试图打破一项新的世界纪录。" },
                    { sentence: "We need to ___ awareness about climate change.", options: ["raise", "grow", "lift", "build"], answer: "raise", cn: "我们需要提高对气候变化的认识。" },
                    { sentence: "I have to work late to ___ the deadline.", options: ["meet", "reach", "achieve", "do"], answer: "meet", cn: "我必须加班才能赶上截止日期。" },
                    { sentence: "After analyzing the data, we can ___ a conclusion.", options: ["draw", "make", "pull", "take"], answer: "draw", cn: "在分析数据后，我们可以得出一个结论。" },
                    { sentence: "Working from home is a ___ alternative to commuting.", options: ["viable", "valid", "living", "working"], answer: "viable", cn: "在家工作是通勤的可行替代方案。" },
                    { sentence: "The new policy caused a ___ debate in parliament.", options: ["heated", "hot", "warm", "strong"], answer: "heated", cn: "新政策在议会引起了激烈的辩论。" },
                    { sentence: "She has a ___ interest in the company's success.", options: ["vested", "strong", "deep", "main"], answer: "vested", cn: "她与公司的成功有着既得利益。" },
                    { sentence: "It was a ___ conclusion that she would win the election.", options: ["foregone", "finished", "final", "forward"], answer: "foregone", cn: "她会赢得选举，这早就是预料之中的事了。" },
                    { sentence: "After a long negotiation, they ___ to an agreement.", options: ["came", "got", "arrived", "went"], answer: "came", cn: "经过漫长的谈判，他们达成了一致。" },
                    { sentence: "You should take ___ account his lack of experience.", options: ["into", "on", "for", "with"], answer: "into", cn: "你应该考虑到他缺乏经验。" },
                    { sentence: "I am ___ concerned about his health.", options: ["deeply", "fully", "highly", "truly"], answer: "deeply", cn: "我非常担心他的健康。" },
                    { sentence: "You must be ___ aware of the risks involved.", options: ["fully", "deeply", "truly", "absolutely"], answer: "fully", cn: "你必须充分认识到所涉及的风险。" },
                    { sentence: "The government needs to ___ the problem of unemployment.", options: ["tackle", "face", "do", "make"], answer: "tackle", cn: "政府需要解决失业问题。" },
                    { sentence: "She had to ___ a choice between her career and family.", options: ["make", "do", "take", "get"], answer: "make", cn: "她必须在事业和家庭之间做出选择。" },
                    { sentence: "The team needs to ___ a consensus before moving forward.", options: ["reach", "get", "do", "make"], answer: "reach", cn: "团队在继续前进之前需要达成共识。" },
                    { sentence: "He was forced to ___ a statement to the press.", options: ["issue", "make", "do", "give"], answer: "issue", cn: "他被迫向媒体发表声明。" },
                    { sentence: "The new law will ___ into effect next month.", options: ["come", "go", "get", "be"], answer: "come", cn: "新法律将于下个月生效。" },
                    { sentence: "She's trying to ___ a balance between work and life.", options: ["strike", "make", "do", "get"], answer: "strike", cn: "她试图在工作和生活之间取得平衡。" },
                    { sentence: "He ___ his concern about the company's future.", options: ["expressed", "said", "told", "gave"], answer: "expressed", cn: "他表达了对公司未来的担忧。" },
                    { sentence: "The company is trying to ___ its market share.", options: ["increase", "grow", "raise", "get"], answer: "increase", cn: "公司正试图增加其市场份额。" },
                    { sentence: "She ___ a risk by investing in the new startup.", options: ["took", "made", "did", "got"], answer: "took", cn: "她投资这家新初创公司冒了风险。" },
                    { sentence: "He needs to ___ an example for the younger players.", options: ["set", "make", "do", "give"], answer: "set", cn: "他需要为年轻球员树立一个榜样。" },
                    { sentence: "The new policy will ___ a threat to small businesses.", options: ["pose", "make", "do", "give"], answer: "pose", cn: "新政策将对小企业构成威胁。" },
                    { sentence: "She's trying to ___ her professional network.", options: ["expand", "grow", "raise", "get"], answer: "expand", cn: "她正试图扩大她的专业网络。" },
                    { sentence: "We must ___ the opportunity to innovate.", options: ["seize", "grab", "take", "get"], answer: "seize", cn: "我们必须抓住创新的机会。" }
                ]
            };

            const TIME_PER_QUESTION = 10;
            const REVIEW_DELAY = 3000;
            const PTS_CORRECT = 10;
            const Q_PER_LEVEL = 10; // Standardized question count for both modes
            const LEVEL_ORDER = ["A1", "A2", "B1", "B2"];

            const screens = {
                menu: document.getElementById('main-menu'),
                p1: document.getElementById('game-screen-1p'),
                p2: document.getElementById('game-screen-2p'),
                winner: document.getElementById('winner-screen')
            };

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();

            function playNativeSound(type) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); // C6
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'incorrect') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'levelup') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.8);
                } else if (type === 'end') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.0);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
                    osc.start(); osc.stop(audioCtx.currentTime + 1.0);
                }
            }

            let availableVoices = [];
            const ttsToggle = document.getElementById('tts-toggle');
            
            function populateVoiceList() {
                availableVoices = speechSynthesis.getVoices();
            }
            populateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoiceList;
            }

            function speakText(text) {
                if (!ttsToggle.checked || !text) return;
                speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                const preferredVoice = availableVoices.find(v => v.name.includes('Microsoft') && v.lang.includes('en')) || 
                                       availableVoices.find(v => v.name.includes('Google') && v.lang.includes('en'));
                if (preferredVoice) utterance.voice = preferredVoice;
                speechSynthesis.speak(utterance);
            }

            function switchScreen(screenName) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens[screenName].classList.add('active');
            }

            let state1P = {
                score: 0, levelIdx: 0, qCount: 0, 
                currentQ: null, queue: [], timer: null, interval: null
            };

            document.getElementById('start-1p-btn').addEventListener('click', () => {
                state1P = { score: 0, levelIdx: 0, qCount: 0, currentQ: null, queue: [], timer: null, interval: null };
                buildQueue1P();
                updateHUD1P();
                switchScreen('p1');
                loadNext1P();
            });

            function buildQueue1P() {
                let lvl = LEVEL_ORDER[state1P.levelIdx];
                state1P.queue = [...collocations[lvl]].sort(() => Math.random() - 0.5);
                state1P.qCount = 0;
            }

            function updateHUD1P() {
                document.getElementById('score-1p').textContent = state1P.score;
                document.getElementById('current-level-1p').textContent = LEVEL_ORDER[state1P.levelIdx];
                document.getElementById('q-progress-1p').textContent = state1P.qCount;
            }

            function loadNext1P() {
                document.getElementById('translation-1p').style.display = 'none';
                if (state1P.qCount >= Q_PER_LEVEL || state1P.queue.length === 0) {
                    state1P.levelIdx++;
                    if (state1P.levelIdx >= LEVEL_ORDER.length) {
                        endGame(`Single Player Complete!`);
                        return;
                    }
                    playNativeSound('levelup');
                    buildQueue1P();
                }

                state1P.currentQ = state1P.queue.shift();
                state1P.qCount++;
                updateHUD1P();

                document.getElementById('sentence-1p').innerHTML = state1P.currentQ.sentence;
                const optsContainer = document.getElementById('options-1p');
                optsContainer.innerHTML = '';
                
                const shuffled = [...state1P.currentQ.options].sort(() => Math.random() - 0.5);
                shuffled.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => handleAns1P(btn);
                    optsContainer.appendChild(btn);
                });

                startTimer1P();
            }

            function startTimer1P() {
                clearInterval(state1P.interval);
                clearTimeout(state1P.timer);
                
                let timeLeft = TIME_PER_QUESTION;
                const textEl = document.getElementById('timer-text-1p');
                const barEl = document.getElementById('timer-bar-1p');
                
                textEl.textContent = timeLeft;
                barEl.style.transition = 'none';
                barEl.style.width = '100%';
                
                setTimeout(() => {
                    barEl.style.transition = `width ${TIME_PER_QUESTION}s linear`;
                    barEl.style.width = '0%';
                }, 50);

                state1P.interval = setInterval(() => {
                    timeLeft--;
                    textEl.textContent = timeLeft > 0 ? timeLeft : 0;
                    if(timeLeft <= 0) {
                        clearInterval(state1P.interval);
                        handleAns1P(null); // Time out
                    }
                }, 1000);
            }

            function handleAns1P(btn) {
                clearInterval(state1P.interval);
                clearTimeout(state1P.timer);
                
                const barEl = document.getElementById('timer-bar-1p');
                barEl.style.transition = 'none';
                barEl.style.width = window.getComputedStyle(barEl).width;

                const isCorrect = btn && btn.textContent === state1P.currentQ.answer;
                const fullSentence = state1P.currentQ.sentence.replace('___', state1P.currentQ.answer);

                Array.from(document.getElementById('options-1p').children).forEach(b => {
                    b.disabled = true;
                    if(b.textContent === state1P.currentQ.answer) b.classList.add('correct');
                });

                const transEl = document.getElementById('translation-1p');
                transEl.textContent = state1P.currentQ.cn || "Translation unavailable.";
                transEl.style.display = 'block';

                if(isCorrect) {
                    state1P.score += PTS_CORRECT;
                    btn.classList.add('correct');
                    playNativeSound('correct');
                    document.getElementById('sentence-1p').innerHTML = state1P.currentQ.sentence.replace('___', `<span style="color:var(--correct); border-bottom: 2px solid var(--correct);">${state1P.currentQ.answer}</span>`);
                } else {
                    playNativeSound('incorrect');
                    if(btn) btn.classList.add('incorrect');
                    document.getElementById('sentence-1p').innerHTML = state1P.currentQ.sentence.replace('___', `<span style="color:var(--incorrect); border-bottom: 2px solid var(--incorrect);">${state1P.currentQ.answer}</span>`);
                }

                updateHUD1P();
                speakText(fullSentence);
                
                // Allow players to review the answer and hear the sentence
                state1P.timer = setTimeout(loadNext1P, REVIEW_DELAY);
            }

            class PlayerState {
                constructor(prefix, name) {
                    this.prefix = prefix;
                    this.name = name;
                    this.score = 0;
                    this.levelIdx = 0;
                    this.qCount = 0;
                    this.queue = [];
                    this.currentQ = null;
                    this.timer = null;
                    this.interval = null;
                    this.isFinished = false;
                }
            }

            let p1, p2;

            document.getElementById('start-2p-btn').addEventListener('click', () => {
                let n1 = document.getElementById('p1-name').value || "Player 1";
                let n2 = document.getElementById('p2-name').value || "Player 2";
                
                document.getElementById('team1-name-hud').textContent = n1;
                document.getElementById('team2-name-hud').textContent = n2;

                p1 = new PlayerState('t1', n1);
                p2 = new PlayerState('t2', n2);
                
                buildQueue2P(p1); buildQueue2P(p2);
                updateHUD2P(p1); updateHUD2P(p2);
                switchScreen('p2');
                
                loadNext2P(p1);
                loadNext2P(p2);
            });
            
            function buildQueue2P(p) {
                let lvl = LEVEL_ORDER[p.levelIdx];
                p.queue = [...collocations[lvl]].sort(() => Math.random() - 0.5);
                p.qCount = 0;
            }

            function updateHUD2P(p) {
                document.getElementById(`team${p.prefix === 't1' ? '1' : '2'}-score`).textContent = `Score: ${p.score}`;
                document.getElementById(`team${p.prefix === 't1' ? '1' : '2'}-level-hud`).textContent = `Lvl ${LEVEL_ORDER[p.levelIdx]} (${p.qCount}/10)`;
            }

            function loadNext2P(p) {
                document.getElementById(`translation-${p.prefix}`).style.display = 'none';

                if (p.qCount >= Q_PER_LEVEL || p.queue.length === 0) {
                    p.levelIdx++;
                    if (p.levelIdx >= LEVEL_ORDER.length) {
                        p.isFinished = true;
                        document.getElementById(`sentence-${p.prefix}`).innerHTML = "Finished!<br>Waiting for opponent...";
                        document.getElementById(`options-${p.prefix}`).innerHTML = "";
                        document.getElementById(`timer-bar-${p.prefix}`).style.width = '0%';
                        if (p1.isFinished && p2.isFinished) {
                            endGame(`Versus Match Over!`);
                        }
                        return;
                    }
                    if (p.prefix === 't1' || p.prefix === 't2') playNativeSound('levelup');
                    buildQueue2P(p);
                }

                p.currentQ = p.queue.shift();
                p.qCount++;
                updateHUD2P(p);
                
                document.getElementById(`sentence-${p.prefix}`).innerHTML = p.currentQ.sentence;
                const optsContainer = document.getElementById(`options-${p.prefix}`);
                optsContainer.innerHTML = '';
                
                const shuffled = [...p.currentQ.options].sort(() => Math.random() - 0.5);
                shuffled.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => handleAns2P(p, btn);
                    optsContainer.appendChild(btn);
                });

                startTimer2P(p);
            }

            function startTimer2P(p) {
                clearInterval(p.interval);
                clearTimeout(p.timer);
                
                let timeLeft = TIME_PER_QUESTION;
                const textEl = document.getElementById(`timer-text-${p.prefix}`);
                const barEl = document.getElementById(`timer-bar-${p.prefix}`);
                
                textEl.textContent = timeLeft;
                barEl.style.transition = 'none';
                barEl.style.width = '100%';
                
                setTimeout(() => {
                    barEl.style.transition = `width ${TIME_PER_QUESTION}s linear`;
                    barEl.style.width = '0%';
                }, 50);

                p.interval = setInterval(() => {
                    timeLeft--;
                    textEl.textContent = timeLeft > 0 ? timeLeft : 0;
                    if(timeLeft <= 0) {
                        clearInterval(p.interval);
                        handleAns2P(p, null); // Time out
                    }
                }, 1000);
            }

            function handleAns2P(p, btn) {
                clearInterval(p.interval);
                clearTimeout(p.timer);
                
                const barEl = document.getElementById(`timer-bar-${p.prefix}`);
                barEl.style.transition = 'none';
                barEl.style.width = window.getComputedStyle(barEl).width;

                const isCorrect = btn && btn.textContent === p.currentQ.answer;
                const fullSentence = p.currentQ.sentence.replace('___', p.currentQ.answer);

                Array.from(document.getElementById(`options-${p.prefix}`).children).forEach(b => {
                    b.disabled = true;
                    if(b.textContent === p.currentQ.answer) b.classList.add('correct');
                });

                const transEl = document.getElementById(`translation-${p.prefix}`);
                transEl.textContent = p.currentQ.cn || "Translation unavailable.";
                transEl.style.display = 'block';

                if(isCorrect) {
                    p.score += PTS_CORRECT;
                    btn.classList.add('correct');
                    playNativeSound('correct');
                    document.getElementById(`sentence-${p.prefix}`).innerHTML = p.currentQ.sentence.replace('___', `<span style="color:var(--correct); border-bottom: 2px solid var(--correct);">${p.currentQ.answer}</span>`);
                } else {
                    playNativeSound('incorrect');
                    if(btn) btn.classList.add('incorrect');
                    document.getElementById(`sentence-${p.prefix}`).innerHTML = p.currentQ.sentence.replace('___', `<span style="color:var(--incorrect); border-bottom: 2px solid var(--incorrect);">${p.currentQ.answer}</span>`);
                }

                updateHUD2P(p);
                speakText(fullSentence);
                p.timer = setTimeout(() => loadNext2P(p), REVIEW_DELAY);
            }

            function endGame(title) {
                playNativeSound('end');
                document.getElementById('winner-declaration').textContent = title;
                
                const summaryEl = document.getElementById('score-summary');
                if(screens.p1.classList.contains('active')) {
                    summaryEl.innerHTML = `Final Score: <span style="color:var(--timer-bar-color)">${state1P.score}</span>`;
                } else {
                    let winnerText = p1.score > p2.score ? `<span style="color:var(--team1-color)">${p1.name} Wins!</span>` : 
                                     p2.score > p1.score ? `<span style="color:var(--team2-color)">${p2.name} Wins!</span>` : 
                                     "It's a Tie!";

                    summaryEl.innerHTML = `
                        ${winnerText}<br>
                        <span style="color:var(--team1-color); font-size:1.8rem;">${p1.name}: ${p1.score}</span> 
                        <br>vs<br> 
                        <span style="color:var(--team2-color); font-size:1.8rem;">${p2.name}: ${p2.score}</span>
                    `;
                }
                
                switchScreen('winner');
            }

            document.getElementById('play-again-btn').addEventListener('click', () => {
                switchScreen('menu');
            });
        });
    </script>
</body>
</html>
