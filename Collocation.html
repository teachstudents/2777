<html lang="en">

    <style>
        :root {
            --primary-text: #ffffff;
            --highlight: #e94560;
            --team1-color: #3a7bd5;
            --team2-color: #e94560;
            --correct: #28a745;
            --incorrect: #dc3545;
            --timer-bar-color: #4dffaf;
        }

        @keyframes backgroundShift {
            0% { background-color: #000000; }
            33% { background-color: #0f172a; } /* Dark Blue */
            66% { background-color: #2e0911; } /* Dark Red */
            100% { background-color: #000000; }
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: var(--primary-text);
            animation: backgroundShift 25s infinite alternate ease-in-out;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: flex-start; /* Raised to top */
            align-items: center;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        .container {
            width: 95%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px; /* Reduced top margin */
        }

        h1 { font-size: 3.2rem; margin-bottom: 5px; color: var(--highlight); }
        h2 { font-size: 2.2rem; color: var(--timer-bar-color); margin-top: 5px; margin-bottom: 5px; }
        p { font-size: 1.2rem; margin-bottom: 10px; }
        
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 10px;
            border: 2px solid var(--team1-color);
            background-color: rgba(22, 33, 62, 0.7);
            color: var(--primary-text);
            font-size: 1.2rem;
            box-sizing: border-box;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            background-color: var(--team1-color);
            color: var(--primary-text);
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover { transform: scale(1.03); }
        .btn.btn-t2 { background-color: var(--team2-color); }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .timer-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .timer-text {
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 45px;
            color: var(--timer-bar-color);
        }

        .timer {
            flex-grow: 1;
            height: 14px;
            background-color: rgba(22, 33, 62, 0.8);
            border-radius: 7px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: var(--timer-bar-color);
            border-radius: 7px;
            box-shadow: 0 0 10px var(--timer-bar-color);
        }

        .question-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            min-height: 90px;
        }

        .sentence-container {
            font-size: 2.08rem; /* Increased 30% from 1.6 */
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 5px;
        }
        
        .translation-container {
            font-size: 1.56rem;
            color: #4dffaf;
            font-weight: bold;
            display: none;
            margin-top: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .options-container { width: 100%; }

        .option-btn {
            width: 100%;
            min-height: 60px;
            padding: 15px;
            margin-bottom: 10px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background-color: rgba(22, 33, 62, 0.7);
            color: var(--primary-text);
            font-size: 1.82rem; /* Increased 30% from 1.4 */
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        @keyframes popCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1.02); }
        }

        .option-btn.correct { 
            background-color: var(--correct); 
            border-color: #fff; 
            transform: scale(1.02); 
            box-shadow: 0 0 20px var(--correct);
            animation: popCorrect 0.4s ease-out;
        }
        
        .option-btn.incorrect { 
            background-color: var(--incorrect); 
            border-color: #fff; 
            opacity: 0.8;
        }
        
        .option-btn:disabled { cursor: not-allowed; }

        #game-container-2p {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

            flex: 1;

            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            background-color: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }

                    { sentence: "You must be ___ aware of the risks involved.", options: ["fully", "deeply", "truly", "absolutely"], answer: "fully", cn: "你必须充分认识到所涉及的风险。" },

                    { sentence: "The scientist is about to ___ an experiment.", options: ["conduct", "do", "make", "get"], answer: "conduct", cn: "科学家即将进行一项实验。" },
                    { sentence: "She ___ a commitment to finish the project on time.", options: ["made", "did", "gave", "took"], answer: "made", cn: "她做出了按时完成项目的承诺。" },
                    { sentence: "He's trying to ___ an advantage over his competitors.", options: ["gain", "get", "win", "take"], answer: "gain", cn: "他试图获得优于竞争对手的优势。" },
                    { sentence: "We need to ___ a thorough investigation.", options: ["carry out", "do", "make", "get"], answer: "carry out", cn: "我们需要进行彻底的调查。" },
                    { sentence: "She ___ a key role in the negotiations.", options: ["played", "did", "made", "had"], answer: "played", cn: "她在谈判中发挥了关键作用。" },
                    { sentence: "He needs to ___ the necessary arrangements.", options: ["make", "do", "get", "take"], answer: "make", cn: "他需要做出必要的安排。" },
                    { sentence: "The company needs to ___ costs to stay profitable.", options: ["cut", "reduce", "lower", "drop"], answer: "cut", cn: "公司需要削减成本以保持盈利。" },
                    { sentence: "The new evidence ___ serious doubts on his theory.", options: ["casts", "throws", "puts", "makes"], answer: "casts", cn: "新证据对他的理论提出了严重质疑。" },
                    { sentence: "We must ___ the opportunity to innovate.", options: ["seize", "grab", "take", "get"], answer: "seize", cn: "我们必须抓住创新的机会。" },
                    { sentence: "The politician refused to ___ his position.", options: ["clarify", "explain", "define", "show"], answer: "clarify", cn: "这位政治家拒绝澄清他的立场。" },
                    { sentence: "The report ___ the importance of early intervention.", options: ["highlights", "shows", "points", "marks"], answer: "highlights", cn: "报告强调了早期干预的重要性。" },
                    { sentence: "The company decided to ___ its operations.", options: ["streamline", "simplify", "shorten", "reduce"], answer: "streamline", cn: "公司决定精简其运营。" }
                ]
            };

            const TIME_PER_QUESTION = 10;
            const REVIEW_DELAY = 3000;
            const PTS_CORRECT = 10;
            const Q_PER_LEVEL = 10;
            const LEVEL_ORDER = ["A1", "A2", "B1", "B2"];

            const screens = {
                menu: document.getElementById('main-menu'),
                p1: document.getElementById('game-screen-1p'),
                p2: document.getElementById('game-screen-2p'),
                winner: document.getElementById('winner-screen')
            };

            function playSound(id) {
                const el = document.getElementById('snd-' + id);
                if(el) { el.currentTime = 0; el.play().catch(e=>{}); }
            }

            let availableVoices = [];
            const ttsToggle = document.getElementById('tts-toggle');
            
            function populateVoiceList() {
                availableVoices = speechSynthesis.getVoices();
            }
            populateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoiceList;
            }

            function speakText(text) {
                if (!ttsToggle.checked || !text) return;
                const utterance = new SpeechSynthesisUtterance(text);
                const preferredVoice = availableVoices.find(v => v.name.includes('Microsoft') && v.lang.includes('en')) || 
                                       availableVoices.find(v => v.name.includes('Google') && v.lang.includes('en'));
                if (preferredVoice) utterance.voice = preferredVoice;
                speechSynthesis.speak(utterance);
            }

            function switchScreen(screenName) {
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens[screenName].classList.add('active');
            }

            let state1P = {
                score: 0, combo: 0, levelIdx: 0, qCount: 0, 
                currentQ: null, queue: [], timer: null, interval: null
            };

            document.getElementById('start-1p-btn').addEventListener('click', () => {
                let name = document.getElementById('p1-name').value || "Player 1";
                state1P = { score: 0, combo: 0, levelIdx: 0, qCount: 0, currentQ: null, queue: [], timer: null, interval: null };
                buildQueue1P();
                updateHUD1P();
                switchScreen('p1');
                loadNext1P();
            });

            function buildQueue1P() {
                let lvl = LEVEL_ORDER[state1P.levelIdx];
                state1P.queue = [...collocations[lvl]].sort(() => Math.random() - 0.5);
                state1P.qCount = 0;
            }

            function updateHUD1P() {
                document.getElementById('score-1p').textContent = state1P.score;
                document.getElementById('current-level-1p').textContent = LEVEL_ORDER[state1P.levelIdx];
                document.getElementById('q-progress-1p').textContent = state1P.qCount;
                
                const comboEl = document.getElementById('combo-multiplier-1p');
                if(state1P.combo > 1) {
                    comboEl.style.display = 'block';
                    document.getElementById('combo-count-1p').textContent = state1P.combo;
                } else {
                    comboEl.style.display = 'none';
                }
            }

            function loadNext1P() {
                document.getElementById('translation-1p').style.display = 'none';
                if (state1P.qCount >= Q_PER_LEVEL || state1P.queue.length === 0) {
                    state1P.levelIdx++;
                    if (state1P.levelIdx >= LEVEL_ORDER.length) {
                        endGame(`Single Player Complete!`);
                        return;
                    }
                    buildQueue1P();
                }

                state1P.currentQ = state1P.queue.shift();
                state1P.qCount++;
                updateHUD1P();

                document.getElementById('sentence-1p').innerHTML = state1P.currentQ.sentence;
                const optsContainer = document.getElementById('options-1p');
                optsContainer.innerHTML = '';
                
                const shuffled = [...state1P.currentQ.options].sort(() => Math.random() - 0.5);
                shuffled.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => handleAns1P(btn);
                    optsContainer.appendChild(btn);
                });

                startTimer1P();
            }

            function startTimer1P() {
                clearInterval(state1P.interval);
                clearTimeout(state1P.timer);
                
                let timeLeft = TIME_PER_QUESTION;
                const textEl = document.getElementById('timer-text-1p');
                const barEl = document.getElementById('timer-bar-1p');
                
                textEl.textContent = timeLeft;
                barEl.style.transition = 'none';
                barEl.style.width = '100%';
                
                setTimeout(() => {
                    barEl.style.transition = `width ${TIME_PER_QUESTION}s linear`;
                    barEl.style.width = '0%';
                }, 50);

                state1P.interval = setInterval(() => {
                    timeLeft--;
                    textEl.textContent = timeLeft > 0 ? timeLeft : 0;
                    if(timeLeft <= 0) clearInterval(state1P.interval);
                }, 1000);

                state1P.timer = setTimeout(() => handleAns1P(null), TIME_PER_QUESTION * 1000);
            }

            function handleAns1P(btn) {
                clearInterval(state1P.interval);
                clearTimeout(state1P.timer);
                
                const barEl = document.getElementById('timer-bar-1p');
                barEl.style.transition = 'none';
                barEl.style.width = window.getComputedStyle(barEl).width;

                const isCorrect = btn && btn.textContent === state1P.currentQ.answer;
                const fullSentence = state1P.currentQ.sentence.replace('___', state1P.currentQ.answer);

                Array.from(document.getElementById('options-1p').children).forEach(b => {
                    b.disabled = true;
                    if(b.textContent === state1P.currentQ.answer) b.classList.add('correct');
                });

                const transEl = document.getElementById('translation-1p');
                transEl.textContent = state1P.currentQ.cn;
                transEl.style.display = 'block';

                if(isCorrect) {
                    state1P.combo++;
                    state1P.score += PTS_CORRECT + state1P.combo;
                    btn.classList.add('correct');
                    playSound('correct');
                    document.getElementById('sentence-1p').innerHTML = state1P.currentQ.sentence.replace('___', `<span style="color:var(--correct); border-bottom: 2px solid var(--correct);">${state1P.currentQ.answer}</span>`);
                } else {
                    state1P.combo = 0;
                    playSound('incorrect');
                    if(btn) btn.classList.add('incorrect');
                    document.getElementById('sentence-1p').innerHTML = state1P.currentQ.sentence.replace('___', `<span style="color:var(--incorrect); border-bottom: 2px solid var(--incorrect);">${state1P.currentQ.answer}</span>`);
                }

                updateHUD1P();
                speakText(fullSentence);
                setTimeout(loadNext1P, REVIEW_DELAY);
            }

            class PlayerState {
                constructor(prefix, name) {
                    this.prefix = prefix;
                    this.name = name;
                    this.score = 0;
                    this.qCount = 0;
                    this.queue = [];
                    this.currentQ = null;
                    this.timer = null;
                    this.interval = null;
                    this.isFinished = false;

                    // Build random queue from ALL levels for frantic 2P
                    let allQ = [];
                    for(let k in collocations) allQ = allQ.concat(collocations[k]);
                    this.queue = allQ.sort(() => Math.random() - 0.5).slice(0, 15); // 15 questions each
                }
            }

            let p1, p2;

            document.getElementById('start-2p-btn').addEventListener('click', () => {
                let n1 = document.getElementById('p1-name').value || "Player 1";
                let n2 = document.getElementById('p2-name').value || "Player 2";
                
                document.getElementById('team1-name-hud').textContent = n1;
                document.getElementById('team2-name-hud').textContent = n2;

                p1 = new PlayerState('t1', n1);
                p2 = new PlayerState('t2', n2);

                updateHUD2P(p1); updateHUD2P(p2);
                switchScreen('p2');
                
                loadNext2P(p1);
                loadNext2P(p2);
            });

            function updateHUD2P(p) {
                document.getElementById(`team${p.prefix === 't1' ? '1' : '2'}-score`).textContent = `Score: ${p.score}`;
            }

            function loadNext2P(p) {
                document.getElementById(`translation-${p.prefix}`).style.display = 'none';

                if (p.qCount >= 15 || p.queue.length === 0) {
                    p.isFinished = true;
                    document.getElementById(`sentence-${p.prefix}`).innerHTML = "Finished! Waiting for opponent...";
                    document.getElementById(`options-${p.prefix}`).innerHTML = "";
                    if (p1.isFinished && p2.isFinished) {
                        endGame(`Versus Match Over!`);
                    }
                    return;
                }

                p.currentQ = p.queue.shift();
                p.qCount++;
                
                document.getElementById(`sentence-${p.prefix}`).innerHTML = p.currentQ.sentence;
                const optsContainer = document.getElementById(`options-${p.prefix}`);
                optsContainer.innerHTML = '';
                
                const shuffled = [...p.currentQ.options].sort(() => Math.random() - 0.5);
                shuffled.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => handleAns2P(p, btn);
                    optsContainer.appendChild(btn);
                });

                startTimer2P(p);
            }

            function startTimer2P(p) {
                clearInterval(p.interval);
                clearTimeout(p.timer);
                
                let timeLeft = TIME_PER_QUESTION;
                const textEl = document.getElementById(`timer-text-${p.prefix}`);
                const barEl = document.getElementById(`timer-bar-${p.prefix}`);
                
                textEl.textContent = timeLeft;
                barEl.style.transition = 'none';
                barEl.style.width = '100%';
                
                setTimeout(() => {
                    barEl.style.transition = `width ${TIME_PER_QUESTION}s linear`;
                    barEl.style.width = '0%';
                }, 50);

                p.interval = setInterval(() => {
                    timeLeft--;
                    textEl.textContent = timeLeft > 0 ? timeLeft : 0;
                    if(timeLeft <= 0) clearInterval(p.interval);
                }, 1000);

                p.timer = setTimeout(() => handleAns2P(p, null), TIME_PER_QUESTION * 1000);
            }

            function handleAns2P(p, btn) {
                clearInterval(p.interval);
                clearTimeout(p.timer);
                
                const barEl = document.getElementById(`timer-bar-${p.prefix}`);
                barEl.style.transition = 'none';
                barEl.style.width = window.getComputedStyle(barEl).width;

                const isCorrect = btn && btn.textContent === p.currentQ.answer;
                const fullSentence = p.currentQ.sentence.replace('___', p.currentQ.answer);

                Array.from(document.getElementById(`options-${p.prefix}`).children).forEach(b => {
                    b.disabled = true;
                    if(b.textContent === p.currentQ.answer) b.classList.add('correct');
                });

                const transEl = document.getElementById(`translation-${p.prefix}`);
                transEl.textContent = p.currentQ.cn;
                transEl.style.display = 'block';

                if(isCorrect) {
                    p.score += PTS_CORRECT;
                    btn.classList.add('correct');
                    playSound('correct');
                    document.getElementById(`sentence-${p.prefix}`).innerHTML = p.currentQ.sentence.replace('___', `<span style="color:var(--correct); border-bottom: 2px solid var(--correct);">${p.currentQ.answer}</span>`);
                } else {
                    playSound('incorrect');
                    if(btn) btn.classList.add('incorrect');
                    document.getElementById(`sentence-${p.prefix}`).innerHTML = p.currentQ.sentence.replace('___', `<span style="color:var(--incorrect); border-bottom: 2px solid var(--incorrect);">${p.currentQ.answer}</span>`);
                }

                updateHUD2P(p);
                speakText(fullSentence);
                setTimeout(() => loadNext2P(p), REVIEW_DELAY);
            }

            function endGame(title) {
                playSound('end');
                document.getElementById('winner-declaration').textContent = title;
                
                const summaryEl = document.getElementById('score-summary');
                if(screens.p1.classList.contains('active')) {
                    summaryEl.innerHTML = `Final Score: <span style="color:var(--timer-bar-color)">${state1P.score}</span>`;
                } else {
                    summaryEl.innerHTML = `
                        <span style="color:var(--team1-color)">${p1.name}: ${p1.score}</span> 
                        <br>vs<br> 
                        <span style="color:var(--team2-color)">${p2.name}: ${p2.score}</span>
                    `;
                }
                
                switchScreen('winner');
            }

            document.getElementById('play-again-btn').addEventListener('click', () => {
                switchScreen('menu');
            });
        });
    </script>
