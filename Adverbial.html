<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Builder Universe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            touch-action: manipulation;
            /* Animated background blending all 4 game theme colors for the menu */
            background: linear-gradient(-45deg, #e0e7ff, #ffedd5, #f3e8ff, #ccfbf1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            transition: background 0.5s ease;
        }

        .chinese-text { font-family: 'Noto Sans SC', sans-serif; }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }

        /* Menu Cards */
        .game-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .game-card:active { transform: translateY(2px) scale(0.98); }

        /* Game Tiles */
        .word-tile {
            transition: all 0.2s ease; cursor: pointer; user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .word-tile:active { transform: scale(0.95); }
        
        .conj-tile {
            transition: all 0.2s ease; cursor: pointer; user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .conj-tile:active { transform: scale(0.95); }

        /* Dynamic Drop Zone will have its background updated via JS */
        .drop-zone {
            min-height: 80px;
            background-size: 20px 20px;
            transition: background-image 0.5s ease;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .hidden-view { display: none !important; }
        
        @keyframes pop { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); } 
        }
        .anim-pop { animation: pop 0.3s ease-out; }
    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">

    <!-- VIEW: MAIN MENU -->
    <div id="menu-view" class="w-full h-full flex flex-col items-center justify-center p-4 md:p-8 transition-opacity duration-500 opacity-100 absolute inset-0 overflow-y-auto">
        <div class="text-center mb-10 w-full max-w-4xl mt-10">
            <div class="inline-block bg-white px-6 py-2 rounded-full shadow-md mb-4 border-2 border-yellow-300">
                <span class="text-yellow-500 font-bold text-lg"><i class="fas fa-star mr-2"></i>Choose Your Adventure!</span>
            </div>
            <h1 class="text-5xl md:text-6xl font-bold text-gray-800 mb-4 floating shadow-sm drop-shadow-lg">
                Sentence Builder Universe
            </h1>
            <p class="text-xl md:text-2xl text-gray-600 font-bold mb-6">
                Master your English grammar by playing fun games!
            </p>
            
            <div class="max-w-xs mx-auto">
                <input type="text" id="global-username" class="shadow-inner border-4 border-white/50 rounded-2xl w-full py-4 px-6 text-gray-700 leading-tight focus:outline-none focus:border-indigo-400 text-center text-2xl font-bold bg-white/80 backdrop-blur" placeholder="Enter Your Name">
            </div>
        </div>

        <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 pb-10">
            
            <!-- CARD 1: Why & Because -->
            <button onclick="openRules('because')" class="text-left w-full game-card bg-white rounded-3xl shadow-xl p-6 border-4 border-indigo-200 flex flex-col relative overflow-hidden group focus:outline-none">
                <div class="absolute -right-6 -top-6 text-indigo-100 opacity-50 group-hover:scale-110 transition-transform duration-500"><i class="fas fa-puzzle-piece text-8xl"></i></div>
                <div class="flex items-center gap-4 mb-4 relative z-10">
                    <div class="bg-indigo-100 p-3 rounded-full text-indigo-600"><i class="fas fa-puzzle-piece text-2xl"></i></div>
                    <h2 class="text-2xl font-bold text-indigo-600">Why & Because</h2>
                </div>
                <p class="text-gray-600 text-lg font-medium mb-4 flex-grow relative z-10">Connect ideas by giving reasons! Practice using 'because'.</p>
                <div class="w-full bg-indigo-500 text-white font-bold py-3 rounded-xl shadow text-xl text-center group-hover:bg-indigo-600 transition-colors">Play Now <i class="fas fa-play ml-1"></i></div>
            </button>

            <!-- CARD 2: Compound Sentences -->
            <button onclick="openRules('compound')" class="text-left w-full game-card bg-white rounded-3xl shadow-xl p-6 border-4 border-orange-200 flex flex-col relative overflow-hidden group focus:outline-none">
                <div class="absolute -right-6 -top-6 text-orange-100 opacity-50 group-hover:scale-110 transition-transform duration-500"><i class="fas fa-link text-8xl"></i></div>
                <div class="flex items-center gap-4 mb-4 relative z-10">
                    <div class="bg-orange-100 p-3 rounded-full text-orange-600"><i class="fas fa-link text-2xl"></i></div>
                    <h2 class="text-2xl font-bold text-orange-600">Compound Sentences</h2>
                </div>
                <p class="text-gray-600 text-lg font-medium mb-4 flex-grow relative z-10">Join two sentences using the magic words: And, But, Or, So!</p>
                <div class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl shadow text-xl text-center group-hover:bg-orange-600 transition-colors">Play Now <i class="fas fa-play ml-1"></i></div>
            </button>

            <!-- CARD 3: When & While -->
            <button onclick="openRules('when-while')" class="text-left w-full game-card bg-white rounded-3xl shadow-xl p-6 border-4 border-violet-200 flex flex-col relative overflow-hidden group focus:outline-none">
                <div class="absolute -right-6 -top-6 text-violet-100 opacity-50 group-hover:scale-110 transition-transform duration-500"><i class="fas fa-layer-group text-8xl"></i></div>
                <div class="flex items-center gap-4 mb-4 relative z-10">
                    <div class="bg-violet-100 p-3 rounded-full text-violet-600"><i class="fas fa-layer-group text-2xl"></i></div>
                    <h2 class="text-2xl font-bold text-violet-600">When & While</h2>
                </div>
                <p class="text-gray-600 text-lg font-medium mb-4 flex-grow relative z-10">Describe when actions happen! Combine ideas using time clauses.</p>
                <div class="w-full bg-violet-500 text-white font-bold py-3 rounded-xl shadow text-xl text-center group-hover:bg-violet-600 transition-colors">Play Now <i class="fas fa-play ml-1"></i></div>
            </button>

            <!-- CARD 4: If & Although -->
            <button onclick="openRules('if-although')" class="text-left w-full game-card bg-white rounded-3xl shadow-xl p-6 border-4 border-teal-200 flex flex-col relative overflow-hidden group focus:outline-none">
                <div class="absolute -right-6 -top-6 text-teal-100 opacity-50 group-hover:scale-110 transition-transform duration-500"><i class="fas fa-random text-8xl"></i></div>
                <div class="flex items-center gap-4 mb-4 relative z-10">
                    <div class="bg-teal-100 p-3 rounded-full text-teal-600"><i class="fas fa-random text-2xl"></i></div>
                    <h2 class="text-2xl font-bold text-teal-600">If & Although</h2>
                </div>
                <p class="text-gray-600 text-lg font-medium mb-4 flex-grow relative z-10">Explore Conditions and Contrasts! Master these tricky words.</p>
                <div class="w-full bg-teal-500 text-white font-bold py-3 rounded-xl shadow text-xl text-center group-hover:bg-teal-600 transition-colors">Play Now <i class="fas fa-play ml-1"></i></div>
            </button>

            <!-- CARD 5: Before & After -->
            <button onclick="openRules('before-after')" class="text-left w-full game-card bg-white rounded-3xl shadow-xl p-6 border-4 border-rose-200 flex flex-col relative overflow-hidden group focus:outline-none">
                <div class="absolute -right-6 -top-6 text-rose-100 opacity-50 group-hover:scale-110 transition-transform duration-500"><i class="fas fa-history text-8xl"></i></div>
                <div class="flex items-center gap-4 mb-4 relative z-10">
                    <div class="bg-rose-100 p-3 rounded-full text-rose-600"><i class="fas fa-history text-2xl"></i></div>
                    <h2 class="text-2xl font-bold text-rose-600">Before & After</h2>
                </div>
                <p class="text-gray-600 text-lg font-medium mb-4 flex-grow relative z-10">Master the sequence of events! Figure out what happens first.</p>
                <div class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl shadow text-xl text-center group-hover:bg-rose-600 transition-colors">Play Now <i class="fas fa-play ml-1"></i></div>
            </button>
            
        </main>
    </div>

    <!-- VIEW: RULES OVERLAY -->
    <div id="rules-view" class="fixed inset-0 bg-black/60 hidden-view flex items-center justify-center z-40 p-4 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div id="rules-card" class="bg-white rounded-3xl shadow-2xl p-6 md:p-10 max-w-4xl w-full border-4 border-white transform transition-transform duration-300 scale-95 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 id="rules-title" class="text-4xl font-bold">Rules</h2>
                <button onclick="closeRules()" class="text-gray-400 hover:text-gray-700 text-3xl transition-colors"><i class="fas fa-times-circle"></i></button>
            </div>
            
            <div id="rules-content" class="overflow-y-auto pr-2 flex-grow mb-6">
                <!-- Injected via JS based on selected game -->
            </div>

            <button onclick="startGame()" id="rules-start-btn" class="w-full text-white font-bold py-4 rounded-xl shadow-lg text-2xl animate-pulse flex items-center justify-center transition hover:scale-105 active:scale-95">
                Let's Play! <i class="fas fa-play ml-3"></i>
            </button>
        </div>
    </div>

    <!-- VIEW: GENERIC DRAG & DROP GAME ENGINE -->
    <div id="game-view" class="hidden-view w-full h-full flex flex-col transition-opacity duration-500 opacity-0 absolute inset-0 z-20 bg-white">
        
        <!-- App Header -->
        <header id="game-header" class="text-white p-3 shadow-lg flex justify-between items-center z-10 transition-colors duration-500">
            <div class="flex items-center gap-2">
                <button onclick="returnToMenu()" class="hover:bg-black/20 p-2 md:px-3 rounded-xl transition-colors font-bold flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> <span class="hidden md:inline">Menu</span>
                </button>
                <i id="game-icon" class="fas fa-puzzle-piece text-yellow-300 text-xl md:text-2xl ml-2"></i>
                <h1 id="game-title-header" class="text-lg md:text-xl font-bold hidden md:block ml-1">Builder</h1>
            </div>
            <div class="flex items-center gap-2 md:gap-4 text-sm md:text-base font-bold">
                <div class="bg-black/20 px-3 py-1 rounded-full flex items-center shadow-inner">
                    <i class="fas fa-user mr-2 text-white/70"></i><span id="player-name-span" class="truncate max-w-[80px] md:max-w-none">Player</span>
                </div>
                <div class="bg-red-500 text-white px-3 py-1 rounded-full shadow flex items-center gap-1">
                    <i class="fas fa-fire text-yellow-300 animate-pulse"></i> <span id="streak-display">0</span>
                </div>
                <div class="bg-yellow-400 text-gray-900 px-3 py-1 rounded-full shadow flex items-center">
                    <i class="fas fa-star mr-1"></i> Score: <span id="score-display">0</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow relative w-full max-w-6xl mx-auto p-2 md:p-4 flex flex-col justify-center overflow-y-auto">
            
            <!-- Top Info -->
            <div class="flex justify-between items-end px-2 mb-2 mt-2">
                <span id="topic-label" class="font-bold text-lg">Topic: Sports</span>
                <span class="text-gray-400 text-sm font-bold bg-gray-100 px-3 py-1 rounded-full" id="progress-label">1/50</span>
            </div>

            <div class="flex flex-col md:flex-row gap-4 h-full min-h-[400px]">
                <!-- LEFT COLUMN: Conjunction Bank -->
                <div class="md:w-1/4 flex flex-col order-2 md:order-1 shrink-0">
                    <div id="left-panel" class="rounded-2xl p-3 shadow-inner h-full flex flex-col items-center transition-colors duration-500">
                         <h3 id="left-panel-title" class="font-bold mb-3 text-center uppercase text-sm md:text-base flex items-center"><i class="fas fa-link mr-2"></i> Joining Words</h3>
                         <div id="conj-bank" class="flex flex-row md:flex-col flex-wrap gap-3 w-full justify-center">
                             <!-- Conjunction tiles generated here -->
                         </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN: Workspace -->
                <div class="md:w-3/4 flex flex-col order-1 md:order-2">
                    
                    <!-- Question Card -->
                    <div id="question-card" class="bg-white rounded-2xl shadow-lg p-4 mb-3 border-l-8 transition-colors duration-500">
                        <div class="flex items-center gap-3 mb-2">
                            <div id="topic-icon-container" class="p-2 rounded-full transition-colors duration-500">
                                <i id="topic-icon" class="fas fa-question-circle text-2xl transition-colors duration-500"></i>
                            </div>
                            <span id="prompt-label" class="text-gray-400 text-sm uppercase tracking-wide font-bold">Combine these:</span>
                        </div>
                        
                        <h2 id="question-text" class="text-2xl md:text-4xl font-bold text-gray-800 mb-4 hidden">Question Prompt?</h2>
                        
                        <div class="flex flex-col gap-3 text-gray-700 text-xl md:text-2xl ml-2 font-medium">
                            <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 shadow-sm">
                                <span id="clause-1" class="flex items-center"><i id="bullet-1" class="fas fa-circle text-xs mr-3 transition-colors duration-500"></i><span id="clause-1-text">Loading...</span></span>
                                <button onclick="speakInput('clause-1-text')" class="speak-btn text-gray-400 hover:text-gray-800 transition-colors p-2">
                                    <i class="fas fa-volume-up"></i>
                                </button>
                            </div>
                            <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 shadow-sm">
                                <span id="clause-2" class="flex items-center"><i id="bullet-2" class="fas fa-circle text-xs mr-3 transition-colors duration-500"></i><span id="clause-2-text">Loading...</span></span>
                                <button onclick="speakInput('clause-2-text')" class="speak-btn text-gray-400 hover:text-gray-800 transition-colors p-2">
                                    <i class="fas fa-volume-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Answer Drop Zone -->
                    <div class="flex-grow bg-white rounded-2xl shadow-inner border-2 border-dashed border-gray-300 p-4 mb-3 relative flex flex-col min-h-[140px]">
                        <span id="drop-hint" class="absolute top-2 left-2 text-xs text-gray-400 uppercase tracking-wide font-bold">Build Sentence Here (Don't forget punctuation!)</span>
                        <div id="answer-area" class="drop-zone flex flex-wrap gap-3 content-start pt-6 w-full items-center">
                            <!-- Words go here -->
                        </div>
                    </div>

                    <!-- Word Bank (Clauses & Punctuation) -->
                    <div id="right-panel" class="rounded-2xl p-3 shadow-inner transition-colors duration-500">
                        <div id="word-bank" class="flex flex-wrap gap-3 justify-center">
                            <!-- Word tiles generated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timer Bar -->
            <div class="w-full bg-gray-200 rounded-full h-4 mt-4 overflow-hidden shadow-inner mb-4">
                <div id="timer-bar" class="bg-gradient-to-r from-green-400 to-green-600 h-4 rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
            </div>
            
        </main>
    </div>

    <!-- FEEDBACK OVERLAY (Modal) -->
    <div id="feedback-modal" class="fixed inset-0 bg-black/60 hidden-view flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div id="feedback-card" class="bg-white rounded-3xl shadow-2xl p-8 max-w-lg w-full text-center relative transform transition-transform duration-300 scale-95 border-4">
            
            <div id="feedback-icon" class="text-7xl mb-4 drop-shadow-md"></div>
            
            <h2 id="feedback-title" class="text-4xl font-bold mb-4"></h2>
            
            <!-- Correct Answer Display -->
            <div id="feedback-bg" class="rounded-xl p-5 mb-6 border shadow-inner">
                <p id="feedback-english" class="text-3xl md:text-4xl font-bold mb-3 leading-tight"></p>
                <div id="feedback-divider" class="h-px w-full my-4"></div>
                <p id="feedback-chinese" class="chinese-text text-2xl font-medium"></p>
            </div>

            <!-- Controls -->
            <div class="flex justify-center gap-4 items-center">
                <button onclick="playAudioFeedback()" class="bg-blue-500 hover:bg-blue-600 text-white rounded-full p-4 shadow-lg w-16 h-16 flex items-center justify-center transition hover:scale-110 active:scale-95 text-xl">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button onclick="nextQuestion()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-10 rounded-2xl shadow-lg text-2xl flex items-center transition hover:scale-105 active:scale-95">
                    Next <i class="fas fa-arrow-right ml-3"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="sfx-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sfx-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

    <script>
        /**
         * MASSIVE GAME DATABASE (All 5 Games)
         * Normalized Format: { t: Topic, q: Prompt(Optional), m: Main/Indep/C1, s: Sub/Dep/C2, conj: Conjunction, ch: Chinese, punct: '.' or '?' }
         */
        const GAME_DB = {
            because: [
                { t: "Sports", q: "Why do you play soccer?", m: "I play soccer", s: "it is fun", conj: "because", ch: "我踢足球是因为它很有趣。" },
                { t: "Sports", q: "Why do you swim?", m: "I swim", s: "I like water", conj: "because", ch: "我游泳是因为我喜欢水。" },

                { t: "Pets", q: "Why is the cat sleeping?", m: "The cat is sleeping", s: "it is tired", conj: "because", ch: "猫在睡觉是因为它累了。" },
                { t: "Pets", q: "Why do we vaccinate pets?", m: "We vaccinate pets", s: "we want to prevent disease", conj: "because", ch: "我们给宠物接种疫苗是因为我们想预防疾病。" },
                { t: "Pets", q: "Why is the parrot special?", m: "The parrot is special", s: "it can mimic human speech", conj: "because", ch: "鹦鹉很特别是因为它可以模仿人类说话。" },
                { t: "Food", q: "Why do you eat apples?", m: "I eat apples", s: "they are healthy", conj: "because", ch: "我吃苹果是因为它们很健康。" },
                { t: "Food", q: "Why do you want pizza?", m: "I want pizza", s: "I am hungry", conj: "because", ch: "我想要披萨是因为我饿了。" },
                { t: "Food", q: "Why is the soup hot?", m: "The soup is hot", s: "Mom cooked it", conj: "because", ch: "汤很热是因为妈妈刚煮好。" },
                { t: "Food", q: "Why do we eat vegetables?", m: "We eat vegetables", s: "our bodies need vitamins", conj: "because", ch: "我们吃蔬菜是因为我们的身体需要维生素。" },
                { t: "Food", q: "Why is this restaurant famous?", m: "This restaurant is famous", s: "the chef uses fresh ingredients", conj: "because", ch: "这家餐厅很有名是因为厨师使用新鲜食材。" },
                { t: "Friends", q: "Why is she your friend?", m: "She is my friend", s: "she is kind", conj: "because", ch: "她是我的朋友因为她很善良。" },
                { t: "Friends", q: "Why are you laughing?", m: "I am laughing", s: "he told a joke", conj: "because", ch: "我在笑是因为他讲了个笑话。" },
                { t: "Friends", q: "Why do you share toys?", m: "I share toys", s: "I am nice", conj: "because", ch: "我分享玩具是因为我很友善。" },
                { t: "Friends", q: "Why did you apologize?", m: "I apologized to him", s: "I accidentally hurt his feelings", conj: "because", ch: "我向他道歉是因为我不小心伤害了他的感情。" },
                { t: "Friends", q: "Why is friendship important?", m: "Friendship is important", s: "we support each other", conj: "because", ch: "友谊很重要是因为我们互相支持。" },
                { t: "Travel", q: "Why do you go to the beach?", m: "I go to the beach", s: "I like sand", conj: "because", ch: "我去海滩是因为我喜欢沙子。" },
                { t: "Travel", q: "Why do we take a plane?", m: "We take a plane", s: "it is fast", conj: "because", ch: "我们坐飞机是因为它很快。" },

                { t: "Travel", q: "Why was the flight delayed?", m: "The flight was delayed", s: "the engine had a problem", conj: "because", ch: "航班延误了是因为引擎出了问题。" },
                { t: "Travel", q: "Why do people explore?", m: "People explore the world", s: "they are curious about culture", conj: "because", ch: "人们探索世界是因为他们对文化感到好奇。" },

        window.onload = function() {

            }
        };

        function loadVoices() {
            state.voices = window.speechSynthesis.getVoices();
            if (state.voices.length === 0) return;
            state.approvedVoices = state.voices.filter(v => {
                const n = v.name.toLowerCase();
                return n.includes("multilingual") && v.lang.startsWith('en');
            });
            if (state.approvedVoices.length === 0) {
                state.approvedVoices = state.voices.filter(v => v.name.toLowerCase().includes("microsoft") && v.name.toLowerCase().includes("natural") && v.lang.startsWith('en'));
            }
            if (state.approvedVoices.length === 0) {
                state.approvedVoices = state.voices.filter(v => v.lang.startsWith('en'));
            }
        }

        function openRules(cat) {
            const name = document.getElementById('global-username').value.trim();
            if(!name) { alert("Please enter your name first!"); return; }
            state.playerName = name;
            state.activeCat = cat;

            // Apply Theme to Rules
            const conf = CONFIG[cat];
            document.getElementById('rules-title').className = `text-4xl font-bold ${conf.theme.text}`;
            document.getElementById('rules-content').innerHTML = conf.rulesHtml;
            document.getElementById('rules-start-btn').className = `w-full text-white font-bold py-4 rounded-xl shadow-lg text-2xl animate-pulse flex items-center justify-center transition hover:scale-105 active:scale-95 ${conf.theme.bg}`;

            const rulesView = document.getElementById('rules-view');
            const rulesCard = document.getElementById('rules-card');
            
            rulesView.classList.remove('hidden-view');
            setTimeout(() => {
                rulesView.classList.remove('opacity-0');
                rulesCard.classList.remove('scale-95');

        }

        function closeRules() {
            const rulesView = document.getElementById('rules-view');
            const rulesCard = document.getElementById('rules-card');
            rulesView.classList.add('opacity-0');
            rulesCard.classList.add('scale-95');
            setTimeout(() => rulesView.classList.add('hidden-view'), 300);
        }

        function startGame() {
            closeRules();
            const menuView = document.getElementById('menu-view');
            const gameView = document.getElementById('game-view');
            const appBody = document.getElementById('app-body');
            
            state.score = 0; state.streak = 0; state.qIndex = 0;

            menuView.classList.remove('opacity-100');

            setTimeout(() => {
                menuView.classList.add('hidden-view');

            clearInterval(state.timerInt);

        function loadQuestion() {
            window.speechSynthesis.cancel();
            const db = GAME_DB[state.activeCat];
            if (state.qIndex >= db.length) { returnToMenu(); return; }

            const qData = db[state.qIndex];
            const conf = CONFIG[state.activeCat];

            // UI
            document.getElementById('progress-label').innerText = `${state.qIndex + 1}/${db.length}`;
            document.getElementById('topic-label').innerText = `Topic: ${qData.t}`;
            document.getElementById('topic-icon').className = `fas ${TOPIC_ICONS[qData.t] || 'fa-question'} text-2xl transition-colors duration-500 ${conf.theme.text}`;
            
            const qTitle = document.getElementById('question-text');
            const pLabel = document.getElementById('prompt-label');
            if(qData.q) {
                qTitle.innerText = qData.q;
                qTitle.classList.remove('hidden');
                pLabel.classList.add('hidden');
            } else {
                qTitle.classList.add('hidden');
                pLabel.classList.remove('hidden');
                pLabel.innerText = "Combine these:";
            }

            const c1Txt = capitalize(qData.m);
            const c2Txt = capitalize(qData.s);
            document.getElementById('clause-1-text').innerText = `${c1Txt}.`;
            document.getElementById('clause-2-text').innerText = `${c2Txt}.`;

            // Bank Setup
            const punct = qData.punct || ".";
            let words = [c1Txt, c2Txt, ",", punct];
            if(state.activeCat === 'because' && Math.random() > 0.5) words = [c1Txt, c2Txt, "."]; // Because doesn't always need comma

            words.sort(() => Math.random() - 0.5);
            
            const wBank = document.getElementById('word-bank');
            const aArea = document.getElementById('answer-area');
            wBank.innerHTML = ''; aArea.innerHTML = '';

            words.forEach(w => wBank.appendChild(createTile(w, false, conf)));

            const cBank = document.getElementById('conj-bank');
            cBank.innerHTML = '';
            
            let conjs = [];
            if(conf.archetype === 'compound') {
                conjs = (state.qIndex < 2) ? [qData.conj, conf.allConjs.filter(c=>c!==qData.conj)[0]] : [...conf.allConjs];
            } else {
                conjs = [...conf.allConjs];
            }
            conjs.sort(() => Math.random() - 0.5);
            conjs.forEach(c => cBank.appendChild(createTile(c, true, conf)));

            updateVisuals();
            resetTimer();
        }

        function createTile(text, isConj, conf) {
            const div = document.createElement('div');
            if(isConj) {
                // Tailwind classes for Conj
                div.className = `conj-tile border-b-4 text-white font-bold py-3 px-6 rounded-xl text-2xl md:text-3xl transform active:translate-y-1 active:border-b-0 w-full md:w-auto text-center ${conf.theme.bg} ${conf.theme.border}`;
            } else {
                div.className = `word-tile bg-white border-b-4 font-bold py-3 px-6 rounded-xl shadow-lg text-2xl md:text-3xl transform active:translate-y-1 active:border-b-0 ${conf.theme.border} text-gray-800`;
            }
            div.dataset.orig = text;
            div.innerText = text;
            div.onclick = function() {
                const isAnswer = div.parentElement.id === 'answer-area';
                if(isAnswer) {
                    if(isConj) document.getElementById('conj-bank').appendChild(div);
                    else document.getElementById('word-bank').appendChild(div);
                } else {
                    document.getElementById('answer-area').appendChild(div);
                }
                updateVisuals();
                checkAnswerLive();
            };
            return div;
        }

        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
        function shouldCap(w) { return ["I", "Dad", "Mom", "Tom", "Grandma", "Japan", "Harry", "Potter"].includes(w); }

        function updateVisuals() {
            const tiles = Array.from(document.getElementById('answer-area').children);
            const banks = [...Array.from(document.getElementById('word-bank').children), ...Array.from(document.getElementById('conj-bank').children)];
            
            banks.forEach(t => {
                let o = t.dataset.orig;
                if(t.classList.contains('conj-tile')) t.innerText = o.toLowerCase();
                else if([',','.','?'].includes(o)) t.innerText = o;
                else t.innerText = capitalize(o);
            });

            tiles.forEach((t, i) => {
                let o = t.dataset.orig;
                if([',','.','?'].includes(o)) { t.innerText = o; return; }
                if(i === 0) t.innerText = capitalize(o);
                else {
                    if(o.startsWith("I ") || o === "I" || shouldCap(o.split(' ')[0])) t.innerText = o;
                    else t.innerText = o.charAt(0).toLowerCase() + o.slice(1);
                }
            });
        }

        function checkAnswerLive() {
            const tiles = Array.from(document.getElementById('answer-area').children);
            if(tiles.length < 3) return; // Need at least M, S, Conj
            validateAnswer(tiles.map(t => t.innerText).join(" "));
        }

        function validateAnswer(userStr) {
            const q = GAME_DB[state.activeCat][state.qIndex];
            const conf = CONFIG[state.activeCat];
            const norm = s => s.toLowerCase().replace(/\s+/g,' ').replace(/\s+,/g,',').replace(/\s+\./g,'.').replace(/\s+\?/g,'?').trim();
            const uNorm = norm(userStr);
            const p = q.punct || '.';

            let matched = false;
            let display = "";

            if(conf.archetype === 'complex') {
                const pA = norm(`${q.conj} ${q.s} , ${q.m} ${p}`);
                const pB = norm(`${q.m} ${q.conj} ${q.s} ${p}`);
                if(uNorm === pA) {
                    matched = true;
                    display = `${capitalize(q.conj)} ${q.s.toLowerCase()}, ${q.m.toLowerCase()}${p}`.replace(/ i /g," I ");
                } else if(uNorm === pB) {
                    matched = true;
                    display = `${capitalize(q.m)} ${q.conj} ${q.s.toLowerCase()}${p}`.replace(/ i /g," I ");
                }
            } else if (conf.archetype === 'compound') {
                const pA = norm(`${q.m} , ${q.conj} ${q.s} ${p}`);
                const pB = norm(`${q.s} , ${q.conj} ${q.m} ${p}`);
                if(uNorm === pA) {
                    matched = true;
                    let c2First = q.s.split(' ')[0];
                    let c2D = (!shouldCap(c2First) && c2First !== "I") ? q.s.charAt(0).toLowerCase()+q.s.slice(1) : q.s;
                    display = `${capitalize(q.m)}, ${q.conj} ${c2D}${p}`;
                } else if(q.conj === 'or' && uNorm === pB) {
                    matched = true;
                    let c1First = q.m.split(' ')[0];
                    let c1D = (!shouldCap(c1First) && c1First !== "I") ? q.m.charAt(0).toLowerCase()+q.m.slice(1) : q.m;
                    display = `${capitalize(q.s)}, ${q.conj} ${c1D}${p}`;
                }
            }

            // Fallback fixing proper nouns and I
            if(matched) {
                display = display.replace(/^i /i, "I ");
                clearInterval(state.timerInt);
                handleWin(display, q.ch);
            }
        }

        function resetTimer() {
            clearInterval(state.timerInt);
            state.timer = 35;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            bar.className = "bg-gradient-to-r from-green-400 to-green-600 h-4 rounded-full transition-all duration-1000 ease-linear";

            state.timerInt = setInterval(() => {
                state.timer--;
                bar.style.width = `${(state.timer/35)*100}%`;
                if(state.timer < 10) bar.className = "bg-gradient-to-r from-yellow-400 to-orange-500 h-4 rounded-full transition-all duration-1000 ease-linear";
                if(state.timer < 5) bar.className = "bg-red-500 h-4 rounded-full transition-all duration-1000 ease-linear animate-pulse";
                if(state.timer <= 0) {
                    clearInterval(state.timerInt);
                    timeOut();
                }
            }, 1000);
        }

        function timeOut() {
            const q = GAME_DB[state.activeCat][state.qIndex];
            const conf = CONFIG[state.activeCat];
            const p = q.punct || '.';
            let display = "";
            if(conf.archetype === 'complex') display = `${capitalize(q.conj)} ${q.s.toLowerCase()}, ${q.m.toLowerCase()}${p}`.replace(/ i /g," I ");
            else {
                let c2D = (!shouldCap(q.s.split(' ')[0]) && !q.s.startsWith("I")) ? q.s.charAt(0).toLowerCase()+q.s.slice(1) : q.s;
                display = `${capitalize(q.m)}, ${q.conj} ${c2D}${p}`;
            }
            display = display.replace(/^i /i, "I ");
            handleLoss(display, q.ch);
        }

        function handleWin(eng, ch) {
            state.score += 10; state.streak += 1; updateStats();
            try { document.getElementById('sfx-correct').play(); } catch(e){}
            if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            showFeedback(true, eng, ch);
        }

        function handleLoss(eng, ch) {
            state.streak = 0; updateStats();
            try { document.getElementById('sfx-wrong').play(); } catch(e){}
            showFeedback(false, eng, ch);
        }

        function updateStats() {
            document.getElementById('score-display').innerText = state.score;
            document.getElementById('streak-display').innerText = state.streak;
        }

        function showFeedback(isWin, eng, ch) {
            const mod = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            
            mod.classList.remove('hidden-view');
            setTimeout(() => { mod.classList.remove('opacity-0'); card.classList.remove('scale-95'); }, 50);

            if(isWin) {
                icon.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                title.innerText = "Great Job!"; title.className = "text-4xl font-bold mb-4 text-green-600";
            } else {
                icon.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                title.innerText = "Time's Up!"; title.className = "text-4xl font-bold mb-4 text-red-600";
            }
            document.getElementById('feedback-english').innerText = eng;
            document.getElementById('feedback-chinese').innerText = ch;
            setTimeout(() => speakText(isWin ? eng : `The answer is: ${eng}`), 500);
        }

        function nextQuestion() {
            const mod = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            mod.classList.add('opacity-0'); card.classList.add('scale-95');
            setTimeout(() => { mod.classList.add('hidden-view'); state.qIndex++; loadQuestion(); }, 300);
        }

        function playAudioFeedback() { speakText(document.getElementById('feedback-english').innerText); }
        function speakInput(id) { speakText(document.getElementById(id).innerText); }

        function speakText(txt) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const u = new SpeechSynthesisUtterance(txt);
                u.rate = 0.85; 
                if (state.approvedVoices.length > 0) {
                    u.voice = state.approvedVoices[Math.floor(Math.random() * state.approvedVoices.length)];
                }
                window.speechSynthesis.speak(u);
            }
        }
    </script>
