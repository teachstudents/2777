<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Grammar Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Nunito:wght@700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffffff, #fef08a, #ffdab9); /* White to yellow to peach */
            color: #1e1b4b;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Nunito', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .btn-hover {
            transition: all 0.2s ease-in-out;
        }
        .btn-hover:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .timer-bar-container {
            width: 100%;
            height: 16px;
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4ade80, #3b82f6);
            transform-origin: left;
            transition: width 1s linear, background-color 0.5s ease;
        }

        .timer-warning {
            background: linear-gradient(90deg, #facc15, #ef4444) !important;
        }

        /* Text colors for different grammar clues */
        .clue-time { color: #1d4ed8; font-weight: 800; } /* Blue */
        .clue-verb { color: #7e22ce; font-weight: 800; } /* Purple */
        .clue-condition { color: #15803d; font-weight: 800; } /* Green */
        .clue-degree { color: #0f766e; font-weight: 800; } 

        /* Fixed gap width to prevent sentence shifting */
        .fixed-gap {
            display: inline-block;
            width: 140px;
            text-align: center;
            border-bottom: 3px solid rgba(0,0,0,0.4);
            padding: 0 8px;
            transition: all 0.2s;
            color: transparent; /* Hide text if it's placed inside before reveal */
        }
        .fixed-gap.revealed {
            color: white;
            background: #22c55e;
            border-bottom: none;
            border-radius: 8px;
            padding: 2px 8px;
        }

        .gap-blank {
            display: inline-block;
            width: 140px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #4b5563;
            border-radius: 8px;
            padding: 2px 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #000;
        }
        .gap-blank.filled {
            background: #4f46e5;
            border-color: #818cf8;
            border-style: solid;
            color: white;
            font-weight: bold;
        }
        .gap-blank.wrong {
            background: #ef4444;
            border-color: #fca5a5;
            animation: shake 0.4s;
        }
        .gap-blank.correct {
            background: #22c55e;
            border-color: #86efac;
        }

        .word-bank-btn {
            background: white;
            color: #1e1b4b;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .word-bank-btn.selected {
            box-shadow: 0 0 0 4px #facc15;
            transform: scale(1.1);
        }

        /* Confetti Canvas */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .badge-animation {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <canvas id="confetti"></canvas>

    <!-- MAIN MENU -->
    <div id="main-menu" class="w-full max-w-6xl flex flex-col items-center">
        <h1 class="text-4xl md:text-6xl font-black text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-purple-700 drop-shadow-lg">
            Cinema Grammar Challenge
        </h1>
        <p class="text-2xl mb-6 text-gray-800">🎬 🍿 🎥 🌟 🏆</p>

        <!-- Compressed Grid for 8 Categories -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full px-4">
            <!-- Categories injected here -->
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden w-full max-w-6xl flex-col items-center">
        
        <!-- Header -->
        <div class="w-full flex flex-col md:flex-row justify-between items-center mb-4 glass-panel p-3 rounded-2xl gap-4">
            <div class="flex items-center gap-4">
                <button onclick="returnToMenu()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl font-bold btn-hover shadow-md">
                    ⬅️ Menu
                </button>
                <div class="text-xl font-bold bg-white border-2 border-indigo-200 px-4 py-2 rounded-xl text-indigo-900">Q: <span id="q-counter">1</span></div>
                
                <!-- Check Answers (Only visible on gap fill) -->
                <button id="check-gap-answers" onclick="checkGapFillAnswers()" class="bg-gradient-to-r from-green-500 to-blue-600 text-white font-black px-4 py-2 rounded-xl btn-hover shadow-md hidden">
                    Check Answers ✅
                </button>
            </div>
            
            <h2 id="category-title" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-700 to-blue-700 hidden md:block">Category Name</h2>
        </div>

        <!-- Timer -->
        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <!-- Solo Score Area -->
        <div class="w-full flex justify-center mb-4 mt-2">
            <div class="glass-panel p-4 rounded-3xl flex flex-col items-center border-t-4 border-yellow-400 min-w-[200px]">
                <div class="text-5xl font-black text-purple-900 mb-1 drop-shadow-md">
                    <span id="player-score">0</span>
                </div>
                <div class="text-3xl mb-1 drop-shadow-md">👤</div>
                <h3 class="text-xl font-bold text-yellow-600 mb-1">Your Score</h3>
                <div id="player-badges" class="flex gap-1 mt-1 text-2xl h-8"></div>
            </div>
        </div>

        <!-- Question Box (Standard) -->
        <div id="standard-question-box" class="w-full glass-panel p-8 rounded-3xl text-center mb-8 shadow-xl">
            <p id="question-text" class="text-3xl md:text-4xl leading-relaxed font-semibold mb-8 text-black">
                Loading...
            </p>
            
            <div id="options-container" class="flex flex-wrap justify-center gap-4 mb-4">
                <!-- Options injected here -->
            </div>
        </div>

        <!-- Gap Fill Box (Category 7) -->
        <div id="gap-fill-box" class="w-full glass-panel p-8 rounded-3xl mb-8 shadow-xl hidden flex-col items-center">
            <h3 id="review-title" class="text-3xl font-black text-purple-700 mb-6 text-center"></h3>
            <p id="gap-fill-text" class="text-2xl md:text-3xl leading-relaxed font-medium mb-10 text-left w-full max-w-4xl mx-auto text-black">
                <!-- Gap fill injected here -->
            </p>
            
            <div id="word-bank" class="flex flex-wrap justify-center gap-4 mb-4 w-full max-w-4xl mx-auto bg-white bg-opacity-70 p-6 rounded-2xl border border-blue-300">
                <!-- Word bank buttons injected here -->
            </div>
        </div>

        <!-- Genre Matching Box (Category 8) -->
        <div id="genre-box" class="w-full glass-panel p-8 rounded-3xl text-center mb-8 shadow-xl hidden">
            <p id="genre-description" class="text-3xl md:text-4xl leading-relaxed font-bold mb-10 text-blue-900">
                Loading description...
            </p>
            <div id="genre-options" class="flex flex-col md:flex-row justify-center gap-4">
                <!-- Genre buttons injected here -->
            </div>
        </div>

    </div>

    <!-- Audio & Scripts -->
    <script>
        // --- DATA & CONFIG ---
        let playerScore = 0;

        const categories = [
            { id: 1, title: "1. Since vs. For ⏱️", color: "from-green-400 to-emerald-600" },
            { id: 2, title: "2. Present Perfect 🎬", color: "from-purple-400 to-indigo-600" },
            { id: 3, title: "3. Zero Conditional 🎥", color: "from-orange-400 to-red-600" },
            { id: 4, title: "4. First Conditional 🌟", color: "from-blue-400 to-cyan-600" },
            { id: 5, title: "5. Too vs. Enough 🎭", color: "from-yellow-400 to-amber-600" },

        // --- 50 Factual Since/For Questions ---
        const sinceFor50 = [

            ["Fans have waited for the sequel", "three years", false, "🍿"],
            ["The actor has lived in Los Angeles", "2015", true, "🌴"],
            ["The crew has filmed in the desert", "last Tuesday", true, "🐪"],

            ["The composer has written the movie score", "January", true, "🎼"],

            ["The chosen one has trained with the master", "childhood", true, "⚔️"],
            ["The detective has searched for clues", "two days", false, "🔍"],
            ["The explorers have wandered the jungle", "Sunday", true, "🗺️"],
            ["The astronaut has drifted in space", "months", false, "🚀"],
            ["The rebel alliance has fought the empire", "a long time", false, "🛡️"],
            ["The magical kingdom has been cursed", "the winter", true, "❄️"],
            ["The giant monster has slept underwater", "centuries", false, "🌊"],
            ["The secret agent has followed the target", "midnight", true, "🕶️"],
            ["The athletes have played the championship match", "three hours", false, "⚽"],
            ["The romantic couple has been separated", "the war began", true, "❤️"],
            ["The sheriff has guarded the frontier town", "years", false, "🤠"],
            ["The treasure has been hidden in the cave", "ancient times", true, "💎"],
            ["The ghosts have haunted the old mansion", "a century", false, "🏚️"],
            ["The AI has controlled the space station", "2050", true, "🤖"],
            ["The martial arts master has taught students", "many years", false, "🥋"],
            ["The film festival has celebrated cinema", "1946", true, "🎞️"]
        ];

        // Generator functions to create questions per category
        function generateQuestions(categoryId) {
            let q = [];
            
            if (categoryId === 1) {
                q = sinceFor50.map(item => ({
                    text: `${item[0]} <span class="fixed-gap">___</span> <span class="clue-time">${item[1]}</span>. ${item[3]}`,
                    plainText: `${item[0]} blank ${item[1]}.`,
                    options: ["since", "for"],
                    correctIndex: item[2] ? 0 : 1
                }));
            } else if (categoryId === 2) {
                const s2 = [
                    ["The director", "finished", "editing the film", "has", "have", "🎬", "(finish)"],
                    ["The actor", "already learned", "his lines", "has", "have", "🎭", "(learn)"],

                    ["The producers", "funded", "the entire trilogy", "have", "has", "💰", "(fund)"],
                    ["The stunt doubles", "practiced", "the jump all morning", "have", "has", "🤸", "(practice)"],
                    ["The scriptwriter", "written", "a new plot twist", "has", "have", "📝", "(write)"],
                    ["The makeup artists", "transformed", "the lead actor", "have", "has", "💄", "(transform)"],
                    ["The sci-fi movie", "won", "several awards", "has", "have", "🏆", "(win)"],
                    ["The main characters", "survived", "the haunted house", "have", "has", "👻", "(survive)"],
                    ["The space captain", "commanded", "the spaceship", "has", "have", "🚀", "(command)"],
                    ["The underdog team", "won", "the championship", "has", "have", "🏅", "(win)"],
                    ["The rebels", "opposed", "the king since 2022", "have", "has", "🛡️", "(oppose)"],

                    ["The lovers", "known", "each other since elementary school", "have", "has", "❤️", "(know)"],
                    ["The monster", "haunted", "the forest for centuries", "has", "have", "🌲", "(haunt)"],
                    ["The explorers", "searched", "the jungle", "have", "has", "🧭", "(search)"],
                    ["The athlete", "trained", "for the big game", "has", "have", "🏃", "(train)"],
                    ["The crew", "prepared", "for the final showdown", "have", "has", "🎬", "(prepare)"],
                    ["The evil AI", "controlled", "the city", "has", "have", "🤖", "(control)"],
                    ["The studio", "developed", "this franchise", "has", "have", "🏢", "(develop)"],
                    ["The hero", "lived", "in the kingdom since 2020", "has", "have", "🏰", "(live)"],
                    ["The detective", "investigated", "this mystery for two weeks", "has", "have", "🔍", "(investigate)"]
                ];
                q = s2.map(item => ({
                    text: `${item[0]} <span class="fixed-gap">___</span> <span class="clue-verb">${item[1]}</span> ${item[2]}. ${item[5]} <b>${item[6]}</b>`,
                    plainText: `${item[0]} blank ${item[1]} ${item[2]}.`,
                    options: [item[3], item[4]],
                    correctIndex: 0
                }));
            } else if (categoryId === 3) {
                // Zero Conditional
                const s3 = [
                    ["a horror movie uses suspense", "the audience ___ nervous", "feels", "will feel", "👻"],
                    ["a superhero loses their powers", "the story ___", "changes", "will change", "🦸"],
                    ["a detective finds evidence", "the mystery ___ clearer", "becomes", "became", "🔍"],
                    ["a comedy uses misunderstandings", "people ___", "laugh", "laughed", "😂"],
                    ["a sci-fi movie includes advanced tech", "viewers ___ futuristic settings", "expect", "expected", "🛸"],
                    ["a movie has a villain", "the hero usually ___ conflict", "faces", "will face", "🦹"],

                    ["it rains on a film set", "the crew ___ indoors", "moves", "will move", "🌧️"],
                    ["the budget runs out", "the production ___ down", "shuts", "will shut", "💸"],
                    ["a movie wins an Oscar", "ticket sales ___", "increase", "will increase", "🏆"],
                    ["the lighting is too dark", "the scene ___ scary", "looks", "will look", "💡"],
                    ["the soundtrack is loud", "the scene ___ intense", "feels", "will feel", "🎧"],
                    ["a stunt goes wrong", "the actor ___ injured", "gets", "will get", "🚑"],
                    ["the makeup is realistic", "the monster ___ terrifying", "looks", "looked", "🧟"],
                    ["the script is funny", "the cast ___ during practice", "laughs", "laugh", "😆"],
                    ["a sequel is announced", "fans ___ excited", "get", "will get", "🤩"],
                    ["the hero has a flaw", "the character ___ relatable", "feels", "will feel", "❤️"],
                    ["the villain is clever", "the hero ___ more", "struggles", "will struggle", "🧠"],
                    ["the setting is isolated", "the tension ___ faster", "builds", "will build", "🏚️"],

                    ["the editing is fast", "the action ___ quicker", "seems", "seem", "✂️"]

                q = s3.map(item => ({
                    text: `<span class="clue-condition">If</span> ${item[0]}, ${item[1].replace('___', '<span class="fixed-gap">___</span>')} ${item[4]}`,
                    plainText: `If ${item[0]}, ${item[1].replace('___', 'blank')}.`,
                    options: [item[2], item[3]],
                    correctIndex: 0
                }));
            } else if (categoryId === 4) {
                // First Conditional
                const s4 = [
                    ["the hero finds the treasure map", "he ___ the quest", "will begin", "begins", "🗺️"],
                    ["the detective discovers the clue", "she ___ the mystery", "will solve", "solves", "🔍"],

                q = s4.map(item => ({

                    correctIndex: 0

            } else if (categoryId === 5) {
                const s5 = [
                    ["The hero is brave", "enough", "to enter the haunted castle.", "too", "🏰"],
                    ["The detective is clever", "enough", "to discover the truth.", "not enough", "🔍"],
                    ["The location is", "too far", "to travel in one day.", "not far enough", "🗺️"],

                    ["The explosion was", "not far enough", "away from the stuntman.", "too far", "💥"],
                    ["The budget is", "not enough", "to cover the CGI.", "too", "💰"],
                    ["The mountain is", "too", "dangerous.", "enough", "⛰️"],
                    ["The spaceship is", "too", "damaged.", "not enough", "🚀"],
                    ["The camera is", "not far enough", "to capture the whole scene.", "too far", "🎥"],
                    ["The studio has", "not enough", "money.", "too", "💰"],
                    ["The hero has", "enough", "allies.", "too far", "🤝"],
                    ["The stunt is", "too far", "down the road.", "not enough", "🛣️"],
                    ["The mystery is", "too", "complicated.", "enough", "❓"],
                    ["The actor is", "too", "nervous.", "enough", "😬"],
                    ["The hero is", "too", "frightened to enter the cabin.", "enough", "😨"],

        // --- AUDIO (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1); 
            setTimeout(() => playTone(659.25, 'sine', 0.1), 100); 
            setTimeout(() => playTone(783.99, 'sine', 0.3), 200); 
        }

        // --- DYNAMIC TTS VOICES ---
        function getVoiceForCategory(catId) {
            const synth = window.speechSynthesis;
            const voices = synth.getVoices();
            
            const voiceMap = {
                1: ["Emma", "UK English Female", "Google UK English Female"],
                2: ["Remy", "fr-FR", "Google français"],
                3: ["Giuseppe", "it-IT", "Google italiano"],
                4: ["Vivienne", "en-GB", "Daniel"],
                5: ["Florian", "de-DE", "Google Deutsch"],
                6: ["Seraphina", "en-US", "Google US English", "Zira"],
                7: ["Emma", "UK English Female", "Google UK English Female"],
                8: ["Emma", "Microsoft Hazel", "Google UK English Female"]
            };

            const preferences = voiceMap[catId] || voiceMap[1];
            let selectedVoice = null;
            
            for (let pref of preferences) {
                selectedVoice = voices.find(v => v.name.includes(pref) || v.lang.includes(pref));
                if (selectedVoice) break;
            }
            
            // Fallback to any English voice
            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith("en-"));
            }
            return selectedVoice;
        }

        function speak(text, callback) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            
            if (currentCategory) {
                const voice = getVoiceForCategory(currentCategory.id);
                if (voice) utterance.voice = voice;
            }

            if(callback) {
                utterance.onend = callback;
                setTimeout(callback, text.length * 75); // fallback
            }
            synth.speak(utterance);
        }

        // --- GAP FILL LOGIC ---
        function loadGapFillReview() {
            const review = currentQuestions[questionIndex];
            document.getElementById('review-title').innerText = review.title;
            document.getElementById('check-gap-answers').classList.remove('hidden');
            
            let htmlText = review.text;
            let expectedAnswers = [];
            
            htmlText = htmlText.replace(/\[(.*?)\]/g, (match, p1) => {
                expectedAnswers.push(p1);
                return `<span class="gap-blank" data-answer="${p1}" onclick="handleGapClick(this)">___</span>`;
            });
            
            document.getElementById('gap-fill-text').innerHTML = htmlText;

            const wordBankEl = document.getElementById('word-bank');
            wordBankEl.innerHTML = '';
            
            let shuffledWords = shuffleArray([...expectedAnswers]);
            shuffledWords.forEach((word, idx) => {
                const btn = document.createElement('div');
                btn.className = "word-bank-btn";
                btn.innerText = word;
                btn.onclick = () => handleWordBankClick(btn);
                wordBankEl.appendChild(btn);
            });
        }

        function handleWordBankClick(btn) {
            if (gapFillCompleted) return;
            playPopSound();
            if(selectedWordBtn) selectedWordBtn.classList.remove('selected');
            if(selectedWordBtn !== btn) {
                selectedWordBtn = btn;
                btn.classList.add('selected');
            } else {
                selectedWordBtn = null;
            }
        }

        function handleGapClick(gapSpan) {
            if (gapFillCompleted) return;
            
            if (gapSpan.classList.contains('filled')) {
                playPopSound();
                const word = gapSpan.innerText;
                gapSpan.innerText = '___';
                gapSpan.classList.remove('filled', 'correct', 'wrong');
                
                const bankBtns = document.querySelectorAll('#word-bank .word-bank-btn');
                for(let btn of bankBtns) {
                    if(btn.innerText === word && btn.classList.contains('hidden')) {
                        btn.classList.remove('hidden');
                        break;
                    }
                }
                return;
            }

            if (selectedWordBtn) {
                playPopSound();
                gapSpan.innerText = selectedWordBtn.innerText;
                gapSpan.classList.add('filled');
                gapSpan.classList.remove('wrong');
                
                selectedWordBtn.classList.add('hidden');
                selectedWordBtn.classList.remove('selected');
                selectedWordBtn = null;
            }
        }

        function checkGapFillAnswers() {
            if (gapFillCompleted) return;
            
            const gaps = document.querySelectorAll('#gap-fill-text .gap-blank');
            let allCorrect = true;
            let allFilled = true;

            gaps.forEach(gap => {
                if(gap.innerText === '___') allFilled = false;
            });

            if(!allFilled) {
                speak("Please fill all the blanks first!");
                return;
            }

            gaps.forEach(gap => {
                gap.classList.remove('wrong', 'correct');
                if (gap.innerText === gap.dataset.answer) {
                    gap.classList.add('correct');
                } else {
                    gap.classList.add('wrong');
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                clearInterval(timerInterval);
                gapFillCompleted = true;
                playCorrectSound();
                createConfetti();
                document.getElementById('check-gap-answers').classList.add('hidden');
                speak("Perfect! Great job!");
                addPoints();
            } else {
                playWrongSound();
            }
        }

        function revealAnswer(selectedIndex, btnElement) {
            if (isAnswerRevealed) return;
            isAnswerRevealed = true;
            clearInterval(timerInterval);
            
            const q = currentQuestions[questionIndex];
            const isCorrect = selectedIndex === q.correctIndex;
            
            const allBtns = document.getElementById('options-container').children;
            
            for(let i=0; i<allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === q.correctIndex) {
                    allBtns[i].classList.remove('bg-white', 'text-indigo-900');
                    allBtns[i].classList.add('bg-green-500', 'text-white', 'border-green-300');
                } else {
                    allBtns[i].classList.add('opacity-50');
                }
            }

            if(isCorrect) {
                playCorrectSound();
                if(btnElement) btnElement.classList.add('scale-110');

                playWrongSound();
                if(btnElement) {
                    btnElement.classList.remove('bg-white');
                    btnElement.classList.add('bg-red-500', 'text-white', 'border-red-300');
                }
            }

            const correctText = q.options[q.correctIndex];
            // Reveal text cleanly without losing fixed gap sizing
            const qtext = document.getElementById('question-text');
            qtext.innerHTML = qtext.innerHTML.replace(
                /<span class="fixed-gap[^>]*>___<\/span>/, 
                `<span class="fixed-gap revealed bg-green-500 text-white">${correctText}</span>`

                speak("Correct!");

            } else {

            }

            checkBadges();
            updateScoreUI();
            
            setTimeout(nextQuestion, 2500);
        }

        function nextQuestion() {
            questionIndex++;
            loadQuestion();
        }

        function updateScoreUI() {
            document.getElementById('player-score').innerText = playerScore;
        }

        function checkBadges() {
            let badgeContainer = document.getElementById('player-badges');
            
            if (playerScore === 30 && badgeContainer.children.length < 1) addBadge(badgeContainer, '⭐');
            if (playerScore === 60 && badgeContainer.children.length < 2) addBadge(badgeContainer, '🔥');
            if (playerScore === 100 && badgeContainer.children.length < 3) addBadge(badgeContainer, '👑');
            if (playerScore === 150 && badgeContainer.children.length < 4) addBadge(badgeContainer, '🏆');
            if (playerScore === 200 && badgeContainer.children.length < 5) addBadge(badgeContainer, '🌟');
        }

        function addBadge(container, emoji) {
            const s = document.createElement('span');
            s.innerText = emoji;
            s.className = 'badge-animation drop-shadow-md';
            container.appendChild(s);
        }

        // --- FAST CONFETTI EFFECT ---
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            for (let i = 0; i < 200; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 8 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -25 - 5,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.1) + 0.05,
                    tiltAngle: 0
                });
            }
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.8; 
                p.y += p.dy;
                p.x += p.dx;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                if (p.y > canvas.height) particles.splice(index, 1);
            });
            requestAnimationFrame(drawConfetti);
        }
        drawConfetti();

        window.onload = initMenu;
    </script>
</body>
</html>
