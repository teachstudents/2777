<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE Reading Traps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Pedagogy Color Code System */
        .color-fact { color: #16a34a; font-weight: 700; } /* Green: Objective Facts */
        .color-opinion { color: #dc2626; font-weight: 700; } /* Red: Subjective Opinions */
        .color-problem { background-color: #fef08a; padding: 2px 4px; border-radius: 4px; color: #854d0e; font-weight: 600; } /* Yellow: Problems/Distractors */
        .color-advice { background-color: #fbcfe8; padding: 2px 4px; border-radius: 4px; color: #9d174d; font-weight: 600; } /* Pink: Advice/Solutions */

        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 z-20 shadow-sm gap-4">
        
        <!-- Left: Dropdown Menu -->
        <div class="shrink-0 flex items-center gap-2">
            <i class="fa-solid fa-microscope text-blue-600 text-lg"></i>
            <select id="module-filter" class="w-56 bg-slate-50 border border-slate-300 text-sm rounded-md px-2 py-1.5 text-slate-700 font-bold focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer">
                <option value="all">All Modules</option>
                <option value="scattered-info">Scattered Info</option>
                <option value="descriptive-fluff">Descriptive Fluff</option>
                <option value="careless-detail">Careless Detail</option>
                <option value="hidden-synonym">Hidden Synonym</option>
                <option value="fact-vs-opinion">Fact vs. Opinion</option>
                <option value="plagiarism">Exact Figure / Plagiarism</option>
                <option value="punctuation">Punctuation & Format</option>
                <option value="extreme">Extreme Language</option>
                <option value="fact-vs-emotion">Fact vs. Emotion</option>
                <option value="chronological">Chronological Distractor</option>
                <option value="sweeping-gen">Sweeping Generalisation</option>
            </select>
        </div>

        <!-- Center: Color Legend -->
        <div class="flex items-center gap-3 bg-slate-50 px-3 py-1.5 rounded-md border border-slate-200 shrink-0">
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Scanner Key:</span>
            <span class="text-xs color-fact">Fact</span>
            <span class="text-xs color-opinion">Opinion</span>
            <span class="text-xs color-problem">Problem</span>
            <span class="text-xs color-advice">Advice</span>
        </div>

        <!-- Right: Controls & Score -->
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-tts" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-md text-sm font-bold transition-transform active:scale-95 shadow-sm" title="Toggle Auto-TTS">
                <i class="fa-solid fa-volume-xmark"></i>
            </button>
            <button id="btn-prev" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-md text-sm font-bold transition-transform active:scale-95 shadow-sm" title="Previous Passage">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="btn-check" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-1.5 rounded-md text-sm font-bold transition-transform active:scale-95 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                Check
            </button>
            <button id="btn-next" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-md text-sm font-bold transition-transform active:scale-95 shadow-sm" title="Next Passage">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <div class="flex items-center gap-2 bg-amber-50 px-3 py-1.5 rounded-md border border-amber-200 text-amber-700 ml-1">
                <i class="fa-solid fa-trophy text-sm"></i>
                <span class="text-sm font-bold" id="score-display">0 / 0</span>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-slate-100 p-4 relative" id="workspace">
            <div class="glass-panel rounded-xl shadow-sm flex flex-col overflow-hidden">
                <div class="bg-slate-800 text-white px-5 py-2 flex justify-between items-center">
                    <span class="text-sm font-bold text-white tracking-wide" id="passage-title">Reading Passage Title</span>
                    <span class="bg-slate-600 px-3 py-0.5 rounded text-[11px] font-bold uppercase tracking-widest text-white shadow-inner" id="trap-type-badge">TRAP_TYPE</span>
                </div>
                <!-- Padded heavily and clickable for TTS -->
                <div class="p-5 text-slate-800 text-[20px] leading-relaxed font-medium bg-white cursor-pointer hover:bg-slate-50 transition-colors" id="passage-text" onclick="speakPassage(currentExercise.passage)">
                    <!-- Passage text injected here -->
                </div>
            </div>

            <!-- Question and Options -->
            <div class="glass-panel rounded-xl flex flex-col bg-white shadow-sm border-t-4 border-t-emerald-500 p-4">
                <div class="flex items-start gap-3 mb-4 border-b border-slate-100 pb-4">
                    <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0 font-black text-base">Q</div>
                    <h4 class="text-[19px] font-bold text-slate-800 leading-snug pt-0.5" id="question-text">
                        Question goes here?
                    </h4>
                </div>

                <div id="options-container" class="grid grid-cols-1 gap-2">
                    <!-- Options injected here -->
                </div>

                <div id="feedback-panel" class="hidden mt-4 rounded-lg border animate-slide-in">
                    <div class="px-4 py-2.5 flex items-center gap-2 border-b border-black/5" id="feedback-header">
                        <i id="feedback-icon" class="fa-solid fa-circle-check text-lg"></i>
                        <span id="feedback-title" class="font-bold text-sm uppercase tracking-wide">Scan Complete</span>
                    </div>
                    <div class="p-4 bg-white rounded-b-lg">
                        <p id="feedback-message" class="text-slate-800 text-[17px] font-medium leading-relaxed">Detailed feedback goes here.</p>
                    </div>
                </div>
            </div>
            
            <div class="h-6 shrink-0"></div>
        </div>
    </main>

    <script>
        const trapDatabase = [
            // 1. SCATTERED INFO TRAPS (5 Passages)
            {
                id: "scat_1", category: "scattered-info", trapTypeName: "Pronoun / Scattered Info", title: "A Trash Bank in East Java",
                passage: `The members of the BSM cooperative are extremely dedicated to improving their local environment. Every weekend, they carefully sort through the trash from their homes and workplaces, separating organic and inorganic rubbish into completely different processing streams. <span class="color-problem">The former</span> is processed in the presence of oxygen, and can be recycled as fertiliser later on to help local farmers, while <span class="color-problem">the latter</span> is any waste of non-biological origin, such as plastics and metals. Once sorted, the group members take their separated trash to a local leader for weighing.`,
                question: "What happens to organic rubbish after it is separated?",
                options: [
                    { text: "It is any waste of non-biological origin.", isCorrect: false },
                    { text: "It is taken to a local leader.", isCorrect: false },
                    { text: "It is processed in the presence of oxygen and recycled.", isCorrect: true }
                ],
                feedbackCorrect: "Correct! You successfully traced the pronoun 'The former' back to 'organic rubbish'.",
                feedbackIncorrect: "Trap Triggered! This is the Scattered Information Pronoun Trap. Trace pronouns like 'the former' back to the previous sentence to ensure you answer about the correct subject."
            },
            {
                id: "scat_2", category: "scattered-info", trapTypeName: "Scattered Details", title: "The Sea Lion Centre",
                passage: `The devastating impact of the El Niño weather pattern severely affected the local marine wildlife. Filled to capacity by early February, the Centre completely stopped taking in new sea lions. The volunteer staff were working around the clock to manage the crisis, but funds quickly ran low. Later that month, to manage the crisis and find more space, they <span class="color-problem">closed its gift shop</span>. The situation continued to worsen into the spring. Finally, the main administrative <span class="color-problem">office has been converted into a special care unit</span> for the youngest pups.`,
                question: "Make notes on the effects of El Niño on the Centre. Which complete set of notes is best?",
                options: [
                    { text: "Filled to capacity", isCorrect: false },
                    { text: "Filled to capacity, closed gift shop, converted office", isCorrect: true },
                    { text: "Stopped taking in new sea lions", isCorrect: false }
                ],
                feedbackCorrect: "Excellent. You scanned the entire paragraph and extracted all scattered points.",
                feedbackIncorrect: "Trap Triggered! When making notes, never stop reading after you find the first point. Look for scattered impacts."
            },
            {
                id: "scat_3", category: "scattered-info", trapTypeName: "Paragraph Bridging", title: "The Mars Rover",
                passage: `The new autonomous rover successfully launched on Tuesday after months of frustrating weather delays and technical setbacks. <span class="color-problem">Its primary mission is to collect soil samples</span> from the northern crater, which scientists believe may hold microscopic evidence of ancient water.<br><br>The engineering behind the machine is entirely unprecedented. While previous models relied heavily on solar power and often shut down during dust storms, this one uses a highly advanced nuclear battery. <span class="color-problem">It will also transmit high-definition audio</span> back to Earth for the very first time, allowing us to finally hear the Martian winds.`,
                question: "What are the TWO main objectives of the new rover?",
                options: [
                    { text: "Collect soil samples and use a nuclear battery", isCorrect: false },
                    { text: "Launch on Tuesday and transmit audio", isCorrect: false },
                    { text: "Collect soil samples and transmit high-definition audio", isCorrect: true }
                ],
                feedbackCorrect: "Perfect! You successfully bridged the gap between paragraphs to find both objectives.",
                feedbackIncorrect: "Trap Triggered! You stopped at the first objective. Always scan the following paragraphs for additional points."
            },
            {
                id: "scat_4", category: "scattered-info", trapTypeName: "The Ambiguous 'It'", title: "Urban Farming",
                passage: `As cities become increasingly crowded, rooftop gardens are completely transforming the modern skyline. They provide a vital psychological escape for office workers, significantly reduce urban heat, and naturally capture rainwater. However, setting up a complex hydroponic system on top of a skyscraper is highly expensive and technically demanding. <span class="color-problem">It</span> requires constant monitoring, temperature control, and specialised chemical nutrients to succeed during the harsh winter months.`,
                question: "What requires constant monitoring?",
                options: [
                    { text: "The city skyline", isCorrect: false },
                    { text: "Rooftop gardens", isCorrect: false },
                    { text: "A hydroponic system", isCorrect: true }
                ],
                feedbackCorrect: "Spot on! You traced 'It' back to the most recent noun phrase.",
                feedbackIncorrect: "Trap Triggered! You linked 'It' to the general topic (rooftop gardens) instead of the specific noun immediately preceding the pronoun (hydroponic system)."
            },
            {
                id: "scat_5", category: "scattered-info", trapTypeName: "Hidden Exclusions", title: "Library Renovations",
                passage: `The university library administration has announced that the building will undergo massive interior renovations starting May 1st to update its aging infrastructure. Students should be aware that <span class="color-problem">the ground floor reading room will be closed</span> for painting and carpet replacement. The digital computer lab on the second floor will remain open 24 hours a day for exam preparation, but <span class="color-problem">the printing services will be temporarily suspended</span> until early June while the new machines are installed.`,
                question: "Which TWO services/areas are unavailable during the renovations?",
                options: [
                    { text: "The computer lab and the reading room", isCorrect: false },
                    { text: "The reading room and the printing services", isCorrect: true },
                    { text: "The painting and the computer lab", isCorrect: false }
                ],
                feedbackCorrect: "Excellent. You found both negative impacts scattered across the text.",
                feedbackIncorrect: "Trap Triggered! You included a facility that remains OPEN (computer lab). Read carefully to separate what is closed from what is open."
            },

            // 2. DESCRIPTIVE FLUFF TRAPS (5 Passages)
            {
                id: "fluff_1", category: "descriptive-fluff", trapTypeName: "Descriptive Fluff Filter", title: "The Discovery of the Titanic",
                passage: `As the submersible's lights hit the ocean floor, the sheer scale of the tragedy became visible. <span class="color-problem">Rivers of rust</span> covered the side of the ship, some of it running the full length of the hull. <span class="color-opinion">The blood of the great ship lay in pools</span> in the silent, freezing depths... rust about them formed eyelashes, <span class="color-opinion">as though the Titanic were weeping over her fate</span>. Near the upper railing, which was astonishingly well-preserved, hung long <span class="color-fact">reddish-brown stalactites of rust</span> that swayed gently in the deep-sea currents.`,
                question: "Make notes about the physical appearance of the wreck of the Titanic.",
                options: [
                    { text: "It was weeping over her tragic fate.", isCorrect: false },
                    { text: "It had reddish-brown stalactites of rust.", isCorrect: true },
                    { text: "Rivers of blood lay in pools on the ocean floor.", isCorrect: false }
                ],
                feedbackCorrect: "Perfect! You successfully filtered out the poetic metaphors and extracted the objective physical fact.",
                feedbackIncorrect: "Trap Triggered! This is the Descriptive Fluff Trap. In summaries, you must ruthlessly ignore metaphors and poetic language. Stick to objective facts."
            },
            {
                id: "fluff_2", category: "descriptive-fluff", trapTypeName: "Adjective Overload", title: "The New High-Speed Rail",
                passage: `After a decade of political debates and monumental construction efforts, the new national bullet train has finally been unveiled. It is a <span class="color-opinion">gorgeous, shimmering masterpiece of modern engineering</span> that redefines luxury travel. Once it leaves the station, it glides effortlessly through the picturesque mountain countryside <span class="color-opinion">like a silver arrow fired from a mythological bow</span>. Beyond its undeniable aesthetic beauty and sleek aerodynamic nose, it practically <span class="color-fact">reduces the standard commute time from Tokyo to Osaka by exactly 45 minutes</span>.`,
                question: "What is the primary practical benefit of the new train?",
                options: [
                    { text: "It is a shimmering masterpiece.", isCorrect: false },
                    { text: "It glides like a silver arrow.", isCorrect: false },
                    { text: "It reduces the commute time by 45 minutes.", isCorrect: true }
                ],
                feedbackCorrect: "Spot on. You ignored the flowery adjectives and found the hard data.",
                feedbackIncorrect: "Fluff Alert! You highlighted the writer's dramatic descriptions. Always look past the adjectives to find the measurable facts."
            },
            {
                id: "fluff_3", category: "descriptive-fluff", trapTypeName: "Metaphor Extraction", title: "Exploring the Amazon",
                passage: `Our expedition into the deepest parts of the rainforest began at dawn. Walking into the dense jungle was like <span class="color-opinion">stepping into a colossal cathedral of emerald green</span>. The thick, unbroken canopy above our heads was a <span class="color-opinion">woven blanket of whispering leaves</span> that completely blocked out the scorching tropical sun. According to our lead biological guide, this specific, highly isolated region <span class="color-fact">contains over 400 species of uncatalogued insects</span> that have never been seen by modern science.`,
                question: "Identify one scientific fact about the rainforest from the text.",
                options: [
                    { text: "It is like an emerald cathedral.", isCorrect: false },
                    { text: "It contains over 400 species of uncatalogued insects.", isCorrect: true },
                    { text: "The canopy is a woven blanket of leaves.", isCorrect: false }
                ],
                feedbackCorrect: "Correct! You successfully bypassed the metaphors to locate the biological data.",
                feedbackIncorrect: "Metaphor Trap! 'Cathedral' and 'woven blanket' are poetic comparisons, not scientific facts."
            },
            {
                id: "fluff_4", category: "descriptive-fluff", trapTypeName: "Historical Romance", title: "The Abandoned Castle",
                passage: `Perched dangerously close to the edge of a jagged coastal cliff, the ruined medieval fortress stood proudly against the raging storm. The wind howled through its <span class="color-opinion">crumbling walls, echoing with the tragic ghosts of forgotten kings</span>. Even in its dilapidated state, it possessed a <span class="color-opinion">haunting, melancholy beauty</span> that attracted photographers from all over the world. However, local military and historical records clearly indicate that it <span class="color-fact">was completely destroyed by cannon fire in 1642</span> during a brutal civil war.`,
                question: "What caused the destruction of the fortress?",
                options: [
                    { text: "The ghosts of forgotten kings.", isCorrect: false },
                    { text: "Its haunting beauty.", isCorrect: false },
                    { text: "Cannon fire in 1642.", isCorrect: true }
                ],
                feedbackCorrect: "Excellent. You found the historical cause and ignored the romanticized ghost stories.",
                feedbackIncorrect: "Trap Triggered! The text uses 'ghosts' for dramatic effect, not historical fact. Look for objective events."
            },
            {
                id: "fluff_5", category: "descriptive-fluff", trapTypeName: "Sales Pitch Fluff", title: "The XYZ Smartphone",
                passage: `Are you tired of carrying around heavy, outdated technology? The highly anticipated new XYZ Smartphone is finally here, and it boasts a <span class="color-opinion">revolutionary, jaw-dropping design</span> that will absolutely <span class="color-opinion">make all your friends intensely envious</span>. Wrapped in a polished titanium frame, it feels incredibly futuristic. Tucked safely inside its remarkably sleek and lightweight casing, the device <span class="color-fact">features a newly upgraded 48-megapixel camera lens</span> designed specifically for low-light photography.`,
                question: "What is a technical upgrade featured on the new phone?",
                options: [
                    { text: "A jaw-dropping design.", isCorrect: false },
                    { text: "A 48-megapixel camera lens.", isCorrect: true },
                    { text: "It makes friends envious.", isCorrect: false }
                ],
                feedbackCorrect: "Perfect. You ignored the marketing hype and found the technical specification.",
                feedbackIncorrect: "Marketing Trap! 'Jaw-dropping' and 'envious' are sales pitch fluff. Look for technical numbers or specifications."
            },

            // 3. CARELESS DETAIL TRAPS (5 Passages)
            {
                id: "detail_1", category: "careless-detail", trapTypeName: "Careless Detail Match", title: "A Dangerous Thirst",
                passage: `Medical professionals warn that there are three main groups highly susceptible to severe dehydration during the summer heatwaves. Those most at risk are the very young because their bodies are <span class="color-fact">less able to regulate their thirst</span> automatically. Secondly, anyone who exercises for a prolonged period, such as marathon runners, faces extreme risks. Lastly, people dancing in crowded nightclubs are highly at risk because the <span class="color-fact">atmosphere is incredibly hot and humid</span>, leading to rapid fluid loss.`,
                question: "State the specific reason why very young children are at risk.",
                options: [
                    { text: "The atmosphere is hot and humid.", isCorrect: false },
                    { text: "They are less able to regulate their thirst.", isCorrect: true },
                    { text: "They exercise for a prolonged period.", isCorrect: false }
                ],
                feedbackCorrect: "Excellent! You carefully matched the specific risk factor to the correct group.",
                feedbackIncorrect: "Trap Triggered! You grabbed a detail belonging to a different category. Always check that the detail perfectly aligns with the subject of the question."
            },
            {
                id: "detail_2", category: "careless-detail", trapTypeName: "Why vs When Misdirection", title: "The Eiffel Tower",
                passage: `The skyline of Paris was forever changed in the late 19th century by an incredibly controversial iron structure. In <span class="color-fact">1889</span>, the Eiffel Tower, famously named after the renowned engineer Gustave Eiffel, was originally <span class="color-fact">built to serve as the grand entrance arch</span> for the World's Fair. Although it was initially despised by many local artists and writers who wanted it torn down after twenty years, it was ultimately saved because of its immense value as a radio telegraph station.`,
                question: "WHY was the Eiffel Tower originally built?",
                options: [
                    { text: "In 1889", isCorrect: false },
                    { text: "To serve as the entrance arch", isCorrect: true },
                    { text: "By Alexandre Eiffel", isCorrect: false }
                ],
                feedbackCorrect: "Spot on! You answered the 'Why' question correctly.",
                feedbackIncorrect: "Trap Triggered! You answered 'When' or 'Who'. Under exam pressure, students frequently misread question words. Always double-check interrogatives!"
            },
            {
                id: "detail_3", category: "careless-detail", trapTypeName: "Category Overlap", title: "Study Habits",
                passage: `Educational psychologists suggest that tailoring revision methods to individual learning styles can drastically improve exam grades. For instance, visual learners benefit greatly from <span class="color-fact">using colour-coded mind maps</span> to organise complex historical timelines. Auditory learners, on the other hand, struggle with silent reading and should focus predominantly on <span class="color-fact">recording and re-listening to lectures</span> while walking or commuting to easily retain the information.`,
                question: "What is a recommended strategy for Auditory learners?",
                options: [
                    { text: "Using colour-coded mind maps", isCorrect: false },
                    { text: "Recording and re-listening to lectures", isCorrect: true },
                    { text: "Reading textbooks silently", isCorrect: false }
                ],
                feedbackCorrect: "Correct. You didn't get distracted by the visual learner strategies.",
                feedbackIncorrect: "Careless Scan! You chose the strategy for 'Visual' learners. Make sure your detail matches the exact category asked in the question."
            },
            {
                id: "detail_4", category: "careless-detail", trapTypeName: "Who is Who?", title: "The Architecture Firm",
                passage: `The city's spectacular new waterfront development was the result of a massive collaborative effort that spanned over five years. The £50 million project was entirely funded by the eccentric <span class="color-problem">billionaire investor Thomas Sterling</span>, who wanted to leave a legacy. However, the award-winning, spectacular glass suspension bridge that acts as the centerpiece was actually designed by <span class="color-fact">lead architect Sarah Jenkins</span>, who received international acclaim for her innovative use of recycled materials.`,
                question: "Who designed the glass bridge?",
                options: [
                    { text: "Thomas Sterling", isCorrect: false },
                    { text: "Sarah Jenkins", isCorrect: true },
                    { text: "The billionaire investor", isCorrect: false }
                ],
                feedbackCorrect: "Great job separating the funder from the designer.",
                feedbackIncorrect: "Who Trap! You grabbed the first name you saw. Thomas funded it, but Sarah designed it. Read the verbs carefully."
            },
            {
                id: "detail_5", category: "careless-detail", trapTypeName: "Location Confusion", title: "The Wildlife Reserve",
                passage: `The vast, 500-acre national wildlife reserve contains drastically different ecosystems that support a wide variety of endangered predators. Park rangers note that the golden eagles are primarily found nesting high up in the treacherous, wind-swept <span class="color-problem">northern mountain peaks</span> where they hunt small rodents. In sharp contrast, the elusive grey wolves avoid the rocky altitudes entirely and prefer the dense, shadowy coverage of the <span class="color-fact">southern pine forests</span>.`,
                question: "Where do the grey wolves prefer to live?",
                options: [
                    { text: "Northern mountain peaks", isCorrect: false },
                    { text: "Southern pine forests", isCorrect: true },
                    { text: "Coastal cliffs", isCorrect: false }
                ],
                feedbackCorrect: "Correct! You successfully matched the location to the specific animal.",
                feedbackIncorrect: "Location Trap! You selected the habitat for the eagles. Double-check which animal the question is asking about."
            },

            // 4. HIDDEN SYNONYM TRAPS (5 Passages)
            {
                id: "syn_1", category: "hidden-synonym", trapTypeName: "Hidden Synonym Search", title: "Teenage Sleep Cycles",
                passage: `Parents often complain that their teenagers are simply lazy, but modern science paints a very different picture. Evidence is emerging that teenagers are biologically incapable of going to bed at a sensible time due to shifts in their circadian rhythms. During puberty, their brains adapt, and their bodies start to produce <span class="color-fact">the hormone melatonin</span>—the chemical responsible for inducing sleep—around an hour later than usual. This means forcing them to sleep at 9 PM is physically counterproductive.`,
                question: "What PHYSICAL SUBSTANCE is responsible for teenagers staying awake later?",
                options: [
                    { text: "Biologically incapable", isCorrect: false },
                    { text: "The hormone melatonin", isCorrect: true },
                    { text: "A sensible time", isCorrect: false }
                ],
                feedbackCorrect: "Correct! You realized that 'physical substance' is a synonym for 'hormone'.",
                feedbackIncorrect: "Trap Triggered! You won't find the exact words 'physical substance' in the text. Look for a synonym or specific example."
            },
            {
                id: "syn_2", category: "hidden-synonym", trapTypeName: "Concept Paraphrasing", title: "Urban Planning",
                passage: `Traffic congestion and toxic exhaust fumes have severely degraded the quality of life in the capital over the last decade. In a highly controversial press conference on Tuesday, the mayor announced that the new environmental policy would strictly <span class="color-fact">prohibit the driving of private vehicles</span> in the city centre during weekend hours. Delivery trucks and emergency services will be granted special exemptions, but normal commuters will face heavy fines.`,
                question: "What is being BANNED in the city centre?",
                options: [
                    { text: "Weekend hours", isCorrect: false },
                    { text: "Private vehicles", isCorrect: true },
                    { text: "The mayor's policy", isCorrect: false }
                ],
                feedbackCorrect: "Spot on! You recognised that 'prohibit' means 'ban'.",
                feedbackIncorrect: "Synonym Alert! The word 'banned' is not in the text. You must look for its synonym, 'prohibit'."
            },
            {
                id: "syn_3", category: "hidden-synonym", trapTypeName: "Financial Equivalents", title: "University Life",
                passage: `The transition from high school to university is notoriously difficult, primarily due to the sudden shift in independence. Recent surveys show that many students struggle to complete their degrees due to severe <span class="color-fact">financial constraints</span>. Because accommodation and textbooks are overwhelmingly expensive, thousands of undergraduates are forcibly required to take on exhausting part-time jobs in the evenings, leaving them too tired to study.`,
                question: "What LACK OF MONEY causes students to struggle?",
                options: [
                    { text: "Part-time jobs", isCorrect: false },
                    { text: "Financial constraints", isCorrect: true },
                    { text: "Completing their degrees", isCorrect: false }

                feedbackIncorrect: "Timeline Trap! You grabbed the first age mentioned. Twenty was when she started writing, not when she won the award."

            {
                id: "chrono_4", category: "chronological", trapTypeName: "Construction Delays", title: "The Suspension Bridge",
                passage: `Connecting the two isolated industrial cities required an engineering marvel that politicians argued over for years. The incredibly ambitious and wildly expensive design for the steel suspension bridge was formally proposed to the city council back in <span class="color-problem">2005</span>. However, due to severe national funding shortages and protests from environmental groups, actual physical construction of the concrete pillars did not legally commence until <span class="color-fact">2010</span>.`,

            {
                id: "chrono_5", category: "chronological", trapTypeName: "Medical Discoveries", title: "Penicillin",
                passage: `The fight against lethal bacterial infections was fundamentally changed by a lucky laboratory accident in London. Scientist Alexander Fleming famously observed the powerful antibacterial properties of a strange green mould left on a petri dish in <span class="color-problem">1928</span>. However, isolating the chemical was incredibly difficult, and it took over a decade of intense Oxford research before the drug was successfully mass-produced to treat wounded soldiers in <span class="color-fact">1942</span>.`,

            // 11. SWEEPING GENERALISATION TRAPS (5 Passages)

                passage: `Blogger B (Sports Fanatic): "My ultimate heroes have to be professional footballers, definitely footballers. When I watch a match, I often shudder at the sheer physical agony a player must be going through after a bad tackle... they get paid enormous, million-pound salaries, but they earn it because the <span class="color-fact">number of years most players can expect to play regularly before their knees give out is very limited</span>."`,
                question: "Match to Blogger B: 'Their heroes only have a...'",
                options: [

                ],

            {
                id: "gen_match_2", category: "sweeping-gen", trapTypeName: "Technical Issues", title: "App Review",

                ],

            {

                passage: `Explorer A (Amazon Expedition): "We severely underestimated the sheer hostility of the rainforest environment. We lost our satellite GPS signal completely on day two due to the thick canopy. By day three, torrential, non-stop monsoons had flooded the only walking path, and my expensive leather hiking boots had completely rotted and fallen apart in the acidic mud."`,

                ],

            {
                id: "gen_match_5", category: "sweeping-gen", trapTypeName: "Financial Barriers", title: "University Access",
                passage: `Student B (Undergraduate): "The academic workload is stressful, but the economics of attending university are what actually causes me to lose sleep. I couldn't even afford the mandatory required textbooks for my advanced chemistry module this semester. Additionally, the daily train fare to commute to campus and the ridiculously inflated cost of hot cafeteria lunches have completely emptied my bank account."`,
                question: "Match to Student B: 'This student struggles with...'",
                options: [
                    { text: "Expensive cafeteria lunches", isCorrect: false },
                    { text: "Significant financial barriers to education", isCorrect: true },
                    { text: "Daily bus fares", isCorrect: false }
                ],
                feedbackCorrect: "Excellent. You recognised that books, fares, and lunches all represent 'financial barriers'.",
                feedbackIncorrect: "Trap Triggered! The examiner merges specific costs (books, buses, lunch) into a broad generalisation like 'financial barriers'."
            }

        let currentExercise = null;
        let selectedOptionIndex = null;
        let score = 0;
        let totalAttempted = 0;
        let synth = window.speechSynthesis;
        let autoTtsEnabled = false;
        
        // Allowed TTS Voices
        const targetVoiceNames = ["Remy", "Giuseppe", "Vivienne", "Florian", "Seraphina", "Emma", "Brian", "Andrew"];
        let allowedVoices = [];

        const DOM = {
            moduleFilter: document.getElementById('module-filter'),
            workspace: document.getElementById('workspace'),
            passageTitle: document.getElementById('passage-title'),
            trapBadge: document.getElementById('trap-type-badge'),
            passageText: document.getElementById('passage-text'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            btnTts: document.getElementById('btn-tts'),
            btnPrev: document.getElementById('btn-prev'),
            btnCheck: document.getElementById('btn-check'),
            btnNext: document.getElementById('btn-next'),
            feedbackPanel: document.getElementById('feedback-panel'),
            feedbackHeader: document.getElementById('feedback-header'),
            feedbackIcon: document.getElementById('feedback-icon'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackMessage: document.getElementById('feedback-message'),
            scoreDisplay: document.getElementById('score-display')
        };

        function init() {
            DOM.moduleFilter.addEventListener('change', loadFilteredCategory);
            DOM.btnCheck.addEventListener('click', handleCheck);
            DOM.btnNext.addEventListener('click', loadNextGlobal);
            DOM.btnPrev.addEventListener('click', loadPrevGlobal);
            DOM.btnTts.addEventListener('click', toggleTts);
            
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = setPreferredVoice;
            }
            setPreferredVoice();
            loadFilteredCategory();
        }

        function setPreferredVoice() {
            const voices = synth.getVoices();
            allowedVoices = voices.filter(v => 
                (v.name.includes('Microsoft') || v.name.includes('Online') || v.name.includes('Natural') || v.name.includes('Multilingual')) && 
                targetVoiceNames.some(name => v.name.includes(name))
            );
            if (allowedVoices.length === 0) {
                // Fallback if the specific metadata tags are missing but the names exist
                allowedVoices = voices.filter(v => targetVoiceNames.some(name => v.name.includes(name)));
            }
            if (allowedVoices.length === 0) {
                allowedVoices = voices.filter(v => v.lang.startsWith('en-'));
            }
        }

        function speakPassage(text) {
            if (!synth) return;
            synth.cancel();
            
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = text;
            let cleanText = tempDiv.textContent || tempDiv.innerText || "";
            
            // Aggressive Emoji Filter
            const emojiRegex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu;
            cleanText = cleanText.replace(emojiRegex, '');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0; 
            
            if (allowedVoices.length > 0) {
                // Cycle through voices based on current exercise
                const trapIndex = trapDatabase.findIndex(t => t.id === currentExercise?.id);
                utterance.voice = allowedVoices[Math.max(0, trapIndex) % allowedVoices.length];
            }
            
            synth.speak(utterance);
        }

        function toggleTts() {
            autoTtsEnabled = !autoTtsEnabled;
            if (autoTtsEnabled) {
                DOM.btnTts.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                DOM.btnTts.classList.remove('text-slate-700');
                DOM.btnTts.classList.add('text-blue-600');
                if (currentExercise) speakPassage(currentExercise.passage);
            } else {
                DOM.btnTts.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                DOM.btnTts.classList.remove('text-blue-600');
                DOM.btnTts.classList.add('text-slate-700');
                synth.cancel();
            }
        }

        function loadFilteredCategory() {
            const filterVal = DOM.moduleFilter.value;
            const filteredTraps = filterVal === 'all' 
                ? trapDatabase 
                : trapDatabase.filter(t => t.category === filterVal);
            
            if(filteredTraps.length > 0) {
                loadExercise(filteredTraps[0].id);
            }
        }

        function loadExercise(id) {
            currentExercise = trapDatabase.find(t => t.id === id);
            selectedOptionIndex = null;
            
            synth.cancel();

            DOM.workspace.classList.remove('hidden');
            DOM.feedbackPanel.classList.add('hidden');
            
            // Re-enable and reset Check button
            DOM.btnCheck.disabled = true;
            DOM.btnCheck.classList.remove('hidden');

            DOM.passageTitle.textContent = currentExercise.title;
            DOM.trapBadge.textContent = currentExercise.trapTypeName;
            DOM.passageText.innerHTML = currentExercise.passage;
            DOM.questionText.textContent = currentExercise.question;

            DOM.optionsContainer.innerHTML = '';
            currentExercise.options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = `w-full text-left p-3 rounded-lg border transition-all duration-200 flex items-center gap-3 bg-slate-50 border-slate-200 hover:border-blue-300 hover:bg-blue-50 focus:outline-none`;
                optBtn.innerHTML = `
                    <div class="w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0 opt-indicator transition-colors"></div>
                    <span class="font-semibold text-slate-800 text-lg">${opt.text}</span>
                `;
                optBtn.onclick = () => selectMcqOption(idx, optBtn);
                DOM.optionsContainer.appendChild(optBtn);
            });
            
            if (autoTtsEnabled) {
                setTimeout(() => speakPassage(currentExercise.passage), 100);
            }
        }

        function selectMcqOption(index, btnElement) {
            if (!DOM.feedbackPanel.classList.contains('hidden')) return; // Prevent changing after check

            selectedOptionIndex = index;
            
            const allOpts = DOM.optionsContainer.children;
            for(let i=0; i<allOpts.length; i++) {
                allOpts[i].classList.remove('bg-blue-50', 'border-blue-500', 'shadow-md');
                allOpts[i].classList.add('bg-slate-50', 'border-slate-200');
                const indicator = allOpts[i].querySelector('.opt-indicator');
                indicator.classList.remove('border-blue-500', 'bg-blue-500');
                indicator.classList.add('border-slate-300');
                indicator.innerHTML = '';
            }

            btnElement.classList.remove('bg-slate-50', 'border-slate-200');
            btnElement.classList.add('bg-blue-50', 'border-blue-500', 'shadow-md');
            const activeIndicator = btnElement.querySelector('.opt-indicator');
            activeIndicator.classList.remove('border-slate-300');
            activeIndicator.classList.add('border-blue-500', 'bg-blue-500');
            activeIndicator.innerHTML = '<i class="fa-solid fa-check text-white text-[10px]"></i>';

            DOM.btnCheck.disabled = false;
        }

        function handleCheck() {
            DOM.btnCheck.disabled = true; // Disable check button so they must navigate away
            DOM.feedbackPanel.classList.remove('hidden');

            const selectedOpt = currentExercise.options[selectedOptionIndex];
            const isCorrect = selectedOpt.isCorrect;
            const feedbackText = isCorrect ? currentExercise.feedbackCorrect : currentExercise.feedbackIncorrect;
            
            const allOpts = DOM.optionsContainer.children;
            currentExercise.options.forEach((opt, idx) => {
                const btn = allOpts[idx];
                const indicator = btn.querySelector('.opt-indicator');
                
                if (opt.isCorrect) {
                    btn.classList.remove('bg-slate-50', 'border-slate-200', 'bg-blue-50', 'border-blue-500');
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'border-2');
                    indicator.className = 'w-5 h-5 rounded-full flex items-center justify-center shrink-0 border-2 border-emerald-500 bg-emerald-500';
                    indicator.innerHTML = '<i class="fa-solid fa-check text-white text-[10px]"></i>';
                } else if (idx === selectedOptionIndex && !opt.isCorrect) {
                    btn.classList.remove('bg-blue-50', 'border-blue-500');
                    btn.classList.add('bg-red-50', 'border-red-500', 'border-2');
                    indicator.className = 'w-5 h-5 rounded-full flex items-center justify-center shrink-0 border-2 border-red-500 bg-red-500';
                    indicator.innerHTML = '<i class="fa-solid fa-xmark text-white text-[10px]"></i>';
                }
            });

            totalAttempted++;
            if (isCorrect) score++;
            DOM.scoreDisplay.textContent = `${score} / ${totalAttempted}`;

            DOM.feedbackPanel.className = `mt-6 rounded-lg border-2 animate-slide-in shrink-0 ${isCorrect ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`;
            DOM.feedbackHeader.className = `px-5 py-3 flex items-center gap-3 border-b ${isCorrect ? 'border-emerald-200 text-emerald-800' : 'border-red-200 text-red-800'}`;
            DOM.feedbackIcon.className = `text-xl ${isCorrect ? 'fa-solid fa-circle-check text-emerald-600' : 'fa-solid fa-triangle-exclamation text-red-600'}`;
            DOM.feedbackTitle.textContent = isCorrect ? "Scan Clear!" : "Trap Triggered!";
            DOM.feedbackMessage.innerHTML = `<span class="${isCorrect ? 'text-emerald-900' : 'text-red-900'}">${feedbackText}</span>`;
            
            if (autoTtsEnabled) {
                speakPassage(feedbackText);
            }
        }

        function loadNextGlobal() {
            const currentIndex = trapDatabase.findIndex(t => t.id === currentExercise.id);
            const nextIndex = (currentIndex + 1) % trapDatabase.length;
            DOM.moduleFilter.value = trapDatabase[nextIndex].category;
            loadExercise(trapDatabase[nextIndex].id);
        }

        function loadPrevGlobal() {
            const currentIndex = trapDatabase.findIndex(t => t.id === currentExercise.id);
            const prevIndex = (currentIndex - 1 + trapDatabase.length) % trapDatabase.length;
            DOM.moduleFilter.value = trapDatabase[prevIndex].category;
            loadExercise(trapDatabase[prevIndex].id);
        }

        init();
    </script>
</body>
